const GUWEN_EXAMPLES=[
{o:"肉食者谋之，又何间焉？……肉食者鄙，未能远谋。",s:"——《左传·曹刿论战》",t:"当权的人自会谋划这事，你又何必参与呢？……当权的人目光短浅，不能深谋远虑。"},
{o:"若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也；焉用亡郑以陪邻？",s:"——《左传·烛之武退秦师》",t:"如果灭亡郑国对您有利，怎敢拿这事来烦劳您的左右。越过别国把远方的郑国当作边邑，您知道这是困难的；何必用灭掉郑国来增加邻国的土地呢？"},
{o:"子曰：「学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？」",s:"——《论语·学而》",t:"孔子说：「学习后按时温习，不也是很愉快的吗？有志同道合的人从远方来，不也是很快乐的吗？别人不了解我，我却不恼怒，不也是君子吗？」"},
{o:"子曰：「《诗》三百，一言以蔽之，曰：『思无邪。』」",s:"——《论语·为政》",t:"孔子说：「《诗经》三百篇，用一句话来概括它，就是『思想纯正无邪念』。」"},
{o:"子曰：「其身正，不令而行；其身不正，虽令不从。」",s:"——《论语·子路》",t:"孔子说：「统治者自身端正，不下命令事情也能实行；自身不端正，即使下了命令，百姓也不会听从。」"},
{o:"子贡问曰：「有一言而可以终身行之者乎？」子曰：「其恕乎！己所不欲，勿施于人。」",s:"——《论语·卫灵公》",t:"子贡问道：「有没有一个字可以终身奉行的呢？」孔子说：「大概是『恕』吧！自己不愿意的，不要强加给别人。」"},
{o:"大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。",s:"——《礼记·大学》",t:"大学的宗旨，在于彰显光明的品德；在于亲近爱抚民众；在于达到道德修养的最高境界。知道应达到的境界才能够志向坚定；志向坚定才能够镇静不躁；镇静不躁才能够心安理得；心安理得才能够思虑周详；思虑周详才能够有所收获。"},
{o:"道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母。",s:"——《老子·第一章》",t:"可以用言语表述的道，就不是永恒的道；可以用名称界定的名，就不是永恒的名。无，是天地的本始；有，是万物的根源。"},
{o:"吾生也有涯，而知也无涯。以有涯随无涯，殆已！已而为知者，殆而已矣。",s:"——《庄子·养生主》",t:"人的生命是有限的，而知识却是无穷的。以有限的生命去追求无穷的知识，那就很危险了！已经这样了还要汲汲追求知识，那就更加危险了。"},
{o:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也。",s:"——《庄子·逍遥游》",t:"北海有一条鱼，它的名字叫鲲。鲲的巨大，不知道有几千里；变化成为鸟，它的名字叫鹏。鹏的脊背，不知道有几千里。"},
{o:"屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。",s:"——《史记·屈原贾生列传》",t:"屈原痛心于楚怀王听觉不敏锐，谗言谄媚蒙蔽了君王的明察，邪恶的小人危害公正，端方正派的人不为朝廷所容，所以忧愁深思，写下了《离骚》。"},
{o:"太史公曰：「传曰『其身正，不令而行；其身不正，虽令不从』。其李将军之谓也？」",s:"——《史记·李将军列传》",t:"太史公说：「《论语》上说『在上位的人自身端正，不下命令事情也能实行；自身不端正，虽然下了命令也没人听从』。这大概就是说李将军的吧？」"},
{o:"古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也终不解矣。",s:"——韩愈《师说》",t:"古代求学的人一定有老师。老师，是靠他来传授道理、教授学业、解答疑难问题的。人不是生下来就懂得道理的，谁能没有疑惑？有了疑惑却不跟从老师学习，那些成为疑惑的问题就始终不能解决了。"},
{o:"嗟乎！师道之不传也久矣，欲人之无惑也难矣。古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。",s:"——韩愈《师说》",t:"唉！从师学习的风尚不流传已经很久了，要想人们没有疑惑也就很难了。古代的圣人，他们超出一般人很远了，尚且跟从老师请教；现在的一般人，他们低于圣人也很远了，却以向老师学习为耻。"},
{o:"呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。",s:"——欧阳修《五代史伶官传序》",t:"唉！国家兴盛与衰亡的道理，虽然说有天命的因素，难道不是由于人事吗？推究庄宗取得天下和失去天下的原因，就可以明白了。"},
{o:"夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！",s:"——欧阳修《五代史伶官传序》",t:"祸患常常是从细微的事情积累起来的，人的才智勇气往往被他所溺爱的事物困扰，难道只有宠幸伶人才会这样吗！"},
{o:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。",s:"——王勃《滕王阁序》",t:"晚霞与孤独的野鸭一起飞翔，秋天的江水与辽阔的天空浑然一色。渔船上的人在傍晚歌唱，歌声响遍鄱阳湖畔；雁群因寒气而惊叫，鸣声直到衡阳的水边才消失。"},
{o:"老当益壮，宁移白首之心？穷且益坚，不坠青云之志。",s:"——王勃《滕王阁序》",t:"年纪虽老而志气应当更加豪壮，怎能在白头时改变心志？境遇虽然困厄而意志应当更加坚定，绝不放弃高远的志向。"},
{o:"是岁十月之望，步自雪堂，将归于临皋。二客从予过黄泥之坂。霜露既降，木叶尽脱；人影在地，仰见明月。顾而乐之，行歌相答。",s:"——苏轼《后赤壁赋》",t:"这一年十月十五日，我从雪堂步行，将要回到临皋。两位客人跟随着我，经过黄泥坂。霜露已经降下，树叶全都脱落；人的影子映在地上，抬头看见明月。四下环顾而心中快乐，边走边唱，互相酬答。"}

{text:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。",src:"——王勃《滕王阁序》"},
{text:"予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。",src:"——周敦颐《爱莲说》"},
{text:"苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。",src:"——刘禹锡《陋室铭》"},
{text:"白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。",src:"——苏轼《赤壁赋》"},
{text:"是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。",src:"——王羲之《兰亭集序》"},
{text:"忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。",src:"——陶渊明《桃花源记》"},
{text:"潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽，似与游者相乐。",src:"——柳宗元《小石潭记》"},
{text:"不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰：先天下之忧而忧，后天下之乐而乐乎！",src:"——范仲淹《岳阳楼记》"},
{text:"有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间。",src:"——郦道元《三峡》"},
{text:"不以一眚掩大德。记人之善，忘人之过。",src:"——《左传》"},
{cat:"古文",text:"臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。",src:"——诸葛亮《出师表》"},
{cat:"古文",text:"臣无祖母，无以至今日；祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。",src:"——李密《陈情表》"},
{cat:"古文",text:"古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？",src:"——韩愈《师说》"},
{cat:"古文",text:"君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。",src:"——荀子《劝学》"},
{cat:"古文",text:"归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。",src:"——陶渊明《归去来兮辞》"},
{cat:"古文",text:"六王毕，四海一；蜀山兀，阿房出。秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。",src:"——杜牧《阿房宫赋》"},
{cat:"古文",text:"庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。",src:"——归有光《项脊轩志》"},
{cat:"古文",text:"山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。",src:"——陶弘景《答谢中书书》"},
{cat:"古文",text:"庭下如积水空明，水中藻荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。",src:"——苏轼《记承天寺夜游》"},
{cat:"古文",text:"风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐，一百许里，奇山异水，天下独绝。",src:"——吴均《与朱元思书》"},
{cat:"古文",text:"人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。",src:"——司马迁《报任安书》"},
{cat:"古文",text:"忧劳可以兴国，逸豫可以亡身，自然之理也。",src:"——欧阳修《伶官传序》"},
{cat:"古文",text:"世有伯乐，然后有千里马。千里马常有，而伯乐不常有。",src:"——韩愈《马说》"},
{cat:"诗词",text:"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。",src:"——李白《将进酒》"},
{cat:"诗词",text:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。",src:"——杜甫《春望》"},
{cat:"诗词",text:"风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。",src:"——杜甫《登高》"},
{cat:"诗词",text:"空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。",src:"——王维《山居秋暝》"},
{cat:"诗词",text:"明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。",src:"——苏轼《水调歌头》"},
{cat:"诗词",text:"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。",src:"——苏轼《定风波》"},
{cat:"诗词",text:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急？",src:"——李清照《声声慢》"},
{cat:"诗词",text:"生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。",src:"——李清照《夏日绝句》"},
{cat:"诗词",text:"昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否，知否？应是绿肥红瘦。",src:"——李清照《如梦令》"},
{cat:"诗词",text:"身不得，男儿列；心却比，男儿烈。算平生肝胆，因人常热。俗子胸襟谁识我？英雄末路当磨折。莽红尘、何处觅知音？青衫湿！",src:"——秋瑾《满江红·小住京华》"},
{cat:"诗词",text:"东风夜放花千树，更吹落、星如雨。宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。",src:"——辛弃疾《青玉案·元夕》"},
{cat:"诗词",text:"醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。",src:"——辛弃疾《破阵子》"},
{cat:"诗词",text:"死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。",src:"——陆游《示儿》"},
{cat:"诗词",text:"对酒当歌，人生几何！譬如朝露，去日苦多。慨当以慷，忧思难忘。何以解忧？唯有杜康。",src:"——曹操《短歌行》"},
{cat:"诗词",text:"怒发冲冠，凭栏处、潇潇雨歇。抬望眼，仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切。",src:"——岳飞《满江红》"},
{cat:"诗词",text:"人生若只如初见，何事秋风悲画扇。等闲变却故人心，却道故人心易变。",src:"——纳兰性德《木兰花令》"},
{cat:"诗词",text:"君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。",src:"——李商隐《夜雨寄北》"},
{cat:"女性主义",text:"人并非生来就是女人，而是逐渐成为女人的。",src:"——西蒙娜·德·波伏娃 Simone de Beauvoir《第二性》Le Deuxième Sexe（节译）"},
{cat:"女性主义",text:"他是主体，是绝对；她则是他者。",src:"——西蒙娜·德·波伏娃 Simone de Beauvoir《第二性》Le Deuxième Sexe（节译）"},
{cat:"女性主义",text:"一个女人若想写小说，她必须有钱，还得有一间属于自己的房间。",src:"——弗吉尼亚·伍尔夫 Virginia Woolf《一间自己的房间》A Room of One's Own（节译）"},
{cat:"女性主义",text:"一个人若没有吃好，就无法思考得好、爱得好、睡得好。",src:"——弗吉尼亚·伍尔夫 Virginia Woolf《一间自己的房间》A Room of One's Own（节译）"},
{cat:"女性主义",text:"我并不希望女人拥有支配男人的权力，而是希望她们能够支配自己。",src:"——玛丽·沃斯通克拉夫特 Mary Wollstonecraft《为女权辩护》A Vindication of the Rights of Woman（节译）"},
{cat:"女性主义",text:"把一种性别在法律上隶属于另一种性别，这本身就是错误的，而且已经成为人类进步的主要障碍之一。",src:"——约翰·斯图尔特·穆勒 John Stuart Mill《妇女的屈从地位》The Subjection of Women（节译）"},
{cat:"女性主义",text:"在家庭里，丈夫是资产者，妻子则代表无产阶级。",src:"——弗里德里希·恩格斯 Friedrich Engels《家庭、私有制和国家的起源》Der Ursprung der Familie, des Privateigentums und des Staats（节译）"},
{cat:"女性主义",text:"主人的工具永远无法拆毁主人的房子。",src:"——奥黛丽·洛德 Audre Lorde《主人的工具永远无法拆毁主人的房子》The Master's Tools Will Never Dismantle the Master's House，1979（节译）"},
{cat:"女性主义",text:"女性主义是一场旨在终结性别歧视、性别剥削与压迫的运动。",src:"——贝尔·胡克斯 bell hooks《Feminism Is for Everybody》（节译）"},
{cat:"女性主义",text:"个人的，就是政治的。",src:"——卡萝尔·汉尼施 Carol Hanisch《个人的即是政治的》The Personal Is Political，1969（节译）"},
{cat:"哲学",text:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？",src:"——《论语·学而》"},
{cat:"哲学",text:"吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。",src:"——《论语·为政》"},
{cat:"哲学",text:"道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母。",src:"——《老子》第一章"},
{cat:"哲学",text:"上善若水。水善利万物而不争，处众人之所恶，故几于道。",src:"——《老子》第八章"},
{cat:"哲学",text:"知人者智，自知者明；胜人者有力，自胜者强。知足者富，强行者有志。",src:"——《老子》第三十三章"},
{cat:"哲学",text:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。",src:"——《庄子·逍遥游》"},
{cat:"哲学",text:"昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？",src:"——《庄子·齐物论》"},
{cat:"哲学",text:"天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。",src:"——《孟子·告子下》"},
{cat:"哲学",text:"大学之道，在明明德，在亲民，在止于至善。",src:"——《大学》"},
{cat:"哲学",text:"天命之谓性，率性之谓道，修道之谓教。",src:"——《中庸》"},
{cat:"哲学",text:"天行健，君子以自强不息。地势坤，君子以厚德载物。",src:"——《周易》"},
{cat:"哲学",text:"知是行之始，行是知之成。",src:"——王阳明《传习录》"},
{cat:"哲学",text:"未经省察的人生是不值得过的。",src:"——苏格拉底 Socrates（柏拉图 Plato《申辩篇》Apologia）"},
{cat:"哲学",text:"人不能两次踏进同一条河流。",src:"——赫拉克利特 Heraclitus（残篇 Fragments）"},
{cat:"哲学",text:"人天生是一种政治的动物。",src:"——亚里士多德 Aristoteles《政治学》Politika"},
{cat:"哲学",text:"人只是一根苇草，是自然界最脆弱的东西；但他是一根能思想的苇草。",src:"——布莱兹·帕斯卡 Blaise Pascal《思想录》Pensées（节译）"},
{cat:"哲学",text:"有两样东西，我们越是经常持久地对之凝神思索，它们就越使内心充满常新而日增的惊奇和敬畏：我头上的星空和我心中的道德律。",src:"——伊曼努尔·康德 Immanuel Kant《实践理性批判》Kritik der praktischen Vernunft（节译）"},
{cat:"哲学",text:"凡杀不死我的，都会使我更强大。",src:"——弗里德里希·尼采 Friedrich Nietzsche《偶像的黄昏》Götzen-Dämmerung（节译）"},
{cat:"哲学",text:"我们必须想象西西弗是幸福的。",src:"——阿尔贝·加缪 Albert Camus《西西弗神话》Le Mythe de Sisyphe（节译）"}
];

const ICONS_POOL=['☁️','🌙','🌸','🍃','🌊','🍵','🦋','🎐','🌻','🍄'];
async function apiGet(p){try{const r=await fetch(p);if(!r.ok)return{ok:false,error:'HTTP '+r.status};return await r.json();}catch(e){return{ok:false,error:e.message};}}
function extractBvid(u){const m=u.match(/BV[a-zA-Z0-9]+/)||u.match(/bvid=([a-zA-Z0-9]+)/i);return m?m[0]:'';}
function extractYouTubeId(u){const m=u.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:'';}
async function resolveYouTube(v){const id=extractYouTubeId(v);if(!id)return{ok:false,error:'无法识别 YouTube ID'};const d=await apiGet('/api/youtube?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));if(!d.ok)return d;return{ok:true,id,title:d.title||('YouTube '+id),author:d.author,cover:d.thumbnail,provider:'youtube',src:'https://www.youtube.com/embed/'+id};}
async function resolveBilibili(v){const bvid=extractBvid(v);if(!bvid)return{ok:false,error:'无法识别 BVID'};const d=await apiGet('/api/bilibili?bvid='+encodeURIComponent(bvid));if(!d.ok)return d;return{ok:true,id:bvid,title:d.title,author:d.author,cover:d.pic,provider:'bilibili',src:'https://player.bilibili.com/player.html?bvid='+bvid+'&page=1&high_quality=1&autoplay=0'};}
async function resolveVideoUrl(u){if(u.indexOf('youtube.com')>=0||u.indexOf('youtu.be')>=0)return resolveYouTube(u);if(u.indexOf('bilibili.com')>=0||extractBvid(u))return resolveBilibili(u);return{ok:false,error:'仅支持 YouTube / Bilibili 链接'};}
function parseDouyinShare(text){
  const r={raw:text,url:'',bloggerName:'',title:''};
  let m=text.match(/https?:\/\/v\.douyin\.com\/[A-Za-z0-9]+\/?/);

function playCelebrateSound(){
  if(!window.AudioContext&&!window.webkitAudioContext)return;
  if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const ctx=_audioCtx;ctx.resume();
  const t=ctx.currentTime;
  [[523.25,0.15],[659.25,0.15],[783.99,0.15],[1046.50,0.35]].forEach(([f,d],i)=>{
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sine';o.frequency.value=f;
    o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0,t+i*0.18);
    g.gain.linearRampToValueAtTime(0.25,t+i*0.18+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.18+d);
    o.start(t+i*0.18);o.stop(t+i*0.18+d);
  });
}

const BG_ANIM_MAX=900*1024;
async function bgIsAnimated(f){
  const type=petFileType(f);
  if(!/gif|png|webp/.test(type))return false;
  if(typeof ImageDecoder!=='undefined'&&await ImageDecoder.isTypeSupported(type).catch(()=>false)){
    try{const d=new ImageDecoder({data:await f.arrayBuffer(),type:type});await d.tracks.ready;const n=d.tracks.selectedTrack?d.tracks.selectedTrack.frameCount:1;d.close();return n>1;}catch(e){}
  }
  return type==='image/gif';
}
async function bgProcessFile(f){
  if(!(await bgIsAnimated(f)))return fileToImageSrc(f,1920,0.8);
  toast('正在处理动图背景，请稍等…');
  for(const dim of [1280,960,720,540,400]){
    const src=await petProcessFile(f,dim,BG_ANIM_MAX);
    if(src.length<=BG_ANIM_MAX*1.37)return src;
  }
  throw new Error('toolarge');
}
function handleBgFile(file,idx){
  if(!petFileType(file).startsWith('image/')){toast('请选择图片文件（PNG/JPG/WEBP/GIF 动图）');return;}
  if(file.size>30*1024*1024){toast('图片太大啦，请选择小一点的文件');return;}
  bgProcessFile(file).then(src=>addBg(src,idx,file.name)).catch(e=>toast(e&&e.message==='toolarge'?'这张动图太大了，压缩后还是放不下，换一张短一点的吧':'图片处理失败，请换一张再试'));
}

function gameDay(){
  const n=new Date();
  const offset=n.getTime()-DAY_START_HOUR*60*60*1000;
  return new Date(offset);
}
function gameDayOfYear(){
  const d=gameDay();
  const s=new Date(d.getFullYear(),0,0);
  return Math.floor((d.getTime()-s.getTime())/86400000);
}
function gameDateKey(ts){
  const n=ts?new Date(ts):new Date();
  const offset=n.getTime()-DAY_START_HOUR*60*60*1000;
  const d=new Date(offset);
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0')+'-'+d.getDate().toString().padStart(2,'0');
}
function todayKey(){return gameDateKey();}
function dayOfYear(){return gameDayOfYear();}
function dateStr(ts){return gameDateKey(ts);}
function todayStr(){return todayKey();}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function jsonAttr(o){return esc(JSON.stringify(o));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}
function genRoom(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function getRoom(){
  let room=new URLSearchParams(location.search).get('room');
  if(!room)room=localStorage.getItem('cinnamoroll_room');
  if(!room){room=genRoom();localStorage.setItem('cinnamoroll_room',room);}
  try{const u=new URL(location.href);if(u.searchParams.get('room')!==room){u.searchParams.set('room',room);history.replaceState({},'',u.toString());}}catch(e){}
  return room;
}

function blobToAvatar(blob){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(blob);const img=new Image();
    img.onload=()=>{
      const S=192,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
      const m=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(u);
      let out;
      try{const d=x.getImageData(0,0,S,S).data;let a=false;for(let i=3;i<d.length;i+=4){if(d[i]<250){a=true;break;}}out=a?c.toDataURL('image/webp',0.9):c.toDataURL('image/jpeg',0.88);}catch(e){out=c.toDataURL('image/jpeg',0.88);}
      res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'));};
    img.src=u;
  });
}

function fileStamp(){const n=new Date(),p=x=>String(x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'_'+p(n.getHours())+p(n.getMinutes());}
function fillImagesFromCache(obj){
  (function walk(o){
    if(!o||typeof o!=='object')return;
    if(Array.isArray(o)){o.forEach(walk);return;}
    if(typeof o.id==='string'&&!o.src&&imageCache[o.id])o.src=imageCache[o.id];
    Object.keys(o).forEach(k=>walk(o[k]));
  })(obj);
}
function exportBackup(){

function doImport(st){

    if(typeof o.id==='string'&&typeof o.src==='string'&&o.src.indexOf('data:')===0)imgs.push(o);
    Object.keys(o).forEach(k=>walk(o[k]));
  })(st);
  imgs.forEach(o=>{imageCache[o.id]=o.src;pushImageToCloud(o.id,o.src);});

  hydrateAfterLoad();
  baseRemoteTime=Math.max(baseRemoteTime,lastRemoteTime);state.time=Math.max(Date.now(),lastRemoteTime+1,(st.time||0)+1);
  save();

function stripImagesForCloud(raw){
  const clone=JSON.parse(JSON.stringify(raw));
  (clone.customDecos||[]).forEach(d=>{if(d)delete d.src;});
  (clone.customBgs||[]).forEach(b=>{if(b)delete b.src;});
  (clone.noteArchive||[]).forEach(a=>{(a.images||[]).forEach(im=>{delete im.src;});});
  if(clone.pet&&Array.isArray(clone.pet.pets))clone.pet.pets.forEach(pt=>{(pt.moods||[]).forEach(m=>(m.imgs||[]).forEach(im=>{delete im.src;}));(pt.states||[]).forEach(s=>{delete s.src;});});
  (clone.tasks||[]).forEach(t=>{(t.noteImages||[]).forEach(im=>{delete im.src;});(t.sportPics||[]).forEach(im=>{delete im.src;});(t.choreChips||[]).forEach(c=>{if(c.img)delete c.img.src;});});
  return clone;
}
let syncReady=false,pendingPush=false,lastRemoteTime=0,LOADED_TIME=0,HAD_LOCAL=false;
// baseRemoteTime：本机数据是基于云端哪个版本（time）改出来的。
// 上传前先读云端：如果云端有本机没见过的更新（别的设备改过），就不覆盖，改为换用云端版本，
// 本机没同步上去的改动存进自动备份。这样长时间放在后台的旧设备醒来后（比如早上 5 点换日自动保存）
// 不会再把别的设备昨晚的新内容盖掉。
let baseRemoteTime=0,_pushing=false,_pushAgain=false,_pushRetryT=null;
async function pushCloud(){
  if(!fbReady){setSync('本地模式');return;}
  if(!syncReady){pendingPush=true;return;}
  if(_pushing){_pushAgain=true;return;}
  _pushing=true;
  const ref=fbDb.collection('rooms').doc(getRoom());
  const data=stripImagesForCloud(state);
  let conflict=null;
  try{
    await fbDb.runTransaction(async tx=>{
      conflict=null;
      const snap=await tx.get(ref);
      const d=snap.exists?snap.data():null;
      if(d&&(d.time||0)>baseRemoteTime&&(d.time||0)!==(data.time||0)){conflict=d;return;}
      tx.set(ref,data);
    });
    if(conflict){
      _pushAgain=false;
      backupPush(state,'和其他设备冲突时本机未同步的内容');
      lastRemoteTime=Math.max(lastRemoteTime,conflict.time||0);
      adoptRemote(conflict);
      toast('☁️ 其他设备有更新的内容，已换成最新版本；本机刚才的改动已存进「🛟 恢复自动备份」');
    }else{
      baseRemoteTime=Math.max(baseRemoteTime,data.time||0);
      setSync('已同步');
    }
  }catch(e){
    // 离线或网络不稳：不排队硬写，等恢复联网后按同样的规则再检查一次
    console.warn('云端保存失败',e);setSync('离线，稍后同步');
    pendingPush=true;
    clearTimeout(_pushRetryT);
    _pushRetryT=setTimeout(()=>{if(pendingPush&&navigator.onLine!==false){pendingPush=false;pushCloud();}},20000);
  }finally{
    _pushing=false;
    if(_pushAgain){_pushAgain=false;pushCloud();}
  }
}
window.addEventListener('online',()=>{if(pendingPush&&syncReady){pendingPush=false;pushCloud();}});
function hydrateAfterLoad(){
  if(!state.coreDone)state.coreDone={};
  if(!Array.isArray(state.completionLog))state.completionLog=[];
  if(!state.tasks)state.tasks=[];
  const ids=state.tasks.map(t=>t.id);PRESET.forEach(p=>{if(!ids.includes(p.id))state.tasks.push(makePresetTask(p));});
  state.tasks.forEach(t=>{
    if(t.preset&&NO_SUB.has(t.id)){t.subs=[];}
    if(!t.noteTime&&t.notes)t.noteTime=Date.now();
    if(t.id==='handwriting'&&!Array.isArray(t.noteImages))t.noteImages=[];
    if(t.id==='housework'&&!Array.isArray(t.noteImages))t.noteImages=[];
    if(t.id==='sport'&&t.customVideos===undefined)t.customVideos=[];
    if(t.id==='piano'){t.name='今日琴房';if(!Array.isArray(t.songs))t.songs=[];}
    if(t.id==='video'&&t.videoTopicId===undefined)t.videoTopicId=null;
    if(t.id==='fanfic'&&t.inspos===undefined)t.inspos=[];
    if(t.id==='mood'){if(!Array.isArray(t.weatherSel))t.weatherSel=[];if(!Array.isArray(t.moodSel))t.moodSel=[];if(!Array.isArray(t.customWeather))t.customWeather=[];if(!Array.isArray(t.customMood))t.customMood=[];}
    if(t.id==='translate'){if(!Array.isArray(t.books))t.books=[];if(!Array.isArray(t.vocab))t.vocab=[];if(!Array.isArray(t.terms))t.terms=[];}
    if(t.id==='housework'&&!Array.isArray(t.choreChips))t.choreChips=DEFAULT_CHORES.map((n,i)=>({id:'chore_init_'+i,name:n}));
    if(t.id==='teach'){if(!Array.isArray(t.classes))t.classes=[];if(!Array.isArray(t.activityChips))t.activityChips=DEFAULT_TEACH_ACTS.map((n,i)=>({id:'act_init_'+i,name:n}));}
    if(t.id==='ppt'&&(!t.ppt||Array.isArray(t.ppt)))t.ppt={custom:{},added:[]};
    if(t.id==='jukebox'&&!Array.isArray(t.songs))t.songs=[];
  });
  if(!Array.isArray(state.customDecos))state.customDecos=[];
  if(!Array.isArray(state.customBgs))state.customBgs=[];
  if(!state.selected&&state.tasks[0])state.selected=state.tasks[0].id;
}

function seedImportedTerms(){
  if(state.termsImportedV1)return;
  const t=(state.tasks||[]).find(x=>x.id==='translate');
  if(t){
    if(!Array.isArray(t.terms))t.terms=[];
    const existing=new Set(t.terms.map(x=>x.term));
    IMPORTED_TERMS_SEED.forEach(pair=>{
      const term=pair[0],meaning=pair[1];
      if(existing.has(term))return;
      existing.add(term);
      t.terms.push({id:uid(),term:term,source:'🔍收集',meaning:meaning});
    });
  }
  state.termsImportedV1=true;
  save();
}

function fixTermNotesV2(){
  if(state.termsNoteFixedV2)return;
  const t=(state.tasks||[]).find(x=>x.id==='translate');
  if(t&&Array.isArray(t.terms)){
    const seedMap={};
    IMPORTED_TERMS_SEED.forEach(pair=>{seedMap[pair[0]]=pair[1];});
    t.terms.forEach(x=>{
      if(x&&x.source==='🔍收集'&&Object.prototype.hasOwnProperty.call(seedMap,x.term)){
        x.meaning=seedMap[x.term];
      }
    });
  }
  state.termsNoteFixedV2=true;
  save();
}
let unsubMain=null,unsubImages=null;
/* ===== 同步安全：启动时先读云端，再决定用哪份，绝不用旧/空数据覆盖云端 ===== */
function richLen(o){
  try{return JSON.stringify(o,(k,v)=>{
    if(k==='terms'&&Array.isArray(v))return v.filter(x=>!(x&&x.source==='🔍收集'));
    if(k==='src'&&typeof v==='string'&&v.length>200)return 'x';
    if(k==='time'||k==='lastGameDay'||k==='noteTime'||k==='version')return undefined;
    return v;
  }).length;}catch(e){return 0;}
}
let _blankLen=null;
function blankLen(){
  if(_blankLen==null){try{_blankLen=richLen({tasks:PRESET.map(makePresetTask),core:[],coreDone:{},completionLog:[]});}catch(e){_blankLen=6000;}}
  return _blankLen;
}
function isBlankState(o){return !o||!Array.isArray(o.tasks)||richLen(o)<=blankLen()+BLANK_MARGIN;}
const BLANK_MARGIN=1800;
function backupPush(obj,reason){
  try{
    const key='cinnamoroll_backups_v1';let arr=[];
    try{arr=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){arr=[];}
    arr.unshift({t:Date.now(),reason:reason,data:JSON.stringify(stripImagesForCloud(obj))});
    arr=arr.slice(0,4);
    while(arr.length){try{localStorage.setItem(key,JSON.stringify(arr));break;}catch(e){arr.pop();}}
  }catch(e){}
}
function dailyLocalBackup(){
  try{
    const k='cinnamoroll_lastdaily';const today=todayKey();
    if(localStorage.getItem(k)===today)return;
    if(!isBlankState(state)){backupPush(state,'每日自动备份');localStorage.setItem(k,today);}
  }catch(e){}
}
function adoptRemote(d){
  baseRemoteTime=Math.max(baseRemoteTime,(d&&d.time)||0);
  const keep={selected:state.selected,view:state.view,diaryDay:state.diaryDay,avatar:state.avatar,avatarTime:state.avatarTime||0,title:state.title,titleTime:state.titleTime||0};
  state=Object.assign({},d);
  state.selected=keep.selected||state.selected;state.view=keep.view||'task';state.diaryDay=keep.diaryDay||null;
  let keepLocal=false;
  if(keep.avatarTime>(d.avatarTime||0)){state.avatar=keep.avatar;state.avatarTime=keep.avatarTime;keepLocal=true;}
  if(keep.titleTime>(d.titleTime||0)){state.title=keep.title;state.titleTime=keep.titleTime;keepLocal=true;}
  hydrateAfterLoad();
  if(state.selected&&!state.tasks.some(t=>t.id===state.selected))state.selected=state.tasks[0]?state.tasks[0].id:null;

function initialSyncDecide(d){
  if(!d){pendingPush=true;return;}
  const lBlank=!HAD_LOCAL||isBlankState(state),cBlank=isBlankState(d);
  let useCloud;
  if(lBlank&&!cBlank)useCloud=true;
  else if(cBlank&&!lBlank)useCloud=false;
  else useCloud=(d.time||0)>LOADED_TIME;
  if(useCloud){
    if(HAD_LOCAL&&!lBlank)backupPush(state,'换用云端数据前的本机数据');
    pendingPush=false;
    adoptRemote(d);
  }else{
    if(!cBlank)backupPush(d,'被本机数据覆盖前的云端数据');
    baseRemoteTime=d.time||0;
    state.time=Math.max(state.time||0,lastRemoteTime+1);
    persistLocal();
    pendingPush=true;
  }
}
function runHousekeeping(){
  if(rollAllTaskNotes())save();
  checkNewDay();seedImportedTerms();stripTermNotesOnce();fixTermNotesV2();dailyLocalBackup();
  renderSidebar();renderDetail();

function startCloudSync(){
  if(!fbReady){setSync('本地模式');runHousekeeping();return;}
  const room=getRoom();
  setSync('连接中');
  if(unsubMain)unsubMain();
  if(unsubImages)unsubImages();
  setTimeout(()=>{if(!syncReady){runHousekeeping();setSync('离线');}},8000);
  unsubMain=fbDb.collection('rooms').doc(room).onSnapshot(snap=>{
    if(!syncReady&&snap.metadata&&snap.metadata.fromCache){setSync('连接中');return;}
    const d=snap.exists?snap.data():null;
    if(d&&d.time)lastRemoteTime=Math.max(lastRemoteTime,d.time);
    if(!syncReady){
      syncReady=true;
      initialSyncDecide(d);
      runHousekeeping();
      if(pendingPush){pendingPush=false;pushCloud();}
      setSync('已同步');return;
    }
    if(d&&d.time&&d.time>(state.time||0))adoptRemote(d);
    setSync('已同步');
  },err=>{console.warn('云端连接失败',err);setSync('离线');});
  unsubImages=fbDb.collection('rooms').doc(room).collection('images').onSnapshot(qs=>{
    qs.docChanges().forEach(ch=>{
      const id=ch.doc.id;
      if(ch.type==='removed'){delete imageCache[id];}
      else{const dd=ch.doc.data();if(dd&&dd.src){imageCache[id]=dd.src;if(/^(pimg|pet)_/.test(id))petIdbPut(id,dd.src);}}
    });
    renderDetail();petApplyDom();
  },err=>{console.warn('图片同步失败',err);});
}

function renderTermList(tid){

function cancelInlineTerm(tid){window._inlineTermId=null;refreshTermList(tid);}
function saveInlineTerm(tid,id,silent){

function cancelEditTerm(){window._editTermId=null;renderDetail();}
function addTerm(tid){

  const w=document.getElementById('term_word').value.trim();
  const s=document.getElementById('term_source').value;
  const m=document.getElementById('term_mean').value.trim();

function renderVocabList(tid){
  const t=getTask(tid);if(!t||!Array.isArray(t.vocab)||!t.vocab.length)return '<div class="empty-hint">词库还空空的，收一个词试试吧～</div>';
  const q=(window._vocabQ||'').toLowerCase().trim();
  const filt=window._vocabFilter||null;
  let list=t.vocab;
  if(filt==='archaic')list=list.filter(g=>g.archaic);
  else if(filt==='synonym')list=list.filter(g=>(g.synonyms||[]).length);
  else if(filt==='descriptive')list=list.filter(g=>(g.descriptive||[]).length);
  if(q)list=list.filter(g=>{
    const all=[g.word].concat(g.synonyms||[]).concat(g.descriptive||[]);
    return all.some(w=>(w||'').toLowerCase().indexOf(q)>=0);
  });
  if(!list.length)return '<div class="empty-hint">没有匹配的词语</div>';
  const expanded=!!window._vocabExpanded;
  const showList=expanded?list:list.slice(0,20);
  let html=showList.map(g=>{
    if(g.id===window._inlineVocabId)return vocabEditCard(tid,g);
    const synHtml=(g.synonyms||[]).length?'<span class="tag tag-blue">近义</span> '+g.synonyms.map(esc).join('、'):'';
    const descHtml=(g.descriptive||[]).length?'<span class="tag tag-pink">描写</span> '+g.descriptive.map(esc).join('、'):'';
    return '<div class="item-card"><div class="ic-main"><div class="ic-title">'+(g.archaic?'<span class="tag tag-archaic">古雅</span> ':'')+esc(g.word)+'</div>'+(synHtml?'<div class="ic-body">'+synHtml+'</div>':'')+(descHtml?'<div class="ic-body">'+descHtml+'</div>':'')+'</div><div class="flex" style="flex-shrink:0"><button class="ic-del" onclick="editVocabGroup(\''+tid+'\',\''+g.id+'\')" title="编辑">✎</button><button class="ic-del" onclick="delVocabGroup(\''+tid+'\',\''+g.id+'\')" title="删除">✕</button></div></div>';
  }).join('');
  if(list.length>20){
    html+='<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="window._vocabExpanded='+(!expanded)+';document.getElementById(\'vocabList\').innerHTML=renderVocabList(\''+tid+'\')">'+(expanded?'收起 ▴':'展开全部 共'+list.length+'条 ▾')+'</button>';
  }
  return html;
}
function refreshVocabList(tid){const el=document.getElementById('vocabList');if(el)el.innerHTML=renderVocabList(tid);}
function vocabEditCard(tid,g){
  return '<div class="item-card editing" style="display:block"><div class="field"><label>词语</label><input class="input" id="iv_word_'+g.id+'" value="'+esc(g.word)+'"></div><label class="flex" style="gap:6px;margin:8px 0;font-size:13px;color:var(--ink-soft)"><input type="checkbox" id="iv_arc_'+g.id+'" style="width:auto"'+(g.archaic?' checked':'')+'> 古雅词</label><div class="field"><label>近义词</label><input class="input" id="iv_syn_'+g.id+'" value="'+esc((g.synonyms||[]).join('、'))+'" placeholder="用 / 或 ； 分隔"></div><div class="field"><label>描写词</label><input class="input" id="iv_desc_'+g.id+'" value="'+esc((g.descriptive||[]).join('、'))+'" placeholder="用 / 或 ； 分隔"></div><div class="flex" style="margin-top:8px"><button class="btn btn-pink btn-sm" onclick="saveInlineVocab(\''+tid+'\',\''+g.id+'\')">💾 保存</button><button class="btn btn-ghost btn-sm" onclick="cancelInlineVocab(\''+tid+'\')">取消</button></div></div>';
}
function editVocabGroup(tid,id){
  if(window._inlineVocabId&&window._inlineVocabId!==id)saveInlineVocab(tid,window._inlineVocabId,true);
  window._inlineVocabId=id;
  refreshVocabList(tid);
  setTimeout(()=>{const el=document.getElementById('iv_word_'+id);if(el){el.focus();el.scrollIntoView({block:'nearest'});}},30);
}
function cancelInlineVocab(tid){window._inlineVocabId=null;refreshVocabList(tid);}
function saveInlineVocab(tid,id,silent){
  const t=getTask(tid);if(!t)return;
  const g=(t.vocab||[]).find(x=>x.id===id);
  const eW=document.getElementById('iv_word_'+id);
  if(!g||!eW)return;
  const word=eW.value.trim();
  if(!word){if(!silent)toast('先填个词语吧～');return;}
  g.word=word;
  g.archaic=document.getElementById('iv_arc_'+id).checked;
  g.synonyms=splitVocabWords(document.getElementById('iv_syn_'+id).value);
  g.descriptive=splitVocabWords(document.getElementById('iv_desc_'+id).value);
  window._inlineVocabId=null;
  save();refreshVocabList(tid);
  toast('已更新 🌸');
}
function cancelEditVocab(){window._editVocabId=null;renderDetail();}
function addVocabGroup(tid){
  const t=getTask(tid);if(!t)return;
  const word=document.getElementById('vocab_word').value.trim();
  const archaic=document.getElementById('vocab_archaic').checked;
  const syn=splitVocabWords(document.getElementById('vocab_syn').value);
  const desc=splitVocabWords(document.getElementById('vocab_desc').value);
  if(!word){toast('先填个词语吧～');return;}
  if(!Array.isArray(t.vocab))t.vocab=[];
  if(window._editVocabId){
    const g=t.vocab.find(x=>x.id===window._editVocabId);
    if(g){g.word=word;g.archaic=archaic;g.synonyms=syn;g.descriptive=desc;}
    window._editVocabId=null;
    save();renderDetail();toast('已更新 🌸');
  }else{
    t.vocab.unshift({id:uid(),word:word,archaic:archaic,synonyms:syn,descriptive:desc});
    save();renderDetail();toast('已收录 🌸');
  }
}
function delVocabGroup(tid,id){
  const t=getTask(tid);if(!t)return;
  t.vocab=(t.vocab||[]).filter(x=>x.id!==id);
  if(window._editVocabId===id)window._editVocabId=null;
  if(window._inlineVocabId===id)window._inlineVocabId=null;
  save();document.getElementById('vocabList').innerHTML=renderVocabList(tid);
}

function findVocabIdx(word){

const PINYIN_PRACTICE_WORDS=new Set(["你","好","你好","一","五","八","大","不","口","白","女","马","忙","吗","很","汉语","难","太","爸爸","妈妈","他","她","男","哥哥","弟弟","妹妹","学习","英语","对","明天","见","去","邮局","寄","信","银行","取","钱","六","七","九","北京","今天","昨天","星期","星期四","星期天","星期日","几","二","三","四","哪儿","那儿","我","回","学校","再见","对不起","没关系","天安门","越南","这","是","老师","您","请","进","坐","喝","茶","谢谢","不客气","客气","工作","身体","十","日","王"]);
function sentenceLateCount(sentence,targetIdx){
  if(targetIdx<0)return 0;
  const idxMap=buildVocabIdx_v2();
  let i=0,count=0;const n=sentence.length,maxLen=VOCAB_MAX_LEN;
  while(i<n){
    let matched=false;
    for(let l=Math.min(maxLen,n-i);l>0;l--){
      const piece=sentence.substr(i,l);
      if(idxMap.hasOwnProperty(piece)){
        const tidx=idxMap[piece];
        if(tidx>targetIdx&&!PINYIN_PRACTICE_WORDS.has(piece))count++;
        i+=l;matched=true;break;
      }
    }
    if(!matched)i++;
  }
  return count;
}
let VOCAB_IDX_CACHE_V2=null,VOCAB_MAX_LEN=0;
function buildVocabIdx_v2(){
  if(!VOCAB_IDX_CACHE_V2){
    VOCAB_IDX_CACHE_V2={};
    VOCAB_ORDER.forEach(function(w,i){if(!(w in VOCAB_IDX_CACHE_V2))VOCAB_IDX_CACHE_V2[w]=i;VOCAB_MAX_LEN=Math.max(VOCAB_MAX_LEN,w.length);});
  }
  return VOCAB_IDX_CACHE_V2;
}
function sortByEarlyWords(arr,targetIdx){
  if(targetIdx<0||!arr||!arr.length)return arr||[];
  return arr.map(function(s){return {s:s,c:sentenceLateCount(s,targetIdx)};}).sort(function(a,b){return a.c-b.c;}).map(function(x){return x.s;});
}

function pptUidata(t){
  if(!t.ppt||Array.isArray(t.ppt))t.ppt={custom:{},added:[]};
  if(!t.ppt.custom)t.ppt.custom={};
  if(!Array.isArray(t.ppt.added))t.ppt.added=[];
  return t.ppt;
}
function pptAllWords(t){
  const d=pptUidata(t);
  const list=HSK_WORDS.map(w=>d.custom[w.id]?Object.assign({},w,d.custom[w.id],{builtin:true}):Object.assign({builtin:true},w));
  d.added.forEach(w=>list.push(Object.assign({builtin:false},w)));
  return list;
}
function pptFind(t,id){return pptAllWords(t).find(w=>w.id===id);}
function pptSearch(t,q,level){
  q=(q||'').trim();
  let list=pptAllWords(t);
  if(level)list=list.filter(w=>String(w.level)===String(level));
  if(!q)return list.slice(0,30);
  return list.filter(w=>w.word.includes(q)||(w.pinyin||'').replace(/\s|[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g,c=>({ā:'a',á:'a',ǎ:'a',à:'a',ē:'e',é:'e',ě:'e',è:'e',ī:'i',í:'i',ǐ:'i',ì:'i',ō:'o',ó:'o',ǒ:'o',ò:'o',ū:'u',ú:'u',ǔ:'u',ù:'u',ü:'v'}[c]||c)).replace(/\s/g,'').includes(q.toLowerCase().replace(/\s/g,''))).slice(0,30);
}

function renderPptResultBox(t){

const PPT_SENSE_SEP='---';
function pptSenseGroups(arr){const g=[[]];(arr||[]).forEach(s=>{if(s===PPT_SENSE_SEP)g.push([]);else g[g.length-1].push(s);});return g;}
function renderPptWord(t,w){
  const chars=[...new Set(w.word.split(''))];
  const etymHtml=chars.map(renderEtymCard).join('');
  const targetIdx=findVocabIdx(w.word);
  // 同一个词在不同课有不同意思时，例句/问答用一行 --- 分组；组之间画虚线，组内各自排序编号
  const groupHtml=(arr,empty)=>{
    const groups=pptSenseGroups(arr).filter(g=>g.length);
    if(!groups.length)return '<div class="empty-hint">'+empty+'</div>';
    return groups.map(g=>sortByEarlyWords(g,targetIdx).map((s,i)=>`<div class="item-card"><div class="ic-main"><div class="ic-title">${i+1}. ${esc(s)}</div></div></div>`).join('')).join('<div class="sense-sep"></div>');
  };
  const qaHtml=groupHtml(w.qa,'暂无互动问答');
  const exHtml=groupHtml(w.ex,'暂无例句');
  const total=[...(w.qa||[]),...(w.ex||[])].filter(s=>s!==PPT_SENSE_SEP).length;
  return `<div class="card"><div class="flex" style="align-items:flex-start"><div style="flex:1"><h3 class="card-title" style="margin-bottom:2px">${esc(w.word)} <span class="muted" style="font-weight:400;font-size:15px">${esc(w.pinyin||'')}</span></h3><div class="flex" style="gap:6px;margin-bottom:6px"><span class="tag tag-blue">HSK ${w.level}</span><span class="muted">共 ${total} 句${w.builtin?'':'（自建词）'}</span></div>${w.note?'<div class="ic-body" style="margin-bottom:4px">💡 '+esc(w.note)+'</div>':''}</div><button class="btn btn-ghost btn-sm" onclick="pptShowEdit('${t.id}','${w.id}')">✎ 编辑</button></div>
<div id="pptEditBox_${w.id}"></div>
<div class="divider"></div>
<h4 class="sub-title">🪷 汉字六书 · 字源小知识</h4>
<details class="liushu-intro"><summary>六书是什么？（点击展开）</summary><div class="li-grid">${LIUSHU_INTRO.map(x=>'<div><b>'+x[0]+'</b>：'+x[1]+'</div>').join('')}</div></details>
<div class="etym-grid">${etymHtml}</div>
<div class="divider"></div>
<h4 class="sub-title">📚 例句</h4>${exHtml}
<h4 class="sub-title" style="margin-top:14px">❓ 互动问答</h4>${qaHtml}
</div>`;
}

function bookIsDone(b){const total=b.total||1;return (b.chapters||[]).filter(c=>c.done&&c.num<=total).length>=total;}
function renderBookList(t){
  const rank=b=>(bookIsDone(b)?2:0)+(b.pinned?0:1);
  const list=t.books.slice().sort((a,b)=>rank(a)-rank(b));
  let html='',shownDone=false;
  list.forEach(b=>{
    if(bookIsDone(b)&&!shownDone){shownDone=true;html+='<div class="muted" style="margin:14px 0 8px">✅ 已读完</div>';}
    html+=renderBookCard(t,b);
  });
  return html;
}

function renderBookCard(t,b){
  b.chapters=b.chapters||[];b.total=b.total||1;if(!b.currentChapter)b.currentChapter=1;

function songTick(t){

/* 家务卡片拖动排序：鼠标按住拖动；触屏长按约 0.35 秒后拖动 */
(function(){
  let cand=null,drag=null,timer=null;
  const grid=()=>document.querySelector('.chore-grid');
  function begin(card,x,y){
    const r=card.getBoundingClientRect();
    const g=card.cloneNode(true);g.classList.add('chore-ghost');g.classList.remove('chore-card');
    g.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
    g.className='chore-card chore-ghost';
    document.body.appendChild(g);
    card.classList.add('chore-dragging');
    document.body.style.userSelect='none';
    drag={card:card,ghost:g,ox:x-r.left,oy:y-r.top};
    if(navigator.vibrate){try{navigator.vibrate(15);}catch(e){}}
  }
  function move(x,y){
    if(!drag)return;
    drag.ghost.style.left=(x-drag.ox)+'px';drag.ghost.style.top=(y-drag.oy)+'px';
    const el=document.elementFromPoint(x,y);
    const over=el&&el.closest&&el.closest('.chore-card:not(.chore-ghost)');
    const gr=grid();
    if(over&&over!==drag.card&&gr&&gr.contains(over)){
      const kids=Array.from(gr.children);
      if(kids.indexOf(drag.card)<kids.indexOf(over))gr.insertBefore(drag.card,over.nextSibling);
      else gr.insertBefore(drag.card,over);
    }
    if(y<70)window.scrollBy(0,-14);else if(window.innerHeight-y<70)window.scrollBy(0,14);
  }
  function end(){
    clearTimeout(timer);timer=null;
    if(drag){
      const gr=grid();
      drag.ghost.remove();drag.card.classList.remove('chore-dragging');
      document.body.style.userSelect='';
      const t=getTask('housework');
      if(t&&gr&&Array.isArray(t.choreChips)){

function fmtTime(v){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m?String(+m[1]).padStart(2,'0')+':'+m[2]:(v||'');}
function dayTime(c,d){

}
function classTimeText(c,d){

function migrateClassLegacy(c){
  c.days=[];
  const str=c.time||'';
  const map={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6};
  const re=/周([一二三四五六日天、,，和\/\s]+)/g;let m;
  while((m=re.exec(str))){m[1].split('').forEach(ch=>{if(map[ch]!=null&&!c.days.includes(map[ch]))c.days.push(map[ch]);});}
  const tm=/(\d{1,2})[:h：点](\d{2})?\s*[-–—~～至到]\s*(\d{1,2})[:h：点](\d{2})?/.exec(str);
  if(tm){c.start=tm[1].padStart(2,'0')+':'+(tm[2]||'00');c.end=tm[3].padStart(2,'0')+':'+(tm[4]||'00');}
}

function timeSelHtml(id,val){

function sportBeep(freq){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sine';o.frequency.value=freq||880;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
    o.start();o.stop(ctx.currentTime+0.32);
    o.onended=()=>ctx.close();
  }catch(e){}
}

function sportStartTimer(tid,pid){
  const t=getTask(tid);const p=t&&t.sportPics.find(x=>x.id===pid);if(!p)return;

  render();
  sportBeep(880);
  _sportTimer={iv:setInterval(()=>{
    left--;
    if(left<=0){
      sportBeep(660);
      if(phase==='hold'){
        if(p.restSec>0){phase='rest';left=p.restSec;}
        else{rep++;if(rep>reps){sportFinishTimer(tid,pid,reps);return;}left=p.holdSec;}
      }else{
        rep++;

        phase='hold';left=p.holdSec;
      }
    }
    render();
  },1000)};
}

let _ytPlayer=null,_ytApiP=null;
function loadYTApi(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(_ytApiP)return _ytApiP;
  _ytApiP=new Promise((res,rej)=>{
    window.onYouTubeIframeAPIReady=()=>res();
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';
    s.onerror=()=>{_ytApiP=null;rej(new Error('load'));};
    document.head.appendChild(s);
    setTimeout(()=>{if(!(window.YT&&window.YT.Player)){_ytApiP=null;rej(new Error('timeout'));}},10000);
  });
  return _ytApiP;
}
function showYtError(code){
  const el=document.getElementById('ytMsg');if(!el)return;
  const map={load:'YouTube 播放器没加载出来（可能被网络屏蔽），建议改用哔哩哔哩视频。',100:'这个视频不存在，或已被设为私享。',101:'该视频的作者禁止了嵌入播放，请换一个视频，或改用哔哩哔哩。',150:'该视频的作者禁止了嵌入播放，请换一个视频，或改用哔哩哔哩。',153:'YouTube 没收到页面来源信息（多为直接双击打开 html 文件导致）。把页面放到网址下打开即可播放，或改用哔哩哔哩。',2:'视频参数有误，请检查链接。',5:'播放器出错，请刷新后重试。'};
  el.textContent=map[code]||('YouTube 播放失败（错误 '+code+'），可改用哔哩哔哩视频。');

function sportMountYT(vid){

    _ytPlayer=new YT.Player('ytHost',{videoId:vid,width:'100%',height:'100%',playerVars:vars,events:{onError:e=>showYtError(e.data)}});

function extractBili(u){const m=String(u).match(/BV[0-9A-Za-z]{10}/);return m?m[0]:'';}
async function sportResolveYT(url){
  const id=extractYouTubeId(url);
  if(!id)return{ok:false,error:'没识别到 YouTube 视频，请粘贴完整链接'};
  const watch='https://www.youtube.com/watch?v='+id;
  const d=await apiGet('/api/youtube?url='+encodeURIComponent(watch));
  if(d&&d.ok&&d.title)return{ok:true,provider:'youtube',id:id,title:d.title,author:d.author||'',cover:d.thumbnail||ytThumb(id)};
  try{
    const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(watch));
    if(r.ok){const j=await r.json();if(j&&j.title)return{ok:true,provider:'youtube',id:id,title:j.title,author:j.author_name||'',cover:j.thumbnail_url||ytThumb(id)};}
  }catch(e){}
  return{ok:false,error:'没能获取到 YouTube 视频信息，请检查链接或网络后重试'};
}
async function sportResolveBili(url){
  const id=extractBili(url);
  if(!id)return{ok:false,error:'没识别到 BV 号，请粘贴完整的哔哩哔哩视频链接（b23.tv 短链请先打开再复制地址栏链接）'};
  const fix=u=>String(u||'').replace(/^http:/,'https:');
  const d=await apiGet('/api/bilibili?bvid='+encodeURIComponent(id));
  if(d&&d.ok&&d.title)return{ok:true,provider:'bilibili',id:id,title:d.title,author:d.author||'',cover:fix(d.pic)};
  try{
    const r=await fetch('https://api.bilibili.com/x/web-interface/view?bvid='+id);
    if(r.ok){const j=await r.json();if(j&&j.code===0&&j.data)return{ok:true,provider:'bilibili',id:id,title:j.data.title,author:(j.data.owner&&j.data.owner.name)||'',cover:fix(j.data.pic)};}
  }catch(e){}
  return{ok:true,provider:'bilibili',id:id,title:'哔哩哔哩视频 '+id,author:'',cover:'',guess:true};
}

  if(state.diaryDay){
    const dd=daysMap[state.diaryDay]||{done:[],notes:[]};
    html+='<div class="card"><h3 class="card-title">🗓 '+state.diaryDay+' 的笔记</h3><button class="btn btn-ghost btn-sm" style="margin-bottom:14px" onclick="state.diaryDay=null;save();renderDetail()">← 返回日记列表</button>';
    html+=dd.notes.length?dd.notes.map(n=>'<div class="item-card"><div class="ic-main"><div class="ic-title">'+esc(n.name)+'</div>'+(n.notes?'<div class="ic-body">'+esc(n.notes)+'</div>':'')+((n.images&&n.images.length)?'<div class="note-img-grid">'+n.images.map(im=>{const s=imgSrc(im);return '<div class="note-img-item"><img src="'+esc(s)+'" onclick="window.open(\''+esc(s)+'\',\'_blank\')" title="点击查看大图"></div>';}).join('')+'</div>':'')+'</div></div>').join(''):'<div class="empty-hint">这一天没有记录笔记</div>';
    html+='</div>';
  }else{
    html+='<div class="card"><h3 class="card-title">📅 每日完成记录</h3><p class="card-desc">这里展示已完成的任务，点击查看当天的笔记，可按月份查看。</p>';
    const todayD=todayStr();const monthOf=d=>d.slice(0,7);
    if(!window._diaryMonth)window._diaryMonth=monthOf(todayD);
    const list=days.filter(d=>monthOf(d)===window._diaryMonth);
    const PER=5,pages=Math.max(1,Math.ceil(list.length/PER));
    if(window._diaryPage==null){
      let idx=0;
      if(window._diaryMonth===monthOf(todayD)){const k=list.findIndex(d=>d<=todayD);idx=k<0?0:k;}
      window._diaryPage=Math.floor(idx/PER);
    }
    window._diaryPage=Math.min(Math.max(window._diaryPage,0),pages-1);
    const pg=window._diaryPage;
    const slice=list.slice(pg*PER,pg*PER+PER);
    const mp=window._diaryMonth.split('-');
    html+='<div class="diary-bar"><button class="btn btn-ghost btn-sm" onclick="openDiaryMonthPicker()">📅 '+mp[0]+'年'+parseInt(mp[1],10)+'月 ▾</button></div>';
    if(slice.length){
      html+=slice.map(d=>{
        const dd=daysMap[d];const date=new Date(d+'T00:00:00');
        const week=['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
        return '<div class="diary-day"><div class="diary-date"><div class="dd">'+date.getDate()+'</div><div class="dw">'+week+'</div></div><div class="diary-body" onclick="openDiaryDay(\''+d+'\')">'+(dd.done.length?'<div class="diary-tasks">'+dd.done.map(x=>'<div class="ddone"><div class="c on">✓</div><div class="t">'+esc(x.name)+'</div></div>').join('')+'</div>':'<div class="dd-empty">这一天没有记录完成的任务</div>')+'<div class="diary-meta"><span>📝 '+dd.notes.length+' 条笔记</span><span>点击看详情 →</span></div></div></div>';
      }).join('');
      html+='<div class="diary-pager"><button class="btn btn-ghost btn-sm" onclick="diaryPage(-1)"'+(pg<=0?' disabled':'')+'>‹ 上一页</button><span>第 '+(pg+1)+' / '+pages+' 页</span><button class="btn btn-ghost btn-sm" onclick="diaryPage(1)"'+(pg>=pages-1?' disabled':'')+'>下一页 ›</button></div>';
    }else{
      html+='<div class="empty-hint">'+(days.length?'这个月还没有记录哦～':'还没有记录哦～<br>完成今日目标、保存笔记后，这里会有记录')+'</div>';
    }
    html+='</div>';
  }
  el.innerHTML=html;
  attachDecoDragHandlers();
}
/* ===== 中文日历选择器（日期 / 年月）===== */
let _cal=null;
function fmtCN(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?(+m[1])+'年'+(+m[2])+'月'+(+m[3])+'日':(iso||'');}
function openCalendar(o){
  const today=todayStr();
  const v=(o.value&&o.value.length>=7)?o.value:today.slice(0,7);
  _cal={mode:o.mode||'date',sel:o.value||'',y:+v.slice(0,4),m:+v.slice(5,7),panel:(o.mode==='month')?'months':'days',yb:0,onPick:o.onPick};
  renderCalendar();
  document.getElementById('modalMask').classList.add('show');
}
function renderCalendar(){
  const c=_cal;if(!c)return;
  const box=document.getElementById('modalBox');const pad=n=>String(n).padStart(2,'0');
  const today=todayStr();
  let h='<div class="cal">';
  if(c.panel==='days'){
    h+='<div class="cal-head"><button class="cal-nav" onclick="calNav(-1)">‹</button><button class="cal-title" onclick="calPanel(\'months\')">'+c.y+'年'+c.m+'月 ▾</button><button class="cal-nav" onclick="calNav(1)">›</button></div>';
    h+='<div class="cal-week">'+['日','一','二','三','四','五','六'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="cal-days">';
    const first=new Date(c.y,c.m-1,1).getDay(),dim=new Date(c.y,c.m,0).getDate();
    for(let i=0;i<first;i++)h+='<span></span>';
    for(let d=1;d<=dim;d++){const key=c.y+'-'+pad(c.m)+'-'+pad(d);h+='<button class="cal-d'+(key===c.sel?' sel':'')+(key===today?' today':'')+'" onclick="calPickDay(\''+key+'\')">'+d+'</button>';}
    h+='</div><div class="cal-foot"><button class="btn btn-ghost btn-sm" onclick="calToday()">今天</button><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button></div>';
  }else if(c.panel==='months'){
    h+='<div class="cal-head"><button class="cal-nav" onclick="calYear(-1)">‹</button><button class="cal-title" onclick="calPanel(\'years\')">'+c.y+'年 ▾</button><button class="cal-nav" onclick="calYear(1)">›</button></div><div class="cal-grid">';
    const selYM=c.sel?c.sel.slice(0,7):'';const curYM=today.slice(0,7);
    for(let m=1;m<=12;m++){const ym=c.y+'-'+pad(m);h+='<button class="cal-cell'+(ym===selYM?' sel':'')+(ym===curYM?' cur':'')+'" onclick="calPickMonth('+m+')">'+m+'月</button>';}
    h+='</div><div class="cal-foot"><button class="btn btn-ghost btn-sm" onclick="calToday()">'+(c.mode==='month'?'本月':'今天')+'</button><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button></div>';
  }else{
    h+='<div class="cal-head"><button class="cal-nav" onclick="calYears(-12)">‹</button><button class="cal-title plain">'+c.yb+' – '+(c.yb+11)+'</button><button class="cal-nav" onclick="calYears(12)">›</button></div><div class="cal-grid">';
    const cy=+today.slice(0,4);
    for(let y=c.yb;y<c.yb+12;y++)h+='<button class="cal-cell'+(y===c.y?' sel':'')+(y===cy&&y!==c.y?' cur':'')+'" onclick="calPickYear('+y+')">'+y+'</button>';
    h+='</div><div class="cal-foot"><span></span><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button></div>';
  }
  box.innerHTML=h+'</div>';
}
function calNav(d){const c=_cal;c.m+=d;if(c.m<1){c.m=12;c.y--;}if(c.m>12){c.m=1;c.y++;}renderCalendar();}
function calYear(d){_cal.y+=d;renderCalendar();}
function calYears(d){_cal.yb+=d;renderCalendar();}
function calPanel(p){_cal.panel=p;if(p==='years')_cal.yb=_cal.y-5;renderCalendar();}
function calPickYear(y){_cal.y=y;_cal.panel='months';renderCalendar();}
function calPickMonth(m){
  const c=_cal;c.m=m;
  if(c.mode==='month'){calFinish(c.y+'-'+String(m).padStart(2,'0'));}
  else{c.panel='days';renderCalendar();}
}
function calPickDay(key){calFinish(key);}
function calToday(){const t=todayStr();calFinish(_cal.mode==='month'?t.slice(0,7):t);}
function calFinish(v){const cb=_cal&&_cal.onPick;closeModal();if(cb)cb(v);}
function pickClassDate(cid){
  const inp=document.getElementById('dateInput_'+cid);const btn=document.getElementById('dateBtn_'+cid);
  openCalendar({mode:'date',value:inp?inp.value:todayStr(),onPick:v=>{if(inp)inp.value=v;if(btn)btn.textContent='📅 '+fmtCN(v);}});
}
function showPrompt(title,val,cb){const mask=document.getElementById('modalMask');const box=document.getElementById('modalBox');box.innerHTML='<h3>'+esc(title)+'</h3><input id="promptInp" value="'+esc(val)+'"><div class="m-actions"><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button><button class="btn btn-pink btn-sm" id="promptOk">确定</button></div>';mask.classList.add('show');const inp=document.getElementById('promptInp');setTimeout(()=>inp.focus(),50);inp.onkeydown=e=>{if(e.key==='Enter'){const v=inp.value.trim();closeModal();cb(v);}};document.getElementById('promptOk').onclick=()=>{const v=inp.value.trim();closeModal();cb(v);};}
function showConfirm(title,body,cb){const mask=document.getElementById('modalMask');const box=document.getElementById('modalBox');box.innerHTML='<h3>'+esc(title)+'</h3><div class="m-body">'+esc(body)+'</div><div class="m-actions"><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button><button class="btn btn-pink btn-sm" id="confirmOk">确定删除</button></div>';mask.classList.add('show');document.getElementById('confirmOk').onclick=()=>{closeModal();cb();};}
function closeModal(){document.getElementById('modalMask').classList.remove('show');}
document.getElementById('modalMask').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function toggleSidebar(open){const sb=document.getElementById('sidebar');const bd=document.getElementById('backdrop');if(open){sb.classList.add('open');bd.classList.add('show');}else{sb.classList.remove('open');bd.classList.remove('show');}}
function bindDiaryButtons(){
  // Diary buttons use inline onclick="openDiary()" — reliable across re-renders.
  // (Previously added addEventListener dual-binding here as reinforcement for a
  //  stale-SW issue; now that SW is network-first the inline handler is sufficient,
  //  and double-binding caused multi-fire + mobile touchend interference.)
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(e=>console.warn('SW 注册失败',e));});
  navigator.serviceWorker.addEventListener('message',(e)=>{
    if(e.data && e.data.type==='sw-updated'){
      if(confirm('发现新版本，是否立即刷新以获取最新修复？')){
        window.location.reload();
      }
    }
  });
}
/* 自动增高的输入框：内容多长，框就多高，不再出现小滚动条 */
function autoGrow(el){if(!el||!el.style)return;el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function growAll(){document.querySelectorAll('textarea.auto-grow').forEach(autoGrow);}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('auto-grow'))autoGrow(t);});
window.addEventListener('resize',()=>{clearTimeout(window._growT);window._growT=setTimeout(growAll,120);});
(function(){
  const d=document.getElementById('detail');if(!d||!window.MutationObserver)return;
  let raf=0;
  new MutationObserver(()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;growAll();});}).observe(d,{childList:true,subtree:true});
})();
getRoom();HAD_LOCAL=!!localStorage.getItem(STORE_KEY);load();LOADED_TIME=state.time||0;renderSidebar();renderDetail();bindDiaryButtons();startCloudSync();petStartRoam();
setInterval(()=>{if(fbReady&&!syncReady)return;checkNewDay();},5*60*1000);
</script>
