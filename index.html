
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>玉桂狗 · 专注力自愈工作台｜专治拖延与走神</title>
<meta name="theme-color" content="#E6F4FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="玉桂狗专注台">
<meta name="application-name" content="玉桂狗专注台">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --pink:#FFEEF8; --blue:#E6F4FF;
  --pink-2:#FFD9EC; --blue-2:#CFE9FF;
  --pink-deep:#E89BCB; --blue-deep:#7FB8E8;
  --ink:#5A5566; --ink-soft:#8A8599; --ink-fade:#B5B0C0;
  --card:#FFFFFF; --card-2:#FBF7FC;
  --line:#F0E6F2; --shadow:0 10px 30px rgba(180,160,200,.18);
  --shadow-soft:0 4px 14px rgba(180,160,200,.12);
  --radius:26px; --radius-s:16px; --radius-xs:12px;
  --gap:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--pink) 0%,#FFF7FC 40%,#F4FAFF 70%,var(--blue) 100%);background-attachment:fixed;min-height:100vh;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--pink-2);color:#5A4060}
.cloud{position:fixed;pointer-events:none;z-index:0;opacity:.5}
.cloud svg{display:block}
.c1{top:6%;left:55%;width:140px}
.c2{top:70%;left:8%;width:100px}
.c3{top:30%;right:4%;width:80px}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:300px;flex-shrink:0;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid rgba(255,255,255,.7);padding:26px 18px;display:flex;flex-direction:column;gap:16px;height:100vh;position:sticky;top:0;overflow-y:auto;transition:transform .3s ease;}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--pink-2);border-radius:6px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 4px}
.brand .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));display:grid;place-items:center;font-size:24px;cursor:pointer;box-shadow:0 2px 8px rgba(232,155,203,.35);border:2px solid #fff;overflow:hidden;transition:transform .15s}
.brand .avatar:hover{transform:scale(1.05)}
.brand .avatar img{width:100%;height:100%;object-fit:cover}
.brand .t1{font-size:18px;font-weight:700;color:#6B4A6E;letter-spacing:.5px;outline:none;border-bottom:1px dashed transparent;cursor:text}
.brand .t1:focus{border-bottom-color:var(--pink-2)}
.brand .t1:empty:before{content:"输入标题…";color:var(--ink-fade)}
.brand .t2{font-size:11px;color:var(--ink-soft);letter-spacing:2px}
  .side-tools{display:flex;gap:8px;align-items:center}
  .side-tools .btn{flex:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sync-badge{font-size:11px;font-weight:600;color:var(--blue-deep);background:var(--blue);padding:6px 10px;border-radius:10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sync-badge:hover{background:var(--blue-2)}
.side-section .label{font-size:11px;color:var(--ink-fade);letter-spacing:2px;margin:0 0 10px 6px;font-weight:600}
.core-area{background:linear-gradient(135deg,rgba(255,214,236,.4),rgba(207,233,255,.4));border-radius:var(--radius-s);padding:14px 14px 12px;border:1px dashed rgba(232,155,203,.4);}
.core-area .ct{font-size:12px;color:#9A6BA0;font-weight:700;margin-bottom:8px}
.core-list{display:flex;flex-direction:column;gap:7px}
.core-empty{font-size:12px;color:var(--ink-fade);text-align:center;padding:10px 0;line-height:1.6}
.core-task-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-xs);background:rgba(255,255,255,.75);border:1px solid rgba(240,230,242,.6);cursor:pointer;transition:all .18s;position:relative;}
.core-task-item:hover{background:#fff;transform:translateX(2px);box-shadow:var(--shadow-soft)}
.core-task-item.done{background:linear-gradient(135deg,rgba(255,217,236,.5),rgba(207,233,255,.5))}
.core-task-item .icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.core-task-item .nm{flex:1;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.core-task-item .nm.done{text-decoration:line-through;color:var(--ink-fade)}
.core-task-item .core-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--pink-2);flex-shrink:0;display:grid;place-items:center;cursor:pointer;font-size:13px;color:#fff;transition:all .18s}
.core-task-item .core-check.on{background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));border-color:transparent}
.task-list{display:flex;flex-direction:column;gap:9px}
.task-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--radius-s);background:rgba(255,255,255,.7);border:1px solid rgba(240,230,242,.6);cursor:pointer;transition:all .18s ease;position:relative;}
.task-item:hover{background:#fff;transform:translateX(2px);box-shadow:var(--shadow-soft)}
.task-item.active{background:linear-gradient(135deg,#fff,var(--card-2));border-color:var(--pink-2);box-shadow:var(--shadow-soft)}
.task-item .icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.task-item .nm{flex:1;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item .nm.done{text-decoration:line-through;color:var(--ink-fade)}
.task-item .core-tag{font-size:9px;background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));color:#fff;padding:1px 7px;border-radius:8px;flex-shrink:0}
.task-item .ops{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task-item:hover .ops{opacity:1}
.task-item .ops button{width:22px;height:22px;border-radius:7px;color:var(--ink-soft);font-size:11px;display:grid;place-items:center}
.task-item .ops button:hover{background:var(--pink);color:var(--pink-deep)}
.add-task{display:flex;gap:7px;margin-top:4px}
.add-task input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-xs);background:rgba(255,255,255,.8);font-size:13px}
.add-task input:focus{outline:none;border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(255,217,236,.3)}
.btn{padding:10px 14px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-pink{background:linear-gradient(135deg,var(--pink-2),var(--pink-deep));color:#fff}
.btn-pink:hover{box-shadow:0 6px 16px rgba(232,155,203,.4);transform:translateY(-1px)}
.btn-soft{background:rgba(255,255,255,.85);color:var(--pink-deep);border:1px solid var(--pink-2)}
.btn-soft:hover{background:#fff}
.btn-blue{background:linear-gradient(135deg,var(--blue-2),var(--blue-deep));color:#fff}
.btn-blue:hover{box-shadow:0 6px 16px rgba(127,184,232,.4);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.6);color:var(--ink-soft);border:1px solid var(--line)}
.btn-ghost:hover{background:#fff;color:var(--ink)}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:10px}
.main{flex:1;min-width:0;padding:30px clamp(16px,4vw,46px) 60px;overflow-x:hidden}
.topbar{display:none;align-items:center;gap:12px;margin-bottom:18px}
.topbar .menu-btn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:20px}
.topbar .tb-title{font-size:16px;font-weight:700;color:#6B4A6E;flex:1}
.topbar .tb-diary{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:18px}
.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.detail-head .big-icon{font-size:40px;filter:drop-shadow(0 3px 6px rgba(232,155,203,.3))}
.detail-head h1{font-size:clamp(20px,3.4vw,26px);font-weight:800;color:#6B4A6E;margin:0;letter-spacing:.5px}
.detail-head .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.detail-head .head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--ink-fade);margin-bottom:22px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border-radius:var(--radius);padding:26px clamp(20px,3vw,30px);box-shadow:var(--shadow);margin-bottom:var(--gap);border:1px solid rgba(255,255,255,.9)}
.card-title{font-size:16px;font-weight:700;color:#6B4A6E;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card-desc{font-size:12px;color:var(--ink-soft);margin:0 0 18px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-block}
.tag-pink{background:var(--pink);color:var(--pink-deep)}
.tag-blue{background:var(--blue);color:var(--blue-deep)}
.tag-archaic{background:#EDE3FF;color:#6B4FB8}
.tag-filter{cursor:pointer;border:none;font-family:inherit}
.tag-filter.active{outline:2px solid currentColor;outline-offset:1px}
.subtask{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:8px;transition:all .2s;border:1px solid transparent}
.subtask:hover{background:#fff;border-color:var(--line)}
.subtask .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink-2);flex-shrink:0;display:grid;place-items:center;cursor:pointer;margin-top:1px;transition:all .18s;color:#fff;font-size:12px}
.subtask.done .check{background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));border-color:transparent}
.subtask.done .st-text{text-decoration:line-through;color:var(--ink-fade)}
.subtask .st-text{flex:1;font-size:14px;line-height:1.5;word-break:break-word}
.subtask.locked{opacity:.5}
.subtask.locked .check{background:var(--line);border-color:var(--line)}
.subtask .lock-note{font-size:10px;color:var(--ink-fade);align-self:center}
.subtask .st-del{opacity:0;width:24px;height:24px;border-radius:8px;color:var(--ink-fade);font-size:14px;display:grid;place-items:center;transition:opacity .15s;background:none;border:none;cursor:pointer;flex-shrink:0}
.subtask:hover .st-del{opacity:.6}
.subtask .st-del:hover{background:var(--pink);color:var(--pink-deep);opacity:1}
.add-sub{display:flex;gap:8px;margin-top:6px}
.add-sub input{flex:1;padding:11px 14px;border:1px dashed var(--pink-2);border-radius:var(--radius-xs);background:rgba(255,238,248,.4);font-size:13px}
.add-sub input:focus{outline:none;background:#fff;border-style:solid;box-shadow:0 0 0 3px rgba(255,217,236,.25)}
.progress-bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-deep),var(--blue-deep));border-radius:8px;transition:width .5s ease}
.progress-txt{font-size:12px;color:var(--ink-soft)}
.notes-area{width:100%;min-height:120px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card-2);resize:vertical;font-size:14px;line-height:1.7}
.notes-area:focus{outline:none;border-color:var(--pink-2);background:#fff;box-shadow:0 0 0 3px rgba(255,217,236,.2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.input,.select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-xs);background:rgba(255,255,255,.9);font-size:14px;transition:all .15s}
.input:focus,.select:focus{outline:none;border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(255,217,236,.25)}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23E89BCB' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.item-card{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:10px;border:1px solid transparent;transition:all .15s}
.item-card:hover{background:#fff;border-color:var(--line);box-shadow:var(--shadow-soft)}
.item-card .ic-main{flex:1;min-width:0}
.item-card .ic-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px;word-break:break-word}
.item-card .ic-meta{font-size:11px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap}
.item-card .ic-body{font-size:13px;color:var(--ink);margin-top:5px;line-height:1.6;white-space:pre-wrap}
.item-card .ic-del{width:26px;height:26px;border-radius:9px;color:var(--ink-fade);font-size:15px;display:grid;place-items:center;flex-shrink:0;background:none;border:none;cursor:pointer}
.item-card .ic-del:hover{background:var(--pink);color:var(--pink-deep)}
.ic-del{width:24px;height:24px;border-radius:8px;color:var(--ink-fade);font-size:14px;display:grid;place-items:center;flex-shrink:0;background:none;border:none;cursor:pointer}
.ic-del:hover{background:var(--pink);color:var(--pink-deep)}
.search-box{position:relative;margin-bottom:14px}
.search-box input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--line);border-radius:var(--radius-xs);background:rgba(255,255,255,.95);font-size:14px}
.search-box input:focus{outline:none;border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(255,217,236,.25)}
.search-box .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6}
.empty-hint{text-align:center;padding:24px;color:var(--ink-fade);font-size:13px;background:var(--card-2);border-radius:var(--radius-s);border:1px dashed var(--line);line-height:1.8}
.quote-card{padding:18px 20px;border-radius:var(--radius-s);background:linear-gradient(135deg,var(--pink),var(--blue));margin-bottom:12px;position:relative;border:1px solid rgba(255,255,255,.8)}
.quote-card .q-text{font-size:15px;line-height:1.8;color:#6B4A6E;font-weight:500}
.quote-card .q-actions{display:flex;gap:8px;margin-top:10px}
.quote-card .q-actions button{font-size:11px;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.75);color:var(--pink-deep);font-weight:600;border:none;cursor:pointer}
.quote-card .q-actions button:hover{background:#fff}
.quote-card .star{position:absolute;top:14px;right:16px;font-size:18px;cursor:pointer;opacity:.5;background:none;border:none}
.quote-card .star.on{opacity:1}
.kn-block{margin-bottom:18px}
.kn-block h4{margin:0 0 8px;font-size:14px;color:var(--blue-deep);font-weight:700}
.kn-word{padding:14px 16px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:9px;border-left:4px solid var(--pink-2)}
.kn-word .w{font-size:17px;font-weight:800;color:#6B4A6E;margin-bottom:3px}
.kn-word .m{font-size:13px;color:var(--ink);line-height:1.7}
.kn-grammar{padding:16px;border-radius:var(--radius-s);background:linear-gradient(135deg,rgba(207,233,255,.5),rgba(255,238,248,.5));border:1px dashed var(--blue-2)}
.kn-grammar .g-title{font-weight:700;color:var(--blue-deep);margin-bottom:5px}
.kn-example{padding:16px;border-radius:var(--radius-s);background:var(--card-2);border-left:4px solid var(--blue-2)}
.kn-example .ex-orig{font-size:15px;font-weight:700;color:#6B4A6E;margin-bottom:4px;line-height:1.9}
.kn-example .ex-src{font-size:11px;color:var(--ink-fade);margin-bottom:8px}
.kn-example .ex-trans{font-size:13px;color:var(--ink);line-height:1.8}
.mat-card{padding:20px 22px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:12px;border-left:4px solid var(--pink-deep)}
.mat-card .mat-text{font-size:16px;font-weight:600;color:#6B4A6E;line-height:2.1;letter-spacing:1px;white-space:pre-wrap}
.mat-card .mat-src{font-size:11px;color:var(--ink-fade);margin-top:8px}
.mat-card .mat-actions{margin-top:10px}
.piano-piece{padding:18px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:12px}
.piano-piece.hide{display:none}
.jianpu{font-size:22px;font-weight:700;color:#6B4A6E;letter-spacing:3px;line-height:2.2;white-space:pre-wrap;font-family:'Courier New',monospace;background:#fff;border-radius:var(--radius-xs);padding:16px 20px;border:1px solid var(--line)}
.jianpu .b{color:var(--blue-deep)}
.calli-refresh{text-align:center;margin-top:16px}
.hide{display:none!important}
.video-tab{padding:9px 15px;border-radius:13px;background:var(--card-2);font-size:13px;font-weight:600;color:var(--ink-soft);transition:all .15s;border:1px solid transparent;cursor:pointer}
.video-tab.active{background:linear-gradient(135deg,var(--blue-2),var(--blue-deep));color:#fff}
.video-tab:hover:not(.active){background:#fff}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius-s);overflow:hidden;box-shadow:var(--shadow-soft);background:#000}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-info{font-size:12px;color:var(--ink-soft);margin-top:10px;text-align:center}
.chapter-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chapter-dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.chapter-dot:hover{background:#fff;border-color:var(--pink-2)}
.chapter-dot.active{background:linear-gradient(135deg,var(--pink-2),var(--blue-2));color:#fff;border-color:transparent;box-shadow:var(--shadow-soft)}
.chapter-dot.done{text-decoration:line-through;color:var(--ink-fade);background:rgba(255,217,236,.3)}
.diary-day{display:flex;gap:16px;margin-bottom:16px;align-items:flex-start}
.inspo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inspo-card{padding:14px 12px;border-radius:var(--radius-xs);background:var(--card-2);border:1px solid transparent;cursor:pointer;transition:all .15s;min-height:90px;display:flex;flex-direction:column;gap:6px}
.inspo-card:hover{background:#fff;border-color:var(--pink-2);box-shadow:var(--shadow-soft)}
.inspo-card .iw{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inspo-card .itags{display:flex;gap:6px;flex-wrap:wrap}

.game-room .content{position:relative;min-height:360px}
.room-deco{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);cursor:grab;z-index:5;touch-action:none;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s}
.room-deco img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.room-deco.selected{box-shadow:0 0 0 3px var(--pink-deep),0 4px 12px rgba(107,74,110,.2);border-radius:12px;background:rgba(255,255,255,.35)}
.room-deco .deco-del{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;background:#FF6B8A;color:#fff;border:none;font-size:13px;display:none;place-items:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.15);z-index:10}
.room-deco.selected .deco-del{display:grid}
.deco-panel{background:var(--card-2);border-radius:var(--radius-s);padding:16px;border:1px solid var(--line);margin-bottom:18px}
.deco-panel h3{margin:0 0 6px;font-size:16px;color:var(--ink)}
.deco-panel .desc{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.deco-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin-bottom:14px}
.deco-slot{aspect-ratio:1;border-radius:14px;background:#fff;border:2px dashed var(--pink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--ink-soft);cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.deco-slot:hover{border-color:var(--pink-deep);color:var(--pink-deep)}
.deco-slot.filled{border-style:solid;border-color:var(--pink-deep);background:rgba(255,217,236,.25);cursor:default}
.deco-slot.filled img{width:100%;height:100%;object-fit:cover}
.deco-slot.locked{border-color:var(--line);background:var(--card-2);cursor:not-allowed;color:var(--ink-fade)}
.deco-slot .slot-hint{font-size:9px;position:absolute;bottom:4px;left:0;right:0;text-align:center}
.deco-controls{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.deco-ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.deco-ctrl-row label{font-size:12px;color:var(--ink);font-weight:600;min-width:40px}
.deco-ctrl-row input[type=range]{flex:1;min-width:120px;accent-color:var(--pink-deep)}
.deco-ctrl-row span{font-size:12px;color:var(--ink-soft);min-width:42px;text-align:right}
.deco-ctrl-row .deco-num{width:54px;padding:3px 6px;border:1px solid var(--pink-2);border-radius:8px;font-size:12px;color:var(--ink);background:#fff;text-align:center}
.deco-ctrl-row .deco-num:focus{outline:none;border-color:var(--pink-deep);box-shadow:0 0 0 2px rgba(232,155,203,.25)}
.deco-ctrl-row .unit{font-size:12px;color:var(--ink-soft)}
.deco-empty{text-align:center;padding:12px;color:var(--ink-soft);font-size:12px;background:#fff;border-radius:12px;border:1px dashed var(--line)}
.deco-slot.selected{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(127,184,232,.3)}

// 图片在发去 Firestore 前先压缩，避免超出单文档大小限制；GIF 保持原样以保留动画
function compressImageFile(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
        else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        let hasAlpha=false;
        if(/^image\/(png|webp|svg)/.test(file.type||'')){
          try{const d=ctx.getImageData(0,0,w,h).data;for(let i=3;i<d.length;i+=4){if(d[i]<250){hasAlpha=true;break;}}}catch(e){}
        }
        if(hasAlpha){
          const wp=canvas.toDataURL('image/webp',Math.max(quality||0.8,0.85));
          resolve(wp.indexOf('data:image/webp')===0?wp:canvas.toDataURL('image/png'));
        }else{
          resolve(canvas.toDataURL('image/jpeg',quality));
        }
      };
      img.onerror=()=>reject(new Error('图片解码失败'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('图片读取失败'));
    reader.readAsDataURL(file);
  });
}
function fileToImageSrc(file,maxDim,quality){
  if(file.type==='image/gif'){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(new Error('图片读取失败'));
      reader.readAsDataURL(file);
    });
  }
  return compressImageFile(file,maxDim,quality);
}

const QUOTES=["他从不肯说想念，只是在每个深夜，把窗外的月光，看成是你的侧脸。","世间所有的久别重逢，都是一个人在原地，把另一个人等成了执念。","我宁愿你忘了我，也不愿你想起我时，心里有半分难过。","他眼底有星辰坠落，那是我穷尽一生也接不住的温柔。","后来我才明白，有些人光是遇见，就已经花光了所有运气。","他把所有的喜欢都藏进风里，怕你听见，又怕你听不见。","如果可以，我想做你生命里那场不必停的雨，淋湿你所有的孤单。","他们都说时间会冲淡一切，可我的时间，好像从他离开那天起就停了。","我这一生见过太多热闹，唯独在他身边，才觉得安静也是好的。","他不是我的月亮，但有一刻，月光确确实实照在了我的身上。","喜欢你这件事，我瞒着所有人，包括自己，却瞒不过每个深夜。","他在人海里回头的那一眼，我把它当成了一辈子的承诺。","原来最深的思念，不是念念不忘，而是不敢再提起你的名字。","我把你写进每一个故事里，却始终写不出一个圆满的结局。","他笑起来的时候，整个冬天都失去了下雪的理由。","我想成为他疲惫时可以依靠的那扇窗，不说话，只让光照进来。","所有的兵荒马乱里，我只想护他一个周全。","他说别等了，可他不知道，等待是我唯一还能做的事。","这世上最好的事，莫过于兜兜转转，你还在原地，而我也没走远。","他是我所有故事的开头，也是我所有故事的结尾。","我把他放在心上最软的地方，碰不得，忘不掉。","若故事能重来，我还是会在那个路口，撞上他的目光。","他不知道，他随手递来的一颗糖，甜了我整个青春。","思念是无声的雪，落满他走过的每一段路。","我在他看不见的地方，把自己活成了他的样子。","他说向前走别回头，可我回头时，他还在原地望着我。","原来心动是这么安静的一件事，像月亮掉进了海里。","我用一生去练习一个名字的发音，直到它变成呼吸。","他走后，连风吹过空椅子，我都觉得是他的拥抱。","如果有来生，我想做他案头的那盏灯，陪他熬过所有长夜。"];

{w:"之",m:"王力《古代汉语》第一册通论核心虚词。主要用法：①代词，代人、事、物，如「学而时习之」；②指示代词「这、那」，如「之二虫又何知」；③动词「往、到……去」，如「吾欲之南海」；④结构助词「的」，如「赤子之心」；⑤取消句子独立性，如「孤之有孔明」；⑥宾语前置标志，如「何陋之有」；⑦定语后置标志，如「马之千里者」；⑧凑足音节，无实义，如「顷之」。"},
{w:"其",m:"①第三人称代词，作定语表领属「他的、它的」，如「见其发矢十中八九」；②作主语或宾语「他、它」，如「其闻道也固先乎吾」；③指示代词「那、那些」，如「既其出，则或咎其欲出者」；④副词表测度「大概、恐怕」，如「其皆出于此乎」；⑤表反诘「难道」，如「其孰能讥之乎」；⑥表祈使或商量「还是、应当」，如「吾其还也」；⑦连词表假设「如果」，如「其业有不精，德有不成者」。"},
{w:"而",m:"连词，用法最繁：①并列，如「蟹六跪而二螯」；②承接，如「温故而知新」；③转折，如「学而不思则罔」；④修饰，连接状语与中心词，如「吾尝跂而望矣」；⑤递进，如「君子博学而日参省乎己」；⑥假设，如「人而无信，不知其可也」；⑦因果，如「表恶其能而不用也」。注意「而」无代词用法，「而翁」之「而」通「尔」。"},
{w:"以",m:"①动词「用、认为」，如「皆以美于徐公」；②介词表工具「用、拿」，如「以刀劈狼首」；③表凭借「凭、靠」，如「以勇气闻于诸侯」；④表原因「因为」，如「不以物喜」；⑤表时间「在、于」，如「余以乾隆三十九年十二月」；⑥连词表目的「来」，如「作《师说》以贻之」；⑦表结果「以致」，如「以啮人，无御之者」；⑧表并列或修饰，如「挟飞仙以遨游」。"},
{w:"于",m:"介词，常引介处所、对象、比较、被动等：①「在」，如「战于长勺」；②「到」，如「乃设九宾礼于庭」；③「对、向」，如「请奉命求救于孙将军」；④「比」，表比较，如「苛政猛于虎也」；⑤「被」，表被动，如「不拘于时」；⑥「从」，如「青，取之于蓝」。翻译时多后置，须调整语序。"},
{w:"为",m:"①动词「做、是、成为」，如「为学」；②介词表对象「替、给」，如「为天下兴利除弊」；③表被动「被」，如「身死人手，为天下笑」；④表原因「因为」，如「为之动容」；⑤介词「对、向」，如「不足为外人道也」；⑥句末语气词，表反问，如「何辞为」。读 wèi 时多为介词或语气词。"},
{w:"乃",m:"①副词「于是、就」，如「乃入据陈」；②「才」，如「乃悟前狼假寐」；③「竟然、却」，如「乃不知有汉」；④判断动词「是」，如「当立者乃公子扶苏」；⑤「只、仅仅」，如「至东城，乃有二十八骑」。"},
{w:"所",m:"「所」字结构是古汉语名词化的重要手段：①「所+动词」转指受事，如「渔人一一为具言所闻」；②「所+介词+动词」表凭借、原因、处所，如「所以遣将守关者」；③「为……所……」表被动，如「行将为人所并」；④「所谓」即「所说的」，「所以」表原因或凭借，不可按现代汉语「所以」理解。"},
{w:"者",m:"①代词性助词，附于动词、形容词后表「……的人/事/物」，如「得道者多助」；②附于数词后表「……种、……样」，如「二者不可得兼」；③用于判断句主语后表提顿，如「陈涉者，阳城人也」；④用于时间词后表停顿，如「今者项庄拔剑舞」；⑤用于假设分句末，如「不者，若属皆且为所虏」。"},
{w:"也",m:"语气词，古汉语使用频率极高：①句末表判断，如「城北徐公，齐国之美丽者也」；②句末表解释或肯定，如「环滁皆山也」；③句末表疑问或反诘，如「何者？严大国之威以修敬也」；④句中表停顿，以舒缓语气，如「是说也，人常疑之」；⑤与「邪」「乎」配合表反问。"},

{w:"焉",m:"①兼词「于之」「于是」，相当于「在那里」「对此」，如「积土成山，风雨兴焉」；②疑问代词「哪里、怎么」，如「且焉置土石」；③句末语气词，无实义，如「虽我之死，有子存焉」；④形容词词尾，相当于「然」，如「盘盘焉，囷囷焉」。"},

const GUWEN_GRAMMAR=[
{t:"古汉语的判断句",d:"古汉语判断句一般不用系词「是」，而以名词或名词性短语作谓语，借助「者……也」「也」「者也」等语气词表示。如「陈涉者，阳城人也」「城北徐公，齐国之美丽者也」「刘备天下枭雄」。先秦「是」多作指示代词，如「是社稷之臣也」中「是」即「这」，不可误为系词。汉代以后系词「是」逐渐发展，但古汉语教学中须严格区分。"},
{t:"被动表示法",d:"古汉语被动式主要有：①「于」字式，如「郤克伤于矢」；②「为」字式，如「身死国灭，为天下笑」；③「为……所……」式，如「不者，若属皆且为所虏」；④「见」字式，如「信而见疑，忠而被谤」；⑤「见……于……」式，如「吾长见笑于大方之家」；⑥「被」字式，汉代以后渐多，如「妆成每被秋娘妒」。先秦被动式较少，多借助上下文或反训理解。"},
{t:"宾语前置的类型",d:"古汉语宾语前置主要有三种：①疑问代词作宾语前置，如「吾谁欺？欺天乎？」「微斯人，吾谁与归？」；②否定句中代词宾语前置，如「不吾知也」「未之有也」「莫我肯顾」；③以「之」「是」为标志的宾语前置，如「何陋之有」「唯利是图」「句读之不知，惑之不解」。第四种为介词宾语前置，如「夜以继日」「秋以为期」。"},
{t:"词类活用·名词活用为动词",d:"名词在特定句法位置上当动词用。如「驴不胜怒，蹄之」中「蹄」=用蹄子踢；「沛公军霸上」中「军」=驻军；「范增数目项王」中「目」=使眼色；「假舟楫者，非能水也」中「水」=游泳。判断关键是看该名词是否带宾语、受副词修饰或处于谓语位置。"},
{t:"词类活用·使动与意动",d:"使动用法是主语使宾语发出动作或具有某种状态，如「项伯杀人，臣活之」的「活」=使……活；「春风又绿江南岸」的「绿」=使……绿。意动用法是主语主观认为宾语如何，如「渔人甚异之」的「异」=以……为异；「孔子登东山而小鲁」的「小」=以……为小。名词、形容词、动词皆可活用为使动或意动，须依上下文及语义判断。"},
{t:"词类活用·名词作状语",d:"古汉语普通名词可直接置于动词前作状语，表比喻、工具、处所、时间等。如「天下云集响应」中「云」「响」表比喻；「箕畚运于渤海之尾」表工具；「上食埃土，下饮黄泉」表方位；「日削月割，以趋于亡」表时间频率。翻译时须补出介词或作相应转换。"},
{t:"定语后置",d:"古汉语为强调或调节节奏，常将定语置于中心词之后。主要格式：①「中心词+之+定语+者」，如「马之千里者」=千里马；②「中心词+定语+者」，如「求人可使报秦者」=求可使报秦之人；③「中心词+之+定语」，如「蚓无爪牙之利，筋骨之强」。翻译时须将定语提前。"},
{t:"状语后置",d:"介词结构「于……」「以……」等常置于动词之后作补语，翻译时应提前作状语。如「战于长勺」=于长勺战；「告之于帝」=于帝告之；「具告以事」=以事具告；「青，取之于蓝，而青于蓝」后一「于蓝」表比较。注意后置状语与被动式「于」的区别。"},
{t:"宾语补出与省略句",d:"古汉语为求简洁，常省略主语、宾语、介词等。省略主语如「（项伯）欲呼张良与（之）俱去」；省略宾语如「竖子不足与（之）谋」；省略介词如「将军战（于）河北，臣战（于）河南」。阅读时须据上下文补出省略成分，方可准确理解句意。"},
{t:"通假字与古今字",d:"通假是古书中音同或音近字的通用假借，如「学而时习之，不亦说乎」中「说」通「悦」；「倍道而妄行」中「倍」通「背」。古今字是先后产生的同词异字，如「莫」本为「暮」，后借为否定代词，又造「暮」字。不可把通假字误作本字理解。"},
{t:"古汉语的副词系统",d:"古汉语副词可分为：①程度副词，如「甚、极、殊、太、尤」；②范围副词，如「皆、尽、悉、咸、仅、但、独」；③时间副词，如「既、已、尝、方、将、且、旋」；④语气副词，如「必、诚、殆、盖、庶、宁」；⑤否定副词，如「不、弗、毋、勿、未、非、微、莫」。其中「弗」相当于「不……之」。"},
{t:"「所」字结构与「者」字结构",d:"「所+动词」构成名词性短语，指代动作对象或相关事物，如「渔人一一为具言所闻」。「者」附于动词、形容词后亦构成名词性结构，如「得道者多助」。「所……者」合用，如「所操之术多异故也」。二者是古汉语名词化的重要手段，学习时应掌握其指代功能和翻译方法。"},
{t:"复音词与联绵词",d:"古汉语以单音词为主，但也存在大量复音词。①联绵词：两字联缀成义，不可拆开，如「徘徊、参差、犹豫、仓猝、窈窕」；②叠音词：如「萧萧、冉冉、悠悠」；③复合词：如「天下、国家、社稷、君子」。识别联绵词和复合词对正确断句、理解文意至关重要。"},
{t:"句首语气词与词头",d:"古汉语句首常用发语词引出议论或叙述，如「夫」「盖」「且夫」「若夫」「今夫」等，无实义，只起提示、舒缓语气作用。词头如「有」用于专有名词前，如「有夏」「有殷」；「言」用于动词前，如「言告师氏」。翻译时可略去不译或转换为现代汉语的语气词。"}

{o:"肉食者谋之，又何间焉？……肉食者鄙，未能远谋。",s:"——《左传·曹刿论战》",t:"当权的人自会谋划这事，你又何必参与呢？……当权的人目光短浅，不能深谋远虑。"},
{o:"若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也；焉用亡郑以陪邻？",s:"——《左传·烛之武退秦师》",t:"如果灭亡郑国对您有利，怎敢拿这事来烦劳您的左右。越过别国把远方的郑国当作边邑，您知道这是困难的；何必用灭掉郑国来增加邻国的土地呢？"},
{o:"子曰：「学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？」",s:"——《论语·学而》",t:"孔子说：「学习后按时温习，不也是很愉快的吗？有志同道合的人从远方来，不也是很快乐的吗？别人不了解我，我却不恼怒，不也是君子吗？」"},
{o:"子曰：「《诗》三百，一言以蔽之，曰：『思无邪。』」",s:"——《论语·为政》",t:"孔子说：「《诗经》三百篇，用一句话来概括它，就是『思想纯正无邪念』。」"},
{o:"子曰：「其身正，不令而行；其身不正，虽令不从。」",s:"——《论语·子路》",t:"孔子说：「统治者自身端正，不下命令事情也能实行；自身不端正，即使下了命令，百姓也不会听从。」"},
{o:"子贡问曰：「有一言而可以终身行之者乎？」子曰：「其恕乎！己所不欲，勿施于人。」",s:"——《论语·卫灵公》",t:"子贡问道：「有没有一个字可以终身奉行的呢？」孔子说：「大概是『恕』吧！自己不愿意的，不要强加给别人。」"},
{o:"大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。",s:"——《礼记·大学》",t:"大学的宗旨，在于彰显光明的品德；在于亲近爱抚民众；在于达到道德修养的最高境界。知道应达到的境界才能够志向坚定；志向坚定才能够镇静不躁；镇静不躁才能够心安理得；心安理得才能够思虑周详；思虑周详才能够有所收获。"},
{o:"道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母。",s:"——《老子·第一章》",t:"可以用言语表述的道，就不是永恒的道；可以用名称界定的名，就不是永恒的名。无，是天地的本始；有，是万物的根源。"},
{o:"吾生也有涯，而知也无涯。以有涯随无涯，殆已！已而为知者，殆而已矣。",s:"——《庄子·养生主》",t:"人的生命是有限的，而知识却是无穷的。以有限的生命去追求无穷的知识，那就很危险了！已经这样了还要汲汲追求知识，那就更加危险了。"},
{o:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也。",s:"——《庄子·逍遥游》",t:"北海有一条鱼，它的名字叫鲲。鲲的巨大，不知道有几千里；变化成为鸟，它的名字叫鹏。鹏的脊背，不知道有几千里。"},
{o:"屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。",s:"——《史记·屈原贾生列传》",t:"屈原痛心于楚怀王听觉不敏锐，谗言谄媚蒙蔽了君王的明察，邪恶的小人危害公正，端方正派的人不为朝廷所容，所以忧愁深思，写下了《离骚》。"},
{o:"太史公曰：「传曰『其身正，不令而行；其身不正，虽令不从』。其李将军之谓也？」",s:"——《史记·李将军列传》",t:"太史公说：「《论语》上说『在上位的人自身端正，不下命令事情也能实行；自身不端正，虽然下了命令也没人听从』。这大概就是说李将军的吧？」"},
{o:"古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也终不解矣。",s:"——韩愈《师说》",t:"古代求学的人一定有老师。老师，是靠他来传授道理、教授学业、解答疑难问题的。人不是生下来就懂得道理的，谁能没有疑惑？有了疑惑却不跟从老师学习，那些成为疑惑的问题就始终不能解决了。"},
{o:"嗟乎！师道之不传也久矣，欲人之无惑也难矣。古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。",s:"——韩愈《师说》",t:"唉！从师学习的风尚不流传已经很久了，要想人们没有疑惑也就很难了。古代的圣人，他们超出一般人很远了，尚且跟从老师请教；现在的一般人，他们低于圣人也很远了，却以向老师学习为耻。"},
{o:"呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。",s:"——欧阳修《五代史伶官传序》",t:"唉！国家兴盛与衰亡的道理，虽然说有天命的因素，难道不是由于人事吗？推究庄宗取得天下和失去天下的原因，就可以明白了。"},
{o:"夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！",s:"——欧阳修《五代史伶官传序》",t:"祸患常常是从细微的事情积累起来的，人的才智勇气往往被他所溺爱的事物困扰，难道只有宠幸伶人才会这样吗！"},
{o:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。",s:"——王勃《滕王阁序》",t:"晚霞与孤独的野鸭一起飞翔，秋天的江水与辽阔的天空浑然一色。渔船上的人在傍晚歌唱，歌声响遍鄱阳湖畔；雁群因寒气而惊叫，鸣声直到衡阳的水边才消失。"},
{o:"老当益壮，宁移白首之心？穷且益坚，不坠青云之志。",s:"——王勃《滕王阁序》",t:"年纪虽老而志气应当更加豪壮，怎能在白头时改变心志？境遇虽然困厄而意志应当更加坚定，绝不放弃高远的志向。"},
{o:"是岁十月之望，步自雪堂，将归于临皋。二客从予过黄泥之坂。霜露既降，木叶尽脱；人影在地，仰见明月。顾而乐之，行歌相答。",s:"——苏轼《后赤壁赋》",t:"这一年十月十五日，我从雪堂步行，将要回到临皋。两位客人跟随着我，经过黄泥坂。霜露已经降下，树叶全都脱落；人的影子映在地上，抬头看见明月。四下环顾而心中快乐，边走边唱，互相酬答。"}

{text:"至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧；渔歌互答，此乐何极！",src:"——范仲淹《岳阳楼记》"},
{text:"若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。",src:"——欧阳修《醉翁亭记》"},
{text:"落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。",src:"——王勃《滕王阁序》"},
{text:"予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。",src:"——周敦颐《爱莲说》"},
{text:"苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。",src:"——刘禹锡《陋室铭》"},
{text:"白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。",src:"——苏轼《赤壁赋》"},
{text:"是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。",src:"——王羲之《兰亭集序》"},
{text:"忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。",src:"——陶渊明《桃花源记》"},
{text:"潭中鱼可百许头，皆若空游无所依。日光下澈，影布石上，佁然不动；俶尔远逝，往来翕忽，似与游者相乐。",src:"——柳宗元《小石潭记》"},
{text:"不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰：先天下之忧而忧，后天下之乐而乐乎！",src:"——范仲淹《岳阳楼记》"},
{text:"有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。春冬之时，则素湍绿潭，回清倒影。绝巘多生怪柏，悬泉瀑布，飞漱其间。",src:"——郦道元《三峡》"},
{text:"不以一眚掩大德。记人之善，忘人之过。",src:"——《左传》"},
{cat:"古文",text:"臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。",src:"——诸葛亮《出师表》"},
{cat:"古文",text:"臣无祖母，无以至今日；祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。",src:"——李密《陈情表》"},
{cat:"古文",text:"古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？",src:"——韩愈《师说》"},
{cat:"古文",text:"君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。",src:"——荀子《劝学》"},
{cat:"古文",text:"归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。",src:"——陶渊明《归去来兮辞》"},
{cat:"古文",text:"六王毕，四海一；蜀山兀，阿房出。秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。",src:"——杜牧《阿房宫赋》"},
{cat:"古文",text:"庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。",src:"——归有光《项脊轩志》"},
{cat:"古文",text:"山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。",src:"——陶弘景《答谢中书书》"},
{cat:"古文",text:"庭下如积水空明，水中藻荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。",src:"——苏轼《记承天寺夜游》"},
{cat:"古文",text:"风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐，一百许里，奇山异水，天下独绝。",src:"——吴均《与朱元思书》"},
{cat:"古文",text:"人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。",src:"——司马迁《报任安书》"},
{cat:"古文",text:"忧劳可以兴国，逸豫可以亡身，自然之理也。",src:"——欧阳修《伶官传序》"},
{cat:"古文",text:"世有伯乐，然后有千里马。千里马常有，而伯乐不常有。",src:"——韩愈《马说》"},
{cat:"诗词",text:"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。",src:"——李白《将进酒》"},
{cat:"诗词",text:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。烽火连三月，家书抵万金。白头搔更短，浑欲不胜簪。",src:"——杜甫《春望》"},
{cat:"诗词",text:"风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。",src:"——杜甫《登高》"},
{cat:"诗词",text:"空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。",src:"——王维《山居秋暝》"},
{cat:"诗词",text:"明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。",src:"——苏轼《水调歌头》"},
{cat:"诗词",text:"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。",src:"——苏轼《定风波》"},
{cat:"诗词",text:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急？",src:"——李清照《声声慢》"},
{cat:"诗词",text:"生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。",src:"——李清照《夏日绝句》"},
{cat:"诗词",text:"昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否，知否？应是绿肥红瘦。",src:"——李清照《如梦令》"},
{cat:"诗词",text:"身不得，男儿列；心却比，男儿烈。算平生肝胆，因人常热。俗子胸襟谁识我？英雄末路当磨折。莽红尘、何处觅知音？青衫湿！",src:"——秋瑾《满江红·小住京华》"},
{cat:"诗词",text:"东风夜放花千树，更吹落、星如雨。宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。",src:"——辛弃疾《青玉案·元夕》"},
{cat:"诗词",text:"醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。",src:"——辛弃疾《破阵子》"},
{cat:"诗词",text:"死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。",src:"——陆游《示儿》"},
{cat:"诗词",text:"对酒当歌，人生几何！譬如朝露，去日苦多。慨当以慷，忧思难忘。何以解忧？唯有杜康。",src:"——曹操《短歌行》"},
{cat:"诗词",text:"怒发冲冠，凭栏处、潇潇雨歇。抬望眼，仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切。",src:"——岳飞《满江红》"},
{cat:"诗词",text:"人生若只如初见，何事秋风悲画扇。等闲变却故人心，却道故人心易变。",src:"——纳兰性德《木兰花令》"},
{cat:"诗词",text:"君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。",src:"——李商隐《夜雨寄北》"},
{cat:"女性主义",text:"人并非生来就是女人，而是逐渐成为女人的。",src:"——西蒙娜·德·波伏娃 Simone de Beauvoir《第二性》Le Deuxième Sexe（节译）"},
{cat:"女性主义",text:"他是主体，是绝对；她则是他者。",src:"——西蒙娜·德·波伏娃 Simone de Beauvoir《第二性》Le Deuxième Sexe（节译）"},
{cat:"女性主义",text:"一个女人若想写小说，她必须有钱，还得有一间属于自己的房间。",src:"——弗吉尼亚·伍尔夫 Virginia Woolf《一间自己的房间》A Room of One's Own（节译）"},
{cat:"女性主义",text:"一个人若没有吃好，就无法思考得好、爱得好、睡得好。",src:"——弗吉尼亚·伍尔夫 Virginia Woolf《一间自己的房间》A Room of One's Own（节译）"},
{cat:"女性主义",text:"我并不希望女人拥有支配男人的权力，而是希望她们能够支配自己。",src:"——玛丽·沃斯通克拉夫特 Mary Wollstonecraft《为女权辩护》A Vindication of the Rights of Woman（节译）"},
{cat:"女性主义",text:"把一种性别在法律上隶属于另一种性别，这本身就是错误的，而且已经成为人类进步的主要障碍之一。",src:"——约翰·斯图尔特·穆勒 John Stuart Mill《妇女的屈从地位》The Subjection of Women（节译）"},
{cat:"女性主义",text:"在家庭里，丈夫是资产者，妻子则代表无产阶级。",src:"——弗里德里希·恩格斯 Friedrich Engels《家庭、私有制和国家的起源》Der Ursprung der Familie, des Privateigentums und des Staats（节译）"},
{cat:"女性主义",text:"主人的工具永远无法拆毁主人的房子。",src:"——奥黛丽·洛德 Audre Lorde《主人的工具永远无法拆毁主人的房子》The Master's Tools Will Never Dismantle the Master's House，1979（节译）"},
{cat:"女性主义",text:"女性主义是一场旨在终结性别歧视、性别剥削与压迫的运动。",src:"——贝尔·胡克斯 bell hooks《Feminism Is for Everybody》（节译）"},
{cat:"女性主义",text:"个人的，就是政治的。",src:"——卡萝尔·汉尼施 Carol Hanisch《个人的即是政治的》The Personal Is Political，1969（节译）"},
{cat:"哲学",text:"学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？",src:"——《论语·学而》"},
{cat:"哲学",text:"吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。",src:"——《论语·为政》"},
{cat:"哲学",text:"道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母。",src:"——《老子》第一章"},
{cat:"哲学",text:"上善若水。水善利万物而不争，处众人之所恶，故几于道。",src:"——《老子》第八章"},
{cat:"哲学",text:"知人者智，自知者明；胜人者有力，自胜者强。知足者富，强行者有志。",src:"——《老子》第三十三章"},
{cat:"哲学",text:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。",src:"——《庄子·逍遥游》"},
{cat:"哲学",text:"昔者庄周梦为胡蝶，栩栩然胡蝶也，自喻适志与！不知周也。俄然觉，则蘧蘧然周也。不知周之梦为胡蝶与，胡蝶之梦为周与？",src:"——《庄子·齐物论》"},
{cat:"哲学",text:"天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。",src:"——《孟子·告子下》"},
{cat:"哲学",text:"大学之道，在明明德，在亲民，在止于至善。",src:"——《大学》"},
{cat:"哲学",text:"天命之谓性，率性之谓道，修道之谓教。",src:"——《中庸》"},
{cat:"哲学",text:"天行健，君子以自强不息。地势坤，君子以厚德载物。",src:"——《周易》"},
{cat:"哲学",text:"知是行之始，行是知之成。",src:"——王阳明《传习录》"},
{cat:"哲学",text:"未经省察的人生是不值得过的。",src:"——苏格拉底 Socrates（柏拉图 Plato《申辩篇》Apologia）"},
{cat:"哲学",text:"人不能两次踏进同一条河流。",src:"——赫拉克利特 Heraclitus（残篇 Fragments）"},
{cat:"哲学",text:"人天生是一种政治的动物。",src:"——亚里士多德 Aristoteles《政治学》Politika"},
{cat:"哲学",text:"人只是一根苇草，是自然界最脆弱的东西；但他是一根能思想的苇草。",src:"——布莱兹·帕斯卡 Blaise Pascal《思想录》Pensées（节译）"},
{cat:"哲学",text:"有两样东西，我们越是经常持久地对之凝神思索，它们就越使内心充满常新而日增的惊奇和敬畏：我头上的星空和我心中的道德律。",src:"——伊曼努尔·康德 Immanuel Kant《实践理性批判》Kritik der praktischen Vernunft（节译）"},
{cat:"哲学",text:"凡杀不死我的，都会使我更强大。",src:"——弗里德里希·尼采 Friedrich Nietzsche《偶像的黄昏》Götzen-Dämmerung（节译）"},
{cat:"哲学",text:"我们必须想象西西弗是幸福的。",src:"——阿尔贝·加缪 Albert Camus《西西弗神话》Le Mythe de Sisyphe（节译）"}
];

const ICONS_POOL=['☁️','🌙','🌸','🍃','🌊','🍵','🦋','🎐','🌻','🍄'];
async function apiGet(p){try{const r=await fetch(p);if(!r.ok)return{ok:false,error:'HTTP '+r.status};return await r.json();}catch(e){return{ok:false,error:e.message};}}
function extractBvid(u){const m=u.match(/BV[a-zA-Z0-9]+/)||u.match(/bvid=([a-zA-Z0-9]+)/i);return m?m[0]:'';}
function extractYouTubeId(u){const m=u.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:'';}
async function resolveYouTube(v){const id=extractYouTubeId(v);if(!id)return{ok:false,error:'无法识别 YouTube ID'};const d=await apiGet('/api/youtube?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id));if(!d.ok)return d;return{ok:true,id,title:d.title||('YouTube '+id),author:d.author,cover:d.thumbnail,provider:'youtube',src:'https://www.youtube.com/embed/'+id};}
async function resolveBilibili(v){const bvid=extractBvid(v);if(!bvid)return{ok:false,error:'无法识别 BVID'};const d=await apiGet('/api/bilibili?bvid='+encodeURIComponent(bvid));if(!d.ok)return d;return{ok:true,id:bvid,title:d.title,author:d.author,cover:d.pic,provider:'bilibili',src:'https://player.bilibili.com/player.html?bvid='+bvid+'&page=1&high_quality=1&autoplay=0'};}
async function resolveVideoUrl(u){if(u.indexOf('youtube.com')>=0||u.indexOf('youtu.be')>=0)return resolveYouTube(u);if(u.indexOf('bilibili.com')>=0||extractBvid(u))return resolveBilibili(u);return{ok:false,error:'仅支持 YouTube / Bilibili 链接'};}
function parseDouyinShare(text){
  const r={raw:text,url:'',bloggerName:'',title:''};
  let m=text.match(/https?:\/\/v\.douyin\.com\/[A-Za-z0-9]+\/?/);
  if(!m)m=text.match(/https?:\/\/www\.douyin\.com\/[^\s，。]+/);
  if(m)r.url=m[0];
  m=text.match(/【(.+?)的(?:图文|视频)?作品】/);
  if(m)r.bloggerName=m[1];
  m=text.match(/】\s*(.+?)\s*https/);
  if(m)r.title=m[1].replace(/…+$/,'').trim();
  return r;
}

function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){
      const data=JSON.parse(raw);
      state.tasks=data.tasks||[];
      state.core=data.core||[];
      state.coreDone=data.coreDone||{};
      state.selected=data.selected||null;
      state.title=data.title||'玉桂狗 · 专注台';
      state.avatar=data.avatar||'☁️';
      state.handwritingIdx=data.handwritingIdx||0;
      state.pianoIdx=data.pianoIdx||0;
      state.completedTotal=data.completedTotal||0;
      state.customDecos=Array.isArray(data.customDecos)?data.customDecos:[];
      // Migrate from old emoji decoration system
      const oldUnlockedCount=Array.isArray(data.unlockedDecor)?data.unlockedDecor.length:0;
      state.decoSlots=data.decoSlots!=null?data.decoSlots:Math.max(1,oldUnlockedCount);
      state.customBgs=Array.isArray(data.customBgs)?data.customBgs:[];
      state.bgSlots=data.bgSlots!=null?data.bgSlots:0;
      state.selectedBg=data.selectedBg!==undefined?data.selectedBg:null;
      state.completionLog=Array.isArray(data.completionLog)?data.completionLog:[];
      state.lastGameDay=data.lastGameDay!=null?data.lastGameDay:null;
      state.view='task';state.diaryDay=null;
      const ids=state.tasks.map(t=>t.id);
      PRESET.forEach(p=>{if(!ids.includes(p.id))state.tasks.push(makePresetTask(p));});
      state.tasks.forEach(t=>{
        if(t.preset&&NO_SUB.has(t.id)){t.subs=[];t.locked=false;}
        if(!t.noteTime&&t.notes)t.noteTime=Date.now();
        if(t.id==='video'&&t.videoTopicId===undefined)t.videoTopicId=null;
        if(t.id==='fanfic'){if(t.inspos===undefined)t.inspos=[];t.name='写小作文';}
        if(t.id==='sport'){if(t.customVideos===undefined)t.customVideos=[];if(t.sportDay===undefined)t.sportDay=0;}
        if(t.id==='handwriting'&&t.handwritingIdx===undefined)t.handwritingIdx=0;
        if(t.id==='handwriting'&&!Array.isArray(t.noteImages))t.noteImages=[];
        if(t.id==='housework'&&!Array.isArray(t.noteImages))t.noteImages=[];
        if(t.id==='piano'){t.name='今日琴房';if(!Array.isArray(t.songs))t.songs=[];}
        if(t.id==='mood'){if(!Array.isArray(t.weatherSel))t.weatherSel=[];if(!Array.isArray(t.moodSel))t.moodSel=[];if(!Array.isArray(t.customWeather))t.customWeather=[];if(!Array.isArray(t.customMood))t.customMood=[];}
        if(t.id==='translate'){if(!Array.isArray(t.books))t.books=[];if(!Array.isArray(t.vocab))t.vocab=[];if(!Array.isArray(t.terms))t.terms=[];}
        if(t.id==='housework'&&!Array.isArray(t.choreChips))t.choreChips=DEFAULT_CHORES.map((n,i)=>({id:'chore_init_'+i,name:n}));
        if(t.id==='teach'){if(!Array.isArray(t.classes))t.classes=[];if(!Array.isArray(t.activityChips))t.activityChips=DEFAULT_TEACH_ACTS.map((n,i)=>({id:'act_init_'+i,name:n}));}
      });
    }else{
      state.tasks=PRESET.map(makePresetTask);state.selected=state.tasks[0]?state.tasks[0].id:null;state.core=[];state.coreDone={};
    }
  }catch(e){state.tasks=PRESET.map(makePresetTask);state.core=[];state.coreDone={};}
  if(!state.selected&&state.tasks[0])state.selected=state.tasks[0].id;
  updateGameStats(true);
}

function recalcCompletedTotal(){
  let n=(state.completionLog||[]).length;
  state.tasks.forEach(t=>{(t.subs||[]).forEach(s=>{if(s.done)n++;});});
  return n;
}
function syncCompletedTotal(){
  state.completedTotal=recalcCompletedTotal();
  const decoThresh=Math.floor(state.completedTotal/10);
  const prevDeco=state.decoSlots||0;
  const decoUp=decoThresh>prevDeco;
  if(decoUp)state.decoSlots=decoThresh;
  const bgThresh=Math.floor(state.completedTotal/20);
  const prevBg=state.bgSlots||0;
  const bgUp=bgThresh>prevBg;
  if(bgUp)state.bgSlots=bgThresh;
  if(decoUp&&bgUp)toast('🎉 解锁了新的装饰槽位和背景图片位！去日记页看看吧');
  else if(decoUp)toast('🎉 解锁了新的装饰槽位！去日记页添加素材吧');
  else if(bgUp)toast('🖼️ 解锁了新的背景图片位！去日记页上传新背景吧');

}

function playCelebrateSound(){
  if(!window.AudioContext&&!window.webkitAudioContext)return;
  if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const ctx=_audioCtx;ctx.resume();
  const t=ctx.currentTime;
  [[523.25,0.15],[659.25,0.15],[783.99,0.15],[1046.50,0.35]].forEach(([f,d],i)=>{
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sine';o.frequency.value=f;
    o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0,t+i*0.18);
    g.gain.linearRampToValueAtTime(0.25,t+i*0.18+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.18+d);
    o.start(t+i*0.18);o.stop(t+i*0.18+d);
  });
}

let dragDeco=null,dragStartX=0,dragStartY=0,dragDecoX=0,dragDecoY=0;
function attachDecoDragHandlers(){
  const room=document.getElementById('roomStage');
  if(!room)return;
  room.querySelectorAll('.room-deco').forEach(el=>{
    el.addEventListener('mousedown',e=>startDecoDrag(e,el));
    el.addEventListener('touchstart',e=>startDecoDrag(e,el),{passive:false});
  });
}
function startDecoDrag(e,el){
  e.preventDefault();e.stopPropagation();
  const d=state.customDecos.find(x=>x&&x.id===el.id);
  if(!d)return;
  state.selectedDeco=d.id;renderDiary();
  dragDeco=d;
  const cx=e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX;
  const cy=e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY;
  dragStartX=cx;dragStartY=cy;dragDecoX=d.x;dragDecoY=d.y;
  document.addEventListener('mousemove',moveDecoDrag);
  document.addEventListener('mouseup',endDecoDrag);
  document.addEventListener('touchmove',moveDecoDrag,{passive:false});
  document.addEventListener('touchend',endDecoDrag);
}
function moveDecoDrag(e){
  if(!dragDeco)return;
  e.preventDefault();
  const cx=e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX;
  const cy=e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY;
  const room=document.getElementById('roomStage');
  const rect=room.getBoundingClientRect();
  const dxPct=((cx-dragStartX)/rect.width)*100;
  const dyPct=((cy-dragStartY)/rect.height)*100;
  dragDeco.x=Math.max(3,Math.min(97,dragDecoX+dxPct));
  dragDeco.y=Math.max(3,Math.min(97,dragDecoY+dyPct));
  const el=document.getElementById(dragDeco.id);
  if(el){el.style.left=dragDeco.x+'%';el.style.top=dragDeco.y+'%';}
}
function endDecoDrag(e){
  dragDeco=null;
  document.removeEventListener('mousemove',moveDecoDrag);
  document.removeEventListener('mouseup',endDecoDrag);
  document.removeEventListener('touchmove',moveDecoDrag);
  document.removeEventListener('touchend',endDecoDrag);
  save();
}

const DAY_START_HOUR=5;
function gameDay(){
  const n=new Date();
  const offset=n.getTime()-DAY_START_HOUR*60*60*1000;
  return new Date(offset);
}
function gameDayOfYear(){
  const d=gameDay();
  const s=new Date(d.getFullYear(),0,0);
  return Math.floor((d.getTime()-s.getTime())/86400000);
}
function gameDateKey(ts){
  const n=ts?new Date(ts):new Date();
  const offset=n.getTime()-DAY_START_HOUR*60*60*1000;
  const d=new Date(offset);

function hydrateAfterLoad(){

    if(t.id==='housework'&&!Array.isArray(t.noteImages))t.noteImages=[];

    if(t.id==='video'&&t.videoTopicId===undefined)t.videoTopicId=null;

    if(t.id==='mood'){if(!Array.isArray(t.weatherSel))t.weatherSel=[];if(!Array.isArray(t.moodSel))t.moodSel=[];if(!Array.isArray(t.customWeather))t.customWeather=[];if(!Array.isArray(t.customMood))t.customMood=[];}
    if(t.id==='translate'){if(!Array.isArray(t.books))t.books=[];if(!Array.isArray(t.vocab))t.vocab=[];if(!Array.isArray(t.terms))t.terms=[];}

  });
  if(!Array.isArray(state.customDecos))state.customDecos=[];

function renderVocabList(tid){

  }).join('');
  if(list.length>20){
    html+='<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="window._vocabExpanded='+(!expanded)+';document.getElementById(\'vocabList\').innerHTML=renderVocabList(\''+tid+'\')">'+(expanded?'收起 ▴':'展开全部 共'+list.length+'条 ▾')+'</button>';
  }
  return html;
}

  const t=getTask(tid);const tp=t.topics.find(x=>x.id===tpid);if(!tp){toast('请先选择一个选题');return;}
  const raw=document.getElementById('dy_share').value.trim();

  const p=parseDouyinShare(raw);
  if(!p.url){toast('没识别到抖音链接，请检查粘贴内容');return;}
  const bname=document.getElementById('dy_bname').value.trim()||p.bloggerName||'未填写';
  const bid=document.getElementById('dy_bid').value.trim();
  tp.sources=tp.sources||[];

function renderBookCard(t,b){

  for(let i=1;i<=b.total;i++){const c=b.chapters.find(x=>x.num==i);html+='<span class="chapter-dot '+(c&&c.done?'done':'')+(b.currentChapter==i?' active':'')+'" onclick="selChapter(\''+t.id+'\',\''+b.id+'\','+i+')">'+i+'</span>';}

let _audioCtx=null;
const SONG_STATUS=[['收藏','🌰'],['试弹','🌱'],['练习','🌿'],['熟悉','🌳'],['绝招','🌸'],['搁置','🍂'],['考古','🏺']];
const SONG_RANK={'收藏':0,'试弹':1,'练习':2,'熟悉':3,'绝招':4};
const STAGE_NEED={'收藏':1,'试弹':3,'练习':5,'熟悉':10};
const STAGE_NEXT={'收藏':'试弹','试弹':'练习','练习':'熟悉','熟悉':'绝招'};
const SONG_OLD={'听过':'收藏','想弹':'收藏','试弹':'练习','熟悉':'熟悉','高手':'绝招','搁置':'搁置','考古':'考古'};
function songMigrate(t){
  if(t.songsV===2)return;
  t.songs.forEach(s=>{s.status=SONG_OLD[s.status]||'收藏';s.prog=s.prog?(SONG_OLD[s.prog]||null):null;s.stageCount=0;});
  t.songsV=2;save();
}
const SONG_EMOJI={};SONG_STATUS.forEach(x=>{SONG_EMOJI[x[0]]=x[1];});
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function songTick(t){
  let ch=false;const today=todayKey();
  t.songs.forEach(s=>{
    const idle=daysBetween(s.since||s.created||today,today);
    if(!(s.status in SONG_RANK)){
      if(s.status==='搁置'&&idle>=60){s.status='考古';ch=true;}
    }else if(SONG_RANK[s.status]>=1){
      if(idle>=60){s.prog=s.status;s.status='考古';ch=true;}
      else if(idle>=14){s.prog=s.status;s.status='搁置';ch=true;}
    }
  });
  if(ch)save();
}
const PT={running:false,endAt:0,total:0,songId:null,iv:null,mins:null};
function pianoRollMins(){return 3+Math.floor(Math.random()*13);}
function pianoFmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function modPiano(t){
  if(!Array.isArray(t.songs))t.songs=[];
  songMigrate(t);
  songTick(t);
  if(PT.mins==null)PT.mins=pianoRollMins();
  const tgtId=PT.running?PT.songId:t.pianoSel;
  const sel=t.songs.find(s=>s.id===tgtId)||null;
  if(!PT.running&&!sel)t.pianoSel=null;
  const left=PT.running?PT.endAt-Date.now():PT.mins*60000;
  const pct=PT.running?Math.round((1-left/PT.total)*100):0;
  const target=sel?`${SONG_EMOJI[sel.status]} 《${esc(sel.name)}》`+(PT.running?'':` <button class="btn btn-ghost btn-sm" onclick="pianoClearSel('${t.id}')">改为热身练手</button>`):'🔥 热身练手';
  const timer=`<div class="card" id="pianoTimerCard"><h3 class="card-title">⏱ 计时器</h3><p class="card-desc">随机 3–15 分钟的练习时长，倒计时结束自动记一次练习并写进专属笔记。没选曲子就是热身练手。</p>
<div class="pp-target">🎯 今日练习：<b>${target}</b></div>
<div class="pp-clock" id="pianoClock">${pianoFmt(left)}</div>
<div class="progress-bar"><i id="pianoBar" style="width:${pct}%"></i></div>
<div class="pp-btns">${PT.running?`<button class="btn btn-ghost btn-sm" onclick="pianoStop()">⏹ 放弃本次</button>`:`<button class="btn btn-soft btn-sm" onclick="pianoReroll()">🎲 重新随机（当前 ${PT.mins} 分钟）</button><button class="btn btn-pink btn-sm" onclick="pianoStart()">▶ 开始倒计时</button>`}</div></div>`;
  const cur=t.songFilter||'全部';
  const filt='<div class="mood-chips" style="margin:12px 0">'+['全部'].concat(SONG_STATUS.map(x=>x[0])).map(n=>{const c=n==='全部'?t.songs.length:t.songs.filter(s=>s.status===n).length;return `<button class="mood-chip${n===cur?' on':''}" onclick="pianoFilter('${t.id}','${n}')">${n==='全部'?'全部':SONG_EMOJI[n]+' '+n} ${c}</button>`;}).join('')+'</div>';
  const list=t.songs.filter(s=>cur==='全部'||s.status===cur).slice().reverse();
  const rows=list.length?'<div class="song-list">'+list.map(s=>`<div class="song-row${sel&&sel.id===s.id?' sel':''}"><button class="song-st" onclick="pianoPickStatus('${t.id}','${s.id}')" title="点击修改状态">${SONG_EMOJI[s.status]}</button><div class="song-main"><div class="song-name">${esc(s.name)}</div><div class="song-meta">${s.status}${songStageText(s)} · 累计练习 ${s.count||0} 次 · ${s.mins||0} 分钟</div></div><button class="btn btn-soft btn-sm" onclick="pianoSelect('${t.id}','${s.id}')">🎯 选取</button><button class="ic-del" onclick="pianoDelSong('${t.id}','${s.id}')" title="删除">✕</button></div>`).join('')+'</div>':'<div class="empty-hint">'+(t.songs.length?'这个状态下还没有曲子':'还没有曲子，收录第一首吧 🎼')+'</div>';
  const songs=`<div class="card"><h3 class="card-title">🎼 曲目</h3><p class="card-desc">收录曲名并选一个初始状态，可以随机或手动挑一首，然后回到上面的计时器开始练习。</p>
<div class="pp-form"><input id="songName" placeholder="曲名，例如：卡农" onkeydown="if(event.key==='Enter')pianoAddSong('${t.id}')"><select id="songStatus">${SONG_STATUS.map(x=>`<option value="${x[0]}"${x[0]==='收藏'?' selected':''}>${x[1]} ${x[0]}</option>`).join('')}</select><button class="btn btn-pink btn-sm" onclick="pianoAddSong('${t.id}')">＋ 收录</button></div>
${filt}<div style="margin-bottom:10px"><button class="btn btn-soft btn-sm" onclick="pianoRandom('${t.id}')">🎲 随机挑一首${cur==='全部'?'':'（'+cur+'）'}</button></div>${rows}
<div class="muted" style="margin-top:12px;line-height:1.7">状态规则（每个阶段单独计次）：🌰收藏 1 次 → 🌱试弹；🌱试弹 3 次 → 🌿练习；🌿练习 5 次 → 🌳熟悉；🌳熟悉 10 次 → 🌸绝招。🌱试弹及以上的曲子 14 天没练变 🍂搁置，60 天没练变 🏺考古，再练一次就会回到原来的阶段。点曲子左边的图标可以手动改状态。</div></div>`;
  return timer+songs;
}
function songStageText(s){
  if(!(s.status in SONG_RANK))return '';
  const need=STAGE_NEED[s.status];
  return need?' · 本阶段 '+(s.stageCount||0)+'/'+need+' 次':' · 已满级 🎉';
}
function pianoTick(){
  const left=PT.endAt-Date.now();
  if(left<=0){pianoDone();return;}
  const c=document.getElementById('pianoClock');if(c)c.textContent=pianoFmt(left);
  const b=document.getElementById('pianoBar');if(b)b.style.width=Math.round((1-left/PT.total)*100)+'%';
}
function pianoStart(){
  if(PT.running)return;
  const t=getTask('piano');if(!t)return;
  if(PT.mins==null)PT.mins=pianoRollMins();
  PT.songId=t.pianoSel||null;PT.total=PT.mins*60000;PT.endAt=Date.now()+PT.total;PT.running=true;
  clearInterval(PT.iv);PT.iv=setInterval(pianoTick,500);
  renderDetail();
}
function pianoStop(){
  clearInterval(PT.iv);PT.running=false;PT.mins=pianoRollMins();
  if(state.selected==='piano')renderDetail();
  toast('已放弃，本次不计入');
}
function pianoReroll(){if(PT.running)return;PT.mins=pianoRollMins();renderDetail();}
function pianoDone(){
  clearInterval(PT.iv);PT.running=false;
  const t=getTask('piano');if(!t)return;
  const song=(t.songs||[]).find(s=>s.id===PT.songId)||null;
  const mins=Math.round(PT.total/60000);
  let up='';
  if(song){
    const before=song.status;
    song.count=(song.count||0)+1;song.mins=(song.mins||0)+mins;song.since=todayKey();
    let cur=(song.status in SONG_RANK)?song.status:((song.prog in SONG_RANK)?song.prog:'收藏');
    song.stageCount=(song.stageCount||0)+1;
    if(STAGE_NEED[cur]&&song.stageCount>=STAGE_NEED[cur]){cur=STAGE_NEXT[cur];song.stageCount=0;}
    song.status=cur;song.prog=cur;
    if(cur!==before)up=' · '+SONG_EMOJI[before]+' '+before+' → '+SONG_EMOJI[cur]+' '+cur;
    var line='🎹 '+stampNow()+' · 《'+song.name+'》 · 练习 '+mins+' 分钟（累计第 '+song.count+' 次）'+up;
  }else{
    var line='🎹 '+stampNow()+' · 热身练手 · '+mins+' 分钟';
  }
  const ta=document.getElementById('notesArea');
  if(ta&&state.selected===t.id)t.notes=ta.value;
  t.notes=(t.notes?t.notes.replace(/\s+$/,'')+'\n':'')+line;t.noteTime=Date.now();
  PT.mins=pianoRollMins();
  save();renderSidebar();
  playCelebrateSound();
  toast(song?('🎹 练完啦！'+(up?song.name+' 升级为 '+SONG_EMOJI[song.status]+song.status:'已记录一次练习')):'🎹 热身完成，已记录');
  if(state.selected==='piano')renderDetail();
}
function pianoClearSel(tid){const t=getTask(tid);if(!t)return;t.pianoSel=null;save();renderDetail();}
function pianoSelect(tid,sid){
  const t=getTask(tid);if(!t)return;
  if(PT.running){toast('正在计时中，先结束当前练习～');return;}
  const s=t.songs.find(x=>x.id===sid);if(!s)return;
  t.pianoSel=sid;save();renderDetail();
  const c=document.getElementById('pianoTimerCard');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});
  toast('已选《'+s.name+'》，点计时器开始练习 ⏱');
}
function pianoRandom(tid){
  const t=getTask(tid);if(!t)return;
  const cur=t.songFilter||'全部';
  const pool=t.songs.filter(s=>cur==='全部'||s.status===cur);
  if(!pool.length){toast('还没有可以挑选的曲子～');return;}
  let cand=pool.filter(s=>s.id!==t.pianoSel);if(!cand.length)cand=pool;
  pianoSelect(tid,cand[Math.floor(Math.random()*cand.length)].id);
}
function pianoFilter(tid,n){const t=getTask(tid);if(!t)return;t.songFilter=n;save();renderDetail();}

  t.songs.push({id:'song_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),name:name,status:status,prog:(status in SONG_RANK)?status:null,stageCount:0,count:0,mins:0,since:k,created:k});

const HW_CATS=['全部','古文','诗词','女性主义','哲学'];
HANDWRITING_MATS.forEach(m=>{if(!m.cat)m.cat='古文';});
function hwPool(t){
  const c=t.hwCat||'全部';const a=[];
  HANDWRITING_MATS.forEach((m,i)=>{if(c==='全部'||m.cat===c)a.push(i);});
  return a.length?a:HANDWRITING_MATS.map((_,i)=>i);
}
function modHandwriting(t){
  const pool=hwPool(t);const d=dayOfYear();
  if(t.handwritingDay!==d){t.handwritingIdx=pool[d%pool.length];t.handwritingDay=d;}
  if(t.handwritingIdx==null||!pool.includes(t.handwritingIdx))t.handwritingIdx=pool[d%pool.length];
  const pos=pool.indexOf(t.handwritingIdx);
  const main=HANDWRITING_MATS[t.handwritingIdx];
  const alts=[pool[(pos+1)%pool.length],pool[(pos+2)%pool.length]].filter((x,i,a)=>x!==t.handwritingIdx&&a.indexOf(x)===i);
  const cur=t.hwCat||'全部';
  const chips='<div class="mood-chips" style="margin-bottom:12px">'+HW_CATS.map(c=>`<button class="mood-chip${c===cur?' on':''}" onclick="setHwCat('${t.id}','${c}')">${c}</button>`).join('')+'</div>';
  const card=(m,i,isMain)=>`<div class="mat-card"${isMain?' style="border-left-width:6px"':''}><div class="mat-text">${esc(m.text)}</div><div class="mat-src">${esc(m.src)} <span class="tag tag-blue" style="margin-left:6px">${esc(m.cat)}</span></div><div class="mat-actions"><button class="btn btn-soft btn-sm" onclick="copyText(this,${jsonAttr(m.text)})">📋 复制</button>${isMain?`<span class="tag tag-pink">今日主推</span><button class="btn btn-pink btn-sm" style="margin-left:auto" onclick="refreshHandwriting('${t.id}')">🔄 换一段</button>`:`<button class="btn btn-ghost btn-sm" onclick="useHandwriting('${t.id}',${i})">换为这篇</button>`}</div></div>`;
  return `<div class="card"><h3 class="card-title">🖌️ 今日抄写素材</h3><p class="card-desc"></p>${chips}${card(main,t.handwritingIdx,true)}${alts.map(i=>card(HANDWRITING_MATS[i],i,false)).join('')}<div class="divider"></div><div class="kn-grammar"><div class="g-title">☁️ 练字心法</div><div class="m">先读帖再落笔 · 一字三遍 · 慢即是快。不求多，求稳。</div></div></div>`;
}
function setHwCat(tid,c){const t=getTask(tid);if(!t)return;t.hwCat=c;const p=hwPool(t);t.handwritingIdx=p[Math.floor(Math.random()*p.length)];t.handwritingDay=dayOfYear();save();renderDetail();}
function refreshHandwriting(tid){const t=getTask(tid);if(!t)return;const p=hwPool(t);const pos=p.indexOf(t.handwritingIdx);t.handwritingIdx=p[(pos+1)%p.length];t.handwritingDay=dayOfYear();save();renderDetail();toast('已换一段 ✨');}
function useHandwriting(tid,i){const t=getTask(tid);if(!t)return;t.handwritingIdx=i;t.handwritingDay=dayOfYear();save();renderDetail();}
function stampNow(){
  const now=new Date();
  return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
}

  html+='<div class="mood-group"><div class="mood-label">此刻心情</div><div class="mood-chips">'+MOOD_OPTS.map(o=>chip(t.moodSel,'moodSel',o[0],o[1],false)).join('')+t.customMood.map(c=>chip(t.moodSel,'moodSel',c.emoji,c.label,true,c.id)).join('')+'</div><div class="add-sub" style="margin-top:8px"><input id="newMoodInput_'+t.id+'" placeholder="＋ 自定义心情，如：🥱 犯困" onkeydown="if(event.key===\'Enter\')addCustomMoodOpt(\''+t.id+'\',\'mood\')"><button class="btn btn-soft btn-sm" onclick="addCustomMoodOpt(\''+t.id+'\',\'mood\')">＋</button></div></div>';

function parseCustomChipInput(raw){
  raw=(raw||'').trim();if(!raw)return null;
  const m=raw.match(/^(\S+)\s+(.+)$/);
  if(m)return {emoji:m[1],label:m[2]};
  return {emoji:'🔖',label:raw};
}
function addCustomMoodOpt(tid,kind){
  const t=getTask(tid);if(!t)return;
  const inpId=kind==='weather'?'newWeatherInput_'+tid:'newMoodInput_'+tid;
  const inp=document.getElementById(inpId);if(!inp)return;
  const parsed=parseCustomChipInput(inp.value);
  if(!parsed){toast('先填点内容吧～');return;}
  const field=kind==='weather'?'customWeather':'customMood';
  if(!Array.isArray(t[field]))t[field]=[];
  t[field].push({id:uid(),emoji:parsed.emoji,label:parsed.label});
  inp.value='';save();renderDetail();toast('已添加自定义选项');
}
function delCustomMoodOpt(tid,field,cid){
  const t=getTask(tid);if(!t)return;
  const arrField=field==='weatherSel'?'customWeather':'customMood';
  t[arrField]=(t[arrField]||[]).filter(c=>c.id!==cid);
  save();renderDetail();toast('已删除');
}
function toggleMoodSel(tid,field,label){
  const t=getTask(tid);if(!t)return;
  if(!Array.isArray(t[field]))t[field]=[];
  const i=t[field].indexOf(label);
  if(i>=0)t[field].splice(i,1);else t[field].push(label);
  save();renderDetail();
}
function stampTimeOnly(){const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
function recordMood(tid){
  const t=getTask(tid);if(!t)return;
  if((!t.weatherSel||!t.weatherSel.length)&&(!t.moodSel||!t.moodSel.length)){toast('先选一下天气或心情吧～');return;}
  const allWeather=WEATHER_OPTS.concat((t.customWeather||[]).map(c=>[c.emoji,c.label]));
  const allMood=MOOD_OPTS.concat((t.customMood||[]).map(c=>[c.emoji,c.label]));
  const withEmoji=(opts,arr)=>arr.map(l=>{const o=opts.find(x=>x[1]===l);return (o?o[0]:'')+l;}).join('、');
  let line='🎐 '+stampTimeOnly();
  if(t.weatherSel&&t.weatherSel.length)line+=' 天气：'+withEmoji(allWeather,t.weatherSel);
  if(t.moodSel&&t.moodSel.length)line+=' · 心情：'+withEmoji(allMood,t.moodSel);
  t.notes=(t.notes?t.notes+'\n':'')+line;
  t.noteTime=Date.now();
  t.weatherSel=[];t.moodSel=[];
  save();renderDetail();renderSidebar();
  toast('已记进笔记 🎐');
}

async function addChoreChip(tid){
  const inp=document.getElementById('choreNewInput');if(!inp)return;
  const name=inp.value.trim();if(!name){toast('先填卡片名称吧～');return;}
  const t=getTask(tid);if(!t)return;
  if(!Array.isArray(t.choreChips))t.choreChips=[];
  const card={id:'chore_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),name:name};
  if(_choreFile){
    if(!_choreFile.type.startsWith('image/')){toast('请选择图片文件');return;}
    if(_choreFile.size>15*1024*1024){toast('图片太大啦，请选小一点的');return;}
    try{
      const src=await fileToImageSrc(_choreFile,480,0.78);
      card.img={id:'chimg_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),src:src};
      pushImageToCloud(card.img.id,src);
    }catch(e){toast('图片处理失败，换一张试试');return;}

function showChoreEdit(tid,cid){
  const t=getTask(tid);if(!t)return;
  const c=(t.choreChips||[]).find(x=>x.id===cid);if(!c)return;
  _choreEditFile=null;_choreEditRemove=false;

  mask.classList.add('show');
  document.getElementById('ceChoreOk').onclick=async()=>{
    const name=document.getElementById('ceChoreName').value.trim();
    if(!name){toast('名称不能为空');return;}
    c.name=name;
    try{
      if(_choreEditFile){
        if(!_choreEditFile.type.startsWith('image/')){toast('请选择图片文件');return;}
        const src=await fileToImageSrc(_choreEditFile,480,0.78);

        c.img={id:'chimg_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),src:src};
        pushImageToCloud(c.img.id,src);

        if(c.img.id)deleteImageFromCloud(c.img.id);
        delete c.img;
      }
    }catch(e){toast('图片处理失败，换一张试试');return;}
    closeModal();save();renderDetail();toast('已更新');
  };

    const gr=grid();
    if(over&&over!==drag.card&&gr&&gr.contains(over)){
      const kids=Array.from(gr.children);

        const re=ids.map(id=>map[id]).filter(Boolean);

  const cardOf=e=>{const c=e.target.closest&&e.target.closest('.chore-card');return (c&&!e.target.closest('.chore-ops')&&c.parentElement&&c.parentElement.classList.contains('chore-grid'))?c:null;};

const CLASS_ICONS=['🌸','🐼','🦊','🐰','🐱','🐶','🦄','🐧','🐳','🌻','🍓','🍀','🚀','🎈','🐝','🦋','🍉','⭐','🌈','🐸','🦉','🍩','🎨','🌙','🐨','🍒','🐙','🍄'];

function fmtTime(v){const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m?String(+m[1]).padStart(2,'0')+':'+m[2]:(v||'');}
function dayTime(c,d){

}
function classTimeText(c,d){

function fmtDMY(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'-'+m[2]+'-'+m[1]:(iso||'');}
function migrateClassLegacy(c){
  c.days=[];

  const map={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6};
  const re=/周([一二三四五六日天、,，和\/\s]+)/g;let m;

function sportBeep(freq){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sine';o.frequency.value=freq||880;o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
    o.start();o.stop(ctx.currentTime+0.32);
    o.onended=()=>ctx.close();
  }catch(e){}
}

function sportStopTimer(){

function sportStartTimer(tid,pid){
  const t=getTask(tid);const p=t&&t.sportPics.find(x=>x.id===pid);if(!p)return;
  const repsInp=document.getElementById('spRepsCount_'+pid);
  const reps=parseInt((repsInp&&repsInp.value)||'3',10)||3;
  if(_sportTimer)clearInterval(_sportTimer.iv);
  let rep=1,phase='hold',left=p.holdSec;
  const box=document.getElementById('spTimerBox_'+pid);
  const render=()=>{if(box)box.innerHTML='<div class="sp-timer-display">'+(phase==='hold'?'💪 保持':'😮\u200d💨 休息')+' · 第'+rep+'/'+reps+'组 · <b>'+left+'</b>s</div><button class="btn btn-ghost btn-sm" onclick="sportStopTimer()">■ 停止</button>';};
  render();
  sportBeep(880);
  _sportTimer={iv:setInterval(()=>{
    left--;
    if(left<=0){
      sportBeep(660);
      if(phase==='hold'){
        if(p.restSec>0){phase='rest';left=p.restSec;}
        else{rep++;if(rep>reps){sportFinishTimer(tid,pid,reps);return;}left=p.holdSec;}
      }else{
        rep++;
        if(rep>reps){sportFinishTimer(tid,pid,reps);return;}
        phase='hold';left=p.holdSec;
      }
    }
    render();
  },1000)};
}
function sportFinishTimer(tid,pid,reps){

let _ytPlayer=null,_ytApiP=null;
function loadYTApi(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(_ytApiP)return _ytApiP;
  _ytApiP=new Promise((res,rej)=>{
    window.onYouTubeIframeAPIReady=()=>res();
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';
    s.onerror=()=>{_ytApiP=null;rej(new Error('load'));};
    document.head.appendChild(s);
    setTimeout(()=>{if(!(window.YT&&window.YT.Player)){_ytApiP=null;rej(new Error('timeout'));}},10000);
  });
  return _ytApiP;
}
function showYtError(code){
  const el=document.getElementById('ytMsg');if(!el)return;
  const map={load:'YouTube 播放器没加载出来（可能被网络屏蔽），建议改用哔哩哔哩视频。',100:'这个视频不存在，或已被设为私享。',101:'该视频的作者禁止了嵌入播放，请换一个视频，或改用哔哩哔哩。',150:'该视频的作者禁止了嵌入播放，请换一个视频，或改用哔哩哔哩。',153:'YouTube 没收到页面来源信息（多为直接双击打开 html 文件导致）。把页面放到网址下打开即可播放，或改用哔哩哔哩。',2:'视频参数有误，请检查链接。',5:'播放器出错，请刷新后重试。'};
  el.textContent=map[code]||('YouTube 播放失败（错误 '+code+'），可改用哔哩哔哩视频。');
  el.style.display='flex';
}
function sportMountYT(vid){
  if(!document.getElementById('ytHost'))return;
  loadYTApi().then(()=>{
    if(!document.getElementById('ytHost'))return;
    if(_ytPlayer&&_ytPlayer.destroy){try{_ytPlayer.destroy();}catch(e){}}
    const vars={rel:0,playsinline:1,modestbranding:1};
    if(/^https?:$/.test(location.protocol))vars.origin=location.origin;
    _ytPlayer=new YT.Player('ytHost',{videoId:vid,width:'100%',height:'100%',playerVars:vars,events:{onError:e=>showYtError(e.data)}});
  }).catch(()=>showYtError('load'));
}
function extractBili(u){const m=String(u).match(/BV[0-9A-Za-z]{10}/);return m?m[0]:'';}
async function sportResolveYT(url){
  const id=extractYouTubeId(url);
  if(!id)return{ok:false,error:'没识别到 YouTube 视频，请粘贴完整链接'};
  const watch='https://www.youtube.com/watch?v='+id;
  const d=await apiGet('/api/youtube?url='+encodeURIComponent(watch));
  if(d&&d.ok&&d.title)return{ok:true,provider:'youtube',id:id,title:d.title,author:d.author||'',cover:d.thumbnail||ytThumb(id)};
  try{
    const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(watch));
    if(r.ok){const j=await r.json();if(j&&j.title)return{ok:true,provider:'youtube',id:id,title:j.title,author:j.author_name||'',cover:j.thumbnail_url||ytThumb(id)};}
  }catch(e){}
  return{ok:false,error:'没能获取到 YouTube 视频信息，请检查链接或网络后重试'};
}
async function sportResolveBili(url){
  const id=extractBili(url);
  if(!id)return{ok:false,error:'没识别到 BV 号，请粘贴完整的哔哩哔哩视频链接（b23.tv 短链请先打开再复制地址栏链接）'};
  const fix=u=>String(u||'').replace(/^http:/,'https:');
  const d=await apiGet('/api/bilibili?bvid='+encodeURIComponent(id));
  if(d&&d.ok&&d.title)return{ok:true,provider:'bilibili',id:id,title:d.title,author:d.author||'',cover:fix(d.pic)};
  try{
    const r=await fetch('https://api.bilibili.com/x/web-interface/view?bvid='+id);
    if(r.ok){const j=await r.json();if(j&&j.code===0&&j.data)return{ok:true,provider:'bilibili',id:id,title:j.data.title,author:(j.data.owner&&j.data.owner.name)||'',cover:fix(j.data.pic)};}
  }catch(e){}
  return{ok:true,provider:'bilibili',id:id,title:'哔哩哔哩视频 '+id,author:'',cover:'',guess:true};
}

  state.tasks.forEach(t=>{if(t.noteTime&&(t.notes||(t.noteImages&&t.noteImages.length))){const d=dateStr(t.noteTime);(daysMap[d]=daysMap[d]||{done:[],notes:[]}).notes.push({id:t.id,name:t.name,notes:t.notes,images:t.noteImages||[],time:t.noteTime});}});
  (state.noteArchive||[]).forEach(a=>{(daysMap[a.date]=daysMap[a.date]||{done:[],notes:[]}).notes.push({id:a.id,name:a.name,notes:a.notes,time:a.time});});
  state.tasks.forEach(t=>{
    if(t.id==='read'&&t.books){
      t.books.forEach(b=>{
        (b.chapters||[]).forEach(ch=>{
          if(ch.notes&&ch.notes.trim()){
            const d=ch.noteTime?dateStr(ch.noteTime):dateStr(Date.now());
            (daysMap[d]=daysMap[d]||{done:[],notes:[]}).notes.push({id:t.id+'_'+b.id+'_'+ch.num,name:t.name+' · 《'+b.title+'》第'+ch.num+'章',notes:ch.notes,time:ch.noteTime||Date.now()});
          }
        });
      });
    }
  });
  const days=Object.keys(daysMap).sort((a,b)=>new Date(b)-new Date(a));
  let html='<div class="fade-in"><div class="breadcrumb"><button class="btn btn-ghost btn-sm" onclick="backToTask()">← 返回任务</button> · 📔 总览日记</div>';
  const bgSrc=currentBgSrc();
  html+='<div class="game-room"><div class="bg"'+(bgSrc?' style="background-image:url(\''+esc(bgSrc)+'\')"':'')+'></div>'+renderRoom()+'</div>'+renderBgPanel()+renderDecoPanel();
  if(state.diaryDay){
    const dd=daysMap[state.diaryDay]||{done:[],notes:[]};
    html+='<div class="card"><h3 class="card-title">🗓 '+state.diaryDay+' 的笔记</h3><button class="btn btn-ghost btn-sm" style="margin-bottom:14px" onclick="state.diaryDay=null;save();renderDetail()">← 返回日记列表</button>';
    html+=dd.notes.length?dd.notes.map(n=>'<div class="item-card"><div class="ic-main"><div class="ic-title">'+esc(n.name)+'</div>'+(n.notes?'<div class="ic-body">'+esc(n.notes)+'</div>':'')+((n.images&&n.images.length)?'<div class="note-img-grid">'+n.images.map(im=>{const s=imgSrc(im);return '<div class="note-img-item"><img src="'+esc(s)+'" onclick="window.open(\''+esc(s)+'\',\'_blank\')" title="点击查看大图"></div>';}).join('')+'</div>':'')+'</div></div>').join(''):'<div class="empty-hint">这一天没有记录笔记</div>';
    html+='</div>';
  }else{
    html+='<div class="card"><h3 class="card-title">📅 每日完成记录</h3><p class="card-desc">这里只显示当天已勾选完成的任务，点击某天查看那天的笔记。</p>';
    if(days.length){
      html+=days.map(d=>{
        const dd=daysMap[d];const date=new Date(d);const dayNum=date.getDate();const week=['周日','周一','周二','周三','周四','周五','周六'][date.getDay()];
        return '<div class="diary-day"><div class="diary-date"><div class="dd">'+dayNum+'</div><div class="dw">'+week+'</div></div><div class="diary-body" onclick="state.diaryDay=\''+d+'\';save();renderDetail()">'+(dd.done.length?dd.done.map(x=>'<div class="ddone"><div class="c on">✓</div><div class="t">'+esc(x.name)+'</div></div>').join(''):'<div class="dd-empty">这一天没有记录完成的任务</div>')+'<div class="diary-meta"><span>📝 '+dd.notes.length+' 条笔记</span><span>点击看详情 →</span></div></div></div>';
      }).join('');
    }else{
      html+='<div class="empty-hint">还没有记录哦～<br>完成今日目标、保存笔记后，这里会有记录</div>';
    }
    html+='</div>';
  }
  el.innerHTML=html;
  attachDecoDragHandlers();
}
function showPrompt(title,val,cb){const mask=document.getElementById('modalMask');const box=document.getElementById('modalBox');box.innerHTML='<h3>'+esc(title)+'</h3><input id="promptInp" value="'+esc(val)+'"><div class="m-actions"><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button><button class="btn btn-pink btn-sm" id="promptOk">确定</button></div>';mask.classList.add('show');const inp=document.getElementById('promptInp');setTimeout(()=>inp.focus(),50);inp.onkeydown=e=>{if(e.key==='Enter'){const v=inp.value.trim();closeModal();cb(v);}};document.getElementById('promptOk').onclick=()=>{const v=inp.value.trim();closeModal();cb(v);};}
function showConfirm(title,body,cb){const mask=document.getElementById('modalMask');const box=document.getElementById('modalBox');box.innerHTML='<h3>'+esc(title)+'</h3><div class="m-body">'+esc(body)+'</div><div class="m-actions"><button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button><button class="btn btn-pink btn-sm" id="confirmOk">确定删除</button></div>';mask.classList.add('show');document.getElementById('confirmOk').onclick=()=>{closeModal();cb();};}
function closeModal(){document.getElementById('modalMask').classList.remove('show');}
document.getElementById('modalMask').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function toggleSidebar(open){const sb=document.getElementById('sidebar');const bd=document.getElementById('backdrop');if(open){sb.classList.add('open');bd.classList.add('show');}else{sb.classList.remove('open');bd.classList.remove('show');}}
function bindDiaryButtons(){
  // Diary buttons use inline onclick="openDiary()" — reliable across re-renders.
  // (Previously added addEventListener dual-binding here as reinforcement for a
  //  stale-SW issue; now that SW is network-first the inline handler is sufficient,
  //  and double-binding caused multi-fire + mobile touchend interference.)
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',(e)=>{
    if(e.data && e.data.type==='sw-updated'){
      if(confirm('发现新版本，是否立即刷新以获取最新修复？')){
        window.location.reload();
      }
    }
  });
}
getRoom();load();checkNewDay();seedImportedTerms();stripTermNotesOnce();renderSidebar();renderDetail();bindDiaryButtons();startCloudSync();
setInterval(checkNewDay,5*60*1000);
</script>
