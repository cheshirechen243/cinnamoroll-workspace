:"草原","pinyin":"cǎoyuán","level":3,"note":"大片野草生长的地方","qa":["你有没有去过草原？草原是什么颜色的？","如果去草原旅游，你想做什么？","你觉得草原和海边，哪个地方更漂亮？"],"ex":["草原上有很多牛和羊。","我们打算假期去草原旅游。","草原的天很蓝，很漂亮。","骑马去草原上走走很舒服。","草原上不但有很多牛和羊，而且还有很多马。"]},{"id":"w525","word":"主意","pinyin":"zhǔyi","level":3,"note":"办法、想法","qa":["假期去哪儿玩，你有什么好主意？","朋友不高兴的时候，你会有什么好主意让他高兴？","你觉得自己是一个很有主意的人吗？"],"ex":["你有什么好主意吗？","这是个好主意，我们就这么做吧。","她的主意总是很特别。","我们一起想个主意吧。","如果你没有好主意，我们就先去问问老师吧。"]},{"id":"w526","word":"马","pinyin":"mǎ","level":3,"note":"一种家畜","qa":["你骑过马吗？在哪里骑的？","你觉得骑马难不难？为什么？","你在什么地方见过马？那里的马多吗？"],"ex":["草原上有很多马，也有很多羊。","他骑马骑得很好，一点儿也不害怕。","这只马跑得很快，我们都喜欢它。","我第一次骑马，有点儿害怕。","虽然我是第一次骑马，但是一点儿也不害怕。"]},{"id":"w527","word":"羊","pinyin":"yáng","level":3,"note":"一种家畜","qa":["你喜欢吃羊肉吗？草原上的羊多不多？","你见过草原上的羊吗？它们是什么颜色的？","你觉得羊可爱吗？为什么？"],"ex":["草原上有很多羊，也有很多牛。","这个菜是羊肉做的，很好吃。","他们家养了很多牛和羊。","羊每天都在草原上吃东西。","因为草原很大，所以这里的羊可以跑来跑去。"]},{"id":"w528","word":"月亮","pinyin":"yuèliang","level":3,"note":"月球，夜晚发光的天体","qa":["你喜欢看月亮吗？什么时候的月亮最漂亮？","你小时候觉得月亮上有什么？","在你的国家，看月亮的时候有什么特别的事吗？"],"ex":["晚上的月亮真漂亮。","草原上的月亮特别大。","孩子们坐在花园里看月亮。","今天晚上没有月亮，天是黑色的。","我们一边看月亮，一边吃蛋糕，非常开心。"]},{"id":"w529","word":"起飞","pinyin":"qǐfēi","level":3,"note":"飞机离开地面升空","qa":["坐飞机的时候，起飞前你会紧张吗？","飞机起飞的时候，你喜欢看外面吗？","如果飞机晚点，很久才起飞，你会做什么？"],"ex":["飞机马上就要起飞了。","飞机起飞的时候，我有点儿紧张。","我们的飞机晚点了，还没有起飞。","起飞以前，请关好手机。","因为天气不好，所以飞机晚了一个小时才起飞。"]},{"id":"w530","word":"宾馆","pinyin":"bīnguǎn","level":3,"note":"供旅客住宿的场所","qa":["你去旅游的时候，喜欢住新的宾馆还是旧的？","你觉得一个好的宾馆应该有什么？","你住过最好的宾馆在哪儿？"],"ex":["我们已经准备好了一家海边的宾馆。","这家宾馆的环境很好。","宾馆离机场不远，很方便。","我们在宾馆住了三天。","虽然这家宾馆不太大，但是服务员都很热情。"]},{"id":"w531","word":"牛","pinyin":"niú","level":3,"note":"一种家畜","qa":["你喜欢吃牛肉吗？草原上养牛的多吗？","你见过的牛是什么颜色的？","你觉得牛和马，哪个更有用？"],"ex":["草原上有很多牛和羊。","这个菜是牛肉做的，很好吃。","他们家养了很多牛，每天都要照顾。","牛在草原上慢慢地走。","草原上的牛和马一边走，一边吃东西。"]},{"id":"w532","word":"相机","pinyin":"xiàngjī","level":3,"note":"拍照用的器材","qa":["你出去旅游的时候，会带相机还是用手机拍照？","你觉得用相机拍照比用手机拍照好吗？","你的相机是什么时候买的？"],"ex":["我带了相机去草原拍照。","她的相机是新买的。","这个相机照的照片很漂亮。","我忘了带相机，只能用手机照相。","虽然手机也能照相，但是我还是喜欢用相机。"]},{"id":"w533","word":"司机","pinyin":"sījī","level":3,"note":"驾驶交通工具的人","qa":["出租车司机每天的工作累不累？","你觉得做一个好司机，最重要的是什么？","你坐出租车的时候，会跟司机聊天儿吗？"],"ex":["出租车司机每天的工作很忙，也很累。","他是一名公交车司机。","司机开车去机场接我们。","这位司机开车开得很好。","因为司机开车开得很慢，所以我们迟到了。"]},{"id":"w534","word":"晚点","pinyin":"wǎndiǎn","level":3,"note":"比预定时间晚","qa":["坐飞机的时候，遇到晚点你会怎么办？","你坐的火车晚点过吗？晚点了多久？","飞机晚点的时候，你会着急吗？"],"ex":["我们的飞机晚点了很长时间。","火车晚点了，我们要多等一会儿。","飞机晚点，让人很着急。","这次旅游，飞机没有晚点。","因为火车晚点了，所以我们到宾馆的时候已经很晚了。"]},{"id":"w535","word":"除了","pinyin":"chúle","level":3,"note":"表示在……之外","qa":["除了汉语，你还想学习什么？","除了汉语，你还会说什么外语？","除了周末，你还有什么时候休息？"],"ex":["除了草原，我们还去了海边。","除了她，大家都去旅游了。","除了工作，他还喜欢骑马。","除了牛肉，我什么肉都喜欢吃。","除了爬山以外，我们还在山上照了很多照片。"]},{"id":"w536","word":"以外","pinyin":"yǐwài","level":3,"note":"在某个范围之外","qa":["除了学习汉语以外，你平时还喜欢做什么？","除了你以外，你们家谁最喜欢旅游？","除了手机以外，你每天一定要带什么？"],"ex":["除了她以外，大家都来了。","除了草原以外，我们还想去海边。","除了工作以外，他没有别的兴趣。","除了羊肉以外，这里还有牛肉。","除了星期天以外，他每天都要去公司工作。"]},{"id":"w537","word":"干净","pinyin":"gānjìng","level":3,"note":"洁净、没有脏东西","qa":["你觉得自己的房间干净吗？多久打扫一次？","你觉得一个干净的房间对学习重要吗？","你觉得你们小区干净吗？"],"ex":["她把房间打扫得很干净。","这家宾馆很干净，我们都很满意。","草原的天气很干净，让人很舒服。","请把碗和筷子洗干净。","因为房间很干净，所以客人们都很满意。"]},{"id":"w538","word":"终于","pinyin":"zhōngyú","level":3,"note":"经过等待、努力最后出现某结果","qa":["你有没有等了很久，终于等到的事情？","你学汉语的时候，有没有什么终于学会的东西？","你等了很久的假期终于来了，你会做什么？"],"ex":["我们坐了很长时间的飞机，飞机终于起飞了。","她终于找到工作了。","等了很久，他终于来了。","我们终于坐上了去草原的飞机。","我们爬了三个小时，终于爬到了山上。"]},{"id":"w539","word":"爬","pinyin":"pá","level":3,"note":"攀登、攀爬","qa":["你喜欢爬山吗？最近一次爬山是什么时候？","你爬过最高的山在哪儿？","你觉得爬山累不累？为什么？"],"ex":["周末我们一起去爬山吧。","他每天早上都去爬山。","爬山对身体很好，可以多锻炼。","孩子喜欢在草原上爬来爬去。","虽然山很高，但是大家都爬上去了。"]},{"id":"w540","word":"山","pinyin":"shān","level":3,"note":"地面上高起的部分","qa":["你家附近有没有可以爬的山？","你觉得山上的环境怎么样？","你喜欢看山还是看海？为什么？"],"ex":["我们打算周末去爬山。","这个山不太高，很容易爬上去。","山上的天气很干净，让人很舒服。","从山上可以看到大海。","我们一边爬山，一边看山上的树和花。"]},{"id":"w541","word":"照","pinyin":"zhào","level":3,"note":"拍摄、照射","qa":["你喜欢照相还是被别人照？","你喜欢给家人照照片吗？","太阳照在你的房间里的时候，是早上还是下午？"],"ex":["请帮我们照一张照片。","太阳照在草原上，很漂亮。","她给我照了很多照片。","我们在山上照了很多照片。","早上的太阳照进房间里，我就起床了。"]},{"id":"w542","word":"鞋","pinyin":"xié","level":3,"note":"穿在脚上的用品","qa":["你今天穿的鞋是什么颜色的？","你最喜欢穿什么颜色的鞋？","你买鞋的时候，觉得好看重要还是舒服重要？"],"ex":["她买了一双新鞋，很漂亮，很喜欢。","这双鞋有点儿小，我想去换一双。","爬山的时候要穿舒服的鞋。","我的鞋丢了一只，找了很久也没找到。","因为这双鞋太小了，所以我想去商店换一双。"]},{"id":"w543","word":"大衣","pinyin":"dàyī","level":3,"note":"较长的外套","qa":["冬天的时候，你会穿大衣吗？","你觉得什么颜色的大衣好看？","你买过最贵的大衣是多少钱？"],"ex":["天气冷了，她穿上了大衣。","这件大衣很漂亮，我很喜欢，想买一件。","他买了一件新大衣。","冬天出门要穿大衣。","虽然这件大衣有点儿贵，但是穿着很舒服。"]},{"id":"w544","word":"拍照","pinyin":"pāizhào","level":3,"note":"照相","qa":["你喜欢拍照吗？一般用手机还是相机拍照？","旅游的时候，你喜欢拍照吗？一般照什么？","你觉得在哪里拍照最好看？"],"ex":["我们在山上拍照了。","她很喜欢拍照，每天都要拍照。","请帮我们拍照，好吗？","拍照的时候，请大家笑一笑。","我们一边爬山，一边拍照，玩得很开心。"]},{"id":"w545","word":"照相","pinyin":"zhàoxiàng","level":3,"note":"用照相机拍摄影像","qa":["你出去旅游的时候，会用相机照相吗？","你觉得照相的时候笑一笑好看吗？","你喜欢在哪里照相？为什么？"],"ex":["我们在草原上照相了。","她喜欢用相机照相。","请帮我们照相，好吗？","照相的时候，大家都很高兴。","如果你想照相，我可以帮你照。"]},{"id":"w546","word":"难看","pinyin":"nánkàn","level":3,"note":"不好看","qa":["你觉得什么衣服比较难看？","你有没有买过一件很难看的衣服？","如果朋友穿了一件难看的衣服，你会告诉他吗？"],"ex":["这件大衣有点儿难看。","这双鞋很难看，我不想买。","这张照片照得很难看。","她说这个颜色很难看。","虽然这件衣服有点儿难看，但是穿着很舒服。"]},{"id":"w547","word":"水平","pinyin":"shuǐpíng","level":3,"note":"能力、程度的高低","qa":["你觉得自己的汉语水平怎么样？","你觉得怎么做才能提高汉语水平？","你觉得你们班谁的汉语水平最高？"],"ex":["她的汉语水平很高。","我的英语水平不太好。","这次比赛的水平很高，大家都很努力。","他的工作水平大家都满意。","因为她每天都认真学习，所以汉语水平提高得很快。"]},{"id":"w548","word":"太阳","pinyin":"tàiyáng","level":3,"note":"恒星，白天发光发热的天体","qa":["你喜欢太阳吗？一般什么时候比较喜欢？","你喜欢在太阳下面运动吗？","你觉得早上的太阳好看，还是晚上的太阳好看？"],"ex":["今天的太阳很大，我们要多喝水。","太阳照在草原上，很漂亮。","我们在山上看太阳。","夏天的太阳特别热。","因为太阳太大了，所以我们在树下面休息了一会儿。"]},{"id":"w549","word":"干","pinyin":"gàn","level":3,"note":"做、从事","qa":["假期的时候，你打算干什么？","你周末一般在家干什么？","你觉得干什么工作最累？"],"ex":["你今天打算干什么？","他每天都很努力地干工作。","这件事应该怎么干？","她干工作很认真，大家都喜欢她。","如果你今天不想干，就明天再干吧。"]},{"id":"w550","word":"电","pinyin":"diàn","level":3,"note":"电力","qa":["家里突然没电了，你会怎么办？","你觉得没有电的时候，生活会怎么样？","如果手机没电了，你会怎么办？"],"ex":["房间里没有电，很不方便。","请把电用完以后关上。","这个洗衣机用电不多，很方便。","飞机上不能用电话。","因为突然没电了，所以我们只能早一点儿睡觉。"]},{"id":"w551","word":"收到","pinyin":"shōudào","level":3,"note":"接到、得到","qa":["你最近收到过让你很高兴的东西吗？","你生日的时候，收到过什么礼物？","你收到朋友的邮件以后，会马上回吗？"],"ex":["我收到了她给我的一封信，很高兴。","他收到了一个新的工作机会，很高兴。","我收到了一封重要的邮件。","她收到了朋友送的照片。","因为收到了妈妈的邮件，所以她今天特别高兴。"]},{"id":"w552","word":"封","pinyin":"fēng","level":3,"note":"计量信件的量词","qa":["你写过信吗？寄过几封信？","你给家人写过几封信？","你最近收到了几封邮件？"],"ex":["她给我写了一封信。","我收到了一封邮件。","这封信写得很好，我看了很多次。","请帮我把这封信寄出去。","虽然这封信很短，但是我看了很多次。"]},{"id":"w553","word":"邮件","pinyin":"yóujiàn","level":3,"note":"通过邮寄或网络传送的文件","qa":["你平时用邮件跟朋友说事情多吗？","你每天会看几次邮件？","你觉得用邮件说事情方便吗？"],"ex":["我收到了一封重要的邮件。","请把邮件发给我，谢谢。","她每天都要看邮件。","这封邮件是公司发的。","如果你收到邮件，请马上告诉我。"]},{"id":"w554","word":"难过","pinyin":"nánguò","level":3,"note":"伤心、不愉快","qa":["有什么事情让你觉得很难过？","你难过的时候，一般会做什么？","朋友很难过的时候，你会怎么帮助他？"],"ex":["她的照片丢了，她很难过。","听到这件事，我很难过。","他因为工作的事，心里难过。","别难过，事情会好起来的。","虽然这次考得不好，但是你不要太难过。"]},{"id":"w555","word":"哈哈","pinyin":"hāhā","level":3,"note":"表示笑声","qa":["最近有没有什么事情让你笑得很开心，哈哈大笑？","朋友讲了一个有意思的故事，你会哈哈大笑吗？"],"ex":["哈哈，你说的这件事真好笑。","她哈哈笑了很长时间。","哈哈，你说得太对了。","听完他讲的故事，大家都哈哈笑了。","他讲的故事太有意思了，我们都哈哈大笑。"]},{"id":"w556","word":"兴趣","pinyin":"xìngqù","level":3,"note":"对事物喜爱的情绪","qa":["你对学汉语有兴趣吗？为什么？","你小时候对什么有兴趣？现在还有兴趣吗？","你觉得兴趣对学习重要吗？"],"ex":["她对音乐很有兴趣。","我对爬山没有兴趣。","他的兴趣是拍照，每天都喜欢拍照。","孩子对新鞋很有兴趣。","因为对音乐很有兴趣，所以她每天都练习唱歌。"]},{"id":"w557","word":"结束","pinyin":"jiéshù","level":3,"note":"事情或活动完了","qa":["你希望假期快点结束吗？为什么？","今天的课结束以后，你打算做什么？","你觉得一个好的电影应该怎么结束？"],"ex":["这次比赛终于结束了，大家都很高兴。","会已经结束了，大家可以回家了。","假期很快就要结束了。","电影结束以后，我们一起吃饭。","如果会议结束得早，我们就一起去吃晚饭。"]},{"id":"w558","word":"该","pinyin":"gāi","level":3,"note":"应当；按道理或按顺序轮到","qa":["你觉得学生每天该学习多长时间？","你觉得什么时候该休息了？一般会怎么休息？"],"ex":["已经十二点了，我们该睡觉了。","已经很晚了，我们该回家了，妈妈会着急的。","如果你身体不舒服，就该去医院看看。","下一个该你了，你准备好了吗？","虽然我很想玩游戏，但是我知道现在该做作业了。"]},{"id":"w559","word":"高铁","pinyin":"gāotiě","level":3,"note":"高速铁路，也指在上面跑的高速列车","qa":["你坐过高铁吗？你觉得高铁怎么样？","去旅游的时候，你喜欢坐高铁还是坐飞机？为什么？"],"ex":["坐高铁去北京只要四个小时，非常方便。","虽然高铁票有点儿贵，但是高铁又快又舒服。","因为高铁站离我家很近，所以我经常坐高铁。","我们打算坐高铁去海边，不坐飞机了。","高铁马上就要开了，请大家快一点儿上车。"]},{"id":"w560","word":"行","pinyin":"xíng","level":3,"note":"可以、没问题（口语）；也指能干、有本事","qa":["朋友请你帮忙的时候，你一般会说“行”还是“不行”？","你觉得你们班谁的汉语最行？为什么？"],"ex":["明天下午三点在路口见面，行吗？","行，没问题，我马上就去帮你买。","你一个人去机场不行，我跟你一起去吧。","如果你今天没有时间，明天再来也行。","虽然他很年轻，但是工作很行，大家都相信他。"]},{"id":"w561","word":"路口","pinyin":"lùkǒu","level":3,"note":"道路交叉的地方","qa":["你家附近的路口有红绿灯吗？车多不多？","你跟朋友见面的时候，喜欢在路口等还是在店里等？"],"ex":["前面的路口往左走，就能看到那家银行。","我们在第二个路口下车吧。","因为这个路口车很多，所以过马路的时候要小心。","他在路口等了很久，朋友才来。","如果你找不到我家，就在路口给我打电话。"]},{"id":"w562","word":"红绿灯","pinyin":"hónglǜdēng","level":3,"note":"路口指挥车和行人的信号灯","qa":["你家到学校的路上有几个红绿灯？","你觉得没有红绿灯的路口，过马路的时候应该注意什么？"],"ex":["过红绿灯的时候，一定要小心。","前面的路口有红绿灯，我们在那儿过马路吧。","因为这个路口没有红绿灯，所以车开得很快。","红绿灯坏了，路口的车都走不了了。","我们要告诉孩子，看红绿灯过马路很重要。"]},{"id":"w563","word":"后来","pinyin":"hòulái","level":3,"note":"指过去某一时间以后的时间","qa":["你小时候喜欢的东西，后来还喜欢吗？","你第一次学汉语的时候觉得难吗？后来呢？"],"ex":["我以前不喜欢吃中国菜，后来越来越喜欢了。","他去年去了北京，后来我们就没有见过面。","开始的时候我觉得汉语很难，后来就觉得不难了。","虽然他小时候身体不好，但是后来每天锻炼，身体好多了。","我们先去了海边，后来又去了草原。"]},{"id":"w564","word":"急","pinyin":"jí","level":3,"note":"着急；事情紧迫","qa":["你急着做一件事的时候，会不会忘记东西？","朋友很急的时候，你会怎么帮他？"],"ex":["别急，我们还有很多时间。","因为他急着去机场，所以饭也没吃就走了。","你先别急，慢慢说，我一定帮你。","她听说妈妈生病了，心里很急。","如果你有急事，就给我打电话吧。"]},{"id":"w565","word":"如果","pinyin":"rúguǒ","level":3,"note":"表示假设，常和“就”一起用","qa":["如果明天放假，你打算做什么？","如果你有很多钱，你最想做什么？","如果可以选择，你想住在哪个国家？"],"ex":["如果明天下雨，我们就不去爬山了。","如果你有问题，就问老师吧。","如果你喜欢这件衣服，就买吧，不太贵。","如果没有手机，我们的生活会很不方便。","如果你觉得累，就先休息一会儿。"]},{"id":"w566","word":"耳机","pinyin":"ěrjī","level":3,"note":"戴在耳朵上听声音的小设备","qa":["你平时用耳机听什么？","你觉得走路的时候用耳机听音乐好不好？为什么？"],"ex":["我坐地铁的时候，喜欢用耳机听音乐。","我的耳机丢了，我找了很久也没找到。","因为别人都在学习，所以你看视频的时候要用耳机。","这个耳机是新买的，声音很好听。","如果你忘了带耳机，就不能在高铁上听音乐了。"]},{"id":"w567","word":"充电宝","pinyin":"chōngdiànbǎo","level":3,"note":"可以随身带着给手机充电的电池","qa":["你出门的时候会带充电宝吗？为什么？","如果你的手机没电了，又没带充电宝，你会怎么办？"],"ex":["我的手机没电了，你能借我一下充电宝吗？","出去旅游的时候，一定要带充电宝。","因为忘了带充电宝，所以我的手机没电了。","这个充电宝太大了，放在包里不方便。","虽然充电宝很方便，但是坐飞机的时候要检查。"]},{"id":"w568","word":"常用","pinyin":"chángyòng","level":3,"note":"经常使用的","qa":["你每天最常用的东西是什么？","你觉得学汉语的时候，最常用的词是哪些？"],"ex":["这些都是常用的汉字，你一定要记住。","手机是我最常用的东西，我每天都用。","老师给我们写了一些常用的句子。","因为这个词很常用，所以大家都应该学会。","我把常用的东西都放在箱子里了。"]},{"id":"w569","word":"分开","pinyin":"fēnkāi","level":3,"note":"人或事物不在一起；把东西分成几部分","qa":["你喜欢跟家人住在一起，还是分开住？为什么？","你跟好朋友分开以后，还常常见面吗？"],"ex":["请把新的衣服和旧的衣服分开放。","因为工作的关系，他和妻子分开了很长时间。","这几个词的意思不一样，要分开记。","虽然我们分开了很多年，但是一直是好朋友。","小朋友们，我们分开坐，一个人坐一张桌子。"]},{"id":"w570","word":"刷","pinyin":"shuā","level":3,"note":"用卡或手机扫一下（付钱、进站）；也指刷洗；刷视频","qa":["你坐地铁的时候，是刷卡还是用手机？","你每天会刷多长时间的视频？"],"ex":["坐地铁的时候，只要刷一下卡就能进站。","现在很多商店都可以刷手机买东西。","吃完饭以后，他把碗刷得很干净。","他每天晚上都刷视频，常常很晚才睡觉。","如果你的卡没有钱了，就刷不了了。"]},{"id":"w571","word":"检票","pinyin":"jiǎnpiào","level":3,"note":"上车、进站以前查看车票","qa":["坐高铁的时候，你一般什么时候去检票？","你觉得在车站检票方便吗？为什么？"],"ex":["高铁马上就要检票了，我们快走吧。","检票的时候，请大家带好护照和车票。","因为检票的人很多，所以我们等了很久。","我们到车站的时候，已经开始检票了。","如果你迟到了，就不能检票上车了。"]},{"id":"w572","word":"放假","pinyin":"fàngjià","level":3,"note":"学校、公司停止上课或上班，开始休息","qa":["你们学校什么时候放假？放几天？","放假的时候，你喜欢在家休息还是出去旅游？"],"ex":["学校下个星期放假，我打算回家。","因为明天放假，所以今天晚上可以晚一点儿睡觉。","放假的时候，高铁票很难买。","虽然放假了，但是他每天还是在家学习。","我们公司放假三天，大家都很高兴。"]},{"id":"w573","word":"沙发","pinyin":"shāfā","level":3,"note":"有靠背、软软的坐具","qa":["你喜欢坐在沙发上做什么？","你觉得什么颜色的沙发好看？为什么？"],"ex":["他坐在沙发上看电视，看了一个下午。","这个沙发很大，也很舒服。","因为房间太小了，所以放不下这个沙发。","我们打算给新房子买一个白色的沙发。","我家的猫每天都在沙发上睡觉。"]},{"id":"w574","word":"选择","pinyin":"xuǎnzé","level":3,"note":"从几个里面挑出来；也指挑出来的结果","qa":["如果让你选择，你想住在城市还是住在草原？","你觉得选择工作的时候，什么最重要？","买手机的时候，你会怎么选择？"],"ex":["这里有很多菜，你可以选择自己喜欢的。","因为高铁比较快，所以我们选择坐高铁去。","虽然这个选择很难，但是我们必须马上决定。","她选择了一家离公司很近的宾馆。","你觉得我应该选择这件还是那件？"]},{"id":"w575","word":"必须","pinyin":"bìxū","level":3,"note":"一定要，不能不这样做","qa":["你觉得出国旅游的时候，必须带什么？","学汉语的时候，你觉得每天必须做什么？"],"ex":["坐飞机的时候，必须带好护照。","明天早上八点有考试，我们必须早一点儿起床。","因为这件事很重要，所以你必须认真做。","如果你想学好汉语，就必须多说多练。","进电梯以前，必须让里面的人先走。"]},{"id":"w576","word":"试","pinyin":"shì","level":3,"note":"尝试；试穿、试用","qa":["买衣服的时候，你一定会先试一试吗？","你最想试一试什么新的事情？"],"ex":["这件裙子很漂亮，你去试一下吧。","如果你不知道好不好吃，就先试一试。","我试了三双鞋，最后买了这双。","虽然这个问题很难，但是我想再试一次。","因为没有试过，所以他不知道这条裤子合适不合适。"]},{"id":"w577","word":"黄色","pinyin":"huángsè","level":3,"note":"像香蕉、柠檬那样的颜色","qa":["你喜欢黄色吗？你有什么黄色的东西？","你觉得黄色的衣服好看吗？为什么？"],"ex":["她穿着一条黄色的裙子，非常漂亮。","秋天到了，树上的叶子变成了黄色。","我不太喜欢黄色，我更喜欢绿色。","因为黄色很好看，所以她买了一个黄色的书包。","香蕉是黄色的，西瓜是绿色的。"]},{"id":"w578","word":"短裤","pinyin":"duǎnkù","level":3,"note":"短的裤子","qa":["夏天的时候，你喜欢穿短裤吗？","你觉得去公司上班可以穿短裤吗？为什么？"],"ex":["天气太热了，我今天穿了一条短裤。","因为要去跑步，所以他穿上了短裤。","虽然这条短裤有点儿旧，但是穿着很舒服。","冬天太冷了，不能穿短裤出门。","这条短裤太大了，我想换一条小一点儿的。"]},{"id":"w579","word":"大小","pinyin":"dàxiǎo","level":3,"note":"东西的大小程度、尺寸","qa":["买鞋的时候，你觉得大小重要还是颜色重要？","你家的房间大小怎么样？你满意吗？"],"ex":["这件衣服的大小正合适，我就买了。","这几个箱子的大小都一样。","如果大小不合适，可以拿来换。","虽然这双鞋的大小合适，但是颜色我不太喜欢。","你知道这个房间的大小吗？能放下一个沙发吗？"]},{"id":"w580","word":"合适","pinyin":"héshì","level":3,"note":"符合实际情况或要求","qa":["你觉得什么时候学习最合适？为什么？","你觉得几岁结婚比较合适？"],"ex":["这条裙子很合适，你穿着很好看。","这个时间去不太合适，我们明天再去吧。","因为这双鞋不合适，所以我又去商店换了。","虽然这个工作很好，但是对我来说不太合适。","我们找了很久，终于找到了一个合适的房子。"]},{"id":"w581","word":"西瓜","pinyin":"xīguā","level":3,"note":"一种夏天常吃的大水果，里面是红色的","qa":["你喜欢吃西瓜吗？一次能吃多少？","你觉得怎么选才能买到好吃的西瓜？"],"ex":["夏天天气很热，我最喜欢吃西瓜。","这个西瓜又大又甜，一共十块钱。","因为西瓜太大了，所以我一个人拿不动。","如果西瓜不甜，你可以拿回来换。","我们一边吃西瓜，一边聊天儿。"]},{"id":"w582","word":"公斤","pinyin":"gōngjīn","level":3,"note":"重量单位，一公斤等于一千克","qa":["坐飞机的时候，你的行李一般有多少公斤？","你觉得一个人一次能拿几公斤的东西？"],"ex":["我的行李有二十公斤，一个人拿不动。","一公斤苹果要十块钱，有点儿贵。","因为最近每天锻炼，所以他瘦了三公斤。","坐飞机的时候，每个人只能带二十公斤的行李。","她买了五公斤的米，放在冰箱旁边。"]},{"id":"w583","word":"冰","pinyin":"bīng","level":3,"note":"水冷到零度以下变成的固体；冰凉的","qa":["天气热的时候，你喜欢喝冰的饮料吗？","你觉得冬天喝冰水好不好？为什么？"],"ex":["天气太热了，我想喝一杯冰水。","冬天到了，河上都是冰。","因为冰箱坏了，所以饮料都不冰了。","虽然冰的西瓜很好吃，但是不能吃太多。","请给我一杯咖啡，不要冰。"]},{"id":"w584","word":"极","pinyin":"jí","level":3,"note":"表示程度最高，常说“……极了”","qa":["你最近有没有觉得高兴极了的事情？","你觉得哪个地方的菜好吃极了？"],"ex":["这个西瓜甜极了，你也吃一点儿吧。","考试考得很好，她高兴极了。","今天天气热极了，大家都不想出门。","因为爬了一天的山，所以我累极了。","这家饭店的服务好极了，我们都很满意。"]},{"id":"w585","word":"香蕉","pinyin":"xiāngjiāo","level":3,"note":"一种黄色、长长的甜水果","qa":["你喜欢吃香蕉吗？一般什么时候吃？","你觉得香蕉和苹果，哪个更好吃？"],"ex":["香蕉是黄色的，又甜又好吃。","我早上吃了一个香蕉，现在还不饿。","因为香蕉很便宜，所以我买了很多。","虽然他很喜欢吃香蕉，但是不能每天吃太多。","请帮我买三斤香蕉和一个西瓜。"]},{"id":"w586","word":"一共","pinyin":"yígòng","level":3,"note":"合在一起、总共","qa":["你家一共有几口人？都有谁？","你一共去过几个国家？最喜欢哪个？"],"ex":["这些水果一共多少钱？","我们班一共有二十个学生。","因为买了很多东西，所以一共花了很多钱。","这个假期我们一共去了三个城市。","他一共写了五封信，都寄给了妈妈。"]},{"id":"w587","word":"毛","pinyin":"máo","level":3,"note":"钱的单位，十毛是一块（也说“角”）；也指人和动物的毛","qa":["你知道一块钱有几毛吗？","你小时候，几毛钱能买什么？"],"ex":["这个苹果三块五毛，很便宜。","你知道吗？一块钱就是十毛钱。","这只小猫的毛是白色的，非常可爱。","因为天气冷了，所以小狗的毛长得很长。","虽然只便宜了五毛钱，但是妈妈还是很高兴。"]},{"id":"w588","word":"不但","pinyin":"búdàn","level":3,"note":"用在递进复句的前一句，常和“而且、还、也”一起用","qa":["你觉得学汉语不但有意思，而且有用吗？为什么？"],"ex":["她不但会说汉语，而且会写很多汉字。","这家饭店不但菜好吃，而且服务也很好。","这个房子不但很大，而且离公司很近。","他不但自己学习很努力，还常常帮助同学。","今天不但下雨，而且风也很大。"]},{"id":"w589","word":"而且","pinyin":"érqiě","level":3,"note":"表示意思更进一层，常和“不但”一起用","qa":["你觉得坐高铁不但快，而且方便吗？为什么？"],"ex":["这件衣服很便宜，而且很好看。","他每天锻炼，而且吃得很健康。","西瓜不但甜，而且很便宜。","这个小区很安静，而且环境很好。","她不但会唱歌，而且唱得非常好听。"]},{"id":"w590","word":"声","pinyin":"shēng","level":3,"note":"声音；量词，用于声音发出的次数（说一声）","qa":["你到家以后，会跟家人说一声吗？","如果你要晚一点儿到，你会跟朋友说一声吗？"],"ex":["你到了机场，给我打个电话说一声。","我叫了他好几声，他都没有听见。","如果你明天不来，请跟老师说一声。","他大声地说：“生日快乐！”","因为教室里很安静，所以大家都小声说话。"]},{"id":"w591","word":"开机","pinyin":"kāijī","level":3,"note":"打开手机、电脑等机器","qa":["你的手机每天都开机吗？晚上会关机吗？","开机以后，你第一件事做什么？"],"ex":["我的手机没电了，不能开机。","上课的时候请关机，下课以后再开机。","因为电脑太旧了，所以开机要很长时间。","飞机起飞以后，不能开机打电话。","他早上一开机，就收到了很多邮件。"]},{"id":"w592","word":"日","pinyin":"rì","level":1,"note":"日期里的“号”；也指太阳、白天","qa":["今天几月几日？"],"ex":["今天是九月二十日。","十月一日是星期几？"]},{"id":"w593","word":"会","pinyin":"huì","level":1,"note":"能够，懂得怎样做（会做饭）","qa":["你会做饭吗？","你会做什么菜？"],"ex":["我会做饭。","妈妈会做饺子，也会做面条儿。","我不会做中国菜。"]},{"id":"w594","word":"只","pinyin":"zhī","level":1,"note":"量词，用于动物等（一只猫）","qa":["你家有几只猫？"],"ex":["我家有一只小猫。","桌子下有一只猫。"]},{"id":"w595","word":"常","pinyin":"cháng","level":3,"note":"常常、经常","qa":["你常去哪儿买东西？","周末的时候，你常做什么？"],"ex":["我常去学校附近的饭店吃饭。","因为她常锻炼，所以身体很健康。","他常跟朋友一起打羽毛球。","虽然我们不常见面，但是我们是好朋友。","这是我们常用的方法。"]},{"id":"w596","word":"体育馆","pinyin":"tǐyùguǎn","level":3,"note":"进行体育运动和比赛的场馆","qa":["你们学校有体育馆吗？大不大？","你常去体育馆做什么运动？"],"ex":["我们学校的体育馆很大，也很新。","下午我要去体育馆打羽毛球。","因为外面下雨，所以我们在体育馆里上体育课。","体育馆离我家很近，走路十分钟就到了。","周末体育馆里的人特别多。"]},{"id":"w597","word":"习惯","pinyin":"xíguàn","level":3,"note":"长期形成的做法；也指对某种情况已经适应","qa":["你有什么好习惯？说一说。","你刚来中国的时候，习惯这里的生活吗？","你习惯早上锻炼还是晚上锻炼？"],"ex":["我有每天早上喝一杯水的习惯。","刚来中国的时候，我不习惯用筷子。","因为他习惯晚睡，所以早上常常起不来。","虽然这里的冬天很冷，但是我已经习惯了。","晚上看手机不是一个好习惯。"]},{"id":"w598","word":"以后","pinyin":"yǐhòu","level":3,"note":"现在或某个时间之后","qa":["你以后想做什么工作？","下课以后，你一般做什么？"],"ex":["下课以后，我们一起去体育馆吧。","以后我想去中国工作。","吃完饭以后，我们一起去超市吧。","如果以后有时间，我们再来这儿玩。","他来中国以后，汉语水平提高了很多。"]},{"id":"w599","word":"羽毛球","pinyin":"yǔmáoqiú","level":3,"note":"一种用球拍打的球类运动，也指这种球","qa":["你会打羽毛球吗？打得怎么样？","你喜欢在哪儿打羽毛球？和谁一起？"],"ex":["我每个星期都去体育馆打羽毛球。","因为外面风很大，所以我们不能在外面打羽毛球。","她羽毛球打得很好，还参加过比赛。","虽然我不太会打羽毛球，但是我很喜欢。","下班以后，我们一起去打羽毛球吧。"]},{"id":"w600","word":"耳朵","pinyin":"ěrduo","level":3,"note":"听声音的器官","qa":["你的耳朵好不好？能听得很清楚吗？","你用耳机听音乐的时候，会不会觉得耳朵不舒服？"],"ex":["小狗的耳朵很大，很可爱。","因为音乐的声音太大了，所以我的耳朵有点儿疼。","她的耳朵很好，很小的声音也能听见。","虽然耳朵不舒服，但是他还是去上课了。","冬天出门的时候，耳朵常常觉得很冷。"]},{"id":"w601","word":"低","pinyin":"dī","level":3,"note":"离地面近、高度小；声音、水平等在一般以下","qa":["你喜欢住在高层还是低层？为什么？","说话的时候，你的声音高还是低？"],"ex":["这张桌子太低了，孩子用正合适。","因为他的汉语水平比较低，所以先上一年级的课。","请你说话声音低一点儿，孩子在睡觉。","虽然这里的房子很便宜，但是楼很低，没有电梯。","飞机飞得很低，我们都看见了。"]},{"id":"w602","word":"关心","pinyin":"guānxīn","level":3,"note":"把人或事放在心上，很重视","qa":["你最关心的人是谁？为什么？","你平时关心新闻吗？最关心什么新闻？"],"ex":["妈妈很关心我的身体，常常给我打电话。","因为老师很关心学生，所以大家都喜欢她。","谢谢你的关心，我已经好多了。","虽然他工作很忙，但是很关心家人。","朋友生病的时候，我们要多关心他。"]},{"id":"w603","word":"注意","pinyin":"zhùyì","level":3,"note":"把心思放在某件事上，小心","qa":["天气冷的时候，你会注意什么？","你觉得学汉语的时候，最应该注意什么？"],"ex":["过马路的时候，一定要注意车。","因为最近感冒的人很多，所以大家要注意身体。","我没注意到他已经来了。","如果你想学好汉语，就要注意听老师讲。","虽然这个问题不难，但是你要注意时间。"]},{"id":"w604","word":"住院","pinyin":"zhùyuàn","level":3,"note":"病人住在医院里治病","qa":["你的家人有没有住院的时候？","如果朋友住院了，你会去看他吗？会带什么？"],"ex":["爷爷生病了，现在在医院住院。","因为他发烧很久了，所以医生让他住院。","她住院住了一个星期，现在好多了。","虽然住院的时候不能出去，但是有很多人来看她。","如果身体还不好，就要继续住院。"]},{"id":"w605","word":"差不多","pinyin":"chàbuduō","level":3,"note":"相差很少、接近","qa":["你和你的好朋友身高差不多吗？","你觉得坐高铁和坐飞机的时间差不多吗？"],"ex":["我和哥哥差不多高。","这件衣服和那件衣服的颜色差不多。","作业我已经做得差不多了。","因为我们的爱好差不多，所以我们常常一起玩。","虽然这家饭店的菜和那家差不多，但是这家更便宜。"]},{"id":"w606","word":"得","pinyin":"děi","level":3,"note":"需要、必须（口语）","qa":["明天你得几点起床？","你每天得做什么事情？"],"ex":["已经八点了，我得走了。","明天有考试，我今天晚上得好好复习。","因为感冒了，所以你得多喝水。","如果你想去北京，就得早一点儿买票。","这件事很重要，你得认真做。"]},{"id":"w607","word":"开心","pinyin":"kāixīn","level":3,"note":"心情愉快、高兴","qa":["最近有什么事情让你很开心？","你不开心的时候，一般做什么？"],"ex":["今天是我的生日，我非常开心。","因为考试考得很好，所以她很开心。","我们在海边玩了一天，玩得很开心。","虽然工作很累，但是和同事在一起很开心。","看到你身体好了，我们都很开心。"]},{"id":"w608","word":"出院","pinyin":"chūyuàn","level":3,"note":"病好以后离开医院回家","qa":["你的朋友出院的时候，你会去接他吗？","你觉得刚出院的人应该注意什么？"],"ex":["爷爷的病好了，明天就可以出院了。","因为身体还不太好，所以医生不让她出院。","出院以后，他每天都在家休息。","虽然已经出院了，但是还要注意身体。","她出院的时候，我们都去医院接她。"]},{"id":"w609","word":"种","pinyin":"zhǒng","level":3,"note":"量词，表示种类（一种、这种）","qa":["你最喜欢哪种水果？","你觉得哪种运动最好？为什么？"],"ex":["这种手机很好用，也不太贵。","商店里有很多种饮料，你想喝哪种？","因为这种菜很新鲜，所以大家都喜欢买。","虽然这种方法很简单，但是很有用。","我不太喜欢这种颜色的衣服。"]},{"id":"w610","word":"方法","pinyin":"fāngfǎ","level":3,"note":"解决问题、做事情的办法","qa":["你有什么学汉语的好方法？","你觉得记汉字最好的方法是什么？"],"ex":["这个方法很好，你可以试一试。","因为方法不对，所以他学了很久也没学会。","老师教了我们一个记汉字的好方法。","虽然这个方法有点儿难，但是很有用。","你有什么好方法能让孩子喜欢学习吗？"]},{"id":"w611","word":"其他","pinyin":"qítā","level":3,"note":"别的，另外的","qa":["除了汉语，你还会其他外语吗？","你还有其他的爱好吗？"],"ex":["我只喜欢喝茶，不喜欢其他饮料。","除了他以外，其他同学都来了。","因为其他人都在忙，所以我一个人去了。","这个问题我懂了，其他的问题还不太懂。","虽然这家店的菜不多，但是比其他店便宜。"]},{"id":"w612","word":"心里","pinyin":"xīnli","level":3,"note":"思想里、感情上","qa":["考试以前，你心里紧张吗？","你心里有事的时候，会跟谁说？"],"ex":["看到妈妈生病了，他心里很难过。","因为明天要比赛，所以我心里有点儿紧张。","虽然他没说话，但是心里很高兴。","我心里一直想着这件事。","有什么事，别放在心里，跟我说说吧。"]},{"id":"w613","word":"校园","pinyin":"xiàoyuán","level":3,"note":"学校里面的地方","qa":["你们学校的校园大不大？有什么好玩的地方？","你最喜欢在校园里的什么地方学习？"],"ex":["我们的校园很大，里面有很多树和花。","因为校园里很安静，所以我喜欢在这儿看书。","下课以后，同学们在校园里走一走。","虽然校园不太大，但是环境非常好。","秋天的时候，校园里特别漂亮。"]},{"id":"w614","word":"卡","pinyin":"kǎ","level":3,"note":"卡片；银行卡、公交卡等","qa":["你平时买东西用卡还是用手机？","你有学校的卡吗？可以用来做什么？"],"ex":["我去银行办了一张新卡。","因为忘了带卡，所以我不能坐地铁。","这张卡里没有钱了，我得去银行。","坐公交车的时候，刷一下卡就可以了。","虽然用卡很方便，但是也要小心别丢了。"]},{"id":"w615","word":"球场","pinyin":"qiúchǎng","level":3,"note":"打球、踢球的场地","qa":["你们学校有几个球场？","你喜欢在球场上打什么球？"],"ex":["下午我们去球场踢足球吧。","因为下雨了，所以球场上一个人也没有。","学校的球场很大，可以打篮球，也可以踢足球。","他每天放学以后都去球场打球。","虽然球场离家有点儿远，但是我常常去。"]},{"id":"w616","word":"为了","pinyin":"wèile","level":3,"note":"表示目的","qa":["为了学好汉语，你每天会做什么？","你为了家人做过什么很累的事？"],"ex":["为了参加比赛，他每天都去球场练习。","为了身体健康，我每天早上跑步。","她为了学汉语，一个人来到了中国。","为了不迟到，我今天六点就起床了。","为了让妈妈开心，他做了一个蛋糕。"]},{"id":"w617","word":"运动会","pinyin":"yùndònghuì","level":3,"note":"很多人参加的体育比赛大会","qa":["你参加过学校的运动会吗？参加了什么比赛？","你觉得运动会上最有意思的比赛是什么？"],"ex":["下个星期学校要开运动会。","因为要参加运动会，所以他每天都练习跑步。","运动会上，大家都很紧张，也很开心。","虽然这次运动会没得到第一名，但是我们很高兴。","我们班在运动会上得了很多分。"]},{"id":"w618","word":"男生","pinyin":"nánshēng","level":3,"note":"男学生；也泛指年轻男子","qa":["你们班有几个男生？几个女生？","你觉得男生和女生喜欢的运动一样吗？"],"ex":["我们班的男生都喜欢踢足球。","这个男生个子很高，篮球打得很好。","因为男生比较多，所以我们班的足球比赛很好看。","虽然他是男生，但是很喜欢做饭。","男生们在球场上打篮球，女生们在旁边看。"]},{"id":"w619","word":"练","pinyin":"liàn","level":3,"note":"反复地做，使熟练","qa":["你每天练多长时间的汉字？","你现在在练什么运动？"],"ex":["他每天早上都在球场练跑步。","因为要参加比赛，所以她练了很久。","这个汉字很难，我得多练几遍。","虽然练得很累，但是他一点儿也不想休息。","你多练练，就能说得很好了。"]},{"id":"w620","word":"网球","pinyin":"wǎngqiú","level":3,"note":"一种用球拍隔着网打的球类运动，也指这种球","qa":["你会打网球吗？和羽毛球比，哪个更难？","你看过网球比赛吗？喜欢哪个运动员？"],"ex":["我爸爸很喜欢打网球。","因为学校的球场离家很近，所以他周末常去打网球。","虽然网球很难，但是很有意思。","她网球打得非常好，参加过很多比赛。","下午我们去打网球，好不好？"]},{"id":"w621","word":"比赛","pinyin":"bǐsài","level":3,"note":"比一比谁更好的活动","qa":["你喜欢看什么比赛？为什么？","你参加比赛以前，会不会很紧张？"],"ex":["明天有足球比赛，我们一起去看吧。","因为下大雨，所以今天没有比赛。","这次比赛他得了第一名。","虽然这次比赛没有得到好成绩，但是大家都很努力。","比赛开始以前，运动员们都很紧张。"]},{"id":"w622","word":"练习","pinyin":"liànxí","level":3,"note":"反复地学、反复地做；也指作业题","qa":["你每天练习说汉语吗？和谁练习？","你觉得练习汉字最好的方法是什么？"],"ex":["我每天都练习写汉字。","因为练习得很认真，所以她的汉语提高得很快。","老师让我们回家做这些练习。","虽然练习很累，但是对比赛很有帮助。","如果你想说好汉语，就要多练习。"]},{"id":"w623","word":"好多","pinyin":"hǎoduō","level":3,"note":"很多（口语）","qa":["你有好多朋友吗？他们都是哪国人？","你家附近有好多饭店吗？"],"ex":["今天超市里的人好多啊！","他买了好多水果，一个人拿不动。","因为好多同学都感冒了，所以今天没上体育课。","虽然好多人觉得汉语很难，但是我觉得很有意思。","我好多年没回家了，很想家人。"]},{"id":"w624","word":"只是","pinyin":"zhǐshì","level":3,"note":"仅仅是；不过（表示轻微的转折）","qa":["你觉得学汉语只是为了找工作吗？"],"ex":["我只是有点儿累，不是生病了。","这件衣服很好看，只是有点儿贵。","他不是不想来，只是没有时间。","因为只是一个小问题，所以你别担心。","我只是问问，你不用马上回答。"]},{"id":"w625","word":"啤酒","pinyin":"píjiǔ","level":3,"note":"一种用麦子做的、有气泡的酒","qa":["你喜欢喝啤酒吗？一般什么时候喝？","你觉得看比赛的时候喝啤酒有意思吗？"],"ex":["夏天很热，他喜欢喝冰啤酒。","因为明天要开车，所以他今天不喝啤酒。","看足球比赛的时候，他们喝了很多啤酒。","虽然啤酒很好喝，但是不能喝太多。","服务员，请再给我们一杯啤酒。"]},{"id":"w626","word":"紧张","pinyin":"jǐnzhāng","level":3,"note":"心里不放松、不安；时间或工作很满","qa":["你考试以前会紧张吗？怎么做才能不紧张？","你第一次说汉语的时候紧张吗？"],"ex":["比赛马上就要开始了，他很紧张。","因为第一次参加比赛，所以她有点儿紧张。","别紧张，你一定能做好。","虽然工作很紧张，但是他每天都很开心。","考试的时候太紧张了，我忘了好几个汉字。"]},{"id":"w627","word":"受到","pinyin":"shòudào","level":3,"note":"得到、遭到（欢迎、影响、帮助等）","qa":["你做过什么让你受到大家欢迎的事？","你觉得什么老师最能受到学生的欢迎？"],"ex":["这个运动员受到了很多人的欢迎。","因为工作很努力，所以她受到了大家的欢迎。","这本书受到了很多年轻人的喜爱。","虽然他受到了很大的影响，但是还是坚持下来了。","下雨天，比赛受到了影响。"]},{"id":"w628","word":"得分","pinyin":"défēn","level":3,"note":"在比赛或考试中得到分数；也指得到的分数","qa":["你们班谁在考试里得分最高？","打篮球的时候，你最多一次得分是多少？"],"ex":["这次考试我得分很高，妈妈很高兴。","这次比赛，我们班的得分最高。","因为他得分最多，所以大家都很喜欢他。","虽然得分不高，但是我已经很努力了。","篮球比赛里，得分多的就是第一名。"]},{"id":"w629","word":"世界","pinyin":"shìjiè","level":3,"note":"地球上所有的地方","qa":["你最想去世界上的哪个地方？为什么？","你觉得世界上最好吃的菜是什么？"],"ex":["他想去世界上很多国家旅游。","因为他跑得最快，所以得了世界第一。","世界上有很多不同的文化。","虽然世界很大，但是我们还是见面了。","这个比赛在世界上非常有名。"]},{"id":"w630","word":"运动员","pinyin":"yùndòngyuán","level":3,"note":"参加体育比赛的人","qa":["你最喜欢哪个运动员？为什么？","你觉得做运动员累不累？"],"ex":["这个运动员跑得非常快。","因为要参加比赛，所以运动员们每天都练习。","我小时候想做一个足球运动员。","虽然他是运动员，但是也很喜欢看书。","比赛结束以后，运动员们都很累。"]},{"id":"w631","word":"得到","pinyin":"dédào","level":3,"note":"事物为自己所有，拿到","qa":["你最近得到过什么礼物？","你觉得怎么做才能得到别人的帮助？"],"ex":["他在比赛里得到了第一名。","因为工作很努力，所以她得到了一个好机会。","我生日的时候，得到了很多礼物。","虽然没有得到好成绩，但是我学到了很多。","只要努力，就一定能得到大家的帮助。"]},{"id":"w632","word":"成绩","pinyin":"chéngjì","level":3,"note":"学习、工作、比赛的结果","qa":["你这次考试的成绩怎么样？满意吗？","你觉得成绩重要吗？为什么？"],"ex":["她每天认真学习，成绩越来越好。","因为这次考试成绩很好，所以妈妈给我买了礼物。","虽然成绩不太好，但是他一直很努力。","这次比赛，他得到了很好的成绩。","老师说我的数学成绩提高了很多。"]},{"id":"w633","word":"笔记","pinyin":"bǐjì","level":3,"note":"听课、看书时写下来的内容","qa":["上课的时候，你会写笔记吗？","你觉得写笔记对学习有什么帮助？"],"ex":["上课的时候，我把老师讲的写在笔记里。","因为她的笔记写得很清楚，所以大家都想看。","考试以前，我会认真看一遍笔记。","虽然写笔记很累，但是对复习很有帮助。","我的笔记本丢了，里面有很多笔记。"]},{"id":"w634","word":"黑板","pinyin":"hēibǎn","level":3,"note":"教室里老师写字用的板","qa":["你们教室里有黑板吗？是什么颜色的？","上课的时候，你能看清楚黑板上的字吗？"],"ex":["老师在黑板上写了很多汉字。","因为黑板上的字太小了，所以后面的同学看不清楚。","下课以后，他在黑板上写了一个句子。","虽然现在有电脑，但是很多老师还是喜欢用黑板。","请大家看黑板，我们一起读一遍。"]},{"id":"w635","word":"遍","pinyin":"biàn","level":3,"note":"量词，表示一个动作从开始到结束的次数","qa":["你最喜欢的电影，你看过几遍？","学新汉字的时候，你一般写几遍？"],"ex":["这个句子请你再说一遍。","因为没听清楚，所以我请老师又讲了一遍。","我把这个对话读了三遍，现在都记住了。","虽然这本书我看了很多遍，但是还是很喜欢。","写完作业以后，要认真检查一遍。"]},{"id":"w636","word":"要求","pinyin":"yāoqiú","level":3,"note":"提出希望别人做到的事；也指提出的条件","qa":["你们老师对学生有什么要求？","你对自己有什么要求？"],"ex":["老师要求我们每天写一遍笔记。","因为公司要求很高，所以他工作很认真。","这个工作的要求是会说汉语。","虽然妈妈的要求很多，但是都是为了我好。","她要求自己每天读一个小时的书。"]},{"id":"w637","word":"外语","pinyin":"wàiyǔ","level":3,"note":"外国的语言","qa":["除了汉语，你还会什么外语？","你觉得学外语最好的方法是什么？"],"ex":["他会说三种外语，真不错。","因为会说外语，所以她找到了一个好工作。","学外语要多听、多说、多练。","虽然学外语很难，但是很有意思。","我想学好汉语，以后再学一门外语。"]},{"id":"w638","word":"遇到","pinyin":"yùdào","level":3,"note":"碰到、碰见","qa":["你学汉语的时候遇到过什么问题？","你在路上遇到过好久不见的朋友吗？"],"ex":["我在超市遇到了我的老师。","因为遇到了一个很难的问题，所以我去问老师。","如果你遇到问题，就给我打电话。","虽然遇到了很多问题，但是他都解决了。","昨天在路上遇到了好久不见的朋友。"]},{"id":"w639","word":"页","pinyin":"yè","level":3,"note":"书本里的一张纸的一面；量词","qa":["你一天能看多少页书？","这本书一共有多少页？你看完了吗？"],"ex":["请大家把书打开，看第十页。","因为这本书太长了，所以我每天只看十页。","作业是第二十页的练习。","虽然只有几页，但是我看了很久。","我今天看了五十页书，有点儿累了。"]},{"id":"w640","word":"对话","pinyin":"duìhuà","level":3,"note":"两个或几个人之间的谈话；课本里的会话","qa":["你平时和中国朋友用汉语对话吗？","你觉得这课的对话难不难？"],"ex":["请你和同学一起读这个对话。","因为对话很有意思，所以大家都喜欢读。","这个对话里有很多新的词。","虽然对话很长，但是我已经记住了。","老师要求我们用今天学的词写一个对话。"]},{"id":"w641","word":"句","pinyin":"jù","level":3,"note":"量词，用于话（一句话）","qa":["你来中国以后，学会的第一句汉语是什么？","你最喜欢的一句中文是什么？为什么？"],"ex":["他一句也没说就走了。","因为这句很重要，所以我写在了笔记里。","请你用汉语说几句，介绍一下你自己。","虽然只说了几句，但是大家都听懂了。","老师说的这句汉语，我没听懂。"]},{"id":"w642","word":"句子","pinyin":"jùzi","level":3,"note":"能表达一个完整意思的一句话","qa":["你能用今天学的词说一个句子吗？","你觉得长句子难还是短句子难？"],"ex":["请用这个词写一个句子。","因为这个句子太长了，所以我读了很多遍。","黑板上有五个句子，请大家读一读。","虽然句子很短，但是意思很重要。","这个句子里有一个字写错了。"]},{"id":"w643","word":"后年","pinyin":"hòunián","level":3,"note":"明年的下一年","qa":["后年你打算做什么？","你觉得后年你的汉语会怎么样？"],"ex":["我后年就要毕业了。","因为后年要去中国，所以我现在开始学汉语。","哥哥打算后年结婚。","虽然后年还很远，但是我们已经开始准备了。","今年我二十岁，后年就二十二岁了。"]},{"id":"w644","word":"一般","pinyin":"yìbān","level":3,"note":"通常；普通、不太好也不太差","qa":["你周末一般做什么？","你一般几点睡觉？几点起床？"],"ex":["我一般早上七点起床。","因为周末一般不上班，所以我常常去爬山。","这家饭店的菜一般，不太好吃。","虽然我一般不喝咖啡，但是今天太累了。","我们一般在学校附近吃饭。"]},{"id":"w645","word":"接","pinyin":"jiē","level":3,"note":"到某地去迎接别人；也指接住、接电话","qa":["你去机场接过朋友吗？说一说那次的事情。","你小时候放学以后，是谁来学校接你的？","朋友来你的城市旅游，你会去车站接他吗？"],"ex":["因为妈妈今天要来，所以我得去车站接她。","虽然飞机晚点了，但是他还是一直在机场等着接我。","如果你到了北京，我就去机场接你。","爸爸每天下班以后都开车来学校接我。","他的手机响了很久，可是他没有接电话。"]},{"id":"w646","word":"斤","pinyin":"jīn","level":3,"note":"重量单位，一斤是半公斤","qa":["你觉得一斤苹果多少钱比较便宜？","你知道一公斤是几斤吗？"],"ex":["因为西瓜很便宜，所以妈妈一下买了十斤。","虽然这些水果一共有五斤，但是我一个人拿得动。","香蕉三块钱一斤，比超市便宜多了。","如果你想买新鲜的鱼，最好早上去，一斤只要二十块。","他最近瘦了十斤，看起来很健康。"]},{"id":"w647","word":"病人","pinyin":"bìngrén","level":3,"note":"生病的人","qa":["如果你是医生，你会怎么照顾病人？","你觉得病人最需要什么？"],"ex":["因为最近很多人感冒，所以医院里的病人特别多。","医生对病人很热情，也很认真。","虽然他是病人，但是每天都在医院里看书学习。","病人刚出院，还要在家多休息几天。","如果你去医院看病人，可以带一些水果。"]},{"id":"w648","word":"回","pinyin":"huí","level":3,"note":"量词，用于事情、动作的次数（怎么回事、去过一回）","qa":["你遇到过什么不知道是怎么回事的事情？","你去过几回北京？最喜欢那里的什么？"],"ex":["你的手机怎么了？这是怎么回事？","因为不知道是怎么回事，所以他去问老师。","我去过一回草原，那里特别漂亮。","虽然这本书我看过一回，但是还想再看一回。","电脑突然没电了，大家都不知道是怎么回事。"]},{"id":"w649","word":"开","pinyin":"kāi","level":3,"note":"（医生）开药，写下病人要用的药","qa":["你感冒的时候，会去医院让医生开药吗？","你觉得医生给病人开药的时候，应该注意什么？"],"ex":["医生给我开了一些感冒药。","因为他发烧了，所以医生给他开了药。","虽然医生开了很多药，但是他不想吃。","如果你身体不舒服，就去医院让医生开点儿药。","医生开药以前，先认真检查了一遍。"]},{"id":"w650","word":"会议","pinyin":"huìyì","level":3,"note":"很多人在一起讨论事情的会","qa":["你参加过的最长的会议开了多长时间？","你觉得开会议的时候，最重要的是什么？"],"ex":["明天上午有一个很重要的会议。","因为会议还没结束，所以经理不能接电话。","会议室里坐满了人。","虽然会议开了三个小时，但是问题还没有解决。","如果你不能参加会议，请提前告诉经理。"]},{"id":"w651","word":"开会","pinyin":"kāihuì","level":3,"note":"很多人在一起开会议","qa":["你们公司每个星期开会吗？一般开多久？","你觉得开会的时候最不应该做什么？"],"ex":["经理正在开会，请你等一下。","因为下午要开会，所以我不能去接孩子了。","我们每个星期一早上都要开会。","虽然开会很累，但是能解决很多问题。","开会的时候，请大家把手机关了。"]},{"id":"w652","word":"后天","pinyin":"hòutiān","level":3,"note":"明天的下一天","qa":["后天你有什么打算？","如果后天放假，你想去哪儿？"],"ex":["后天就是周末了，我们去爬山吧。","因为后天要考试，所以我这两天都在复习。","经理说后天要开一个重要的会议。","虽然后天才出发，但是我已经准备好了行李。","今天是星期三，后天是星期五。"]},{"id":"w653","word":"地点","pinyin":"dìdiǎn","level":3,"note":"做某件事的地方","qa":["你觉得和朋友见面最好的地点是哪儿？","开会的时间和地点，你一般怎么记？"],"ex":["请告诉我会议的时间和地点。","因为地点变了，所以很多人都去错了地方。","这个地点离地铁站很近，很方便。","虽然时间还没定，但是地点已经决定了。","我们见面的地点在学校门口。"]},{"id":"w654","word":"室","pinyin":"shì","level":3,"note":"房间（办公室、教室、会议室）","qa":["你们学校的办公室和教室在哪一层？","你觉得一个好的会议室应该有什么？"],"ex":["经理在会议室等你。","因为教室里太热了，所以我们开了空调。","办公室在二层，你坐电梯上去吧。","虽然这个会议室不大，但是很干净。","下课以后，请大家把教室打扫干净。"]},{"id":"w655","word":"发","pinyin":"fā","level":3,"note":"送出、发出（发邮件、发信息）","qa":["你每天会给别人发多少条信息？","你一般用手机给朋友发什么？"],"ex":["我明天把会议的地点发给你。","因为忘了发邮件，所以经理有点儿生气。","她每天都给妈妈发照片。","虽然我已经发了三次，但是他还没收到。","你到了以后，给我发一个信息。"]},{"id":"w656","word":"笔记本","pinyin":"bǐjìběn","level":3,"note":"笔记本电脑；也指写笔记的本子","qa":["你的笔记本电脑是什么时候买的？","你出门的时候会带笔记本吗？"],"ex":["我的笔记本太旧了，想买一个新的。","因为要开会，所以我带了笔记本。","她在笔记本上写了很多汉字。","虽然这个笔记本有点儿贵，但是很好用。","如果笔记本没电了，会议就开不了了。"]},{"id":"w657","word":"声音","pinyin":"shēngyīn","level":3,"note":"耳朵能听到的东西","qa":["你喜欢什么声音？不喜欢什么声音？","你觉得谁的声音最好听？"],"ex":["她的声音很好听，大家都喜欢听她唱歌。","因为外面的声音太大，所以我睡不着。","请你说话的声音小一点儿。","虽然电话里的声音不太清楚，但是我听懂了。","我听到门外有声音，好像有人来了。"]},{"id":"w658","word":"看来","pinyin":"kànlái","level":3,"note":"根据看到的情况来判断","qa":["看来今天要下雨，你带伞了吗？","看来你最近很忙，在忙什么呢？"],"ex":["天越来越黑了，看来要下雨了。","他今天没来上课，看来是生病了。","看来这个问题很难，我们得问问老师。","你笑得这么开心，看来考得不错。","因为路上车太多，看来我们要迟到了。"]},{"id":"w659","word":"办法","pinyin":"bànfǎ","level":3,"note":"解决问题的方法","qa":["你有什么学汉语的好办法？","遇到问题的时候，你会怎么想办法？"],"ex":["别着急，我们一起想办法。","因为没有别的办法，所以我们只能走路回家。","这个办法很好，我们就这么做吧。","虽然这个办法有点儿难，但是很有用。","如果你有好办法，请告诉我。"]},{"id":"w660","word":"只能","pinyin":"zhǐnéng","level":3,"note":"只可以，没有别的选择","qa":["如果你只能带一样东西去旅游，你会带什么？","如果你只能学一种外语，你会选什么？"],"ex":["因为下雨了，所以我们只能在家看电视。","没有车了，我们只能走路回家。","我只能在这儿等你十分钟。","虽然我很想去，但是只能下次了。","这个问题只能问经理了。"]},{"id":"w661","word":"别人","pinyin":"biérén","level":3,"note":"自己以外的人","qa":["你觉得帮助别人重要吗？为什么？","你遇到问题的时候，会请别人帮忙吗？"],"ex":["别人说话的时候，要认真听。","因为他常常帮助别人，所以大家都很喜欢他。","这是别人的东西，你不要拿。","虽然别人都去了，但是我不想去。","请你小声一点儿，不要影响别人休息。"]},{"id":"w662","word":"请假","pinyin":"qǐngjià","level":3,"note":"请求不上班或不上课","qa":["你一般什么时候会请假？","你请假最长的一次是多长时间？"],"ex":["我感冒了，今天要跟经理请假。","因为孩子生病了，所以她请假回家了。","他请假去医院看病了。","虽然工作很忙，但是经理还是让我请假了。","如果你明天想请假，今天要告诉老师。"]},{"id":"w663","word":"休假","pinyin":"xiūjià","level":3,"note":"按规定不上班，休息一段时间","qa":["你休假的时候，最想去哪儿？","你们公司一年可以休假几天？"],"ex":["经理下个星期休假，不在公司。","因为工作太累了，所以他想休假一个月。","休假的时候，我们去了海边。","虽然休假了，但是他还常常看邮件。","我打算休假的时候去中国旅游。"]},{"id":"w664","word":"怕","pinyin":"pà","level":3,"note":"害怕；担心","qa":["你最怕什么？为什么？","你小时候怕黑吗？现在还怕吗？"],"ex":["我妹妹很怕狗，看见狗就跑。","因为怕迟到，所以他六点就起床了。","别怕，我一直在你身边。","虽然我有点儿怕，但是还是去试了试。","我怕你忘了，所以又给你打了个电话。"]},{"id":"w665","word":"邮箱","pinyin":"yóuxiāng","level":3,"note":"电子邮件的地址；也指寄信的箱子","qa":["你每天看几次邮箱？","你有几个邮箱？常用哪个？"],"ex":["请把你的邮箱告诉我。","因为邮箱里的邮件太多，所以我找不到那一封了。","我已经把文件发到你的邮箱了。","虽然我每天看邮箱，但是没看到你的邮件。","你打开邮箱看一下，有一封新邮件。"]},{"id":"w666","word":"愿意","pinyin":"yuànyì","level":3,"note":"心里同意、乐意做某事","qa":["你愿意一个人去国外生活吗？为什么？","如果朋友请你帮忙，你愿意吗？"],"ex":["我很愿意帮助你，你别客气。","因为他愿意学习，所以汉语提高得很快。","她不愿意一个人去，想和朋友一起去。","虽然工作很累，但是他很愿意做。","如果你愿意，我们明天可以一起去。"]},{"id":"w667","word":"城市","pinyin":"chéngshì","level":3,"note":"人口多、有很多房子和商店的地方","qa":["你最喜欢的城市是哪个？为什么？","你觉得住在大城市好还是小城市好？"],"ex":["北京是一个很大的城市。","因为这个城市的环境很好，所以很多人想住在这里。","我想去中国的很多城市旅游。","虽然这个城市不大，但是很漂亮。","他从小在这个城市长大。"]},{"id":"w668","word":"机会","pinyin":"jīhuì","level":3,"note":"合适的时候、好的时候","qa":["如果有机会，你最想去哪个国家？","你觉得学汉语能给你带来什么机会？"],"ex":["这是一个很好的机会，你要好好准备。","因为有机会去中国，所以他很高兴。","我希望以后有机会再来这里。","虽然这次没去成，但是以后还有很多机会。","有机会的话，我们一起去旅游吧。"]},{"id":"w669","word":"生活","pinyin":"shēnghuó","level":3,"note":"人每天的吃住、工作、学习等；也指过日子","qa":["你在中国的生活怎么样？习惯吗？","你觉得你现在的生活和以前有什么不一样？"],"ex":["我在这里生活得很好，你不用担心。","因为工作很忙，所以他的生活很简单。","我很喜欢这个城市的生活。","虽然生活不太容易，但是她每天都很开心。","他们在一起生活了很多年。"]},{"id":"w670","word":"或","pinyin":"huò","level":3,"note":"或者（多用于书面语）","qa":["你周末一般看书或运动吗？"],"ex":["你可以今天或明天来找我。","我们坐高铁或飞机去都可以。","每天早上我喝一杯牛奶或咖啡。","有问题可以打电话或发邮件。","这件事你去或他去都行。"]},{"id":"w671","word":"街","pinyin":"jiē","level":3,"note":"城市里两边有房子的路","qa":["你家附近的街上有什么商店？","周末你喜欢去街上走一走吗？"],"ex":["这条街上有很多饭店。","因为街上人太多了，所以我们去公园了。","我家就在学校后面的那条街上。","虽然这条街不大，但是很干净。","晚上的街上很漂亮，到处都是灯。"]},{"id":"w672","word":"开花","pinyin":"kāihuā","level":3,"note":"花朵张开","qa":["你最喜欢什么花？它什么时候开花？","你家有没有会开花的树？"],"ex":["春天到了，公园里的树都开花了。","因为天气越来越热，所以这些树都开花了。","这种树每年四月开花。","虽然开花的时间不长，但是非常漂亮。","妈妈种的那些花终于开花了。"]},{"id":"w673","word":"船","pinyin":"chuán","level":3,"note":"在水上走的交通工具","qa":["你坐过船吗？是在哪儿坐的？","你觉得坐船旅游有意思吗？"],"ex":["我们在公园里坐船，玩得很开心。","因为风太大了，所以船不能开。","这条船很大，能坐很多人。","虽然坐船比较慢，但是可以看很多风景。","他第一次坐船，有点儿紧张。"]},{"id":"w674","word":"工作日","pinyin":"gōngzuòrì","level":3,"note":"要上班的日子（一般是星期一到星期五）","qa":["工作日的时候，你几点起床？","你觉得工作日和周末，哪个更累？"],"ex":["工作日我每天八点上班。","因为是工作日，所以地铁上的人很多。","工作日的时候，我很少做饭。","虽然今天是工作日，但是我请假了。","这家银行只在工作日开门。"]},{"id":"w675","word":"刮","pinyin":"guā","level":3,"note":"（风）吹起来","qa":["你们那儿什么季节常常刮风？","刮大风的时候，你还会出门吗？"],"ex":["外面刮大风了，你多穿点儿衣服。","因为刮风，所以今天我们没有去爬山。","春天这里常常刮风。","虽然外面在刮风，但是一点儿也不冷。","风刮得很大，树都在动。"]},{"id":"w676","word":"风","pinyin":"fēng","level":3,"note":"流动的空气","qa":["你喜欢刮风的天气吗？为什么？","你们那儿冬天的风大不大？"],"ex":["今天风很大，我们别去海边了。","因为有风，所以今天很凉快。","秋天的风很凉快，很舒服。","虽然风很大，但是他还是去跑步了。","风太大了，我的伞都坏了。"]},{"id":"w677","word":"新闻","pinyin":"xīnwén","level":3,"note":"最近发生的新的事情的报道","qa":["你每天看新闻吗？一般看什么新闻？","最近有什么新闻让你很关注？"],"ex":["爸爸每天晚上都看新闻。","因为看了新闻，所以我知道明天会下雨。","这个新闻很重要，大家都在说。","虽然我不常看新闻，但是也知道这件事。","我在手机上看到了一个有意思的新闻。"]},{"id":"w678","word":"借","pinyin":"jiè","level":3,"note":"暂时用别人的东西；也指把东西暂时给别人用","qa":["你借过朋友的什么东西？","别人跟你借钱的时候，你会借吗？"],"ex":["我没带伞，可以借你的伞吗？","因为忘了带笔，所以我借了同学的笔。","我从图书馆借了三本书。","虽然他借了我的钱，但是很快就还给我了。","如果你需要，我可以借给你。"]},{"id":"w679","word":"雨衣","pinyin":"yǔyī","level":3,"note":"下雨时穿的衣服","qa":["下雨的时候，你穿雨衣还是打伞？","你有雨衣吗？是什么颜色的？"],"ex":["外面下雨了，孩子们都穿上了雨衣。","因为骑自行车，所以他穿雨衣，不打伞。","我的雨衣是黄色的，很好看。","虽然雨衣不太好看，但是很有用。","出门的时候别忘了带雨衣。"]},{"id":"w680","word":"变","pinyin":"biàn","level":3,"note":"和原来不一样了","qa":["你觉得你的城市这几年变了吗？","你来中国以后，自己有什么变了？"],"ex":["天变冷了，多穿点儿衣服。","因为很久没见，所以他变得我都不认识了。","这个城市变了很多，越来越漂亮了。","虽然工作变了，但是我们还是好朋友。","她的汉语变得越来越好了。"]},{"id":"w681","word":"冬天","pinyin":"dōngtiān","level":3,"note":"一年里最冷的季节","qa":["你们那儿的冬天冷不冷？","冬天的时候，你喜欢做什么？"],"ex":["冬天到了，天气越来越冷。","因为冬天太冷了，所以我不想出门。","这里的冬天不太冷，很舒服。","虽然是冬天，但是今天一点儿也不冷。","冬天的时候，我喜欢喝热茶。"]},{"id":"w682","word":"常常","pinyin":"chángcháng","level":3,"note":"很多次、经常","qa":["你常常做什么运动？","周末你常常和谁一起玩？"],"ex":["我常常去图书馆看书。","因为他常常锻炼，所以身体很好。","这里夏天常常下雨。","虽然她很忙，但是常常给妈妈打电话。","我小时候常常和哥哥一起踢足球。"]},{"id":"w683","word":"关注","pinyin":"guānzhù","level":3,"note":"关心、注意（某个人或某件事）","qa":["你最近在关注什么新闻？","你在网上关注了哪些人？"],"ex":["最近大家都在关注天气的变化。","因为很关注健康，所以她每天都锻炼。","我在网上关注了很多中国的老师。","虽然他不太关注新闻，但是知道这件事。","这个运动员受到了很多人的关注。"]},{"id":"w684","word":"四季","pinyin":"sìjì","level":3,"note":"春、夏、秋、冬四个季节","qa":["你们国家四季的变化大吗？","你最喜欢四季里的哪一个？"],"ex":["北京四季都很漂亮。","因为这里四季都很热，所以没有冬天。","一年有四季：春天、夏天、秋天和冬天。","虽然四季的天气不一样，但是每个季节都有意思。","这个城市四季都有很多游客。"]},{"id":"w685","word":"凉快","pinyin":"liángkuai","level":3,"note":"天气不热，让人舒服","qa":["夏天的时候，你觉得哪里最凉快？","你觉得几月的天气最凉快？"],"ex":["刮风以后，天气凉快多了。","因为这里有很多树，所以很凉快。","秋天到了，天气越来越凉快了。","虽然外面很热，但是房间里很凉快。","晚上比白天凉快，我们晚上出去吧。"]},{"id":"w686","word":"秋天","pinyin":"qiūtiān","level":3,"note":"一年里夏天以后、冬天以前的季节","qa":["你们那儿的秋天是什么样的？","秋天的时候，你最喜欢吃什么水果？"],"ex":["秋天是北京最漂亮的季节。","因为秋天不冷也不热，所以我最喜欢秋天。","秋天到了，树上的叶子都变黄了。","虽然是秋天，但是今天还是很热。","秋天的时候，我们常常去爬山。"]},{"id":"w687","word":"叶子","pinyin":"yèzi","level":3,"note":"树和草上长的绿色的片","qa":["秋天的时候，你们那儿的叶子是什么颜色的？","你觉得哪种树的叶子最漂亮？"],"ex":["秋天到了，叶子都变成了黄色。","因为刮大风，所以地上都是叶子。","这种树的叶子很大，像一把伞。","虽然是冬天，但是这些树的叶子还是绿的。","孩子们在公园里找漂亮的叶子。"]},{"id":"w688","word":"变成","pinyin":"biànchéng","level":3,"note":"变得和原来不一样，成为另一种样子","qa":["如果你能变成一种动物，你想变成什么？","你觉得你的城市以后会变成什么样？"],"ex":["秋天到了，叶子变成了黄色。","因为天气太冷了，所以水变成了冰。","他从一个小孩子变成了一个大学生。","虽然我们以前不认识，但是现在变成了好朋友。","这个小区以前是一个公园，后来变成了商场。"]},{"id":"w689","word":"请客","pinyin":"qǐngkè","level":3,"note":"请别人吃饭、玩，自己付钱","qa":["你最近一次请客是什么时候？请了谁？","在你的国家，吃饭的时候一般谁来请客？"],"ex":["今天我过生日，我请客，大家多吃点儿。","因为他找到了新工作，所以晚上他请客。","上次是你请客，这次我来吧。","虽然他很少请客，但是每次都很热情。","我们一起去吃饭吧，今天经理请客。"]},{"id":"w690","word":"做法","pinyin":"zuòfǎ","level":3,"note":"做事情、做东西的方法","qa":["你会做什么菜？可以说一说做法吗？","你觉得他的做法对不对？为什么？"],"ex":["这个菜的做法很简单。","因为做法不同，所以这两个菜吃起来不一样。","我觉得你的做法不太好。","虽然做法有点儿难，但是我想试一试。","妈妈把饺子的做法告诉了我。"]},{"id":"w691","word":"不同","pinyin":"bùtóng","level":3,"note":"不一样","qa":["你觉得中国和你们国家有什么不同？","你和你的好朋友有什么不同的爱好？"],"ex":["每个人的想法都不同。","因为季节不同，所以天气也不一样。","南方和北方的菜很不同。","虽然我们的爱好不同，但是我们是好朋友。","不同的城市有不同的文化。"]},{"id":"w692","word":"加","pinyin":"jiā","level":3,"note":"加上、增加","qa":["你喝咖啡的时候，喜欢加牛奶吗？","你觉得三加五是多少？"],"ex":["请在我的咖啡里加一点儿牛奶。","五加三是八，你算对了吗？","因为人太多了，所以我们又加了一张桌子。","虽然加了很多东西，但是这个菜还是不好吃。","如果你也想来，我就再加一个人。"]},{"id":"w693","word":"的话","pinyin":"dehuà","level":3,"note":"用在假设句的后面，常和“如果”一起用","qa":["如果明天下雨的话，你会做什么？","有时间的话，你最想去哪儿旅游？"],"ex":["如果你不舒服的话，就回家休息吧。","明天下雨的话，我们就不去爬山了。","有问题的话，你就给我打电话。","你喜欢的话，这本书就送给你。","方便的话，请你帮我拿一下行李。"]},{"id":"w694","word":"做客","pinyin":"zuòkè","level":3,"note":"到别人家去作客人","qa":["你喜欢去朋友家做客吗？为什么？","朋友来你家做客的时候，你会准备什么？"],"ex":["周末我去朋友家做客。","欢迎你来我家做客。","因为要去老师家做客，所以我买了一些水果。","虽然第一次去他家做客，但是一点儿也不紧张。","去别人家做客的时候，可以带一点儿礼物。"]},{"id":"w695","word":"邻居","pinyin":"línjū","level":3,"note":"住在旁边的人家","qa":["你认识你的邻居吗？你们关系怎么样？","你觉得好邻居应该是什么样的？"],"ex":["我的邻居是一位很热情的老人。","因为邻居常常帮助我们，所以我们关系很好。","我们和邻居一起过新年。","虽然我们是邻居，但是很少见面。","邻居送给我们一盘饺子。"]},{"id":"w696","word":"酒","pinyin":"jiǔ","level":3,"note":"用粮食、水果等做的、喝了会醉的饮料","qa":["你会喝酒吗？一般什么时候喝？","在你的国家，过节的时候喝什么酒？"],"ex":["爸爸晚上喜欢喝一点儿酒。","因为要开车，所以他今天不能喝酒。","这是朋友送给我的酒。","虽然他喜欢喝酒，但是从来不喝太多。","晚会上有很多饮料和酒。"]},{"id":"w697","word":"晚会","pinyin":"wǎnhuì","level":3,"note":"晚上举行的、有节目表演的聚会","qa":["你参加过什么晚会？有意思吗？","如果你们班开新年晚会，你想表演什么？"],"ex":["今天晚上学校有一个新年晚会。","因为要参加晚会，所以她穿了一条漂亮的裙子。","晚会上有很多好看的节目。","虽然晚会很晚才结束，但是大家都很开心。","我们在晚会上唱歌、跳舞，玩得很开心。"]},{"id":"w698","word":"礼物","pinyin":"lǐwù","level":3,"note":"送给别人的东西","qa":["你收到过最喜欢的礼物是什么？","朋友过生日的时候，你一般送什么礼物？"],"ex":["这是我给你买的生日礼物。","因为不知道送什么礼物，所以我问了她的朋友。","我去朋友家做客的时候，带了一些礼物。","虽然礼物不贵，但是他很喜欢。","新年的时候，爸爸妈妈给了我很多礼物。"]},{"id":"w699","word":"画家","pinyin":"huàjiā","level":3,"note":"以画画为工作的人","qa":["你知道哪些有名的画家？","如果你是画家，你想画什么？"],"ex":["我的邻居是一位画家。","因为她从小喜欢画画，所以后来成了画家。","这位画家的画很有名。","虽然他不是画家，但是画得很好。","画家在公园里画了一张画。"]},{"id":"w700","word":"盘子","pinyin":"pánzi","level":3,"note":"放菜、放水果的扁平器具","qa":["你家里的盘子是什么颜色的？","吃完饭以后，谁洗盘子？"],"ex":["请把盘子放在桌子上。","因为盘子太小了，所以放不下这么多菜。","她洗了很多盘子，有点儿累了。","虽然这个盘子很旧，但是很漂亮。","服务员拿来一个大盘子，里面有很多水果。"]},{"id":"w701","word":"一边","pinyin":"yìbiān","level":3,"note":"“一边……一边……”：两个动作同时进行","qa":["你喜欢一边吃饭一边看手机吗？","你会一边听音乐一边学习吗？"],"ex":["她一边听音乐，一边打扫房间。","我们一边吃饭，一边聊天儿。","因为他一边走路一边看手机，所以没看到前面的车。","虽然一边工作一边学习很累，但是他很努力。","孩子一边唱歌一边跳舞。"]},{"id":"w702","word":"聊天儿","pinyin":"liáotiānr","level":3,"note":"随便地说话、谈天","qa":["你喜欢和谁聊天儿？一般聊什么？","你喜欢在手机上聊天儿还是见面聊天儿？"],"ex":["我们一边喝茶，一边聊天儿。","因为很久没见了，所以我们聊天儿聊了很长时间。","上课的时候不要聊天儿。","虽然我们住得很远，但是常常在网上聊天儿。","晚会以后，大家坐在一起聊天儿。"]},{"id":"w703","word":"来自","pinyin":"láizì","level":3,"note":"从某个地方来","qa":["你来自哪个国家？那里有什么有名的东西？","你们班的同学都来自哪里？"],"ex":["我来自越南，现在在北京学习汉语。","我们班的同学来自很多不同的国家。","因为他来自南方，所以不太习惯北方的冬天。","虽然他们来自不同的城市，但是成了好朋友。","这位老师来自北京。"]},{"id":"w704","word":"夫妻","pinyin":"fūqī","level":3,"note":"丈夫和妻子","qa":["你觉得一对好夫妻应该是什么样的？","在你的国家，夫妻结婚以后一般住在哪儿？"],"ex":["这对夫妻结婚已经二十年了。","因为夫妻两个人都很忙，所以常常吃外卖。","我的邻居是一对年轻的夫妻。","虽然他们是夫妻，但是爱好很不一样。","这对夫妻常常一起去旅游。"]},{"id":"w705","word":"直到","pinyin":"zhídào","level":3,"note":"一直到（某个时间）","qa":["你昨天学习直到几点？","你小时候直到几岁才学会骑自行车？"],"ex":["他一直工作，直到晚上十点才回家。","我们等了很久，直到下午他才来。","直到今天，我还记得那一天。","因为太累了，所以他直到中午才起床。","虽然她学了很久，但是直到现在还说不好。"]},{"id":"w706","word":"感到","pinyin":"gǎndào","level":3,"note":"心里觉得","qa":["你什么时候会感到很开心？","第一次来中国的时候，你感到怎么样？"],"ex":["考试考得很好，她感到非常高兴。","因为一个人住，所以他有时候感到有点儿难过。","我对这里的生活感到很满意。","虽然工作很累，但是我感到很开心。","第一次在很多人面前表演，他感到有点儿紧张。"]},{"id":"w707","word":"东方","pinyin":"dōngfāng","level":3,"note":"东边；也指亚洲一带","qa":["你觉得东方文化和西方文化有什么不同？","你对东方的哪个国家最感兴趣？"],"ex":["每天早上，太阳从东方出来。","因为他对东方文化很感兴趣，所以来中国学习。","这家饭店有很多东方的菜。","虽然他来自西方，但是很喜欢东方的音乐。","中国在世界的东方。"]},{"id":"w708","word":"文化","pinyin":"wénhuà","level":3,"note":"一个国家、地方的生活习惯、艺术、历史等","qa":["你对中国文化的哪一方面最感兴趣？","你觉得学习一个国家的文化重要吗？为什么？"],"ex":["我对中国文化很感兴趣。","因为想了解中国文化，所以他来中国学习汉语。","每个国家都有自己的文化。","虽然文化不同，但是我们可以成为好朋友。","老师给我们介绍了中国的节日文化。"]},{"id":"w709","word":"词典","pinyin":"cídiǎn","level":3,"note":"查词的意思和用法的书","qa":["你学汉语的时候常用词典吗？用哪种？","遇到不认识的字，你会查词典吗？"],"ex":["遇到不认识的词，我就查词典。","因为这本词典很好用，所以我每天都带着。","我在图书馆借了一本汉语词典。","虽然手机上也有词典，但是我更喜欢用书。","这本词典是老师送给我的。"]},{"id":"w710","word":"最好","pinyin":"zuìhǎo","level":3,"note":"最合适的做法是……（提建议）；也表示最好的","qa":["你觉得学汉语最好每天学多长时间？","你觉得周末最好做什么？为什么？"],"ex":["天气很冷，你最好多穿点儿衣服。","明天有考试，你最好早一点儿睡觉。","因为路上车多，所以你们最好早点儿出门。","如果不舒服，你最好去医院看看。","这是我吃过的最好吃的饺子。"]},{"id":"w711","word":"节","pinyin":"jié","level":3,"note":"第14课：量词，一节课（分成段的东西）｜第18课：节日（过节、春节）","qa":["你今天有几节课？都是什么课？","你最喜欢哪节课？为什么？","---","你们国家最重要的节是什么？","过节的时候，你们家一般做什么？"],"ex":["我们今天上午有三节汉语课。","因为下午第一节是体育课，所以我带了运动鞋。","这节课老师讲得很有意思。","虽然一节课只有四十五分钟，但是我们学了很多。","下一节课在三楼，别走错了。","---","过节的时候，我们全家人一起吃饭。","春节是中国最重要的节日。","因为要过节了，所以超市里的人特别多。","虽然他在国外，但是过节的时候一定给家里打电话。","中秋节的时候，大家一起看月亮。"],"lessons":[14,18]},{"id":"w712","word":"图书馆","pinyin":"túshūguǎn","level":3,"note":"放很多书、可以借书看书的地方","qa":["你常去图书馆吗？一般在那里做什么？","你们学校的图书馆大不大？"],"ex":["我常去图书馆看书。","因为图书馆很安静，所以我喜欢在那里学习。","我从图书馆借了一本词典。","虽然图书馆有点儿远，但是我每天都去。","图书馆晚上十点关门。"]},{"id":"w713","word":"被","pinyin":"bèi","level":3,"note":"介词，用在被动句里（我的书被他拿走了）","qa":["你的东西被别人拿错过吗？","你小时候被爸爸妈妈说过什么？"],"ex":["我的自行车被人骑走了。","我的蛋糕被弟弟吃了。","因为刮大风，所以我的伞被风刮坏了。","虽然他被老师说了，但是一点儿也不生气。","这本书被很多人借过。"]},{"id":"w714","word":"名人","pinyin":"míngrén","level":3,"note":"很有名的人","qa":["你最喜欢哪个名人？为什么？","你见过名人吗？在哪儿见的？"],"ex":["我在机场看到了一个名人。","因为他是名人，所以很多人认识他。","这个城市出了很多名人。","虽然她是名人，但是对大家很热情。","很多名人都来这家饭店吃过饭。"]},{"id":"w715","word":"故事","pinyin":"gùshi","level":3,"note":"讲出来的事情，可以是真的，也可以是编的","qa":["你小时候最喜欢听什么故事？","你能给大家讲一个有意思的故事吗？"],"ex":["妈妈每天晚上给我讲故事。","因为这个故事很有意思，所以孩子们都喜欢听。","这本书里有很多中国故事。","虽然这个故事很长，但是大家听得很认真。","爷爷给我们讲了一个他小时候的故事。"]},{"id":"w716","word":"然后","pinyin":"ránhòu","level":3,"note":"表示接着做下一件事","qa":["你早上起床以后先做什么，然后做什么？","下课以后，你一般先做什么，然后做什么？"],"ex":["我们先去吃饭，然后去看电影。","他先做完了作业，然后出去玩了。","你先往前走，然后在路口往左。","因为下雨了，所以我们先在家等一会儿，然后再出去。","她先打扫了房间，然后开始做饭。"]},{"id":"w717","word":"报纸","pinyin":"bàozhǐ","level":3,"note":"每天或定期出版、登新闻的纸","qa":["你看报纸吗？还是在手机上看新闻？","你家里有人每天看报纸吗？"],"ex":["爷爷每天早上都看报纸。","因为现在大家都用手机看新闻，所以看报纸的人少了。","这张报纸上有一个很有意思的新闻。","虽然我不常看报纸，但是今天买了一张。","我把报纸放在桌子上了。"]},{"id":"w718","word":"忘记","pinyin":"wàngjì","level":3,"note":"不记得了","qa":["你最近忘记过什么重要的事情吗？","你觉得怎么做才能不忘记学过的汉字？"],"ex":["我忘记带手机了，你能等我一下吗？","因为忘记了时间，所以他迟到了。","我不会忘记你对我的帮助。","虽然很多年没见，但是我没有忘记她。","出门的时候别忘记关灯。"]},{"id":"w719","word":"电子书","pinyin":"diànzǐshū","level":3,"note":"在手机、电脑上看的书","qa":["你喜欢看电子书还是纸的书？为什么？","你手机里有多少本电子书？"],"ex":["我喜欢在手机上看电子书。","因为电子书很方便，所以我坐地铁的时候常常看。","这本电子书很便宜，只要五块钱。","虽然电子书很方便，但是我更喜欢纸的书。","我一个月看了三本电子书。"]},{"id":"w720","word":"女生","pinyin":"nǚshēng","level":3,"note":"女学生；也泛指年轻女子","qa":["你们班有几个女生？","你觉得女生和男生喜欢的东西一样吗？"],"ex":["我们班的女生都喜欢唱歌。","这个女生汉语说得非常好。","因为女生比较多，所以我们班的晚会节目很多。","虽然她是女生，但是足球踢得很好。","女生们在图书馆里一起学习。"]},{"id":"w721","word":"表演","pinyin":"biǎoyǎn","level":3,"note":"在大家面前唱歌、跳舞、演节目等","qa":["你会表演什么节目？","你最喜欢看什么表演？为什么？"],"ex":["晚会上，她表演了一个中国舞。","因为要表演节目，所以他们练习了很久。","这个表演非常好看，大家都很喜欢。","虽然第一次表演，但是她一点儿也不紧张。","孩子们在学校里表演了一个故事。"]},{"id":"w722","word":"怎么办","pinyin":"zěnmebàn","level":3,"note":"该怎么做（遇到问题时问）","qa":["如果你的手机丢了，你会怎么办？","考试没考好的时候，你一般怎么办？"],"ex":["我的护照丢了，怎么办？","下雨了，我们没带伞，怎么办？","因为不知道怎么办，所以他去问老师。","如果明天还下雨，我们怎么办？","虽然问题很难，但是我们知道该怎么办。"]},{"id":"w723","word":"校长","pinyin":"xiàozhǎng","level":3,"note":"学校里最高的领导","qa":["你们学校的校长是什么样的人？","如果你是校长，你想让学校有什么变化？"],"ex":["我们校长是一位很热情的老师。","因为校长要来听课，所以老师有点儿紧张。","校长在晚会上讲了几句。","虽然校长很忙，但是常常和学生聊天儿。","新校长来自北京，说话很有意思。"]},{"id":"w724","word":"面前","pinyin":"miànqián","level":3,"note":"面对着的地方、跟前","qa":["你在很多人面前说汉语会紧张吗？","你在老师面前会不会不好意思？"],"ex":["他在大家面前唱了一个中文歌。","因为在很多人面前说话，所以她有点儿紧张。","我的面前有一杯热茶。","虽然他在老师面前很安静，但是平时很爱说话。","问题就在你面前，你要自己解决。"]},{"id":"w725","word":"有些","pinyin":"yǒuxiē","level":3,"note":"一部分；也表示有一点儿","qa":["你们班有些同学喜欢什么运动？","你觉得有些人为什么不喜欢运动？"],"ex":["有些人喜欢喝茶，有些人喜欢喝咖啡。","今天有些冷，你多穿点儿衣服。","因为有些问题还没解决，所以我们明天再开会。","虽然有些汉字很难写，但是我每天都练习。","这个城市有些地方很漂亮。"]},{"id":"w726","word":"相信","pinyin":"xiāngxìn","level":3,"note":"认为是真的、对的","qa":["你最相信的人是谁？为什么？","你相信自己能学好汉语吗？"],"ex":["我相信你一定能做好。","因为他是我的好朋友，所以我相信他。","你相信我，这件事不是我做的。","虽然很多人不相信，但是这是真的。","老师说只要努力就能学好，我相信老师。"]},{"id":"w727","word":"新年","pinyin":"xīnnián","level":3,"note":"新的一年的开始","qa":["新年的时候，你们家一般做什么？","新年你有什么打算？"],"ex":["新年快乐！希望你身体健康！","因为新年要到了，所以超市里的人很多。","新年的时候，我们全家人一起吃饭。","虽然新年不能回家，但是我给家人打了电话。","我们在学校开了一个新年晚会。"]},{"id":"w728","word":"班级","pinyin":"bānjí","level":3,"note":"学校里的班","qa":["你们班级有多少个学生？","你觉得你们班级怎么样？"],"ex":["我们班级一共有二十个学生。","因为我们班级的同学关系很好，所以大家常常一起玩。","这次比赛我们班级得了第一名。","虽然班级不大，但是很有意思。","每个班级都准备了一个节目。"]},{"id":"w729","word":"跳","pinyin":"tiào","level":3,"note":"两脚用力离开地面；跳舞","qa":["你会跳舞吗？喜欢跳什么舞？","你觉得小猫能跳多高？"],"ex":["她一边唱歌，一边跳舞。","因为太高兴了，所以孩子跳了起来。","小猫从桌子上跳了下来。","虽然他跳得不高，但是跑得很快。","路上有水，你跳过去吧。"]},{"id":"w730","word":"留学生","pinyin":"liúxuéshēng","level":3,"note":"到外国学习的学生","qa":["你们学校有很多留学生吗？都来自哪儿？","你觉得做留学生最难的是什么？"],"ex":["我是来自越南的留学生。","因为学校有很多留学生，所以大家会说很多国家的话。","留学生们一起去参加了新年晚会。","虽然是留学生，但是他的汉语说得非常好。","这个留学生对中国文化很感兴趣。"]},{"id":"w731","word":"一块儿","pinyin":"yíkuàir","level":3,"note":"一起（口语）","qa":["周末你喜欢和谁一块儿出去玩？","你愿意和朋友一块儿去旅游吗？"],"ex":["我们一块儿去吃饭吧。","因为我们住得很近，所以常常一块儿上学。","下课以后，大家一块儿去打篮球。","虽然我们不在一块儿工作，但是常常见面。","我和妈妈一块儿去超市买东西。"]},{"id":"w732","word":"网站","pinyin":"wǎngzhàn","level":3,"note":"网上的页面、地址","qa":["你平时常上什么网站？为什么？","你学汉语的时候会用什么网站？"],"ex":["我在这个网站上买了一本书。","因为这个网站很好用，所以很多人都用。","你可以在学校的网站上找到考试时间。","虽然这个网站是中文的，但是我能看懂。","我把这个网站发给你了。"]},{"id":"w733","word":"视频","pinyin":"shìpín","level":3,"note":"网上、手机上看的影像节目","qa":["你每天看多长时间视频？","你喜欢看什么视频？"],"ex":["我喜欢在手机上看视频。","因为这个视频很有意思，所以我看了很多遍。","他每天都在网上发视频。","虽然看视频很有意思，但是不能看太久。","老师给我们看了一个中国文化的视频。"]},{"id":"w734","word":"点","pinyin":"diǎn","level":3,"note":"小的圆形痕迹、标记（地图上的红点）","qa":["你在地图上找过自己的家吗？是一个什么样的点？","你会在地图上画红点，记下想去的地方吗？"],"ex":["地图上的这个红点，就是我们现在的地方。","因为衣服上有一个黑点，所以我想换一件。","老师在黑板上画了几个点。","虽然只是一个小红点，但是一眼就能看到。","你看，地图上红点最多的地方，游客也最多。"]},{"id":"w735","word":"蓝","pinyin":"lán","level":3,"note":"像晴天的天空那样的颜色","qa":["你喜欢蓝色吗？你有什么蓝色的东西？","你觉得什么时候的天最蓝？"],"ex":["今天的天特别蓝，一点儿风也没有。","因为她喜欢蓝色，所以买了一条蓝裙子。","海水很蓝，也很干净。","虽然这件衣服是蓝的，但是看起来有点儿旧。","秋天的天空又高又蓝。"]},{"id":"w736","word":"段","pinyin":"duàn","level":3,"note":"量词，用于路、时间、话等的一部分","qa":["你每天要走一段路去上学吗？要多久？","你最难忘的是哪一段时间？"],"ex":["这段路车很多，你开车要小心。","因为这段时间工作很忙，所以我没有去旅游。","我们一起走了一段路，聊了很多。","虽然这段话不长，但是我读了好几遍。","那段时间是我最开心的时候。"]},{"id":"w737","word":"马路","pinyin":"mǎlù","level":3,"note":"城市里车走的大路","qa":["你过马路的时候会注意什么？","你家门口的马路车多不多？"],"ex":["过马路的时候，一定要看红绿灯。","因为马路上车太多，所以我们走得很慢。","马路对面有一家超市。","虽然这条马路不大，但是车很多。","孩子们不能在马路上玩。"]},{"id":"w738","word":"平时","pinyin":"píngshí","level":3,"note":"一般的时候，平常","qa":["你平时几点起床？周末呢？","你平时下班以后做什么？"],"ex":["我平时七点起床，周末会晚一点儿。","因为平时工作太忙，所以周末我只想休息。","他平时很少说话，今天说了很多。","虽然平时不太锻炼，但是他身体很好。","这家饭店平时人不多，周末人很多。"]},{"id":"w739","word":"放学","pinyin":"fàngxué","level":3,"note":"学校一天的课上完了，学生回家","qa":["你小时候放学以后一般做什么？","放学以后，谁来学校接你？"],"ex":["放学以后，我们一起去打篮球吧。","因为今天放学很早，所以我去超市买东西了。","妈妈每天下午四点来学校接我放学。","虽然已经放学了，但是他还在教室里写作业。","放学的时候，学校门口有很多家长。"]},{"id":"w740","word":"老人","pinyin":"lǎorén","level":3,"note":"年纪大的人","qa":["你觉得我们应该怎么照顾老人？","在你的国家，老人们平时喜欢做什么？"],"ex":["公园里有很多老人在锻炼身体。","因为爷爷是老人了，所以我们常常去看他。","坐公交车的时候，要让老人先坐。","虽然他是老人，但是每天都去爬山。","这位老人在这个小区住了很多年。"]},{"id":"w741","word":"根据","pinyin":"gēnjù","level":3,"note":"按照、依照","qa":["你一般根据什么来选饭店？","你会根据天气决定穿什么衣服吗？"],"ex":["根据天气，我们决定明天去爬山。","我们要根据自己的水平选择书。","因为根据地图找不到路，所以我们问了别人。","虽然根据老师的方法练习了，但是我还是说不好。","这个故事是根据真的事情写的。"]},{"id":"w742","word":"可是","pinyin":"kěshì","level":3,"note":"但是（表示转折）","qa":["你有没有很想做、可是没有时间做的事？"],"ex":["我很想去，可是没有时间。","这件衣服很漂亮，可是太贵了。","他说他会来，可是一直没来。","我给他打电话了，可是他没接。","外面很冷，可是孩子们还在外面玩。"]},{"id":"w743","word":"以上","pinyin":"yǐshàng","level":3,"note":"比某个数量多；上面说的这些","qa":["你们班十八岁以上的同学多吗？","你每天学习一个小时以上吗？"],"ex":["每天晚上我都学习一个小时以上。","因为参加的人在一百个以上，所以比赛开了一天。","十八岁以上的人才能开车。","以上就是我今天要说的。","虽然这本书有三百页以上，但是我很快就看完了。"]},{"id":"w744","word":"有名","pinyin":"yǒumíng","level":3,"note":"名字大家都知道","qa":["你们国家有什么有名的地方？","你觉得哪个中国菜最有名？"],"ex":["北京有很多有名的景点。","因为这家饭店很有名，所以人特别多。","他是一位很有名的画家。","虽然这个地方不太有名，但是非常漂亮。","这里有一条很有名的街。"]},{"id":"w745","word":"景点","pinyin":"jǐngdiǎn","level":3,"note":"风景好、游客去看的地方","qa":["你最想去中国的哪个景点？","你去旅游的时候，喜欢去有名的景点吗？"],"ex":["这个城市有很多有名的景点。","因为是周末，所以景点里的游客特别多。","我们一天去了三个景点，有点儿累了。","虽然这个景点不大，但是很漂亮。","你可以在网上看一看这里有哪些景点。"]},{"id":"w746","word":"游客","pinyin":"yóukè","level":3,"note":"来旅游的人","qa":["你觉得游客多的地方好玩吗？","你们城市哪里的游客最多？"],"ex":["夏天海边有很多游客。","因为游客太多了，所以我们等了很久。","这些游客来自很多不同的国家。","虽然游客很多，但是这里还是很干净。","很多游客在这里拍照。"]},{"id":"w747","word":"外地","pinyin":"wàidì","level":3,"note":"自己住的地方以外的地方","qa":["你在外地生活过吗？在哪儿？","外地的朋友来你的城市，你会带他去哪儿？"],"ex":["我是外地人，不太了解这里。","因为在外地工作，所以他很少回家。","很多外地游客来北京旅游。","虽然她在外地上大学，但是常常给家里打电话。","春节的时候，在外地的人都回家了。"]},{"id":"w748","word":"聊","pinyin":"liáo","level":3,"note":"随便地说话、谈天","qa":["你和好朋友见面的时候一般聊什么？","你喜欢和谁聊中国文化？"],"ex":["我们聊了很长时间，都忘了吃饭。","因为很久没见了，所以我们一直在聊。","有时间的话，我们一起喝茶聊一聊吧。","虽然我们聊得不多，但是很开心。","他们在聊明天的比赛。"]},{"id":"w749","word":"河","pinyin":"hé","level":3,"note":"天然的大水道","qa":["你家附近有河吗？大不大？","你喜欢在河边走一走吗？"],"ex":["我家门口有一条小河。","因为河水很干净，所以很多孩子在河里玩。","我们一边在河边走，一边聊天儿。","虽然这条河不大，但是很漂亮。","冬天的时候，河上有很多冰。"]},{"id":"w750","word":"关系","pinyin":"guānxi","level":3,"note":"人和人、事和事之间的联系","qa":["你和你的邻居关系怎么样？","你觉得怎么做才能和同事有好的关系？"],"ex":["我和同学们的关系都很好。","因为工作的关系，他常常去外地。","这件事和我没有关系。","虽然他们是邻居，但是关系不太好。","你们两个是什么关系？"]},{"id":"w751","word":"养","pinyin":"yǎng","level":3,"note":"照顾动物、植物，让它生长","qa":["你养过什么动物吗？","你觉得在家里养猫好还是养狗好？"],"ex":["我家养了一只小猫。","因为妈妈喜欢花，所以家里养了很多花。","养狗要每天带它出去走一走。","虽然养猫很有意思，但是也要花很多时间。","爷爷在家养了几只鸟。"]},{"id":"w752","word":"西北","pinyin":"xīběi","level":3,"note":"西和北之间的方向；也指中国的西北地区","qa":["你去过中国的西北吗？","你觉得西北和南方有什么不一样？"],"ex":["中国的西北有很大的草原。","因为西北常常刮风，所以要多带衣服。","我打算明年去西北旅游。","虽然西北的冬天很冷，但是风景很漂亮。","学校在城市的西北，离我家有点儿远。"]},{"id":"w753","word":"经过","pinyin":"jīngguò","level":3,"note":"从某个地方过去；通过（某个过程）","qa":["你每天上学的时候会经过什么地方？","你觉得经过努力，能学好汉语吗？"],"ex":["我每天上班都会经过这个公园。","因为经过了很多练习，所以他的汉语提高了很多。","从家到学校要经过三个路口。","虽然经过了很长时间，但是我还记得那件事。","经过这家店的时候，我买了一杯奶茶。"]},{"id":"w754","word":"草地","pinyin":"cǎodì","level":3,"note":"长满草的地方","qa":["你喜欢坐在草地上休息吗？","你们学校有草地吗？"],"ex":["孩子们在草地上跑来跑去。","因为天气很好，所以我们在草地上吃饭。","公园里有一大片草地，非常漂亮。","虽然草地很漂亮，但是不能在上面踢球。","我们坐在草地上聊天儿。"]},{"id":"w755","word":"遇见","pinyin":"yùjiàn","level":3,"note":"没想到地见到","qa":["你在路上遇见过好久不见的朋友吗？","你最想遇见哪个名人？"],"ex":["我在超市遇见了我的老师。","因为在路上遇见了朋友，所以我回家晚了。","我没想到会在这里遇见你。","虽然只遇见过一次，但是我还记得她。","昨天在公园遇见了一只很可爱的小狗。"]},{"id":"w756","word":"脏","pinyin":"zāng","level":3,"note":"不干净","qa":["你的房间脏了，一般多久打扫一次？","你觉得家里什么地方最容易脏？"],"ex":["你的衣服脏了，快换一件吧。","因为下雨，所以我的鞋都脏了。","这个杯子有点儿脏，我去洗一下。","虽然房间很脏，但是他不想打扫。","小狗在草地上玩，身上都脏了。"]},{"id":"w757","word":"可爱","pinyin":"kě'ài","level":3,"note":"让人喜欢","qa":["你觉得什么动物最可爱？","你小时候可爱吗？家人怎么说？"],"ex":["这只小猫真可爱，我很喜欢。","因为大熊猫很可爱，所以大家都喜欢它。","她的妹妹很可爱，大家都喜欢她。","虽然小狗有点儿脏，但是很可爱。","动物园里有很多可爱的动物。"]},{"id":"w758","word":"认得","pinyin":"rènde","level":3,"note":"认识，能认出来","qa":["你认得多少个汉字？","你还认得你小学的老师吗？"],"ex":["我认得这个字，但是不会写。","因为很久没见，所以我差点儿不认得他了。","你还认得回家的路吗？","虽然他变了很多，但是我还认得他。","这个地方我认得，我以前来过。"]},{"id":"w759","word":"动物园","pinyin":"dòngwùyuán","level":3,"note":"养很多动物、让人参观的公园","qa":["你去过动物园吗？最喜欢看什么动物？","你觉得动物园里的动物开心吗？"],"ex":["周末我们带孩子去动物园。","因为动物园里有大熊猫，所以游客特别多。","这个动物园很大，一天看不完。","虽然动物园离家很远，但是孩子们很想去。","我们在动物园里看到了很多可爱的动物。"]},{"id":"w760","word":"动物","pinyin":"dòngwù","level":3,"note":"能自己活动的生物（猫、狗、鸟等）","qa":["你最喜欢什么动物？为什么？","你觉得哪种动物最聪明？"],"ex":["我很喜欢小动物，特别是小猫。","因为这里的草很多，所以有很多野生动物。","猫和狗是我最喜欢的动物。","虽然这个动物看起来很大，但是很可爱。","动物园里有很多不同的动物。"]},{"id":"w761","word":"大熊猫","pinyin":"dàxióngmāo","level":3,"note":"中国特有的黑白两色的动物，喜欢吃竹子","qa":["你见过大熊猫吗？在哪儿见的？","你觉得大熊猫为什么这么可爱？"],"ex":["大熊猫是中国的国宝。","因为大熊猫很可爱，所以大家都喜欢它。","大熊猫最喜欢吃竹子。","虽然大熊猫看起来很胖，但是会爬树。","我们在动物园里看到了两只大熊猫。"]},{"id":"w762","word":"奇怪","pinyin":"qíguài","level":3,"note":"和平常不一样，让人觉得不明白","qa":["你遇到过什么奇怪的事？","你觉得中国有什么让你感到奇怪的习惯？"],"ex":["他今天怎么没来？真奇怪。","因为天气很奇怪，一会儿热一会儿冷，所以很多人感冒了。","我觉得这个问题有点儿奇怪。","虽然他说的话很奇怪，但是有道理。","奇怪，我的手机去哪儿了？"]},{"id":"w763","word":"竹子","pinyin":"zhúzi","level":3,"note":"一种长得很快、中间是空的植物","qa":["你见过竹子吗？在哪儿见的？","你知道大熊猫为什么喜欢吃竹子吗？"],"ex":["大熊猫最喜欢吃竹子。","因为这里有很多竹子，所以风景很漂亮。","这个杯子是用竹子做的。","虽然竹子很高，但是长得很快。","中国南方有很多竹子。"]},{"id":"w764","word":"国宝","pinyin":"guóbǎo","level":3,"note":"国家最珍贵的东西","qa":["你们国家的国宝是什么？","你觉得为什么大熊猫是中国的国宝？"],"ex":["大熊猫是中国的国宝。","因为是国宝，所以大家都很关心大熊猫。","这件东西是国宝，只能看，不能拍照。","虽然大熊猫是国宝，但是也很可爱。","我们去看了很多国宝。"]},{"id":"w765","word":"全","pinyin":"quán","level":3,"note":"整个、所有的；都","qa":["你们全家人一起去旅游过吗？","这本书你全看完了吗？"],"ex":["我们全家人一起去动物园。","因为作业很多，所以我全做完已经很晚了。","这个问题全班只有他会。","虽然菜很多，但是我们全吃完了。","他刚才说的全是真的。"]},{"id":"w766","word":"野生","pinyin":"yěshēng","level":3,"note":"在自然环境里生长、不是人养的","qa":["你见过野生动物吗？是什么动物？","你觉得野生动物应该住在动物园吗？"],"ex":["山里有很多野生动物。","因为野生大熊猫很少，所以很难看到。","这些花是野生的，没有人种。","虽然野生动物很可爱，但是不能离它们太近。","草原上有很多野生的马。"]},{"id":"w767","word":"关于","pinyin":"guānyú","level":3,"note":"介词，引出说到的事物","qa":["你喜欢看关于什么的书？","你知道哪些关于中国的故事？"],"ex":["这是一本关于大熊猫的书。","关于这个问题，我们明天再说。","因为她对历史感兴趣，所以常看关于历史的书。","虽然我看了很多关于中国的书，但是还没去过中国。","老师给我们讲了一个关于月亮的故事。"]},{"id":"w768","word":"饱","pinyin":"bǎo","level":3,"note":"吃够了，不想再吃","qa":["你吃饱了吗？还想吃什么？","你一般吃几碗饭才饱？"],"ex":["我吃饱了，一点儿也吃不下了。","因为中午吃得太饱，所以晚上不想吃饭。","大熊猫吃饱了，就开始睡觉。","虽然已经吃饱了，但是我还想吃一块蛋糕。","你吃饱了吗？要不要再来一碗？"]},{"id":"w769","word":"嘴","pinyin":"zuǐ","level":3,"note":"人和动物吃东西、说话的地方","qa":["你觉得小鸟的嘴是什么样的？","你生病的时候，嘴里会觉得不舒服吗？"],"ex":["请张开嘴，医生看一下。","因为嘴太疼了，所以他什么都不想吃。","小猫的嘴很小，很可爱。","虽然他嘴上说不想去，但是心里很想去。","吃饭的时候，嘴里有东西不要说话。"]},{"id":"w770","word":"身边","pinyin":"shēnbiān","level":3,"note":"身体的旁边；自己周围","qa":["你身边有没有很会说汉语的朋友？","你出门的时候，身边一般带什么？"],"ex":["小狗一直在我身边。","因为妈妈在身边，所以孩子一点儿也不害怕。","我身边的朋友都很喜欢看电影。","虽然他不在我身边，但是常常给我打电话。","手机不在身边，我有点儿着急。"]},{"id":"w771","word":"半天","pinyin":"bàntiān","level":3,"note":"一天的一半；也表示很长一段时间","qa":["你等人最多等过多长时间？有没有等了半天？","你上午半天一般做什么？"],"ex":["我等了你半天，你怎么才来？","因为找了半天也没找到，所以他很着急。","我们今天只上半天课。","虽然看了半天，但是我还是不明白。","他们聊了半天，都忘了吃饭。"]},{"id":"w772","word":"脸","pinyin":"liǎn","level":3,"note":"头的前面部分","qa":["你早上起床以后先洗脸吗？","你喝酒以后，脸会红吗？"],"ex":["他洗了洗脸，就去上班了。","因为太热了，所以孩子的脸都红了。","她的脸很小，眼睛很大。","虽然他脸上没有笑，但是心里很高兴。","大熊猫的脸是白色的，眼睛是黑色的。"]},{"id":"w773","word":"大人","pinyin":"dàren","level":3,"note":"成年人（和孩子相对）","qa":["你小时候想快点儿变成大人吗？为什么？","你觉得大人和孩子有什么不一样？"],"ex":["孩子们在玩，大人们在旁边聊天儿。","因为这个电影是给大人看的，所以孩子不能看。","大人的票比孩子的贵。","虽然他还是孩子，但是说话像大人一样。","晚上大人不在家，孩子们自己做饭。"]},{"id":"w774","word":"喜爱","pinyin":"xǐ'ài","level":3,"note":"喜欢、爱","qa":["你最喜爱的动物是什么？","你觉得什么样的老师受到学生的喜爱？"],"ex":["大熊猫受到了很多人的喜爱。","因为这本书很有意思，所以受到孩子们的喜爱。","这是我最喜爱的一个节目。","虽然这只小狗很脏，但是孩子们很喜爱它。","这位老师很受学生喜爱。"]}];
const HANZI_ETYM=[{"char":"人","type":"象形","benyi":"本义是人。","yanbian":"甲骨文像一个侧身站立的人，能看出头、手臂和腿。后来笔画拉直，成了今天的“人”。作偏旁写成“亻”，和人有关，如你、休、住。"},{"char":"大","type":"象形","benyi":"本义是大，与“小”相对。","yanbian":"甲骨文像一个正面站立、张开双臂双腿的成年人，用人把身体张开的样子来表示“大”。后来引申为年纪大、程度深等。"},{"char":"小","type":"象形","benyi":"本义是细小、微小。","yanbian":"甲骨文用三个小点表示细小的沙粒（也有人把它归为指事字）。后来写成中间一竖、两边各一点。引申为年纪小、不重要。"},{"char":"上","type":"指事","benyi":"本义是上面、高处。","yanbian":"甲骨文在一条长横线（表示基准）上面加一短横，指出“在上面”；后来加上一竖写成“上”。引申为往上去（上楼）、次序在前（上次）。"},{"char":"下","type":"指事","benyi":"本义是下面、低处。","yanbian":"甲骨文在长横线下面加一短横，指出“在下面”；后来加竖写成“下”。引申为往下去（下楼）、次序在后（下次）。"},{"char":"中","type":"象形","benyi":"本义是中间、当中。","yanbian":"甲骨文像一根竖立的旗杆，中间有方框，上下飘着旗游。一说古代聚集众人时在中央立起旗子，所以表示“中间”。引申为里面（心中）、不偏不倚。"},{"char":"一","type":"指事","benyi":"本义是数目一。","yanbian":"用一条横线表示最小的整数“一”。古人认为“一”是万物的开始，所以又引申为全、满（一身汗）。"},{"char":"二","type":"指事","benyi":"本义是数目二。","yanbian":"用两条横线表示“二”，和“一”“三”一样，是用线条的数目直接记数，是最古老的数字写法之一。"},{"char":"三","type":"指事","benyi":"本义是数目三。","yanbian":"用三条横线表示“三”。古人常用“三”表示多数，如“三思”就是想了又想。"},{"char":"天","type":"指事","benyi":"本义是人的头顶。","yanbian":"甲骨文是一个正面站立的人（大），头部特别画大，指出头顶所在。人的头顶上面就是天空，所以引申为天空、天气，又引申为一天、白天。"},{"char":"地","type":"形声","radical":"土，也","benyi":"本义是大地、土地。","yanbian":"从土表意，“也”表声。古人认为天在上、地在下，天清地浊。后来引申为地方、地点，也用作助词（慢慢地走）。"},{"char":"山","type":"象形","benyi":"本义是山。","yanbian":"甲骨文像三座并立的山峰，中间一座最高，是山的轮廓画。以“山”为偏旁的字多和山有关，如岛、峰。"},{"char":"水","type":"象形","benyi":"本义是河流、水。","yanbian":"甲骨文像弯弯曲曲流动的水，中间是主流，两旁是水点或支流。作偏旁时写成“氵”，如河、洗、海。"},{"char":"火","type":"象形","benyi":"本义是火。","yanbian":"甲骨文像火焰向上燃烧的样子。作偏旁时有时写在字下成“灬”，如热、照、然。"},{"char":"木","type":"象形","benyi":"本义是树木。","yanbian":"甲骨文上面像树枝，中间是树干，下面是树根。后来泛指木头；以“木”为偏旁的字多与树木或木制品有关，如林、树、桌。"},{"char":"本","type":"指事","radical":"木，一","benyi":"本义是树根。","yanbian":"在“木”的下部加一短横（或点），指出树根的位置。树根是树的根本，所以引申为根本、本来，又用作书本的量词。"},{"char":"末","type":"指事","radical":"木，一","benyi":"本义是树梢。","yanbian":"在“木”的上部加一横，指出树梢，和“本”正好相对。树梢是树的最末端，所以引申为最后、末尾，如“周末”是一周的最后几天。"},{"char":"日","type":"象形","benyi":"本义是太阳。","yanbian":"甲骨文像圆圆的太阳，中间一点表示太阳的光。太阳出来一次就是一天，所以引申为白天、一天、日子。"},{"char":"月","type":"象形","benyi":"本义是月亮。","yanbian":"甲骨文像一弯月牙，和圆圆的“日”相区别。月亮圆缺一次大约一个月，所以引申为月份。作偏旁时的“月”很多其实是“肉”，如脚、腿、胖。"},{"char":"明","type":"会意","radical":"日，月","benyi":"本义是光明、明亮。","yanbian":"太阳和月亮都会发光，放在一起表示明亮（甲骨文也有写成窗户加“月”的，表示月光照进窗户）。引申为清楚（明白）；“明天”的“明”指天亮以后的那一天。"},{"char":"休","type":"会意","radical":"亻（人），木","benyi":"本义是休息。","yanbian":"一个人靠在大树旁边，表示在树下歇息。引申为停止（休假）。"},{"char":"林","type":"会意","radical":"木，木","benyi":"本义是树林。","yanbian":"两个“木”并排，表示树很多、连成一片。"},{"char":"森","type":"会意","radical":"木，木，木","benyi":"本义是树木茂密。","yanbian":"三个“木”叠在一起，比“林”还多，表示树木又多又密。引申为多而密、阴暗（森林、阴森）。"},{"char":"从","type":"会意","trad":"從","radical":"人，人","benyi":"本义是跟随。","yanbian":"甲骨文是两个人一前一后，后面的人跟着前面的人走。繁体“從”加了表示行走的“彳”和“止”，简化字又回到了最早的两个“人”。后来用作介词（从家里来）。"},{"char":"众","type":"会意","trad":"衆","radical":"人，人，人","benyi":"本义是很多人。","yanbian":"甲骨文上面是“日”，下面是三个人，像许多人在太阳下劳动；繁体写作“衆”。简化字用三个“人”叠在一起表示人多。"},{"char":"女","type":"象形","benyi":"本义是女子。","yanbian":"甲骨文像一个人跪坐着、双手交叉放在胸前的样子，是古人描画女子的方式。以“女”为偏旁的字多与女性或婚姻有关，如妈、姐、婚。"},{"char":"子","type":"象形","benyi":"本义是婴儿、孩子。","yanbian":"甲骨文像一个头大、身体小、张开双臂的婴儿（腿被包在襁褓里）。引申为儿子、孩子，又用作名词后缀（桌子、筷子）。"},{"char":"好","type":"会意","radical":"女，子","benyi":"放在一起，古人认为女子带着孩子、母慈子孝是美好的事","yanbian":"引申为'好'。"},{"char":"学","type":"会意","trad":"學","radical":"臼（双手），爻，冖，子","benyi":"本义是学习、受教。","yanbian":"甲骨文上面是两只手摆弄“爻”（算筹或绳结），下面的屋子（冖）里有个孩子（子），表示孩子在屋里受教、学习。简化字把上部简写成三点。"},{"char":"习","type":"会意","trad":"習","radical":"羽，日（白）","benyi":"本义是小鸟反复练习飞。","yanbian":"繁体“習”上面是“羽”（翅膀），下面是“日”（一说是“白”），像小鸟在阳光下一次次扇动翅膀学飞。引申为反复练习、复习、习惯。简化字只取了“羽”的一半。"},{"char":"书","type":"形声","trad":"書","radical":"聿，者","benyi":"本义是书写。","yanbian":"繁体“書”上面是“聿”（手拿毛笔），下面“者”表声（后来写成“曰”）。本义是写字，引申为写下来的东西——书籍、书信。简化字“书”是根据草书写法简化来的。"},{"char":"心","type":"象形","benyi":"本义是心脏。","yanbian":"甲骨文像心脏的形状，里面有心室。古人认为心能思考，所以和思想、感情有关的字很多带“心”或“忄”，如想、忙、情。"},{"char":"手","type":"象形","benyi":"本义是手。","yanbian":"金文像一只手张开五个手指，中间一竖是手臂。作偏旁时写成“扌”，如打、拿、找。"},{"char":"口","type":"象形","benyi":"本义是嘴。","yanbian":"甲骨文像张开的嘴巴。和吃、说、声音有关的字多带“口”，如吃、喝、叫。也用来指出入的地方（门口、路口）。"},{"char":"目","type":"象形","benyi":"本义是眼睛。","yanbian":"甲骨文像一只横着的眼睛，有眼眶和瞳孔，后来竖着写成“目”。以“目”为偏旁的字多和看有关，如看、睡、眼。"},{"char":"眼","type":"形声","radical":"目，艮","benyi":"本义是眼珠、眼睛。","yanbian":"从目表意，“艮”表声。先秦多用“目”表示眼睛，“眼”原来多指眼珠，后来慢慢代替“目”，成为口语里的常用词。"},{"char":"看","type":"会意","radical":"手，目","benyi":"本义是看、望。","yanbian":"上面是“手”，下面是“目”，像把手搭在眼睛上面往远处望。引申为观看、看望、认为（我看不行）。"},{"char":"耳","type":"象形","benyi":"本义是耳朵。","yanbian":"甲骨文像耳朵的外形，有耳廓和耳孔。和听有关的字多带“耳”，如聪、联。"},{"char":"足","type":"象形","benyi":"本义是脚。","yanbian":"甲骨文上面的“口”像膝盖（一说是小腿），下面是脚掌和脚趾。脚站稳了心里就踏实，引申为充足、足够。作偏旁写成“⻊”，如路、跑、踢。"},{"char":"走","type":"会意","radical":"夭（摆臂的人），止（脚）","benyi":"本义是跑。","yanbian":"金文上面像一个甩开手臂奔跑的人，下面是“止”（脚），合起来表示跑。古代“走”是跑、“行”才是走；后来“走”变成了普通的走路，本义由“跑”代替。"},{"char":"车","type":"象形","trad":"車","benyi":"本义是车子。","yanbian":"甲骨文像从上往下看的一辆车：两边是车轮，中间是车厢和车轴。后来简化成只画一个车轮的“車”，简化字又根据草书写成“车”。"},{"char":"马","type":"象形","trad":"馬","benyi":"本义是马。","yanbian":"甲骨文像一匹侧立的马，有长脸、鬃毛、四条腿和尾巴。繁体“馬”下面四点是四条腿，简化字根据草书写成“马”。"},{"char":"鱼","type":"象形","trad":"魚","benyi":"本义是鱼。","yanbian":"甲骨文像一条鱼：上面是头，中间是有鳞的身体，下面是尾巴。繁体“魚”下面的四点原来是鱼尾，简化字写成一横。"},{"char":"鸟","type":"象形","trad":"鳥","benyi":"本义是鸟。","yanbian":"甲骨文像一只侧立的鸟，有嘴、眼睛、翅膀和脚。繁体“鳥”下面四点是鸟爪和尾羽，简化字写成“鸟”。"},{"char":"羊","type":"象形","benyi":"本义是羊。","yanbian":"甲骨文像羊头的正面，上面两只弯弯的羊角很明显。古人觉得羊温顺、美好，所以“美”“善”等字里都有“羊”。"},{"char":"牛","type":"象形","benyi":"本义是牛。","yanbian":"甲骨文像牛头的正面，上面两只向上弯的角，下面是牛脸。牛力气大，是古代重要的家畜。"},{"char":"雨","type":"象形","benyi":"本义是下雨。","yanbian":"甲骨文上面一横表示天，下面的点是落下的雨滴。和天气有关的字很多带“雨”，如雪、雷。"},{"char":"田","type":"象形","benyi":"本义是农田。","yanbian":"甲骨文像划分成一块块的农田，中间的线是田埂和小路。和农业、土地有关的字常带“田”，如男。"},{"char":"力","type":"象形","benyi":"本义一说是耕地的农具，一说是力气。","yanbian":"甲骨文像古代翻土的农具“耒”，一说像手臂上鼓起的肌肉。用耒耕地要花力气，所以引申为力气、能力。“男”就是在田里出力的人。"},{"char":"刀","type":"象形","benyi":"本义是刀。","yanbian":"甲骨文像一把刀，上面是刀柄，弯的是刀背和刀刃。作偏旁时写成“刂”，如刷、到、别。"},{"char":"门","type":"象形","trad":"門","benyi":"本义是门。","yanbian":"甲骨文像两扇相对的门板，上面有门框。繁体“門”保留了两扇门的样子，简化字根据草书写成“门”。"},{"char":"自","type":"象形","benyi":"本义是鼻子。","yanbian":"甲骨文像人的鼻子，有鼻梁和鼻翼。人说到“我自己”时常指着自己的鼻子，所以借用为“自己”；鼻子的本义另造“鼻”字（在“自”下加声旁“畀”）。"},{"char":"面","type":"象形","benyi":"本义是脸。","yanbian":"甲骨文外面是脸的轮廓，里面画了一只眼睛，用眼睛代表整张脸。引申为表面、方面、见面；表示面条的“麵”简化时也并入了“面”。"},{"char":"音","type":"指事","radical":"言，一","benyi":"本义是声音。","yanbian":"金文里“音”和“言”原是同一个字，后来在“言”的“口”中加一短横，指出从口中发出的声音，分化出“音”。引申为音乐、音调。"},{"char":"言","type":"象形","benyi":"本义是说话。","yanbian":"甲骨文下面是“口”，上面像伸出的舌头（一说像一种吹奏的乐器），表示用嘴说话。作偏旁写成“讠”，和说话有关，如说、话、讲。"},{"char":"讲","type":"形声","trad":"講","radical":"讠（言），冓（简化为“井”）","benyi":"本义是和解、商量。","yanbian":"从言表意，“冓”表声。本义是讲和、商量，后来引申为讲解、说明、说话。简化字把右边换成读音相近的“井”。"},{"char":"认","type":"形声","trad":"認","radical":"讠（言），忍（简化为“人”）","benyi":"本义是辨认、认得。","yanbian":"从言表意，“忍”表声。本义是辨认，引申为认识、承认、认为。简化字把“忍”换成了“人”。"},{"char":"记","type":"形声","trad":"記","radical":"讠（言），己","benyi":"本义是记录。","yanbian":"从言表意，“己”表声。本义是把话记下来，引申为记住（放在心里）、笔记、日记。"},{"char":"识","type":"形声","trad":"識","radical":"讠（言），戠（简化为“只”）","benyi":"本义是知道、认得。","yanbian":"从言表意，“戠”表声。本义是知道、认得，引申为知识、见识。简化字把复杂的“戠”换成读音相近的“只”。"},{"char":"解","type":"会意","radical":"角，刀，牛","benyi":"本义是剖开、分解牛的身体。","yanbian":"由“角”“刀”“牛”组成，表示用刀把牛角和牛身分开（成语“庖丁解牛”就是这个意思）。引申为解开、解释、了解。"},{"char":"谢","type":"形声","trad":"謝","radical":"讠（言），射","benyi":"本义是辞别、推辞。","yanbian":"从言表意，“射”表声。本义是辞去、告别，引申为认错道歉、表示感谢；花落也叫“谢”（花谢了）。"},{"char":"在","type":"形声","radical":"土，才","benyi":"本义是存在。","yanbian":"从土表意，“才”表声（“才”本身像草木破土而出）。本义是存在、生存，引申为处在某个地方，又用作介词和副词（正在）。"},{"char":"打","type":"形声","radical":"扌（手），丁","benyi":"本义是击打。","yanbian":"从手表意，“丁”表声（一说“丁”像钉子，兼表敲钉子的意思）。本义是击打，后来用途越来越广：打电话、打车、打篮球都用它表示“做某个动作”。"},{"char":"拿","type":"会意","radical":"合，手","benyi":"本义是用手握住、取。","yanbian":"上面是“合”，下面是“手”，表示把手合拢来抓东西。古代写作“拏”，后来改成更好懂的“拿”。"},{"char":"把","type":"形声","radical":"扌（手），巴","benyi":"本义是用手握住。","yanbian":"从手表意，“巴”表声。本义是握住（把握），引申为把手、量词（一把伞），又虚化成介词“把”（把书还给你）。"},{"char":"接","type":"形声","radical":"扌（手），妾","benyi":"本义是交接、接触。","yanbian":"从手表意，“妾”表声。《说文》：“接，交也。”本义是两手相交、接触，引申为连接、接住、迎接（接朋友）。"},{"char":"换","type":"形声","trad":"換","radical":"扌（手），奂","benyi":"本义是交换。","yanbian":"从手表意，“奂”表声。本义是用一样东西换另一样东西，引申为更换、变换。"},{"char":"找","type":"会意","radical":"扌（手），戈","benyi":"一说本义是划船（“划”的异体字）。","yanbian":"“找”是比较晚才出现的字，由手（扌）和戈组成，古书里曾用作划船的“划”。宋元以后借用来表示寻找、找钱，今天只用这个意思。"},{"char":"搬","type":"形声","radical":"扌（手），般","benyi":"本义是移动东西。","yanbian":"从手表意，“般”表声（“般”本来就有旋转、搬运的意思）。本义是把东西从一处移到另一处，如搬家、搬箱子。"},{"char":"放","type":"形声","radical":"攵（手持棍），方","benyi":"本义是驱逐、放逐。","yanbian":"从攴（攵，手拿棍子）表意，“方”表声。本义是赶走、流放，引申为放开、放下、放假、放心。"},{"char":"算","type":"会意","radical":"竹，具","benyi":"本义是计算。","yanbian":"《说文》：“算，数也。从竹从具。”上面是“竹”，指古代用竹子做的算筹；下面是“具”（双手捧着器具）。双手摆弄竹筹来计数就是“算”。引申为计划（打算）、算作。"},{"char":"复","type":"形声","trad":"復／複","radical":"彳，复（夂）","benyi":"本义是往返、回来。","yanbian":"甲骨文“复”像一只脚（夂）在城邑之间来回走，后来加上“彳”写作“復”。本义是返回，引申为重复、再一次（复习）。表示衣服有几层的“複”也简化成了“复”。"},{"char":"周","type":"象形","benyi":"本义是周密、周遍。","yanbian":"甲骨文像田地里整整齐齐种满了庄稼（一说像雕刻的花纹），表示周密、周遍。引申为环绕一圈（周围），又引申为一个循环——一周（星期）。"},{"char":"南","type":"象形","benyi":"一说本义是一种悬挂敲击的乐器。","yanbian":"甲骨文像一种挂起来敲打的乐器（一说像钟、铃一类）。后来借用表示方向“南”，本义就不用了。"},{"char":"北","type":"会意","radical":"人，人（背对）","benyi":"本义是背、背对。","yanbian":"甲骨文是两个背对背的人，本义是“背”。古人房子坐北朝南，背对的方向就是北，所以借用来表示北方；本义后来加“月（肉）”写成“背”。"},{"char":"东","type":"象形","trad":"東","benyi":"一说本义是两头扎紧的口袋。","yanbian":"甲骨文像一个两头扎起来的口袋（一说像太阳从树中升起）。后来借用表示方向“东”（太阳升起的方向）。简化字根据草书写法简化。"},{"char":"西","type":"象形","benyi":"本义是鸟巢。","yanbian":"甲骨文像鸟巢的样子。太阳落山时鸟回巢，所以借用来表示太阳落下的方向——西方；鸟栖息的本义后来写作“栖”。"},{"char":"家","type":"会意","radical":"宀（房屋），豕（猪）","benyi":"本义是住所。","yanbian":"上面“宀”是房屋，下面“豕”是猪。古人在屋里或屋旁养猪，有猪的房子就是有人长期居住的家。引申为家庭、家人，也指有专门本领的人（画家）。"},{"char":"室","type":"形声","radical":"宀（房屋），至","benyi":"本义是屋子里的房间。","yanbian":"从宀表意，“至”表声（“至”有到达的意思，人到了这里就停下来）。本义是内室，引申为教室、办公室这类专门的房间。"},{"char":"公","type":"会意","radical":"八，厶","benyi":"本义是公共、无私。","yanbian":"古书说“背厶为公”：“厶”是“私”的古字，“八”表示分开、相背，和私相反就是“公”。引申为公家、公共、公司，也用作对年长男子的称呼。"},{"char":"办","type":"形声","trad":"辦","radical":"力，辡","benyi":"本义是致力、办理。","yanbian":"繁体“辦”中间是“力”，两边的“辡”表声，表示用力做事。本义是办理，引申为办法、办公。简化字保留中间的“力”，两边各写一点。"},{"char":"经","type":"形声","trad":"經","radical":"纟（丝），巠","benyi":"本义是织布的纵线。","yanbian":"从糸（纟）表意，“巠”表声（“巠”本身像织布机上的纵线）。织布要先定好纵线，所以引申为常规、经典；纵线从头贯穿到尾，又引申为经过、经历、已经。"},{"char":"理","type":"形声","radical":"王（玉），里","benyi":"本义是雕琢玉石。","yanbian":"从玉（王）表意，“里”表声。本义是顺着玉的纹路雕琢玉石，引申为纹理、道理，又引申为整理、管理（经理）。"},{"char":"秘","type":"形声","trad":"祕","radical":"示（后写作“禾”），必","benyi":"本义是神秘、不公开。","yanbian":"原来写作“祕”，从示（与神有关）表意，“必”表声；后来“示”旁常写成“禾”。引申为秘密。“秘书”原指宫中收藏的秘密图书，后来指管理文书的人。"},{"char":"楼","type":"形声","trad":"樓","radical":"木，娄","benyi":"本义是两层以上的房屋。","yanbian":"从木表意（古代房子用木头盖），“娄”表声（“娄”有中空、层层相叠的意思）。本义是重叠的房屋，引申为楼层、大楼。"},{"char":"疼","type":"形声","radical":"疒，冬","benyi":"本义是疼痛。","yanbian":"从疒（像病床，和疾病有关）表意，“冬”表声。本义是痛，引申为疼爱。和病痛有关的字多带“疒”，如病、瘦。"},{"char":"脚","type":"形声","trad":"腳","radical":"月（肉），却","benyi":"本义是小腿。","yanbian":"从肉（月）表意，“却”表声。古代“脚”原来指小腿，“足”才指脚掌；后来“脚”慢慢代替“足”，指整只脚。"},{"char":"腿","type":"形声","radical":"月（肉），退","benyi":"本义是腿。","yanbian":"从肉（月）表意，“退”表声。“腿”是后起字，古代多用“股”（大腿）、“胫”（小腿）。"},{"char":"树","type":"形声","trad":"樹","radical":"木，尌","benyi":"本义是种植、栽种。","yanbian":"从木表意，“尌”表声（“尌”本身有竖立的意思）。本义是种树、立起来（树立），后来“树木”成了最常用的意思。"},{"char":"容","type":"会意","radical":"宀（房屋），谷","benyi":"本义是容纳、装下。","yanbian":"《说文》：“容，盛也。从宀谷。”房屋和山谷都是能装东西的地方，所以本义是容纳。能装得下就显得宽松，引申为容易；脸上“装着”表情，又引申为容貌。"},{"char":"易","type":"象形","benyi":"说法不一：一说是蜥蜴，一说是赐予。","yanbian":"一说小篆像蜥蜴，蜥蜴会变色，所以引申为变化、交换（贸易）；另一说甲骨文像把一个器皿里的水倒进另一个器皿，本义是赐予。变化交换之后又引申为容易。"},{"char":"难","type":"形声","trad":"難","radical":"隹（鸟），堇（简化为“又”）","benyi":"本义是一种鸟。","yanbian":"从隹（短尾鸟）表意，“堇”表声，本义是一种鸟名；后来借用表示困难、不容易，读 nàn 时指灾难。简化字把左边换成“又”。"},{"char":"太","type":"指事","radical":"大，丶","benyi":"本义是极大。","yanbian":"原来和“大”“泰”是同一个字，后来在“大”下面加一点，分化出“太”，表示比大还大。引申为程度很高（太好了）、过分（太贵了）。"},{"char":"婚","type":"形声","radical":"女，昏","benyi":"本义是娶妻、结婚。","yanbian":"从女表意，“昏”表声也表意。古代娶妻的婚礼在黄昏举行，所以原来就写作“昏”，后来加“女”旁成“婚”。"},{"char":"辆","type":"形声","trad":"輛","radical":"车，两","benyi":"本义是车的量词。","yanbian":"从车表意，“两”表声也表意——古代的车有两个轮子，所以一车叫“一两”，后来加车旁写成“辆”。"},{"char":"伞","type":"象形","trad":"傘","benyi":"本义是伞。","yanbian":"“傘”是后起的象形字：上面像撑开的伞面，里面的几个“人”像伞骨，下面一竖是伞柄。简化字“伞”只保留一个“人”，更简洁。"},{"char":"重","type":"会意","radical":"人，东（囊袋）","benyi":"本义是分量大。","yanbian":"金文像一个人背着一个大口袋（东），表示东西很沉（一说“东”也表声）。引申为重要、严重；读 chóng 时表示重复、再一次。"},{"char":"轻","type":"形声","trad":"輕","radical":"车，巠","benyi":"本义是一种轻便的车。","yanbian":"从车表意，“巠”表声。本义是轻便的战车，引申为分量小，又引申为程度浅、年轻、轻松。"},{"char":"近","type":"形声","radical":"辶（辵），斤","benyi":"本义是距离短。","yanbian":"从辵（辶，走路）表意，“斤”表声。本义是路不远，引申为时间不远（最近）、关系亲近。"},{"char":"远","type":"形声","trad":"遠","radical":"辶（辵），袁（简化为“元”）","benyi":"本义是距离长。","yanbian":"从辵（辶）表意，“袁”表声，简化字换成读音相近的“元”。本义是路远，引申为时间久、关系疏远。"},{"char":"还","type":"形声","trad":"還","radical":"辶（辵），睘（简化为“不”）","benyi":"本义是返回。","yanbian":"从辵（辶，走路）表意，“睘”表声，本义是返回（huán），引申为归还。读 hái 时是借用来表示“仍然、还有”。简化字把右边写成“不”，只是一个记号。"},{"char":"迟","type":"形声","radical":"辶，尺","benyi":"本义是走得慢","yanbian":"引申为迟到。"},{"char":"间","type":"会意","trad":"間（古作“閒”）","radical":"门，月（后改为“日”）","benyi":"本义是门缝、空隙。","yanbian":"古字写作“閒”，门里透进月光，表示门缝、空隙；后来把“月”换成“日”写作“間”。有空隙就有“中间”，引申为房间、时间，也用作量词（一间屋子）。"},{"char":"附","type":"形声","radical":"阝（阜，土山），付","benyi":"本义是小土山。","yanbian":"从阜（阝，土山）表意，“付”表声。本义是小土山，引申为靠近（附近）、依附、附带。"},{"char":"银","type":"形声","trad":"銀","radical":"钅（金），艮","benyi":"本义是银子。","yanbian":"从金表意，“艮”表声。《说文》：“银，白金也。”本义是白色的金属银，古代用作货币，所以存钱的地方叫“银行”。"},{"char":"锻","type":"形声","trad":"鍛","radical":"钅（金），段","benyi":"本义是打铁。","yanbian":"从金表意，“段”表声（“段”的本义就是捶打）。本义是把金属烧红后捶打，引申为锻炼——像打铁一样让身体变得结实。"},{"char":"站","type":"形声","radical":"立，占","benyi":"本义是站立。","yanbian":"从立表意，“占”表声。本义是站着不动。元代以后借用蒙古语“驿站”的意思，指路上停车、休息的地方，于是有了车站、地铁站。"},{"char":"骑","type":"形声","trad":"騎","radical":"马，奇","benyi":"本义是跨坐在马上。","yanbian":"从马表意，“奇”表声。本义是两腿分开跨坐在马背上，引申为骑车；读 jì 时指骑兵。"},{"char":"顾","type":"形声","radical":"厂/页，雇","benyi":"本义是回头看","yanbian":"引申为照顾。"},{"char":"花","type":"形声","radical":"艹，化","benyi":"本义是花朵。","yanbian":"古代“花”写作“华（華）”，像树上开满花的样子；后来另造“花”字：从艹表意，“化”表声。引申为好看的花纹，又引申为花费（花钱）。"},{"char":"草","type":"形声","radical":"艹，早","benyi":"本义是栎树的果实。","yanbian":"《说文》：“草，草斗，栎实也。”从艹表意，“早”表声，本义是栎树的果实（可以染黑色，后来写作“皂”）。后来借用表示草本植物，原来表示草的“艸”就不常用了。"},{"char":"衣","type":"象形","benyi":"本义是上衣。","yanbian":"甲骨文像一件上衣：上面是衣领，两边是袖子，下面是衣襟。古代上身穿的叫“衣”，下身穿的叫“裳”。作偏旁写成“衤”，如裤、裙。"},{"char":"裤","type":"形声","trad":"褲","radical":"衤（衣），库","benyi":"本义是裤子。","yanbian":"从衣表意，“库”表声。古代写作“绔”“袴”，原来指套在腿上的套裤，后来指今天的裤子。"},{"char":"裙","type":"形声","radical":"衤（衣），君","benyi":"本义是下身穿的裙子。","yanbian":"从衣表意，“君”表声。古代写作“帬”，原来指围在下身的衣物，后来专指裙子。"},{"char":"行","type":"象形","benyi":"本义是道路。","yanbian":"甲骨文像一个十字路口，本义是道路。在路上走就是“行走”，引申为做事、可以（行不行）；读 háng 时指行列、行业（银行）。"},{"char":"饭","type":"形声","trad":"飯","radical":"饣（食），反","benyi":"本义是吃。","yanbian":"从食表意，“反”表声。本义是吃（古书里“饭牛”就是喂牛），后来引申为煮熟的米饭，又泛指一顿饭。"},{"char":"饮","type":"会意","trad":"飲","radical":"饣（食），欠","benyi":"本义是喝。","yanbian":"甲骨文像一个人低头张嘴对着酒坛喝酒，后来写成“飲”，左边是食，右边“欠”是张着嘴的人。本义是喝，名词指饮料。"},{"char":"饿","type":"形声","trad":"餓","radical":"饣（食），我","benyi":"本义是严重地挨饿。","yanbian":"从食表意，“我”表声。古代“饥”只是吃不饱，“饿”是严重缺少食物，程度更重；后来两个字意思接近，都表示肚子饿。"},{"char":"馆","type":"形声","trad":"館","radical":"饣（食），官","benyi":"本义是招待客人吃住的房舍。","yanbian":"从食表意，“官”表声。本义是客舍，引申为饭馆、宾馆，又指图书馆、体育馆这类公共场所。"},{"char":"高","type":"象形","benyi":"本义是高。","yanbian":"甲骨文像一座高高的楼台：上面是屋顶，中间是楼，下面是高台和门。用高楼来表示“高”，引申为高兴（情绪上扬）、高级。"},{"char":"老","type":"象形","benyi":"本义是年老。","yanbian":"甲骨文像一位长着长发、弯着腰、拄着拐杖的老人。本义是年纪大，引申为老师、老朋友里的“老”（时间长、熟悉）。"},{"char":"情","type":"形声","radical":"忄（心），青","benyi":"本义是感情。","yanbian":"从心（忄）表意，“青”表声。本义是人的情感，引申为情况、事情、爱情。"},{"char":"感","type":"形声","radical":"心，咸","benyi":"本义是内心受到触动。","yanbian":"从心表意，“咸”表声（“咸”有全部、都的意思）。本义是感动，引申为感觉、感谢、感冒。"},{"char":"热","type":"形声","trad":"熱","radical":"灬（火），埶（简化为“执”）","benyi":"本义是温度高。","yanbian":"从火（灬）表意，“埶”表声。本义是温度高，引申为热情、热闹。简化字把上部“埶”换成“执”。"},{"char":"急","type":"形声","radical":"心，及（隶变后变形）","benyi":"本义是心急、焦虑。","yanbian":"从心表意，上面原来是“及”表声（“及”有追赶的意思），隶变后写成现在的形状。本义是心里着急，引申为急迫、紧急（急事）。"},{"char":"着","type":"形声","trad":"著","radical":"艹（后变形），者","benyi":"本义是附着、接触。","yanbian":"“着”原来是“著”的俗写，从艸（艹）表意，“者”表声。本义是附着、接触（着地），引申为穿（着衣）、着急；读 zhe 时是助词，表示动作在持续。"},{"char":"睡","type":"会意","radical":"目，垂","benyi":"本义是坐着打瞌睡。","yanbian":"从目、从垂，“垂”兼表声：眼皮垂下来就是打瞌睡。本义是坐着打盹，后来泛指睡觉。"},{"char":"瘦","type":"形声","radical":"疒，叟","benyi":"本义是身体瘦。","yanbian":"从疒表意（消瘦多和生病有关），“叟”表声。本义是身体瘦，和“胖”相对。"},{"char":"胖","type":"形声","radical":"月（肉），半","benyi":"本义是祭祀用的半边牲肉。","yanbian":"从肉（月）表意，“半”表声也表意。本义是祭祀用的半边牲肉（读 pàn）；后来借用表示人身体肥胖。"},{"char":"甜","type":"会意","radical":"舌，甘","benyi":"本义是味道甜。","yanbian":"左边是“舌”，右边是“甘”（嘴里含着好东西），舌头尝到甘美的味道就是甜。引申为幸福（甜蜜）、好听（嘴甜）。"},{"char":"满","type":"形声","radical":"氵，㒼","benyi":"本义是水注满器皿","yanbian":"引申为充满。"},{"char":"清","type":"形声","radical":"氵（水），青","benyi":"本义是水清澈。","yanbian":"从水表意，“青”表声。本义是水清澈透明，引申为干净、清楚、安静。"},{"char":"洗","type":"形声","radical":"氵（水），先","benyi":"本义是洗脚。","yanbian":"从水表意，“先”表声。本义是洗脚（古代洗脸、洗手各有专门的字），后来泛指用水清洗。"},{"char":"游","type":"形声","radical":"氵（水），斿","benyi":"本义是旗子上的飘带。","yanbian":"从水表意，“斿”表声（“斿”像旗子上飘动的带子）。飘带摆动像在水里一样，引申为在水里游，又引申为游玩、旅游。"},{"char":"熊","type":"形声","radical":"能，灬","benyi":"本义是熊。","yanbian":"“能”原来就是熊的样子，后来“能”被借去表示能力，就在下面加“火”（灬，一说是由熊掌的形状变来）造出“熊”字，专指熊这种动物。"},{"char":"猫","type":"形声","trad":"貓","radical":"犭（豸），苗","benyi":"本义是猫。","yanbian":"从豸（后写作犭，表示野兽）表意，“苗”表声（也有人认为“苗”是模仿猫叫的声音）。本义就是猫。"},{"char":"环","type":"形声","trad":"環","radical":"王（玉），睘（简化为“不”）","benyi":"本义是中间有孔的圆形玉器。","yanbian":"从玉（王）表意，“睘”表声（“睘”有圆转的意思）。本义是圆形玉器，引申为圆圈、围绕（环境：围绕在我们周围的一切）。简化字把右边写成“不”。"},{"char":"现","type":"形声","trad":"現","radical":"王（玉），见","benyi":"本义是玉石的光泽显露。","yanbian":"从玉（王）表意，“见”表声也表意。本义是玉石的光彩显露出来，引申为出现、显现，又引申为眼前的、现在。"},{"char":"班","type":"会意","radical":"王（玉），刂（刀），王（玉）","benyi":"本义是分玉。","yanbian":"两块玉中间一把刀，表示用刀把玉分开。古代天子把玉分给诸侯作凭证，本义是分发；引申为按次序排列的一组人——班级、上班。"},{"char":"特","type":"形声","radical":"牛，寺","benyi":"本义是公牛","yanbian":"引申为特殊、特别。"},{"char":"片","type":"象形","benyi":"本义是劈开的木片。","yanbian":"甲骨文像把木头从中间劈开后的一半。本义是木片，引申为薄而平的东西（照片、卡片），也用作量词。"},{"char":"照","type":"形声","radical":"灬（火），昭","benyi":"本义是照亮。","yanbian":"从火表意，“昭”表声（“昭”就是明亮）。本义是光照亮，引申为对着看（照镜子），又引申为照相、照片、照顾。"},{"char":"烧","type":"形声","trad":"燒","radical":"火，尧","benyi":"本义是燃烧。","yanbian":"从火表意，“尧”表声。本义是用火烧，引申为做菜的方法（红烧）、身体发热（发烧）。"},{"char":"梯","type":"形声","radical":"木，弟","benyi":"本义是梯子。","yanbian":"从木表意，“弟”表声（“弟”本义是次第，一级一级）。本义是木头做的梯子，引申为楼梯、电梯。"},{"char":"楚","type":"形声","radical":"林，疋","benyi":"本义是荆条一类的灌木。","yanbian":"《说文》：“楚，丛木，一名荆也。从林，疋声。”古代用荆条打人，引申为痛苦（痛楚）；“清楚”的“楚”表示鲜明、整齐。"},{"char":"查","type":"会意","radical":"木，旦","benyi":"本义与树木记号有关","yanbian":"后引申为检查、查看。"},{"char":"机","type":"形声","trad":"機","radical":"木，幾（简化为“几”）","benyi":"本义是弩上发射箭的机关。","yanbian":"繁体“機”从木表意，“幾”表声，本义是弓弩上的发射机关，引申为机器、机会。简化字借用了原来表示一种树的“机”字。"},{"char":"朋","type":"象形","benyi":"本义是成串的贝。","yanbian":"甲骨文像两串挂在一起的贝壳（古代用贝壳当钱），本义是成串的贝；引申为成群的、同类的人——朋友。"},{"char":"友","type":"会意","radical":"又（手），又（手）","benyi":"本义是朋友。","yanbian":"甲骨文是两只朝同一个方向伸出的右手（又），表示互相帮助的人，本义就是朋友。"},{"char":"亮","type":"会意","radical":"高（省），儿（人）","benyi":"本义是明亮。","yanbian":"上面是“高”的省写，下面是“儿”（人），人站在高处，光线就明亮。引申为声音响亮、心里明白。"},{"char":"再","type":"指事","radical":"冓（省），一","benyi":"本义是两次、第二次。","yanbian":"《说文》：“再，一举而二也。”字形在“冓”（两个相交的构件）的省形上加一横，指出“又一次”。本义是第二次，引申为又、再一次（再见）。"},{"char":"更","type":"形声","radical":"攴，丙","benyi":"本义是改变。","yanbian":"《说文》：“更，改也。从攴，丙声。”古字从攴（手拿东西做事）表意，“丙”表声，本义是改变、更换。古代夜里轮流打更报时也叫“更”；读 gèng 时表示“更加”。"},{"char":"最","type":"会意","radical":"曰，取","benyi":"本义是冒险夺取","yanbian":"引申为'最、极'。"},{"char":"初","type":"会意","radical":"衤（衣），刀","benyi":"本义是开始。","yanbian":"左边是“衣”，右边是“刀”，用刀裁剪布料是做衣服的第一步，所以本义是开始。引申为最初、初级（初中）。"},{"char":"为","type":"会意","trad":"爲","radical":"爪（手），象","benyi":"本义是做、劳作。","yanbian":"甲骨文是一只手牵着一头大象，表示让大象干活，本义是做。读 wèi 时引申为“为了、给”。简化字“为”根据草书写法简化。"},{"char":"以","type":"象形","benyi":"本义是用、拿。","yanbian":"甲骨文像一个人手里提着东西（一说像犁头一类工具），本义是用。引申为凭借、按照，又用在“以前、以后、以为”中。"},{"char":"会","type":"会意","trad":"會","radical":"亼（盖子），曾（器身）","benyi":"本义是会合。","yanbian":"甲骨文上面是盖子，下面是容器，盖子和容器合在一起，本义是会合、聚在一起。引申为见面、会议；聚在一起能学到本领，又引申为“会（能够）”。"},{"char":"决","type":"形声","trad":"決","radical":"氵（水，简化为“冫”），夬","benyi":"本义是冲开堤岸。","yanbian":"本写作“決”，从水表意，“夬”表声。本义是挖开或冲开堤岸让水流走；水一旦冲出去就不能回头，引申为决定、决心。简化字把三点水写成两点。"},{"char":"准","type":"形声","trad":"準","radical":"氵（水），隼","benyi":"本义是水平。","yanbian":"“準”从水表意，“隼”表声。古人用静止的水面测量是否平，所以本义是水平、标准，引申为准确、准备。简化字借用了原来表示“允许”的“准”字。"},{"char":"备","type":"会意","trad":"備","radical":"人，箭袋","benyi":"本义是准备好。","yanbian":"甲骨文像一个插着箭的箭袋，表示箭已经放好、随时可用；繁体“備”又加了人旁。本义是完备、准备好，引申为具备、准备。"},{"char":"坚","type":"会意","radical":"臤，土","benyi":"表示土质坚固","yanbian":"引申为坚固、坚持。"},{"char":"持","type":"形声","radical":"扌（手），寺","benyi":"本义是握住。","yanbian":"从手表意，“寺”表声。本义是握着、拿着，引申为坚持、保持、支持。"},{"char":"提","type":"形声","radical":"扌，是","benyi":"本义是用手提起","yanbian":"引申为提出、提高。"},{"char":"排","type":"形声","radical":"扌，非","benyi":"本义是用手推开","yanbian":"引申为排列。"},{"char":"答","type":"形声","radical":"竹，合","benyi":"本义是回答。","yanbian":"本写作“荅”（一种豆），后来借用表示回答，又把草字头写成竹字头。“合”表声也表意——回答要和问题对得上。引申为答应、答案。"},{"char":"级","type":"形声","trad":"級","radical":"纟（丝），及","benyi":"本义是丝织品的等次。","yanbian":"从糸（纟）表意，“及”表声。本义是丝的等级，引申为台阶的层次、等级、年级。"},{"char":"结","type":"形声","radical":"纟，吉","benyi":"本义是打结","yanbian":"引申为结束、结果。"},{"char":"绿","type":"形声","trad":"綠","radical":"纟（丝），录","benyi":"本义是绿色的丝帛。","yanbian":"从糸（纟）表意，“录”表声。本义是青中带黄的丝帛，引申为绿色。"},{"char":"绍","type":"形声","trad":"紹","radical":"纟（丝），召","benyi":"本义是接续。","yanbian":"从糸（纟）表意，“召”表声。本义是把丝线接起来，引申为连接双方——介绍。"},{"char":"系","type":"会意","trad":"繫／係","radical":"丿（手），糸（丝）","benyi":"本义是连接、悬挂。","yanbian":"甲骨文像一只手抓着几束丝线，表示把东西连在一起。引申为系统、关系（係）、系鞋带（繫）；简化后这几个字都写成“系”。"},{"char":"聪","type":"形声","trad":"聰","radical":"耳，悤（简化为“总”）","benyi":"本义是听觉灵敏。","yanbian":"从耳表意，“悤”表声。本义是耳朵听得清楚，引申为聪明——听得多、懂得快。"},{"char":"育","type":"会意","radical":"𠫓（倒写的“子”），月（肉）","benyi":"本义是生育。","yanbian":"上面是倒过来的“子”（婴儿头朝下出生），下面是“月”（肉，身体），表示妇女生孩子。引申为养育、教育。"},{"char":"你","type":"形声","radical":"亻（人），尔","benyi":"本义是称呼对方。","yanbian":"古代多用“尔”“汝”表示“你”，后来在“尔”旁加人旁写成“你”，专门用来称呼对方。"},{"char":"少","type":"指事","radical":"小，丿","benyi":"本义是数量不多。","yanbian":"甲骨文“少”和“小”写法接近，都是几个小点（像细小的沙粒），后来在“小”下加一撇分化出来。本义是不多，与“多”相对；读 shào 时指年纪轻（少年）。"},{"char":"多","type":"会意","radical":"夕，夕","benyi":"本义是数量大。","yanbian":"甲骨文是两块叠在一起的肉（形状像“夕”），肉多了就是“多”。本义是数量大，与“少”相对。"},{"char":"今","type":"指事","benyi":"本义是现在、当前。","yanbian":"甲骨文上面像一个倒过来的“口”（一说像屋顶），下面一横指出当下这一刻，说法不一。本义是现在，引申为今天、今年。"},{"char":"作","type":"形声","radical":"亻（人），乍","benyi":"本义是起来、开始做。","yanbian":"甲骨文只写作“乍”，后来加上人旁。本义是起身、兴起，引申为劳作、工作、作业。"},{"char":"所","type":"形声","radical":"户，斤","benyi":"本义是伐木的场所","yanbian":"引申为处所、地方。"},{"char":"见","type":"会意","trad":"見","radical":"目，人（儿）","benyi":"本义是看见。","yanbian":"甲骨文下面是一个人，上面突出一只大眼睛，表示用眼睛看到。引申为见面、见到。简化字根据草书写成“见”。"},{"char":"工","type":"象形","benyi":"本义是工具（曲尺一类）。","yanbian":"甲骨文像古代工匠用的曲尺或夯土工具。本义是工具，引申为工匠、做工、工作。"},{"char":"常","type":"形声","radical":"巾，尚","benyi":"本义是古人下身穿的裙裳。","yanbian":"从巾（布）表意，“尚”表声。本义是下衣（后来写作“裳”），后来借用表示长久不变、经常。"},{"char":"安","type":"会意","radical":"宀（房屋），女","benyi":"本义是安宁。","yanbian":"一个女子安坐在屋子里，表示安宁、安定。引申为安全、安静、安排。"},{"char":"定","type":"形声","radical":"宀（房屋），正","benyi":"本义是安定。","yanbian":"从宀表意，“正”表声（下面的“正”隶变后写成现在的样子）。本义是在屋里安定下来，引申为确定、决定、一定。"},{"char":"兴","type":"会意","trad":"興","radical":"舁（四只手），同","benyi":"本义是抬起、兴起。","yanbian":"甲骨文是四只手一起抬起一件东西（中间的“同”一说是抬东西的架子），本义是抬起、兴起。引申为兴旺、兴趣、高兴。简化字根据草书写成“兴”。"},{"char":"师","type":"会意","trad":"師","radical":"𠂤（小土山），帀（环绕）","benyi":"本义是军队。","yanbian":"繁体“師”左边是“𠂤”（小土山，军队驻扎的地方），右边“帀”表示环绕。本义是军队（古代两千五百人为一师）；军中负责教练的人也叫“师”，引申为老师。"},{"char":"喜","type":"会意","radical":"壴（鼓），口","benyi":"本义是快乐。","yanbian":"上面是“壴”（鼓），下面是“口”，敲着鼓、张嘴唱歌，表示欢乐。本义是高兴，引申为喜欢。"},{"char":"医","type":"形声","trad":"醫","radical":"殹，酉（酒）","benyi":"本义是治病的人。","yanbian":"繁体“醫”下面是“酉”（酒），古人用酒入药、清洗伤口；上面“殹”表声。本义是治病的人，引申为医治、医院。简化字借用了原来表示装箭器具的“医”字。"},{"char":"漂","type":"形声","radical":"氵，票","benyi":"本义是在水面浮动","yanbian":"引申为漂亮（轻盈好看）。"},{"char":"检","type":"形声","trad":"檢","radical":"木，佥","benyi":"本义是封书的木签。","yanbian":"从木表意，“佥”表声。古代在书信、文书外面加一块木片封好并写上题签，叫“检”。引申为约束、查验——检查、检票。"},{"char":"吃","type":"形声","radical":"口，乞","benyi":"本义是说话结巴。","yanbian":"从口表意，“乞”表声。本义是说话不流利（口吃），后来借用代替“喫”，表示吃东西。"},{"char":"然","type":"会意","radical":"肰（犬肉），灬（火）","benyi":"本义是燃烧。","yanbian":"上面是“肰”（狗肉），下面是“火”，用火烤肉，本义是燃烧。后来被借用表示“这样、对的”（当然、虽然），本义就另加火旁写成“燃”。"},{"char":"介","type":"会意","radical":"人，八","benyi":"本义是铠甲。","yanbian":"甲骨文像一个人身上前后披着甲片，本义是铠甲。人在甲的中间，引申为处在两者中间——介绍。"},{"char":"院","type":"形声","radical":"阝（阜），完","benyi":"本义是围墙。","yanbian":"从阜（阝）表意，“完”表声。本义是围墙，引申为有围墙的院子，又指医院、电影院这类机构和场所。"},{"char":"店","type":"形声","radical":"广（房屋），占","benyi":"本义是存放货物、接待客人的屋子。","yanbian":"从
