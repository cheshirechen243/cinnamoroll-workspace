
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>玉桂狗 · 专注力自愈工作台｜专治拖延与走神</title>
<meta name="theme-color" content="#E6F4FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小工作台">
<meta name="application-name" content="小工作台">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --pink:#FFEEF8; --blue:#E6F4FF;
  --pink-2:#FFD9EC; --blue-2:#CFE9FF;
  --pink-deep:#E89BCB; --blue-deep:#7FB8E8;
  --ink:#5A5566; --ink-soft:#8A8599; --ink-fade:#B5B0C0;
  --card:#FFFFFF; --card-2:#FBF7FC;
  --line:#F0E6F2; --shadow:0 10px 30px rgba(180,160,200,.18);
  --shadow-soft:0 4px 14px rgba(180,160,200,.12);
  --radius:26px; --radius-s:16px; --radius-xs:12px;
  --gap:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--pink) 0%,#FFF7FC 40%,#F4FAFF 70%,var(--blue) 100%);background-attachment:fixed;min-height:100vh;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--pink-2);color:#5A4060}
.cloud{position:fixed;pointer-events:none;z-index:0;opacity:.5}
.cloud svg{display:block}
.c1{top:6%;left:55%;width:140px}
.c2{top:70%;left:8%;width:100px}
.c3{top:30%;right:4%;width:80px}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:300px;flex-shrink:0;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid rgba(255,255,255,.7);padding:26px 18px;display:flex;flex-direction:column;gap:16px;height:100vh;position:sticky;top:0;overflow-y:auto;transition:transform .3s ease;}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--pink-2);border-radius:6px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 6px 4px}
.brand .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));display:grid;place-items:center;font-size:24px;cursor:pointer;box-shadow:0 2px 8px rgba(232,155,203,.35);border:2px solid #fff;overflow:hidden;transition:transform .15s}
.brand .avatar:hover{transform:scale(1.05)}
.brand .avatar img{width:100%;height:100%;object-fit:cover}
.brand .t1{font-size:18px;font-weight:700;color:#6B4A6E;letter-spacing:.5px;outline:none;border-bottom:1px dashed transparent;cursor:text}
.brand .t1:focus{border-bottom-color:var(--pink-2)}
.brand .t1:empty:before{content:"输入标题…";color:var(--ink-fade)}
.brand .t2{font-size:11px;color:var(--ink-soft);letter-spacing:2px}
  .side-tools{display:flex;gap:8px;align-items:center}
  .side-tools .btn{flex:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sync-badge{font-size:11px;font-weight:600;color:var(--blue-deep);background:var(--blue);padding:6px 10px;border-radius:10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sync-badge:hover{background:var(--blue-2)}
.side-section .label{font-size:11px;color:var(--ink-fade);letter-spacing:2px;margin:0 0 10px 6px;font-weight:600}
.core-area{background:linear-gradient(135deg,rgba(255,214,236,.4),rgba(207,233,255,.4));border-radius:var(--radius-s);padding:14px 14px 12px;border:1px dashed rgba(232,155,203,.4);}
.core-area .ct{font-size:12px;color:#9A6BA0;font-weight:700;margin-bottom:8px}
.core-list{display:flex;flex-direction:column;gap:7px}
.core-empty{font-size:12px;color:var(--ink-fade);text-align:center;padding:10px 0;line-height:1.6}
.core-task-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-xs);background:rgba(255,255,255,.75);border:1px solid rgba(240,230,242,.6);cursor:pointer;transition:all .18s;position:relative;}
.core-task-item:hover{background:#fff;transform:translateX(2px);box-shadow:var(--shadow-soft)}
.core-task-item.done{background:linear-gradient(135deg,rgba(255,217,236,.5),rgba(207,233,255,.5))}
.core-task-item .icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.core-task-item .nm{flex:1;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.core-task-item .nm.done{text-decoration:line-through;color:var(--ink-fade)}
.core-task-item .core-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--pink-2);flex-shrink:0;display:grid;place-items:center;cursor:pointer;font-size:13px;color:#fff;transition:all .18s}
.core-task-item .core-check.on{background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));border-color:transparent}
.task-list{display:flex;flex-direction:column;gap:9px}
.task-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--radius-s);background:rgba(255,255,255,.7);border:1px solid rgba(240,230,242,.6);cursor:pointer;transition:all .18s ease;position:relative;}
.task-item:hover{background:#fff;transform:translateX(2px);box-shadow:var(--shadow-soft)}
.task-item.active{background:linear-gradient(135deg,#fff,var(--card-2));border-color:var(--pink-2);box-shadow:var(--shadow-soft)}
.task-item .icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.task-item .nm{flex:1;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-item .nm.done{text-decoration:line-through;color:var(--ink-fade)}
.task-item .core-tag{font-size:9px;background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));color:#fff;padding:1px 7px;border-radius:8px;flex-shrink:0}
.task-item .ops{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task-item:hover .ops{opacity:1}
.task-item .ops button{width:22px;height:22px;border-radius:7px;color:var(--ink-soft);font-size:11px;display:grid;place-items:center}
.task-item .ops button:hover{background:var(--pink);color:var(--pink-deep)}
.add-task{display:flex;gap:7px;margin-top:4px}
.add-task input{flex:1;padding:10px 13px;border:1px solid var(--line);border-radius:var(--radius-xs);background:rgba(255,255,255,.8);font-size:13px}
.add-task input:focus{outline:none;border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(255,217,236,.3)}
.btn{padding:10px 14px;border-radius:var(--radius-xs);font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-pink{background:linear-gradient(135deg,var(--pink-2),var(--pink-deep));color:#fff}
.btn-pink:hover{box-shadow:0 6px 16px rgba(232,155,203,.4);transform:translateY(-1px)}
.btn-soft{background:rgba(255,255,255,.85);color:var(--pink-deep);border:1px solid var(--pink-2)}
.btn-soft:hover{background:#fff}
.btn-blue{background:linear-gradient(135deg,var(--blue-2),var(--blue-deep));color:#fff}
.btn-blue:hover{box-shadow:0 6px 16px rgba(127,184,232,.4);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.6);color:var(--ink-soft);border:1px solid var(--line)}
.btn-ghost:hover{background:#fff;color:var(--ink)}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:10px}
.main{flex:1;min-width:0;padding:30px clamp(16px,4vw,46px) 60px;overflow-x:hidden}
.topbar{display:none;align-items:center;gap:12px;margin-bottom:18px}
.topbar .menu-btn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:20px}
.topbar .tb-title{font-size:16px;font-weight:700;color:#6B4A6E;flex:1}
.topbar .tb-diary{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:18px}
.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.detail-head .big-icon{font-size:40px;filter:drop-shadow(0 3px 6px rgba(232,155,203,.3))}
.detail-head h1{font-size:clamp(20px,3.4vw,26px);font-weight:800;color:#6B4A6E;margin:0;letter-spacing:.5px}
.detail-head .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.detail-head .head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.breadcrumb{font-size:12px;color:var(--ink-fade);margin-bottom:22px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border-radius:var(--radius);padding:26px clamp(20px,3vw,30px);box-shadow:var(--shadow);margin-bottom:var(--gap);border:1px solid rgba(255,255,255,.9)}
.card-title{font-size:16px;font-weight:700;color:#6B4A6E;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card-desc{font-size:12px;color:var(--ink-soft);margin:0 0 18px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-block}
.tag-pink{background:var(--pink);color:var(--pink-deep)}
.tag-blue{background:var(--blue);color:var(--blue-deep)}
.tag-archaic{background:#EDE3FF;color:#6B4FB8}
.tag-filter{cursor:pointer;border:none;font-family:inherit}
.tag-filter.active{outline:2px solid currentColor;outline-offset:1px}
.subtask{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:8px;transition:all .2s;border:1px solid transparent}
.subtask:hover{background:#fff;border-color:var(--line)}
.subtask .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--pink-2);flex-shrink:0;display:grid;place-items:center;cursor:pointer;margin-top:1px;transition:all .18s;color:#fff;font-size:12px}
.subtask.done .check{background:linear-gradient(135deg,var(--pink-deep),var(--blue-deep));border-color:transparent}
.subtask.done .st-text{text-decoration:line-through;color:var(--ink-fade)}
.subtask .st-text{flex:1;font-size:14px;line-height:1.5;word-break:break-word}
.subtask.locked{opacity:.5}
.subtask.locked .check{background:var(--line);border-color:var(--line)}
.subtask .lock-note{font-size:10px;color:var(--ink-fade);align-self:center}
.subtask .st-del{opacity:0;width:24px;height:24px;border-radius:8px;color:var(--ink-fade);font-size:14px;display:grid;place-items:center;transition:opacity .15s;background:none;border:none;cursor:pointer;flex-shrink:0}
.subtask:hover .st-del{opacity:.6}
.subtask .st-del:hover{background:var(--pink);color:var(--pink-deep);opacity:1}
.add-sub{display:flex;gap:8px;margin-top:6px}
.add-sub input{flex:1;padding:11px 14px;border:1px dashed var(--pink-2);border-radius:var(--radius-xs);background:rgba(255,238,248,.4);font-size:13px}
.add-sub input:focus{outline:none;background:#fff;border-style:solid;box-shadow:0 0 0 3px rgba(255,217,236,.25)}
.progress-bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-deep),var(--blue-deep));border-radius:8px;transition:width .5s ease}
.progress-txt{font-size:12px;color:var(--ink-soft)}
.notes-area{width:100%;min-height:120px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--card-2);resize:vertical;font-size:14px;line-height:1.7}
.notes-area:focus{outline:none;border-color:var(--pink-2);background:#fff;box-shadow:0 0 0 3px rgba(255,217,236,.2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.input,.select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-xs);background:rgba(255,255,255,.9);font-size:14px;transition:all .15s}
.input:focus,.select:focus{outline:none;border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(255,217,236,.25)}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%23E89BCB' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.item-card{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:10px;border:1px solid transparent;transition:all .15s}
.item-card:hover{background:#fff;border-color:var(--line);box-shadow:var(--shadow-soft)}
.item-card .ic-main{flex:1;min-width:0}
.item-card .ic-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px;word-break:break-word}
.item-card .ic-meta{font-size:11px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap}
.item-card .ic-body{font-size:13px;color:var(--ink);margin-top:5px;line-height:1.6;white-space:pre-wrap}
.item-card .ic-del{width:26px;height:26px;border-radius:9px;color:var(--ink-fade);font-size:15px;display:grid;place-items:center;flex-shrink:0;background:none;border:none;cursor:pointer}
.item-card .ic-del:hover{background:var(--pink);color:var(--pink-deep)}
.ic-del{width:24px;height:24px;border-radius:8px;color:var(--ink-fade);font-size:14px;display:grid;place-items:center;flex-shrink:0;background:none;border:none;cursor:pointer}
.ic-del:hover{background:var(--pink);color:var(--pink-deep)}
.search-box{position:relative;margin-bottom:14px}
.search-box input{width:100%;padding:12px 16px 12px 42px;border:1px solid var(--line);border-radius:var(--radius-xs);background:rgba(255,255,255,.95);font-size:14px}
.search-box input:focus{outline:none;border-color:var(--pink-2);box-shadow:0 0 0 3px rgba(255,217,236,.25)}
.search-box .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6}
.empty-hint{text-align:center;padding:24px;color:var(--ink-fade);font-size:13px;background:var(--card-2);border-radius:var(--radius-s);border:1px dashed var(--line);line-height:1.8}
.quote-card{padding:18px 20px;border-radius:var(--radius-s);background:linear-gradient(135deg,var(--pink),var(--blue));margin-bottom:12px;position:relative;border:1px solid rgba(255,255,255,.8)}
.quote-card .q-text{font-size:15px;line-height:1.8;color:#6B4A6E;font-weight:500}
.quote-card .q-actions{display:flex;gap:8px;margin-top:10px}
.quote-card .q-actions button{font-size:11px;padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.75);color:var(--pink-deep);font-weight:600;border:none;cursor:pointer}
.quote-card .q-actions button:hover{background:#fff}
.quote-card .star{position:absolute;top:14px;right:16px;font-size:18px;cursor:pointer;opacity:.5;background:none;border:none}
.quote-card .star.on{opacity:1}
.kn-block{margin-bottom:18px}
.kn-block h4{margin:0 0 8px;font-size:14px;color:var(--blue-deep);font-weight:700}
.kn-word{padding:14px 16px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:9px;border-left:4px solid var(--pink-2)}
.kn-word .w{font-size:17px;font-weight:800;color:#6B4A6E;margin-bottom:3px}
.kn-word .m{font-size:13px;color:var(--ink);line-height:1.7}
.kn-grammar{padding:16px;border-radius:var(--radius-s);background:linear-gradient(135deg,rgba(207,233,255,.5),rgba(255,238,248,.5));border:1px dashed var(--blue-2)}
.kn-grammar .g-title{font-weight:700;color:var(--blue-deep);margin-bottom:5px}
.kn-example{padding:16px;border-radius:var(--radius-s);background:var(--card-2);border-left:4px solid var(--blue-2)}
.kn-example .ex-orig{font-size:15px;font-weight:700;color:#6B4A6E;margin-bottom:4px;line-height:1.9}
.kn-example .ex-src{font-size:11px;color:var(--ink-fade);margin-bottom:8px}
.kn-example .ex-trans{font-size:13px;color:var(--ink);line-height:1.8}
.mat-card{padding:20px 22px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:12px;border-left:4px solid var(--pink-deep)}
.mat-card .mat-text{font-size:16px;font-weight:600;color:#6B4A6E;line-height:2.1;letter-spacing:1px;white-space:pre-wrap}
.mat-card .mat-src{font-size:11px;color:var(--ink-fade);margin-top:8px}
.mat-card .mat-actions{margin-top:10px}
.piano-piece{padding:18px;border-radius:var(--radius-s);background:var(--card-2);margin-bottom:12px}
.piano-piece.hide{display:none}
.jianpu{font-size:22px;font-weight:700;color:#6B4A6E;letter-spacing:3px;line-height:2.2;white-space:pre-wrap;font-family:'Courier New',monospace;background:#fff;border-radius:var(--radius-xs);padding:16px 20px;border:1px solid var(--line)}
.jianpu .b{color:var(--blue-deep)}
.calli-refresh{text-align:center;margin-top:16px}
.hide{display:none!important}
.video-tab{padding:9px 15px;border-radius:13px;background:var(--card-2);font-size:13px;font-weight:600;color:var(--ink-soft);transition:all .15s;border:1px solid transparent;cursor:pointer}
.video-tab.active{background:linear-gradient(135deg,var(--blue-2),var(--blue-deep));color:#fff}
.video-tab:hover:not(.active){background:#fff}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius-s);overflow:hidden;box-shadow:var(--shadow-soft);background:#000}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-info{font-size:12px;color:var(--ink-soft);margin-top:10px;text-align:center}
.chapter-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chapter-dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.chapter-dot:hover{background:#fff;border-color:var(--pink-2)}
.chapter-dot.active{background:linear-gradient(135deg,var(--pink-2),var(--blue-2));color:#fff;border-color:transparent;box-shadow:var(--shadow-soft)}
.chapter-dot.done{text-decoration:line-through;color:var(--ink-fade);background:rgba(255,217,236,.3)}
.diary-day{display:flex;gap:16px;margin-bottom:16px;align-items:flex-start}
.inspo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inspo-card{padding:14px 12px;border-radius:var(--radius-xs);background:var(--card-2);border:1px solid transparent;cursor:pointer;transition:all .15s;min-height:90px;display:flex;flex-direction:column;gap:6px}
.inspo-card:hover{background:#fff;border-color:var(--pink-2);box-shadow:var(--shadow-soft)}
.inspo-card .iw{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inspo-card .itags{display:flex;gap:6px;flex-wrap:wrap}

.game-room .content{position:relative;min-height:360px}
.room-deco{position:absolute;width:64px;height:64px;transform:translate(-50%,-50%);cursor:grab;z-index:5;touch-action:none;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s}
.room-deco img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.room-deco.selected{box-shadow:0 0 0 3px var(--pink-deep),0 4px 12px rgba(107,74,110,.2);border-radius:12px;background:rgba(255,255,255,.35)}
.room-deco .deco-del{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;background:#FF6B8A;color:#fff;border:none;font-size:13px;display:none;place-items:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.15);z-index:10}
.room-deco.selected .deco-del{display:grid}
.deco-panel{background:var(--card-2);border-radius:var(--radius-s);padding:16px;border:1px solid var(--line);margin-bottom:18px}
.deco-panel h3{margin:0 0 6px;font-size:16px;color:var(--ink)}
.deco-panel .desc{font-size:12px;color:var(--ink-soft);margin-bottom:14px}
.deco-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;margin-bottom:14px}
.deco-slot{aspect-ratio:1;border-radius:14px;background:#fff;border:2px dashed var(--pink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--ink-soft);cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.deco-slot:hover{border-color:var(--pink-deep);color:var(--pink-deep)}
.deco-slot.filled{border-style:solid;border-color:var(--pink-deep);background:rgba(255,217,236,.25);cursor:default}
.deco-slot.filled img{width:100%;height:100%;object-fit:cover}
.deco-slot.locked{border-color:var(--line);background:var(--card-2);cursor:not-allowed;color:var(--ink-fade)}
.deco-slot .slot-hint{font-size:9px;position:absolute;bottom:4px;left:0;right:0;text-align:center}
.deco-controls{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.deco-ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.deco-ctrl-row label{font-size:12px;color:var(--ink);font-weight:600;min-width:40px}
.deco-ctrl-row input[type=range]{flex:1;min-width:120px;accent-color:var(--pink-deep)}
.deco-ctrl-row span{font-size:12px;color:var(--ink-soft);min-width:42px;text-align:right}
.deco-ctrl-row .deco-num{width:54px;padding:3px 6px;border:1px solid var(--pink-2);border-radius:8px;font-size:12px;color:var(--ink);background:#fff;text-align:center}
.deco-ctrl-row .deco-num:focus{outline:none;border-color:var(--pink-deep);box-shadow:0 0 0 2px rgba(232,155,203,.25)}
.deco-ctrl-row .unit{font-size:12px;color:var(--ink-soft)}
.deco-empty{text-align:center;padding:12px;color:var(--ink-soft);font-size:12px;background:#fff;border-radius:12px;border:1px dashed var(--line)}
.deco-slot.selected{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(127,184,232,.3)}

// 图片在发去 Firestore 前先压缩，避免超出单文档大小限制；GIF 保持原样以保留动画
function compressImageFile(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
        else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        let hasAlpha=false;
        if(/^image\/(png|webp|svg)/.test(file.type||'')){
          try{const d=ctx.getImageData(0,0,w,h).data;for(let i=3;i<d.length;i+=4){if(d[i]<250){hasAlpha=true;break;}}}catch(e){}
        }
        if(hasAlpha){
          const wp=canvas.toDataURL('image/webp',Math.max(quality||0.8,0.85));
          resolve(wp.indexOf('data:image/webp')===0?wp:canvas.toDataURL('image/png'));
        }else{
          resolve(canvas.toDataURL('image/jpeg',quality));
        }
      };
      img.onerror=()=>reject(new Error('图片解码失败'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('图片读取失败'));
    reader.readAsDataURL(file);
  });
}
function fileToImageSrc(file,maxDim,quality){
  if(file.type==='image/gif'){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(new Error('图片读取失败'));
      reader.readAsDataURL(file);
    });
  }
  return compressImageFile(file,maxDim,quality);
}

const HSK_WORDS=[{"id":"w1","word":"你好","pinyin":"nǐ hǎo","level":1,"note":"打招呼用语","qa":[],"ex":["你好！","老师，你好！"]},{"id":"w2","word":"谢谢","pinyin":"xiè xiè","level":1,"note":"表示感谢","qa":[],"ex":["谢谢！","谢谢老师！"]},{"id":"w3","word":"再见","pinyin":"zài jiàn","level":1,"note":"离开时的告别语","qa":[],"ex":["明天见，再见！","老师，再见！"]},{"id":"w4","word":"喜欢","pinyin":"xǐ huān","level":1,"note":"对某事物有好感","qa":["你喜欢什么？","你喜欢谁？"],"ex":["你喜欢中国菜吗？","我很喜欢你的新电脑。"]},{"id":"w5","word":"吃饭","pinyin":"chī fàn","level":1,"note":"进食","qa":["你几点吃晚饭？","你今天中午吃了什么？"],"ex":["我们一起去吃饭吧。","他还没吃饭呢。","吃饭前要洗手。","你吃饭了吗？"]},{"id":"w6","word":"喝水","pinyin":"hē shuǐ","level":1,"note":"饮用水","qa":["你渴了会做什么？","一天要喝多少水？"],"ex":["天气很热，多喝水。","我想喝一杯水。","请你喝水吧。","他每天早上喝一杯水。"]},{"id":"w7","word":"学生","pinyin":"xué shēng","level":1,"note":"在校学习的人","qa":["你是学生吗？"],"ex":["我是学生。","他是学生。"]},{"id":"w8","word":"老师","pinyin":"lǎo shī","level":1,"note":"教书的人","qa":["你是老师吗？"],"ex":["老师，您好！","谢谢老师！"]},{"id":"w9","word":"朋友","pinyin":"péngyou","level":1,"note":"友人","qa":["你有朋友吗？"],"ex":["他是我的朋友。","我有很多朋友。"]},{"id":"w10","word":"家","pinyin":"jiā","level":1,"note":"第4课：家庭（我家有四口人）｜第7课：住的地方（在家）｜第9课：量词（一家商店）","qa":["你家有几口人？","---","你晚上在家吗？","---","你家那边有几家商店？"],"ex":["我家有四口人。","他家有三个孩子。","---","他家不大。","我晚上在家。","妈妈现在在家做饭。","---","那边有一家商店。","我家后边有一家饭店。"],"lessons":[4,7,9]},{"id":"w11","word":"今天","pinyin":"jīn tiān","level":1,"note":"说话当天","qa":["今天星期几？"],"ex":["今天是星期一。","今天我很忙。"]},{"id":"w12","word":"明天","pinyin":"míng tiān","level":1,"note":"今天之后的一天","qa":["明天是几号？"],"ex":["明天见。","明天我想去超市。"]},{"id":"w13","word":"现在","pinyin":"xiànzài","level":1,"note":"此时此刻","qa":["现在几点？"],"ex":["我现在很忙。","现在是上午九点。"]},{"id":"w14","word":"多少","pinyin":"duō shǎo","level":1,"note":"询问数量","qa":["你家有多少人？"],"ex":["你有多少个哥哥？","你有多少个孩子？"]},{"id":"w15","word":"漂亮","pinyin":"piào liàng","level":1,"note":"美丽好看","qa":["谁很漂亮？","你漂亮吗？"],"ex":["电脑很漂亮。","她真漂亮。"]},{"id":"w16","word":"工作","pinyin":"gōng zuò","level":1,"note":"职业、劳动","qa":["你工作忙吗？"],"ex":["我工作很忙。","她想工作。"]},{"id":"w17","word":"天气","pinyin":"tiān qì","level":1,"note":"气候状况","qa":["今天天气怎么样？","你喜欢什么天气？冷的还是热的？"],"ex":["今天天气很好。","天气很热。"]},{"id":"w18","word":"看书","pinyin":"kàn shū","level":1,"note":"阅读书籍","qa":["你喜欢看什么书？","你每天看书吗？"],"ex":["我喜欢在家看书。","他正在图书馆看书。","晚上睡前我常常看书。","你在看什么书？"]},{"id":"w19","word":"睡觉","pinyin":"shuìjiào","level":1,"note":"休息入眠","qa":["你几点睡觉？"],"ex":["我想睡觉。","她想睡觉。"]},{"id":"w20","word":"高兴","pinyin":"gāo xìng","level":1,"note":"愉快、开心","qa":["你高兴吗？"],"ex":["认识你，我很高兴。","我很高兴。"]},{"id":"w21","word":"医院","pinyin":"yīyuàn","level":1,"note":"看病的地方","qa":["你想去医院吗？"],"ex":["他在医院工作。","医院在那边。"]},{"id":"w22","word":"出租车","pinyin":"chū zū chē","level":1,"note":"供人雇用的汽车","qa":["你想坐出租车吗？","你坐出租车吗？"],"ex":["我们坐出租车去超市。","这是出租车。"]},{"id":"w23","word":"商店","pinyin":"shāngdiàn","level":1,"note":"卖东西的场所","qa":["商店在哪儿？"],"ex":["商店很漂亮。","这家商店很小。"]},{"id":"w24","word":"锻炼","pinyin":"duànliàn","level":3,"note":"通过运动增强体质","qa":["你每天锻炼身体吗？一般怎么锻炼？","你觉得锻炼身体对学习有帮助吗？","你一个星期锻炼几次？每次锻炼多久？"],"ex":["爬山是一种很好的锻炼。","他每天都锻炼身体，身体很好。","锻炼对健康很重要。","她喜欢在花园里锻炼。","因为他每天都锻炼身体，所以很少生病。"]},{"id":"w25","word":"因为","pinyin":"yīn wèi","level":2,"note":"表示原因","qa":["你因为什么事这么忙？"],"ex":["因为工作，我很忙。","因为下雨，我没去超市。"]},{"id":"w26","word":"所以","pinyin":"suǒ yǐ","level":2,"note":"表示结果","qa":["因为天气冷，所以你会怎么穿衣服？"],"ex":["因为下雨，所以我们没出去。"]},{"id":"w27","word":"虽然","pinyin":"suī rán","level":2,"note":"表示让步","qa":[],"ex":["虽然很忙，我还是想休息。","虽然下雨，他还是去了。"]},{"id":"w28","word":"已经","pinyin":"yǐ jīng","level":2,"note":"表示动作完成","qa":[],"ex":["天已经黑了。"]},{"id":"w29","word":"机场","pinyin":"jīchǎng","level":1,"note":"飞机起降的场所","qa":["你想去机场接谁？"],"ex":["我去机场接朋友。","机场在北京。"]},{"id":"w30","word":"经常","pinyin":"jīng cháng","level":2,"note":"表示频率高","qa":["你经常运动吗？","你经常去哪家餐厅吃饭？"],"ex":["我们经常一起吃饭。"]},{"id":"w31","word":"认识","pinyin":"rènshi","level":1,"note":"知道某人或某事，见过、认得","qa":["你认识我吗？","你认识王老师吗？"],"ex":["很高兴认识你。","我不认识你，你叫什么名字？","认识你，我也很高兴。"]},{"id":"w32","word":"介绍","pinyin":"jiè shào","level":2,"note":"使双方相互了解","qa":["你能给我介绍一家好吃的餐厅吗？"],"ex":["请你自我介绍一下。","朋友给我介绍了一份工作。","老师给大家介绍了新同学。","你能给我介绍一下这道菜吗？"]},{"id":"w35","word":"旅游","pinyin":"lǚ yóu","level":2,"note":"外出游览观光","qa":[],"ex":["他喜欢一个人旅游。","旅游让我认识了很多新朋友。"]},{"id":"w36","word":"准备","pinyin":"zhǔn bèi","level":2,"note":"预先安排或筹备","qa":[],"ex":["妈妈正在准备晚饭。"]},{"id":"w37","word":"决定","pinyin":"juédìng","level":3,"note":"拿定主意；也指拿定的主意","qa":["你最近决定了什么重要的事情？","你决定来中国学汉语的时候，家人同意吗？","如果要决定去哪儿旅游，你一般听谁的？"],"ex":["我们决定这个周末去草原旅游。","因为这个房子离公司很近，所以他决定住在这儿。","虽然这个决定很难，但是我觉得是对的。","买哪件衣服，你自己决定吧。","她想了很久，最后决定不去了。"]},{"id":"w39","word":"提高","pinyin":"tígāo","level":3,"note":"使水平、成绩等比原来高","qa":["你觉得怎么做才能提高汉语水平？","最近你有什么提高了很多？"],"ex":["每天多说多练，可以提高汉语水平。","因为他每天练习，所以成绩提高得很快。","老师要求我们提高作业的水平。","虽然提高得不快，但是她一直很努力。","这个方法能帮助大家提高学习成绩。"]},{"id":"w40","word":"检查","pinyin":"jiǎnchá","level":3,"note":"仔细查看，看有没有问题","qa":["考试以后，你会检查自己写的汉字吗？","你多久去医院检查一次身体？","出门以前，你会检查什么？"],"ex":["医生给他检查了身体，说没有问题。","出门以前，请检查一下门关了没有。","做完作业以后，一定要认真检查一遍。","因为他身体不舒服，所以去医院做检查了。","坐飞机以前，要检查护照和行李。"]},{"id":"w42","word":"饭馆","pinyin":"fàn guǎn","level":2,"note":"吃饭的地方","qa":[],"ex":["这家饭馆的菜很好吃。","我们去那家新开的饭馆试试吧。","饭馆里人很多，要排队。"]},{"id":"w43","word":"节目","pinyin":"jiémù","level":3,"note":"表演或电视、电台播出的项目","qa":["你喜欢看什么电视节目？","晚会上你最喜欢哪个节目？"],"ex":["我喜欢看旅游节目。","因为这个节目很有意思，所以每个星期我都看。","晚会上有很多好看的节目。","虽然节目很晚才开始，但是大家都在等。","我们班准备了一个唱歌的节目。"]},{"id":"w44","word":"联系","pinyin":"lián xì","level":2,"note":"彼此接触、沟通","qa":["你们还有联系吗？","有事你会怎么联系我？"],"ex":["有什么事请随时联系我。","我们已经很久没联系了。","请留下你的联系方式。","到了以后请跟我联系。"]},{"id":"w45","word":"安排","pinyin":"ān pái","level":2,"note":"有计划地处理事情","qa":["你周末怎么安排？","公司会怎么安排你的工作？"],"ex":["这次旅行是他安排的。","老师给我们安排了一次考试。","你的时间安排得很好。","公司安排我下周出差。"]},{"id":"w46","word":"解决","pinyin":"jiějué","level":3,"note":"处理问题，使问题没有了","qa":["遇到问题的时候，你一般怎么解决？","你觉得什么问题最难解决？"],"ex":["这个问题我们已经解决了。","因为问题没有解决，所以大家都很着急。","我们一起想办法解决这个问题吧。","虽然问题很多，但是我们一个一个地解决了。","如果你解决不了，就去问经理。"]},{"id":"w47","word":"羡慕","pinyin":"xiàn mù","level":2,"note":"因喜爱而希望自己也拥有","qa":["你羡慕别人什么？","别人会羡慕你什么？"],"ex":["我很羡慕她的好口语。","大家都很羡慕他的好工作。","别羡慕别人，做好自己。","我羡慕你有这么多时间旅游。"]},{"id":"w48","word":"坚持","pinyin":"jiān chí","level":2,"note":"持续做某事不放弃","qa":["你能坚持每天锻炼吗？","学汉语最难坚持的是什么？"],"ex":["坚持锻炼身体很重要。","他坚持每天读书一小时。","无论多累，她都坚持学习。","只要坚持下去，就一定能成功。"]},{"id":"w49","word":"周末","pinyin":"zhōumò","level":3,"note":"一个星期的最后两天（星期六、星期天）","qa":["周末你一般做什么？","这个周末你有什么打算？"],"ex":["周末我们一起去动物园吧。","因为周末不上班，所以我睡得很晚。","她每个周末都去超市买菜。","虽然周末很短，但是我们玩得很开心。","这个周末天气很好，我想去爬山。"]},{"id":"w50","word":"打算","pinyin":"dǎsuàn","level":3,"note":"计划要做某事（还没做）","qa":["这个周末你打算做什么？和谁一起？","你以后打算在哪个城市生活？为什么？","学完汉语以后，你打算做什么工作？"],"ex":["我打算放假的时候坐高铁去北京旅游。","因为明天要考试，所以我打算今天晚上好好复习。","他打算下个月搬家，现在正在找房子。","虽然我打算早上六点起床，但是七点才起来。","你打算什么时候去银行办信用卡？"]},{"id":"w51","word":"啊","pinyin":"a","level":3,"note":"语气助词，感叹词","qa":[],"ex":["你在看什么啊？"]},{"id":"w52","word":"跟","pinyin":"gēn","level":3,"note":"一起，和的意思。","qa":[],"ex":["昨天你跟妈妈打电话了吗？"]},{"id":"w53","word":"一直","pinyin":"yìzhí","level":3,"note":"表示动作持续不断","qa":["你有没有一直想去但还没去过的地方？","你小时候一直想做什么工作？","你一直都很喜欢吃的菜是什么？"],"ex":["她一直想去草原看看。","我一直很喜欢骑马。","飞机一直没有起飞，我们都很着急。","他一直住在这个小区。","虽然外面一直在下雨，但是我们还是出去了。"]},{"id":"w54","word":"游戏","pinyin":"yóuxì","level":3,"note":"玩的活动；电脑、手机上的游戏","qa":["你喜欢玩什么游戏？","你觉得玩游戏好不好？为什么？"],"ex":["我弟弟很喜欢玩手机游戏。","因为玩游戏玩得太晚，所以他早上起不来。","这个游戏很有意思，我们一起玩吧。","虽然游戏很好玩，但是不能玩太久。","上课的时候，老师和我们玩了一个汉字游戏。"]},{"id":"w55","word":"作业","pinyin":"zuòyè","level":3,"note":"老师让学生课后做的练习","qa":["你每天做作业要多长时间？","你觉得老师给学生很多作业好不好？为什么？"],"ex":["今天的作业很多，我得早一点儿回家。","因为作业没写完，所以他不能出去玩。","老师，这是我的作业。","虽然作业有点儿难，但是我都做完了。","做完作业以后，我们一起去打网球吧。"]},{"id":"w56","word":"着急","pinyin":"zháojí","level":3,"note":"心里不安、想赶快解决","qa":["你什么时候会觉得很着急？请说一说那时候怎么样。","朋友迟到的时候，你会着急吗？你会怎么做？","考试以前你会不会很着急？为什么？"],"ex":["我的行李丢了，我现在非常着急。","别着急，慢慢说，我们一起想。","他找工作找了很长时间也没找到，非常着急。","考试快到了，她有点儿着急。","你别着急，我们的时间还很多。"]},{"id":"w57","word":"复习","pinyin":"fùxí","level":3,"note":"再学一遍学过的东西","qa":["下课回家以后，你会怎么复习？","考试以前，你一般复习多长时间？"],"ex":["明天要考试，今天晚上我得好好复习。","因为复习得很认真，所以她考得很好。","每天复习一遍，就不容易忘记。","虽然复习很累，但是很有用。","我们一起去图书馆复习吧。"]},{"id":"w58","word":"南方","pinyin":"nánfāng","level":3,"note":"南边的地方；在中国多指长江以南","qa":["你喜欢南方还是北方？为什么？","你觉得南方和北方的菜有什么不同？"],"ex":["南方的冬天不太冷，很舒服。","因为南方常常下雨，所以出门要带伞。","我是南方人，不太习惯北方的冬天。","虽然南方的夏天很热，但是水果很多。","明年我打算去中国南方旅游。"]},{"id":"w59","word":"北方","pinyin":"běifāng","level":3,"note":"北边的地方；在中国多指长江以北","qa":["你去过中国的北方吗？觉得怎么样？","你觉得北方人和南方人有什么不一样？"],"ex":["北方的冬天很冷，常常刮大风。","因为北方人喜欢吃面条，所以这里有很多面馆。","我第一次去北方的时候，觉得特别冷。","虽然北方冬天很冷，但是房间里一点儿也不冷。","北京在中国的北方。"]},{"id":"w60","word":"面包","pinyin":"miànbāo","level":1,"note":"一种食物","qa":["你喜欢吃面包吗？"],"ex":["我喜欢吃面包。","这个面包很好吃。"]},{"id":"w61","word":"带","pinyin":"dài","level":3,"note":"随身携带","qa":["出国旅游的时候，你觉得应该带哪些重要的东西？","你每天出门的时候一定会带什么东西？","你带过朋友去你最喜欢的饭店吗？"],"ex":["出国的时候，要带好护照和手机。","请你带上你的行李，我们要走了。","她这次旅游带了很多漂亮的衣服。","我今天忘了带手机，觉得不太舒服。","带着家人一起去旅游，虽然累，但是很快乐。"]},{"id":"w62","word":"地图","pinyin":"dìtú","level":3,"note":"画着地方、路的图","qa":["你去一个新的城市的时候，会看地图吗？","你会用手机上的地图吗？好用吗？"],"ex":["我们看一下地图，找找路。","因为有手机地图，所以我们没有走错路。","请给我一张北京地图。","虽然有地图，但是我们还是没找到那家饭店。","桌子上有一张中国地图。"]},{"id":"w63","word":"搬","pinyin":"bān","level":3,"note":"移动物体","qa":["你搬过很多东西吗？累不累？","如果你要搬很多东西，你会请谁帮忙？","你觉得搬东西的时候应该注意什么？"],"ex":["请帮我搬一下这个箱子。","这个冰箱太大了，一个人搬不动。","他们正在把家里的东西搬到新房子。","他们一起把冰箱搬到新房子里。","虽然箱子里的东西很多，但是他一个人就搬上去了。"]},{"id":"w64","word":"腿","pinyin":"tuǐ","level":3,"note":"人和动物走路用的身体部分；桌椅等的支撑部分","qa":["你觉得一张椅子有几条腿最好？","你跑步以后，腿会疼吗？"],"ex":["我踢足球的时候，腿有点儿疼。","因为爬了一天的山，所以我的腿很累。","小狗有四条腿，跑得很快。","虽然他的腿不太舒服，但是还是去上班了。","你坐了很久了，站起来走一走，动一动腿吧。"]},{"id":"w65","word":"疼","pinyin":"téng","level":3,"note":"","qa":["听我说话， 你头疼吗？"],"ex":["妈妈很疼我。","看到孩子哭，奶奶很心疼。"]},{"id":"w66","word":"脚","pinyin":"jiǎo","level":3,"note":"人和动物走路时着地的部分","qa":["你走路走多了，脚会疼吗？","你觉得小狗的脚可爱吗？"],"ex":["我走了一天，脚很疼。","因为鞋太小了，所以我的脚很不舒服。","冬天的时候，我的脚常常很冷。","虽然他的脚不太好，但是每天都走路上班。","小猫的脚很小，很可爱。"]},{"id":"w67","word":"树","pinyin":"shù","level":3,"note":"木本植物","qa":["你家附近有没有很多树？","你喜欢什么树？为什么？","你觉得城市里需要多一点儿树吗？"],"ex":["山上有很多树，很漂亮。","这个树长得很高，比房子还高。","我们在树下拍照，觉得很舒服。","花园里种了很多树。","我们小区不但有很多树，而且还有一个大花园。"]},{"id":"w68","word":"容易","pinyin":"róng yì","level":3,"note":"","qa":["老师给的作业容易吗？","你容易喜欢上什么样的人？"],"ex":["最近天气不好，很容易生病。","她又要工作又要照顾孩子，真不容易啊。","他们好不容易找到我这儿。","喝冷水容易生病。"]},{"id":"w69","word":"难","pinyin":"nán","level":3,"note":"不容易","qa":["汉语和英语，哪个更难？为什么？","你觉得汉语里最难的是什么？"],"ex":["这次考试很难，很多人都没考好。","因为汉字很难写，所以我每天都练习。","虽然数学题很难，但是他都做对了。","这个问题太难了，我不知道怎么回答。","刚开始学汉语的时候，我觉得很难。"]},{"id":"w70","word":"太太","pinyin":"tài tài","level":3,"note":"","qa":[],"ex":["他的太太是我的表妹。","妹妹看到老太太上公交车，就给她让座。","他是我太太认识的一个人。","你太太还在生你的气呢。"]},{"id":"w71","word":"秘书","pinyin":"mì shū","level":3,"note":"","qa":["你经理有几个秘书？","他的秘书是哪国人 ？"],"ex":["过十分钟, 张秘书才有空儿。","他的秘书会汉语和英语。","他的新秘书是一个刚毕业的大学生。","别的事情就跟我的秘书说吧。","秘书对我来说是一个很好的工作。"]},{"id":"w72","word":"经理","pinyin":"jīnglǐ","level":3,"note":"公司里负责管理的人","qa":["你觉得一个好经理应该是什么样的人？","你们经理对大家好吗？说一说。"],"ex":["我们经理工作很认真，每天很晚才回家。","因为经理出差了，所以今天的会议不开了。","经理让我明天把笔记本电脑带来。","虽然他很年轻，但是已经是经理了。","如果有问题，你可以直接去问经理。"]},{"id":"w73","word":"办公室","pinyin":"bàngōngshì","level":3,"note":"办公的房间","qa":["你们老师的办公室在几层？","你在办公室工作的时候，最常做什么？"],"ex":["老师在办公室里等你。","因为办公室里人很多，所以我去外面打电话。","下课以后，请到我的办公室来一下。","他的办公室在十层，很大也很干净。","虽然办公室不太大，但是很安静。"]},{"id":"w74","word":"辆","pinyin":"liàng","level":3,"note":"车的量词","qa":["你家一共有几辆车？都是什么颜色的？","你觉得一个家里需要几辆车？为什么？"],"ex":["我家有一辆白色的车，是爸爸去年买的。","路口有很多辆出租车在等客人。","因为这辆车太旧了，所以他想换一辆新的。","虽然这辆自行车不太贵，但是骑起来很舒服。","那辆红色的车是谁的？开得太快了。"]},{"id":"w75","word":"楼","pinyin":"lóu","level":3,"note":"","qa":[],"ex":["坐这里可以看见高楼。","没有人住在对面那栋楼里。","我们听见她下楼了。","我住在 16 楼，他住在 5 楼。"]},{"id":"w76","word":"拿","pinyin":"ná","level":3,"note":"","qa":["你知道谁拿我的汉语书？"],"ex":["你爱拿多少就拿多少。"]},{"id":"w77","word":"把","pinyin":"bǎ","level":3,"note":"第10课：介词，把字句（把书放在桌子上）｜第12课：量词（一把伞、一把椅子）","qa":["你每天回家以后，会把书包放在哪儿？","你会把重要的东西放在哪里？","---","你出门的时候会带一把伞吗？为什么？","你家里有几把椅子？都是什么颜色的？"],"ex":["请把作业放在桌子上。","因为下雨了，所以我把衣服拿回房间了。","他把笔记本忘在教室里了。","虽然作业很多，但是她今天把作业都写完了。","请你把这个句子读一遍。","---","外面下雨了，你带一把伞吧。","因为教室里的椅子太少了，所以我们又拿来了几把。","我的那把伞丢了，只好借朋友的。","虽然这把伞有点儿旧，但是还很好用。","桌子旁边有三把椅子，你坐吧。"],"lessons":[10,12]},{"id":"w78","word":"伞","pinyin":"sǎn","level":3,"note":"下雨或太阳大时打在头上的东西","qa":["今天你带伞了吗？为什么？","你觉得下雨天用伞好还是穿雨衣好？"],"ex":["今天会下雨，你别忘了带伞。","因为没带伞，所以我借了同事的伞。","如果你有伞，可以让我跟你一起走吗？","这把伞是新买的，很漂亮。","风太大了，伞一点儿用也没有。"]},{"id":"w79","word":"胖","pinyin":"pàng","level":3,"note":"身体脂肪多，和“瘦”相对","qa":["你觉得怎么做才能不胖？","你觉得小猫胖一点儿可爱吗？"],"ex":["他最近吃得太多，胖了三公斤。","因为每天吃蛋糕，所以她越来越胖了。","虽然他有点儿胖，但是跑得很快。","我家的猫很胖，不太喜欢动。","如果你不想胖，就要多运动。"]},{"id":"w80","word":"其实","pinyin":"qíshí","level":3,"note":"实际上（说出真实的情况）","qa":["有没有一件事，大家都以为你喜欢，其实你不喜欢？","你觉得学汉语其实难不难？"],"ex":["他看起来很累，其实他很开心。","大家都以为他不来了，其实他已经到了。","其实这个问题不难，你再想想。","虽然他说不想去，但是其实他很想去。","这件衣服看起来很贵，其实很便宜。"]},{"id":"w81","word":"瘦","pinyin":"shòu","level":3,"note":"身体脂肪少","qa":["你觉得自己现在瘦了还是没有瘦？","你觉得一个人太瘦了好不好？为什么？","你觉得怎么做才能又健康又瘦？"],"ex":["她这个月瘦了很多，是不是生病了？","我觉得他比去年瘦了。","这条裤子太瘦了，我穿不下。","他工作很忙，所以瘦了不少。","医生说她太瘦了，应该多吃饭。"]},{"id":"w82","word":"还是","pinyin":"hái shì","level":3,"note":"","qa":[],"ex":["天冷了，你还是多穿点儿吧。"]},{"id":"w83","word":"爬山","pinyin":"pá shān","level":3,"note":"","qa":["你喜欢爬山吗？","爬山的时候要准备什么东西？"],"ex":["我的脚一直疼，周末不能爬山了。","今年夏天，我会带我太太去爬山。","明天不管天气怎么样，我都要去爬山。","星期天我们去爬山，晚上回来。"]},{"id":"w84","word":"小心","pinyin":"xiǎoxīn","level":3,"note":"注意、留神，防止出问题","qa":["你觉得过马路的时候，应该怎么小心？","朋友出门旅游的时候，你会让他小心什么？"],"ex":["路上车很多，你开车的时候要小心一点儿。","小心！前面有车，你别走了。","因为地上有水，所以大家走路要小心。","如果你一个人去旅游，一定要小心自己的护照。","她很小心地把照片放进了箱子里。"]},{"id":"w85","word":"条","pinyin":"tiáo","level":3,"note":"","qa":[],"ex":["这条裤子很漂亮。","这条裤子很好看。"]},{"id":"w86","word":"裤子","pinyin":"kù zi","level":3,"note":"","qa":[],"ex":["这条裤子很漂亮。","我想买裤子。"]},{"id":"w87","word":"记得","pinyin":"jì de","level":3,"note":"","qa":["我怎么能不记得呢？"],"ex":["我不记得在哪儿见过你了。"]},{"id":"w88","word":"衬衫","pinyin":"chèn shān","level":3,"note":"","qa":["你喜欢什么颜色的衬衫？","你们上学／上班的时候要穿白衬衫吗？"],"ex":["他给自己买了三件衬衫。","帮我拿一件新的衬衫。","办公室坐着一个穿白衬衫工作的人。","这边卖女衬衫，你想买红色还是绿色？","昨天逛街的时候，我给妈妈买了一件新衬衫。"]},{"id":"w89","word":"元","pinyin":"yuán","level":1,"note":"货币单位","qa":["这苹果多少元？"],"ex":["这本书十元。","苹果五元一斤。"]},{"id":"w90","word":"新鲜","pinyin":"xīnxiān","level":3,"note":"刚生产或刚做好、没有变坏的","qa":["你一般去哪儿买新鲜的水果？","你觉得新鲜的菜和放了很久的菜有什么不一样？"],"ex":["这些水果都是今天早上的，非常新鲜。","虽然超市的菜比较贵，但是很新鲜。","因为鱼不新鲜了，所以我们没有买。","我们去海边吃新鲜的鱼吧。","早上去买菜，菜最新鲜。"]},{"id":"w91","word":"甜","pinyin":"tián","level":3,"note":"像糖或蜜那样的味道","qa":["你喜欢吃甜的东西吗？最喜欢什么？","你觉得吃太多甜的东西对身体好吗？"],"ex":["这个西瓜很甜，你尝一尝。","虽然蛋糕很甜，但是我只能吃一点儿。","因为她喜欢吃甜的，所以我们买了很多蛋糕。","这杯奶茶太甜了，我不想喝了。","香蕉放几天以后，吃起来会更甜。"]},{"id":"w92","word":"只","pinyin":"zhǐ","level":3,"note":"仅仅、单单","qa":["你今天只吃了早饭吗？为什么？","如果你一天只能吃一种东西，你会选什么？"],"ex":["我只喝了一杯水，没有吃东西。","他只想休息，不想说话。","这个问题只有老师知道。","我们班只有他一个人会说英语。","她只吃了半碗饭就说饱了。"]},{"id":"w93","word":"放","pinyin":"fàng","level":3,"note":"把东西放在某个地方","qa":["你的桌子上都放着些什么？","回家以后，你一般把包放在哪儿？"],"ex":["桌子上放着一杯奶茶，你先喝吧。","请把书放回书包里。","因为冰箱太小了，所以放不下这么多水果。","虽然房间不大，但是放了很多东西。","你把手机放在哪儿了？"]},{"id":"w94","word":"饮料","pinyin":"yǐnliào","level":3,"note":"可以喝的液体食品","qa":["你去饭店的时候，一般会点什么饮料？","你最喜欢喝什么饮料？为什么喜欢？","你觉得饮料喝多了对身体好不好？"],"ex":["请给我们一些饮料。","这家店的饮料又便宜又好喝。","夏天的时候，我喜欢喝冷饮料。","孩子不应该喝太多饮料，对身体不好。","菜单上有很多饮料，你想喝哪个？"]},{"id":"w95","word":"或者","pinyin":"huòzhě","level":3,"note":"表示选择，这个或那个都可以","qa":["你周末一般做什么？看电影或者打球？","你出去玩的时候，一般坐地铁或者打车？"],"ex":["明天或者后天，我们一起去看电影吧。","你可以坐地铁或者坐公交车去机场。","因为很忙，所以我一般吃方便面或者点外卖。","周末我常常在家看书或者听音乐。","如果你有问题，可以问老师或者问同学。"]},{"id":"w96","word":"花","pinyin":"huā","level":3,"note":"","qa":[],"ex":["老太太喜欢穿花衣服。","她开一个花店卖鲜花。"]},{"id":"w97","word":"绿","pinyin":"lǜ","level":3,"note":"","qa":["饮料放在哪儿？","男的想喝什么？","女的最喜欢喝什么？","她喜欢什么时候喝？"],"ex":["我每天早上都喝一杯绿茶。","这件衬衫花花绿绿的，不好看。","经理的办公室的门是绿色的。","冬天哪儿有红花绿叶啊！"]},{"id":"w98","word":"照片","pinyin":"zhàopiàn","level":3,"note":"拍摄的影像","qa":["你手机里有没有一个对你来说很重要的照片？是什么照片？","你喜欢把照片发给朋友看吗？一般发什么照片？","你最喜欢哪张照片？可以说一说是在哪儿照的吗？"],"ex":["你手机里有没有一个很重要的照片？","这是我家人的照片，我经常带在包里。","她的照片很漂亮，本人也很漂亮。","我丢了一个很重要的照片，现在很不高兴。","请给我看看你旅游的照片，好吗？","护照上有一个照片，是新照片。"]},{"id":"w99","word":"年级","pinyin":"niánjí","level":3,"note":"学校里按学习年数分的级","qa":["你上几年级的时候开始学外语？","你们学校一个年级有多少个班？"],"ex":["我弟弟今年上三年级。","因为他是一年级的学生，所以还不太了解学校。","我们年级有很多外国学生。","虽然她才二年级，但是汉语说得很好。","下个学期我就要上四年级了。"]},{"id":"w100","word":"又","pinyin":"yòu","level":3,"note":"表示重复或几种情况同时存在","qa":["最近有没有什么事情又发生了一次？请说一说。","你有没有一本书看完了，又想再看一次？"],"ex":["他昨天来了，今天又来了。","这个孩子又高又瘦，长得很快。","我又忘了带手机，真不方便。","她又生病了，这个月已经是第二次了。","这个菜又好吃又便宜，我们下次再来吃。"]},{"id":"w101","word":"聪明","pinyin":"cōng míng","level":3,"note":"","qa":["什么样的人算聪明？","你喜欢跟聪明人做朋友吗？为什么？"],"ex":["她是班上最聪明的学生。","他有时聪明的，也有时不聪明的。","你一向这样又漂亮又聪明。","聪明人不会错过这次机会的。","其实，我一点也不聪明。","人们都喜欢聪明人，一听就懂，一学就会。"]},{"id":"w102","word":"热情","pinyin":"rèqíng","level":3,"note":"待人真诚、有感情","qa":["你觉得一个热情的人应该怎么对客人？","你觉得哪个国家的人最热情？为什么？","你去朋友家做客的时候，他们热情吗？"],"ex":["这家饭店的服务员非常热情。","她对每个客人都很热情，大家都喜欢她。","他是一个热情的人，经常帮助别人。","谢谢你这么热情地帮助我。","服务员对客人很热情，用起来很方便。"]},{"id":"w103","word":"努力","pinyin":"nǔlì","level":3,"note":"用很大的力气去做","qa":["你觉得自己学汉语努力吗？","为了学好汉语，你做了哪些努力？"],"ex":["她学习很努力，每天都复习。","因为他工作很努力，所以大家都很喜欢他。","只要努力，就能学好汉语。","虽然努力了，但是这次成绩还是不太好。","我们一起努力，一定能得到好成绩。"]},{"id":"w104","word":"总是","pinyin":"zǒngshì","level":3,"note":"一直、经常","qa":["你有没有总是忘记做的一件事？","你的朋友里谁总是迟到？","你总是在什么时候学习汉语？"],"ex":["他总是很忙，很少休息。","她总是第一个到学校。","这个问题我总是做不对，很着急。","你总是这么热情，谢谢你。","因为他总是迟到，所以老师有点儿生气。"]},{"id":"w105","word":"回答","pinyin":"huí dá","level":3,"note":"","qa":["这个问题怎么回答？","不会回答 = 答不上来。"],"ex":["她总是很热情地回答同学的问题。","他没回答，怕不小心让她难过。","等我想好了再给你回答。"]},{"id":"w106","word":"站","pinyin":"zhàn","level":3,"note":"站立；车站","qa":["你每天从哪个车站坐车去学校？","你觉得上课的时候站着说话好还是坐着说话好？","你家离哪个地铁站最近？走路要多久？"],"ex":["请你站在这儿等我。","我在车站等了你很长时间。","她站了很长时间，觉得有点儿累。","下一站就是机场，请大家准备好。","他站在服务台前边，问了一个问题。"]},{"id":"w107","word":"饿","pinyin":"è","level":3,"note":"肚子空、想吃东西","qa":["你今天几点开始觉得饿？中午吃了什么？","你饿的时候最想吃什么？为什么？","你觉得饿的时候去超市买东西，会不会买太多？"],"ex":["我今天没吃早饭，现在很饿。","他工作太忙，饿了也没时间吃饭。","孩子饿了就会不高兴，你快给他做饭吧。","我们先吃一点儿东西，别让大家饿着。","如果你饿了，冰箱里有蛋糕，你可以吃。"]},{"id":"w108","word":"超市","pinyin":"chāoshì","level":1,"note":"可以自己挑选商品的大商店","qa":["你想去超市买什么？","你家那边有超市吗？"],"ex":["我想去超市。","超市有很多东西。","我明天去超市买牛奶。"]},{"id":"w109","word":"蛋糕","pinyin":"dàngāo","level":3,"note":"一种甜点","qa":["你喜欢吃什么蛋糕？一般什么时候吃？","你自己做过蛋糕吗？难不难？","过生日的时候，你一定要吃蛋糕吗？"],"ex":["今天是她的生日，我们买了一个蛋糕。","这家店的蛋糕又好吃又便宜。","他一个人吃了半个蛋糕。","服务员，请问有没有蛋糕？","妈妈做的蛋糕，我们都很喜欢。"]},{"id":"w110","word":"年轻","pinyin":"niánqīng","level":3,"note":"岁数不大","qa":["你觉得年轻的时候应该多做些什么事情？","你觉得年轻人最喜欢听的音乐是哪一种？","你想在年轻的时候去哪些国家旅游？"],"ex":["她虽然是老师，但是很年轻，也很漂亮。","年轻的时候，我很喜欢跟朋友一起旅游。","他是一位很年轻的医生，每天工作很忙。","年轻人应该多学习，也应该多运动。","这位年轻的老师教得很好，学生都很喜欢她。"]},{"id":"w111","word":"认真","pinyin":"rènzhēn","level":3,"note":"做事仔细、不马虎","qa":["你觉得自己是一个认真的人吗？","上课的时候，你们班谁最认真？"],"ex":["她上课的时候听得很认真。","因为他工作很认真，所以经理很满意。","请大家认真看黑板。","虽然这次作业不难，但是你也要认真做。","他认真地回答了老师的问题。"]},{"id":"w112","word":"客人","pinyin":"kèrén","level":3,"note":"被请来的人；也指来买东西、吃饭的人","qa":["家里来客人的时候，你会做什么？","你觉得做客人的时候应该注意什么？"],"ex":["今天家里要来客人，妈妈做了很多菜。","因为客人很多，所以饭店里很忙。","服务员很热情地欢迎客人。","虽然客人不多，但是我们准备了很多菜。","客人走了以后，我们一起打扫房间。"]},{"id":"w113","word":"发烧","pinyin":"fāshāo","level":3,"note":"生病时身体的温度比平时高","qa":["你发烧的时候会做什么？","你小时候发烧，家人会怎么照顾你？"],"ex":["我昨天发烧了，没去上班。","孩子发烧了，妈妈很着急。","发烧的时候要多喝水，多休息。","因为发烧了，所以医生让他住院。","虽然他发烧了，但是还是去参加了考试。"]},{"id":"w114","word":"为","pinyin":"wèi","level":3,"note":"介词，给、替（为你高兴、为公司工作）","qa":["你为家人做过什么让他们高兴的事？","朋友考试考得很好，你会为他高兴吗？"],"ex":["这是我为你准备的生日礼物。","听说你找到了好工作，我真为你高兴。","妈妈每天为我们做饭，很累。","因为这件事，大家都为他担心。","他为这家公司工作了十年。"]},{"id":"w115","word":"照顾","pinyin":"zhàogù","level":3,"note":"关心、帮助（别人的生活）","qa":["你生病的时候，谁来照顾你？","你照顾过小动物吗？"],"ex":["妈妈生病了，我在家照顾她。","因为爸爸妈妈很忙，所以奶奶照顾我。","谢谢你这几天的照顾。","虽然工作很忙，但是他每天都照顾好自己的猫。","我是新来的，请大家多照顾。"]},{"id":"w116","word":"用","pinyin":"yòng","level":3,"note":"使用","qa":["你觉得用筷子还是用勺子吃饭更方便？","你每天用手机做什么？用多长时间？","你觉得用电脑学习汉语方便吗？"],"ex":["请问，这个可以用吗？","她用手机给朋友打电话。","我们上课的时候要用汉语说话。","这个勺子用起来不太方便。","服务员很热情，用汉语问我们要吃什么。"]},{"id":"w117","word":"感冒","pinyin":"gǎnmào","level":3,"note":"一种常见的病，会头疼、发烧等","qa":["你感冒的时候，一般会怎么做？","你觉得怎么做才能不感冒？"],"ex":["我感冒了，今天不能去上课。","因为昨天下雨没带伞，所以他感冒了。","感冒的时候要多喝水、多休息。","虽然只是有点儿感冒，但是她还是去医院看了看。","最近天气变化很大，很多人都感冒了。"]},{"id":"w118","word":"季节","pinyin":"jìjié","level":3,"note":"一年里按天气分成的春、夏、秋、冬","qa":["你最喜欢哪个季节？为什么？","你们那儿哪个季节最舒服？"],"ex":["春天是我最喜欢的季节。","因为这个季节不冷也不热，所以大家都喜欢出去玩。","每个季节都有不一样的水果。","虽然这个季节常常下雨，但是很凉快。","秋天是去北京旅游最好的季节。"]},{"id":"w119","word":"当然","pinyin":"dāngrán","level":3,"note":"应该这样、没有问题","qa":["你来中国以后，当然想去很多地方，你最想去哪儿？","朋友请你帮忙，你一般会说“当然可以”吗？"],"ex":["你来我家做客，我当然欢迎。","他是中国人，当然会用筷子。","当然可以，你想用多久都行。","因为他每天练习，所以当然说得很好。","这件事我当然记得，你不用担心。"]},{"id":"w120","word":"春天","pinyin":"chūntiān","level":3,"note":"一年里的第一个季节，冬天以后","qa":["春天的时候，你喜欢去哪儿玩？","你们那儿的春天是什么样的？"],"ex":["春天来了，树绿了，花也开了。","因为春天不冷也不热，所以很多人出去旅游。","我最喜欢春天，因为到处都是花。","虽然是春天，但是今天还有点儿冷。","春天的时候，公园里的人特别多。"]},{"id":"w121","word":"草","pinyin":"cǎo","level":3,"note":"","qa":["吃草的动物有哪些？"],"ex":["树和草都绿了，来在草地上坐坐。","羊在山上吃草。","中医药店里放着各种草药。","这些花草的名字我一个也不知道。"]},{"id":"w122","word":"夏天","pinyin":"xiàtiān","level":3,"note":"一年里最热的季节","qa":["夏天你喜欢做什么？","你觉得夏天最热的时候，去哪儿最好？"],"ex":["这里的夏天非常热。","因为夏天太热了，所以我每天都开空调。","今年夏天，我打算去海边旅游。","虽然夏天很热，但是可以吃很多西瓜。","夏天的白天很长，七点多天还很亮。"]},{"id":"w123","word":"裙子","pinyin":"qúnzi","level":3,"note":"围在腰部以下的服装","qa":["你喜欢穿什么颜色的裙子？","你觉得什么时候穿裙子最好看？"],"ex":["这条裙子太长了，我想换一条短一点儿的。","她穿上新裙子，很高兴地去参加晚会了。","虽然这条裙子有点儿贵，但是我很喜欢。","因为天气冷了，所以她不穿裙子了。","妈妈给我买了一条黄色的裙子。"]},{"id":"w124","word":"最近","pinyin":"zuìjìn","level":3,"note":"离现在不久的一段时间","qa":["你最近在忙什么？忙得怎么样？","你最近有没有看什么好看的电影？","最近天气怎么样？你喜欢吗？"],"ex":["我最近工作很忙，常常很晚才回家。","因为最近天气很冷，所以很多人都感冒了。","最近我对中国文化越来越感兴趣。","虽然最近很忙，但是我每天都锻炼身体。","你最近怎么样？身体好吗？"]},{"id":"w125","word":"越","pinyin":"yuè","level":3,"note":"“越……越……”：程度随着情况变化而加深；也说“越来越”","qa":["你觉得汉语越学越难，还是越学越容易？","你觉得最近天气越来越冷了吗？"],"ex":["雨越下越大，我们快回家吧。","她的汉语越来越好了。","这个菜越吃越好吃。","因为天气越来越热，所以大家都喜欢在家开空调。","你越着急，事情越做不好。"]},{"id":"w126","word":"眼睛","pinyin":"yǎn jīng","level":3,"note":"","qa":["你的眼睛多少度？"],"ex":["她的眼睛很漂亮。","我的眼睛不舒服。"]},{"id":"w127","word":"突然","pinyin":"tūrán","level":3,"note":"事情来得很快、没想到","qa":["你走在路上的时候，突然下雨了，你会怎么办？","如果你的手机突然没电了，你会怎么做？"],"ex":["我们正在上课，突然电脑没电了。","因为他突然生病了，所以今天没来上班。","外面突然刮起了大风，好像要下雨了。","虽然事情来得很突然，但是大家都不着急。","他突然想起来，今天是妈妈的生日。"]},{"id":"w128","word":"离开","pinyin":"líkāi","level":3,"note":"从某个地方走开，不在一起了","qa":["你离开家的时候，一般会带什么？","如果要离开你的城市，你最想带走什么？"],"ex":["离开教室的时候，请关灯。","因为工作的关系，他离开了北京。","她离开家已经三年了，很想家人。","虽然不想离开，但是我得回国了。","他刚离开，你给他打个电话吧。"]},{"id":"w129","word":"清楚","pinyin":"qīngchu","level":3,"note":"容易让人看懂、听懂；也指了解得很明白","qa":["你能看清楚黑板上的字吗？","这个问题你清楚了吗？还有不明白的地方吗？"],"ex":["老师讲得很清楚，我都听懂了。","因为坐得太远，所以我看不清楚黑板。","请你说清楚一点儿，我没听明白。","虽然我去过那里，但是记不清楚路了。","这个问题我也不太清楚，你问问老师吧。"]},{"id":"w130","word":"刚才","pinyin":"gāngcái","level":3,"note":"刚过去不久的时候","qa":["你刚才在做什么？做完了吗？","老师刚才说的，你都听懂了吗？"],"ex":["刚才经理找你，你去哪儿了？","因为刚才下了一场大雨，所以路上都是水。","我刚才吃了一个苹果，现在不饿。","虽然刚才还很热，但是现在刮风了，凉快多了。","他刚才还在这儿，现在不知道去哪儿了。"]},{"id":"w131","word":"帮忙","pinyin":"bāng máng","level":3,"note":"","qa":[],"ex":["你能帮忙吗？","谢谢你帮忙。"]},{"id":"w132","word":"特别","pinyin":"tèbié","level":3,"note":"与众不同、格外","qa":["你有没有特别喜欢的一个地方？为什么特别喜欢？","你觉得你的国家有什么特别好吃的菜？","你今天有没有特别想做的事情？"],"ex":["这个地方特别漂亮。","她今天特别高兴，笑得很开心。","草原的月亮特别大。","我特别喜欢吃鸡肉。","因为今天是她的生日，所以她特别开心。"]},{"id":"w133","word":"讲","pinyin":"jiǎng","level":3,"note":"说；讲解","qa":["你喜欢听老师讲故事吗？","你能给我们讲一讲你们国家的节日吗？"],"ex":["老师给我们讲了一个很有意思的故事。","因为他讲得太快，所以我没听明白。","请你再讲一遍，好吗？","虽然这个问题很难，但是老师讲得很清楚。","爷爷常常给我们讲他小时候的事。"]},{"id":"w134","word":"明白","pinyin":"míngbai","level":3,"note":"知道、懂得；清楚","qa":["老师讲的这个问题，你明白了吗？","你不明白的时候，会马上问老师吗？"],"ex":["我不明白这个句子的意思。","因为老师讲得很清楚，所以大家都明白了。","你明白了吗？还有问题吗？","虽然他没说，但是我明白他的意思。","我现在才明白，妈妈是为了我好。"]},{"id":"w136","word":"音乐","pinyin":"yīnyuè","level":3,"note":"有节奏、旋律的声音艺术","qa":["你喜欢听什么音乐？为什么喜欢？","你学习的时候喜欢听音乐吗？为什么？","你觉得哪个国家的音乐最好听？"],"ex":["她很喜欢听音乐，每天都要听。","我们在草原上听音乐。","这个音乐很好听，我很喜欢。","晚上听音乐让人很舒服。","她一边听音乐，一边打扫房间。"]},{"id":"w137","word":"公园","pinyin":"gōngyuán","level":3,"note":"大家休息、玩的地方，有树有花","qa":["你家附近有公园吗？你常去吗？","你喜欢在公园里做什么？"],"ex":["周末我们常去公园走一走。","因为公园离家很近，所以我每天去那儿跑步。","公园里有很多树和花，很漂亮。","虽然公园不大，但是人很多。","下午我们一起去公园坐船吧。"]},{"id":"w138","word":"睡着","pinyin":"shuì zháo","level":3,"note":"","qa":["最近你睡得着吗？"],"ex":["我一直想这个问题，一夜没睡着。","明天要考试了，他着急得怎么也睡不着。","病人睡着了，你们出去聊天儿吧。","有时候我上课，听着听着就睡着了。","今天太累了，一上床就睡着了。"]},{"id":"w139","word":"更","pinyin":"gèng","level":3,"note":"表示程度又高了一层","qa":["你觉得学汉语，说更难还是写更难？","你觉得夏天更好还是冬天更好？为什么？"],"ex":["这件衣服很好看，那件更好看。","今天比昨天更冷，你多穿一点儿吧。","因为每天练习，所以她的汉语说得更好了。","虽然坐高铁很快，但是坐飞机更快。","我喜欢吃苹果，更喜欢吃西瓜。"]},{"id":"w140","word":"同事","pinyin":"tóngshì","level":3,"note":"在一起工作的人","qa":["你和你的同事关系怎么样？","你觉得好同事应该是什么样的？"],"ex":["我的同事都很热情，常常帮助我。","因为同事生病了，所以我帮他做了一些工作。","下班以后，我常常和同事一起吃饭。","虽然我们是同事，但是也是好朋友。","新来的同事是法国人，汉语说得很好。"]},{"id":"w141","word":"以前","pinyin":"yǐqián","level":3,"note":"现在或某个时间之前","qa":["你来中国以前，对中国有什么了解？","你以前住在哪儿？跟现在住的地方有什么不一样？","你学汉语以前，学过别的外语吗？"],"ex":["我以前不会用筷子，现在用得很好。","睡觉以前，请把手机关了。","他以前住在南方，后来搬到了北方。","出门以前，你要检查一下有没有带护照。","虽然我以前来过这儿，但是现在变化太大了，我都不认识了。"]},{"id":"w142","word":"银行","pinyin":"yínháng","level":3,"note":"金融机构","qa":["你去银行一般是办什么事情？","你家附近有没有银行？远不远？","你觉得在银行工作累不累？"],"ex":["我要去银行办信用卡。","银行在服务台旁边。","她在银行工作，每天都很忙。","银行离我家不远，很方便。","因为今天是星期天，所以银行里的人特别多。"]},{"id":"w143","word":"久","pinyin":"jiǔ","level":3,"note":"时间长","qa":["你等一个人的时候，最长等过多久？","你学汉语学了多久了？","你觉得要学多久，才能说好汉语？"],"ex":["我们等了很久，飞机才起飞。","好久不见，你还好吗？","他去草原旅游了很久。","这件事我们想了很久，还是不知道怎么办。","因为等了很久，所以孩子们都有点儿累了。"]},{"id":"w144","word":"感兴趣","pinyin":"gǎn xìngqù","level":3,"note":"对某事有兴趣","qa":["你对什么事情特别感兴趣？","你对中国的什么东西最感兴趣？","你对音乐感兴趣吗？喜欢听什么？"],"ex":["我对汉语很感兴趣。","她对音乐特别感兴趣。","他对爬山不太感兴趣。","孩子对新鞋很感兴趣。","因为我对中国文化感兴趣，所以来中国学习汉语。"]},{"id":"w145","word":"结婚","pinyin":"jiéhūn","level":3,"note":"男女双方正式成为夫妻","qa":["在你的国家，结婚的时候有什么特别的习惯？","你参加过朋友结婚的晚会吗？说一说那天的事。"],"ex":["他们结婚已经十年了，生活得很开心。","我姐姐下个月结婚，我要回家参加。","虽然他们结婚不久，但是已经买了房子。","因为要结婚了，所以他们在找新房子。","他们结婚的时候，来了很多朋友。"]},{"id":"w146","word":"欢迎","pinyin":"huānyíng","level":3,"note":"高兴地迎接","qa":["朋友来你家做客的时候，你会怎么欢迎他们？","你觉得你的城市欢迎外国人吗？","你最想欢迎哪位朋友来你家？"],"ex":["欢迎你来我家做客。","这里的人都很欢迎客人。","服务员热情地欢迎我们。","欢迎大家来草原旅游。","如果你们有时间，欢迎来我们学校看看。"]},{"id":"w147","word":"迟到","pinyin":"chídào","level":3,"note":"比规定的时间晚到","qa":["你上学或者上班的时候经常迟到吗？为什么？","如果朋友总是迟到，你会怎么跟他说？","你觉得跟别人见面的时候迟到，是不是很不好？"],"ex":["因为路上车太多，所以我今天上课迟到了。","快一点儿！我们要迟到了。","虽然他起床很早，但是还是迟到了。","如果你明天再迟到，老师会生气的。","她每天都来得很早，一次也没有迟到过。"]},{"id":"w148","word":"半","pinyin":"bàn","level":1,"note":"二分之一","qa":["现在几点半？"],"ex":["现在八点半。","我下午一点半上课。"]},{"id":"w149","word":"接","pinyin":"jiē","level":1,"note":"到某个地方去迎接别人","qa":["明天谁去机场接你？","你想去机场接谁？"],"ex":["我明天去机场接我的女朋友。","爸爸开车去学校接我。","下午我要去机场接朋友。"]},{"id":"w150","word":"刻","pinyin":"kè","level":3,"note":"一刻钟，15分钟","qa":["现在是几点几刻？我们要迟到了。","你一般早上几点几刻起床？"],"ex":["我们八点一刻见面吧。","他等了一刻，你才来。","从这儿到宾馆要走一刻的时间。","飞机差一刻就要起飞了。","因为飞机八点一刻起飞，所以我们六点就要出门。"]},{"id":"w151","word":"差","pinyin":"chà","level":3,"note":"不好、不够标准；缺少、不够（差十分八点）","qa":["你觉得自己哪门课比较差？为什么？","如果考试成绩很差，你会怎么办？"],"ex":["他的数学成绩很差，他很着急。","因为这家饭店的服务很差，所以我们不去了。","现在差十分八点，我们快走吧。","虽然我的汉语还很差，但是我每天都在努力。","我的作业还差一点儿就写完了。"]},{"id":"w152","word":"满意","pinyin":"mǎnyì","level":3,"note":"符合心愿、感到高兴","qa":["你对现在的工作或学习满意吗？为什么？","你对你现在住的房子满意吗？为什么？","你对自己今天做的事情满意吗？"],"ex":["她对这次旅游很满意。","客人对服务员的服务很满意。","我对这个房子很满意。","他对自己的工作不太满意。","虽然这个房子不太大，但是我们对它很满意。"]},{"id":"w153","word":"电梯","pinyin":"diàntī","level":3,"note":"楼里上下楼用的机器","qa":["你家的楼有电梯吗？你一般坐电梯还是走楼梯？","如果电梯坏了，你又住在二十层，你会怎么办？"],"ex":["我家住在十五层，每天都要坐电梯。","因为电梯坏了，所以我们只能走楼梯。","电梯里的人太多了，我们等下一个吧。","虽然坐电梯很方便，但是走楼梯可以锻炼身体。","请问，电梯在哪儿？我要去十层。"]},{"id":"w154","word":"层","pinyin":"céng","level":3,"note":"计量楼层的量词","qa":["你家住在第几层？喜欢住高层还是低层？","你们学校一共有几层？你们班在第几层？","你喜欢住在高层吗？为什么？"],"ex":["我家住在五层，很喜欢那里。","这个房子一共有二十层。","她住的房间在三层。","这个房子一共有二十层，很高。","因为电梯坏了，所以我们只能走到十层。"]},{"id":"w155","word":"害怕","pinyin":"hài pà","level":3,"note":"","qa":["你最害怕什么？"],"ex":["别害怕，有我在呢。","她的词典里没有“害怕”这个词。"]},{"id":"w156","word":"熊猫","pinyin":"xióng māo","level":3,"note":"","qa":["你怎么带着熊猫眼来上课啊，昨天睡不着吗？","去哪儿可以看到熊猫？"],"ex":["熊猫是中国的国宝。","我最喜欢熊猫，因为它们特别可爱。","很多外国人没有见过大熊猫。","这已经是熊猫妈妈生下来的第三个小熊猫了。","我去上海动物园，终于看到熊猫了！","这个熊猫小娃娃送给你。"]},{"id":"w157","word":"见面","pinyin":"jiàn miàn","level":3,"note":"","qa":["你什么时候跟奶奶爷爷见面？"],"ex":["她生气了，最近不想跟男朋友见面了。","我们好几年没见面了，你想我吗？","他一见面就喜欢上这个人了。","上次我们见面，你还没这么瘦呢。"]},{"id":"w158","word":"安静","pinyin":"ānjìng","level":3,"note":"没有声音、不吵","qa":["你学习的时候，一定要很安静吗？","你觉得你住的地方安静吗？为什么？"],"ex":["图书馆里很安静，大家都在看书。","请大家安静一下，老师要说话了。","因为这个小区很安静，所以我们决定住在这儿。","虽然这家饭店的菜不太多，但是环境很安静。","孩子们都睡着了，家里很安静。"]},{"id":"w159","word":"可乐","pinyin":"kě lè","level":3,"note":"","qa":["你喜欢喝可乐吗？","可乐对身体好吗？"],"ex":["他的冰箱里全是可乐。","可乐是世界上最受欢迎的饮料之一。","一杯可乐和一片面包就是他每天的早饭。","我表姐家有一条白毛狗，叫可乐。","我到对面的饮料机那儿买瓶可乐再回来。"]},{"id":"w160","word":"一会儿","pinyin":"yíhuìr","level":3,"note":"很短的时间；也表示过不久","qa":["你一会儿要做什么？","你每天学习的时候会休息一会儿吗？"],"ex":["你等我一会儿，我马上就来。","我们一会儿去超市吧。","因为太累了，所以他休息了一会儿。","虽然只睡了一会儿，但是他觉得舒服多了。","一会儿下雨，一会儿刮风，天气变化很大。"]},{"id":"w161","word":"马上","pinyin":"mǎshàng","level":3,"note":"立刻、很快","qa":["你的朋友迟到的时候，他会不会说马上就到？","考试马上就要开始了，你会做什么？","你跟朋友说马上就到的时候，一般还要多久才到？"],"ex":["你等一下，我马上就到。","菜马上就好，请你再等一会儿。","他说他马上就来，可是我们等了很长时间也没来。","考试马上要开始了，大家快坐好。","我马上要去机场接朋友，先走了。"]},{"id":"w162","word":"洗手间","pinyin":"xǐ shǒu jiān","level":3,"note":"","qa":[],"ex":["她哭着跑进洗手间去了。"]},{"id":"w163","word":"老","pinyin":"lǎo","level":3,"note":"","qa":[],"ex":["他现在太老了，不能工作了。","我在回来的路上遇到一个老同学。","他是我以前在北京工作的老同事。","我们还是老地方见吧？","中国有句老话：真金不怕火来烧。"]},{"id":"w164","word":"几乎","pinyin":"jīhū","level":3,"note":"差不多、接近于","qa":["你几乎每天都做的事情是什么？","你几乎不吃的东西是什么？为什么？"],"ex":["他几乎每天都去球场锻炼。","因为工作太忙，所以我几乎没有时间休息。","这个汉字太难了，几乎没有人会写。","虽然他来中国不久，但是已经几乎能听懂老师讲的汉语了。","我们几乎是一起到的。"]},{"id":"w165","word":"变化","pinyin":"biànhuà","level":3,"note":"和原来不一样的地方","qa":["你觉得你的国家这几年有什么变化？","你学汉语以后，生活有什么变化？"],"ex":["这几年，我们的城市有很大的变化。","因为天气变化很大，所以很多人感冒了。","他离开的这几年，老家有很大的变化。","虽然变化很大，但是我还是很喜欢这里。","如果时间有变化，我会马上告诉你。"]},{"id":"w166","word":"健康","pinyin":"jiànkāng","level":3,"note":"身体好，没有病","qa":["你觉得怎么做身体才能健康？","你觉得健康和钱哪个更重要？为什么？"],"ex":["多运动、早睡觉，对健康很好。","因为爷爷每天锻炼，所以身体很健康。","虽然工作很重要，但是健康更重要。","我希望家人都健康快乐。","吃太多方便面对健康不好。"]},{"id":"w167","word":"重要","pinyin":"zhòngyào","level":3,"note":"有很大意义或作用","qa":["对你来说，什么事情最重要？请说一说。","你觉得学汉语的时候，什么最重要？为什么？","对学生来说，身体重要还是成绩重要？"],"ex":["身体好对每个人来说都很重要。","这是一个很重要的问题。","护照对出国旅游的人来说很重要。","她是我最重要的家人。","学好汉语对我的工作很重要。"]},{"id":"w168","word":"中文","pinyin":"zhōngwén","level":1,"note":"中国的语言文字","qa":["你想学习中文吗？"],"ex":["我的中文老师是中国人。","她是法国人，也学习中文。"]},{"id":"w169","word":"班","pinyin":"bān","level":3,"note":"","qa":[],"ex":["我们在中学是同一个班。","坐在那边都是我的同班同学。","我们在学校上完课，晚上还要上一个中文补习班。"]},{"id":"w170","word":"一样","pinyin":"yíyàng","level":3,"note":"相同、没有区别","qa":["你跟朋友长得一样吗？你们有什么不一样的地方？","你觉得中国人的生活跟你们国家的一样吗？","你和你的好朋友有什么一样的爱好？"],"ex":["这件衣服跟那件衣服的颜色一样，都很好看。","她跟我姐姐长得一样。","我们想的不一样，但是我们还是朋友。","这双新鞋跟那双一样大，都是我的。","虽然我们是好朋友，但是我们的爱好不一样。"]},{"id":"w171","word":"最后","pinyin":"zuìhòu","level":3,"note":"时间或次序在所有的后面","qa":["下课以后，你们班谁最后离开教室？","你最后一次去旅游是什么时候？"],"ex":["最后一个人离开了，教室突然很安静。","他一直跑到最后，终于得了第一名。","因为最后一个问题太难了，所以我没做完。","我们最后决定去海边旅游。","虽然开始很难，但是最后我们都学会了。"]},{"id":"w172","word":"放心","pinyin":"fàngxīn","level":3,"note":"心里安定，不担心","qa":["你一个人出去旅游，家人放心吗？","你觉得怎么做才能让爸爸妈妈放心？"],"ex":["放心吧，我会照顾好自己的。","因为他每天都给妈妈打电话，所以妈妈很放心。","医生说没问题，你就放心吧。","虽然孩子长大了，但是妈妈还是不放心。","你把东西放在我这儿，放心吧。"]},{"id":"w173","word":"一定","pinyin":"yídìng","level":3,"note":"必然、肯定","qa":["你决定做一件事以后，会不会一定要做完？","你觉得学好汉语一定要来中国吗？","明天你一定要做完的事情是什么？"],"ex":["他一定会来的，你放心吧。","我们一定要去草原看看。","她说的一定是对的，你相信她吧。","如果明天下雨，你还会一定要出去吗？","如果你明天来北京，我一定去机场接你。"]},{"id":"w174","word":"担心","pinyin":"dānxīn","level":3,"note":"放心不下，心里不安","qa":["你最担心的事情是什么？","考试以前，你会担心吗？为什么？"],"ex":["妈妈很担心我的身体。","别担心，他马上就到了。","因为明天有考试，所以我有点儿担心。","虽然爸爸不说，但是我知道他很担心我。","他一个人去旅游，我很担心他。"]},{"id":"w175","word":"比较","pinyin":"bǐjiào","level":3,"note":"相对地、较为","qa":["你比较喜欢爬山还是比较喜欢去海边？","你比较喜欢吃中国菜还是你们国家的菜？","你觉得汉语里什么比较难？"],"ex":["这件大衣比较贵，我买不起。","她比较喜欢安静的环境。","我比较喜欢喝茶，不太喜欢喝咖啡。","这条路比较近，我们走这边吧。","因为这家饭店的菜比较好吃，所以客人比较多。"]},{"id":"w176","word":"了解","pinyin":"liǎojiě","level":3,"note":"知道得很清楚","qa":["你觉得谁最了解你？为什么？","你对中国的哪个城市最了解？"],"ex":["我想多了解中国文化。","因为不太了解这个城市，所以我们先看了地图。","我们认识很多年了，他很了解我。","虽然学了一年汉语，但是我对中国还不太了解。","你可以在网上了解一下这个学校。"]},{"id":"w177","word":"先","pinyin":"xiān","level":3,"note":"表示时间在前","qa":["出门旅游以前，你会先做什么准备？","早上起床以后，你先做什么？","做作业的时候，你先做简单的还是先做难的？"],"ex":["我们先去宾馆，再去海边。","你先说，我等一下再说。","先关灯，再关空调，然后出门。","请先看菜单，再点菜。","如果你饿了，就先吃一点儿东西吧。"]},{"id":"w178","word":"中间","pinyin":"zhōngjiān","level":3,"note":"两端之间的位置","qa":["在教室里，你喜欢坐在中间还是旁边？","拍照的时候，你喜欢站在中间还是旁边？为什么？","你家和学校中间有没有商店或者饭店？"],"ex":["他坐在我们中间，我们一起说笑。","桌子中间有一杯茶。","照片中间站着的人是我妈妈。","我站在他和她中间。","这个商店和那个商店中间有一家饭店。"]},{"id":"w179","word":"参加","pinyin":"cānjiā","level":3,"note":"加入某个活动或组织","qa":["你参加过什么比赛？得到了什么成绩？","你在学校参加过运动会吗？参加了什么？","如果有汉语比赛，你想参加吗？"],"ex":["我明天要参加一个重要的考试。","因为他身体不舒服，所以没参加今天的比赛。","欢迎大家来参加我的生日晚会。","虽然第一次参加比赛，但是她一点儿也不紧张。","这次运动会，我们班有二十个人参加。"]},{"id":"w180","word":"影响","pinyin":"yǐngxiǎng","level":3,"note":"对别人或别的事起作用、使发生变化","qa":["谁对你的影响最大？为什么？","你觉得玩手机会影响学习吗？"],"ex":["晚上看手机会影响睡觉。","因为下大雨，所以比赛受到了影响。","爸爸对我的影响很大，我很爱他。","虽然天气不好，但是没有影响我们去爬山。","请你小声一点儿，别影响别人学习。"]},{"id":"w181","word":"个子","pinyin":"gè zi","level":3,"note":"","qa":["你喜欢什么个子的人？"],"ex":["他的个子很高。","她个子不高。"]},{"id":"w182","word":"矮","pinyin":"ǎi","level":3,"note":"身材短；高度小，与“高”相对","qa":["你们家谁最矮？他有多高？","你喜欢住在矮一点儿的楼里吗？为什么？"],"ex":["我比哥哥矮一点儿，但是比妹妹高。","因为他个子矮，所以老师让他坐在前面。","这张桌子太矮了，写字很不舒服。","虽然他个子很矮，但是篮球打得非常好。","山下有很多矮矮的房子，很漂亮。"]},{"id":"w183","word":"历史","pinyin":"lìshǐ","level":3,"note":"过去发生的事；也指历史课","qa":["你喜欢学历史吗？为什么？","你对哪个国家的历史最感兴趣？"],"ex":["我对中国历史很感兴趣。","因为历史课很有意思，所以大家都很喜欢上历史课。","这个城市有很长的历史。","虽然历史不太好学，但是很有用。","他是我们学校的历史老师。"]},{"id":"w184","word":"体育","pinyin":"tǐyù","level":3,"note":"锻炼身体的运动，也指体育课","qa":["你喜欢上体育课吗？为什么？","你最喜欢看什么体育比赛？"],"ex":["我们每个星期有三节体育课。","因为喜欢体育，所以他每天都去球场。","他是我们学校的体育老师。","虽然他数学不太好，但是体育非常好。","看体育比赛的时候，他常常很紧张。"]},{"id":"w185","word":"数学","pinyin":"shùxué","level":3,"note":"研究数和图形的一门课","qa":["你数学好吗？你喜欢上数学课吗？","你觉得数学和汉语，哪个更难？"],"ex":["我妹妹的数学很好，每次考试成绩都很好。","因为数学作业太多，所以我今天很晚才睡觉。","虽然数学很难，但是我很喜欢。","我们的数学老师讲得很清楚。","他这次数学考得很好，老师很满意。"]},{"id":"w186","word":"方便","pinyin":"fāngbiàn","level":3,"note":"便利、容易","qa":["你觉得点外卖方便还是自己做饭方便？","你觉得你家附近买东西方便吗？","你觉得坐地铁方便还是打车方便？为什么？"],"ex":["坐地铁去机场很方便。","点外卖虽然方便，可是没有自己做饭健康。","这个勺子用起来很方便。","服务台在这儿，问问题很方便。","如果方便的话，请你帮我一下。"]},{"id":"w187","word":"自行车","pinyin":"zìxíngchē","level":3,"note":"用脚踩着骑的两轮车","qa":["你会骑自行车吗？是谁教你的？","你觉得骑自行车上班好不好？为什么？"],"ex":["我每天骑自行车去学校，只要十分钟。","因为今天下雨，所以我没骑自行车，坐地铁去了。","他的自行车丢了，他很着急。","虽然骑自行车有点儿累，但是可以锻炼身体。","周末我们一起骑自行车去公园吧。"]},{"id":"w188","word":"骑","pinyin":"qí","level":3,"note":"跨坐在动物或车上","qa":["你会骑马吗？平时骑自行车多吗？","你觉得骑自行车去学校方便吗？","你第一次骑自行车是几岁的时候？"],"ex":["我们在草原上骑马。","他每天骑自行车上班。","孩子们喜欢骑马，觉得很好玩。","她不会骑车，也不会骑马。","因为学校离家不远，所以我每天骑自行车上学。"]},{"id":"w189","word":"旧","pinyin":"jiù","level":3,"note":"用了很久的、过去的，与“新”相对","qa":["你家里有没有一件用了很久的旧东西？","你觉得旧衣服应该怎么办？"],"ex":["这件衣服太旧了，我想买一件新的。","虽然这个手机有点儿旧，但是还很好用。","他把旧书都送给了邻居的孩子。","我们搬家的时候，把旧沙发也带走了。","因为房子太旧了，所以他们打算换一个新的。"]},{"id":"w190","word":"换","pinyin":"huàn","level":3,"note":"更换","qa":["你上次换新手机是什么时候？为什么想换？","你来中国以后换过房子吗？为什么换？","你觉得换一个新环境学习会更好吗？"],"ex":["我想换一件新衣服。","这条裤子太短了，我要去换一条。","她换了新工作，现在很忙。","服务员，我想换一个碗。","因为这个房子离公司太远，所以我们想换一个房子。"]},{"id":"w191","word":"地方","pinyin":"dìfang","level":3,"note":"某个地点、某个部分","qa":["上课的时候，有不明白的地方，你会怎么做？","你最想去的地方是哪儿？为什么？"],"ex":["下雨了，我们先找个地方休息吧。","这是一个很安静的地方，适合学习。","因为这个地方很漂亮，所以很多人来这儿拍照。","虽然这个地方很远，但是我还是想去看看。","你有不明白的地方，可以问我。"]},{"id":"w192","word":"中介","pinyin":"zhōng jiè","level":3,"note":"","qa":["为什么中介知道你的手机号码？"],"ex":["他哥哥是做中介服务的。","她的丈夫是婚姻中介介绍的。","现在想租房都要在网上找中介。","听说这家中介公司骗了很多客人的钱。","中介公司会给你介绍各种留学方案。"]},{"id":"w193","word":"主要","pinyin":"zhǔyào","level":3,"note":"最重要的、起决定作用的","qa":["你学汉语主要是为了什么？","你平时主要用手机做什么？"],"ex":["我们学校的学生主要是外国人。","因为这里主要是住的地方，所以很安静。","他来北京主要是为了学习汉语。","虽然他会很多运动，但是主要打网球。","这次考试主要考第一课到第五课。"]},{"id":"w194","word":"环境","pinyin":"huánjìng","level":3,"note":"周围的自然或社会条件","qa":["你觉得一个好的学习环境应该怎么样？","你喜欢现在住的地方的环境吗？为什么？","你觉得城市里的环境好，还是草原上的环境好？"],"ex":["这个小区的环境很好。","好的环境对身体健康很重要。","这家饭店的环境很干净。","我很喜欢学校的学习环境。","因为这里的环境很安静，所以我喜欢在这儿学习。"]},{"id":"w195","word":"附近","pinyin":"fùjìn","level":3,"note":"离某个地方不远的地方","qa":["你家附近有什么好吃的饭店？","你们学校附近有公园吗？"],"ex":["我家附近有一个很大的公园。","因为学校附近有地铁站，所以上学很方便。","附近新开了一家咖啡店，我们去看看吧。","虽然附近有很多饭店，但是我最喜欢这一家。","请问，这儿附近有银行吗？"]},{"id":"w196","word":"大家","pinyin":"dàjiā","level":1,"note":"指所有的人","qa":[],"ex":["大家好！","谢谢大家！"]},{"id":"w197","word":"好","pinyin":"hǎo","level":1,"note":"表示满意、良好","qa":[],"ex":["你好！","老师好！"]},{"id":"w198","word":"们","pinyin":"men","level":1,"note":"用在人称代词或名词后表示复数","qa":[],"ex":["学生们，再见！","老师们好！"]},{"id":"w199","word":"您","pinyin":"nín","level":1,"note":"你的敬称","qa":[],"ex":["您好！","谢谢您！"]},{"id":"w200","word":"你们","pinyin":"nǐmen","level":1,"note":"称呼多个对方","qa":[],"ex":["你们好！","谢谢你们！"]},{"id":"w201","word":"不客气","pinyin":"bú kèqi","level":1,"note":"回应感谢的客套话","qa":[],"ex":["不客气！","不客气，再见！"]},{"id":"w202","word":"同学","pinyin":"tóngxué","level":1,"note":"共同学习的人","qa":["你们是同学吗？"],"ex":["同学，你好！","同学们，再见！"]},{"id":"w203","word":"请问","pinyin":"qǐngwèn","level":1,"note":"礼貌地提出问题","qa":[],"ex":["请问，您是老师？","请问，你叫什么名字？"]},{"id":"w204","word":"你","pinyin":"nǐ","level":1,"note":"称呼对方","qa":[],"ex":["你是学生。","你是老师吗？"]},{"id":"w205","word":"叫","pinyin":"jiào","level":1,"note":"称为、名字是","qa":["你叫什么名字？"],"ex":["他叫什么名字？","老师，您叫什么名字？"]},{"id":"w206","word":"什么","pinyin":"shénme","level":1,"note":"询问事物","qa":["你叫什么名字？"],"ex":["你叫什么？","这是什么？"]},{"id":"w207","word":"名字","pinyin":"míngzi","level":1,"note":"人或事物的称呼","qa":["你叫什么名字？"],"ex":["请问，你叫什么名字？","他叫什么名字？"]},{"id":"w208","word":"我","pinyin":"wǒ","level":1,"note":"称呼自己","qa":[],"ex":["我是学生。","我是学生，我很高兴。"]},{"id":"w209","word":"不","pinyin":"bù","level":1,"note":"否定副词","qa":[],"ex":["我不是老师。","他不是老师，是学生。"]},{"id":"w210","word":"是","pinyin":"shì","level":1,"note":"表判断","qa":[],"ex":["我是学生。","你是老师，我是学生。"]},{"id":"w211","word":"对不起","pinyin":"duìbuqǐ","level":1,"note":"表示歉意","qa":[],"ex":["对不起！","对不起，我不认识你。"]},{"id":"w212","word":"没关系","pinyin":"méi guānxi","level":1,"note":"回应道歉的客套话","qa":[],"ex":["没关系！","没关系，再见！"]},{"id":"w213","word":"没事","pinyin":"méishì","level":1,"note":"没有关系、没问题","qa":[],"ex":["没事！","没事，谢谢你。"]},{"id":"w214","word":"很","pinyin":"hěn","level":1,"note":"程度副词","qa":[],"ex":["我很高兴。","认识你，我很高兴。"]},{"id":"w215","word":"也","pinyin":"yě","level":1,"note":"表示同样","qa":[],"ex":["我也是学生。","我也很高兴。"]},{"id":"w216","word":"人","pinyin":"rén","level":1,"note":"称呼一个人","qa":["你是哪国人？"],"ex":["他是中国人。","她是法国人。"]},{"id":"w217","word":"的","pinyin":"de","level":1,"note":"结构助词，表示领属或修饰","qa":[],"ex":["这是我的名字。","你的名字是什么？"]},{"id":"w218","word":"中国","pinyin":"Zhōngguó","level":1,"note":"国家名","qa":["你是中国人吗？","你想去中国吗？"],"ex":["我是中国人。","他是中国老师。"]},{"id":"w219","word":"法国","pinyin":"Fàguó","level":1,"note":"国家名","qa":["你想去法国吗？","你认识法国人吗？"],"ex":["她是法国人。","我的女朋友是法国人。"]},{"id":"w220","word":"这","pinyin":"zhè","level":1,"note":"近指代词","qa":["这是什么？"],"ex":["这是我的老师。","这是我的中文老师。"]},{"id":"w221","word":"谁","pinyin":"shéi","level":1,"note":"疑问代词，问人","qa":["这是谁？"],"ex":["你是谁？","谁是老师？"]},{"id":"w222","word":"女朋友","pinyin":"nǚ péngyou","level":1,"note":"女性恋爱对象","qa":["谁是你的女朋友？"],"ex":["她是我的女朋友。","我的女朋友是中国人。"]},{"id":"w223","word":"哪","pinyin":"nǎ","level":1,"note":"疑问代词，问哪一个","qa":["你是哪国人？"],"ex":["他是哪国人？","你去哪国工作？"]},{"id":"w224","word":"国","pinyin":"guó","level":1,"note":"国家","qa":["你是哪国人？"],"ex":["你是哪国人？","她是中国人。"]},{"id":"w225","word":"她","pinyin":"tā","level":1,"note":"女性第三人称代词","qa":["她是谁？"],"ex":["她是我的女朋友。","她是我的姐姐。"]},{"id":"w226","word":"泰国","pinyin":"Tàiguó","level":1,"note":"国家名","qa":["你想去泰国吗？","你认识泰国人吗？"],"ex":["他是泰国人。","我的同学是泰国人。"]},{"id":"w227","word":"喂","pinyin":"wèi","level":1,"note":"打招呼、打电话用语","qa":[],"ex":["喂，你好！","喂，你是谁？"]},{"id":"w228","word":"姐姐","pinyin":"jiějie","level":1,"note":"年长的女性同辈亲属","qa":["姐姐忙吗？"],"ex":["她是我姐姐。","我姐姐是老师。"]},{"id":"w229","word":"还","pinyin":"hái","level":1,"note":"仍然；表示补充（也）","qa":["你还忙吗？"],"ex":["我还很忙。","我还不认识她。","你的女朋友还是学生吗？"]},{"id":"w230","word":"忙","pinyin":"máng","level":1,"note":"事情多、没有空闲","qa":["你忙吗？"],"ex":["老师很忙。","我工作很忙。"]},{"id":"w231","word":"吗","pinyin":"ma","level":1,"note":"疑问语气助词","qa":[],"ex":["你好吗？","你是学生吗？"]},{"id":"w232","word":"对","pinyin":"duì","level":1,"note":"第3课：形容词，正确（对不对）｜第11课：介词，对着某人（对我说）","qa":["对不对？","---","你想对老师说什么？"],"ex":["对，我是学生。","这是对的。","---","老师对我说：“你好！”","妈妈对我说，她很忙。"],"lessons":[3,11]},{"id":"w233","word":"太","pinyin":"tài","level":1,"note":"表示程度高","qa":[],"ex":["我太忙。","太谢谢你。"]},{"id":"w234","word":"我们","pinyin":"wǒmen","level":1,"note":"称呼己方多人","qa":["我们是同学吗？"],"ex":["我们是同学。","我们是中国人。"]},{"id":"w235","word":"想","pinyin":"xiǎng","level":1,"note":"希望、思考","qa":["你想去哪国？"],"ex":["我想工作。","她想认识你。"]},{"id":"w236","word":"有","pinyin":"y é","level":1,"note":"到学校学习","qa":["你几点上学？"],"ex":["我八点上学。","她早上八点上学。"]},{"id":"w448","word":"他们","pinyin":"tāmen","level":1,"note":"男性或混合的第三人称复数","qa":[],"ex":["他们是学生。","他们都很忙。"]},{"id":"w449","word":"她们","pinyin":"tāmen","level":1,"note":"女性第三人称复数","qa":[],"ex":["她们是老师。","她们都很漂亮。"]},{"id":"w450","word":"它们","pinyin":"tāmen","level":1,"note":"事物的第三人称复数","qa":[],"ex":["这是猫和狗，它们在玩。","那些是书，它们很新。"]},{"id":"w451","word":"晚","pinyin":"wǎn","level":1,"note":"迟、时间靠后","qa":["你今天来晚了吗？"],"ex":["我今天来晚了。","太晚了，我们回家吧。"]},{"id":"w452","word":"爱","pinyin":"ài","level":1,"note":"喜爱、爱护","qa":["你爱谁？"],"ex":["我爱我的家人。","她爱唱歌。"]},{"id":"w453","word":"哪个","pinyin":"nǎge","level":1,"note":"疑问代词，问哪一个","qa":["你喜欢哪个？"],"ex":["你喜欢哪个苹果？","这是哪个学校？"]},{"id":"w454","word":"去年","pinyin":"qùnián","level":1,"note":"今年的前一年","qa":["去年你做什么了？"],"ex":["去年我在中国。","去年他上大学了。"]},{"id":"w455","word":"年","pinyin":"nián","level":1,"note":"计年的单位","qa":["你今年几岁？"],"ex":["我今年二十岁。","这是新的一年。"]},{"id":"w456","word":"好玩儿","pinyin":"hǎowánr","level":1,"note":"有趣","qa":["北京好玩儿吗？"],"ex":["我的猫很好玩儿。","北京很好玩儿。"]},{"id":"w457","word":"北京","pinyin":"Běijīng","level":1,"note":"中国首都","qa":["你想去北京吗？"],"ex":["我想去北京。","我想去北京工作。"]},{"id":"w458","word":"飞机","pinyin":"fēijī","level":1,"note":"航空器","qa":["你喜欢坐飞机吗？"],"ex":["我喜欢坐飞机。","我们坐飞机去北京。"]},{"id":"w459","word":"小时","pinyin":"xiǎoshí","level":1,"note":"时间单位","qa":["你一天工作几个小时？"],"ex":["我工作八个小时。","坐飞机要几个小时。"]},{"id":"w460","word":"家人","pinyin":"jiārén","level":1,"note":"家庭成员","qa":["你想家人吗？"],"ex":["我爱我的家人。","我的家人都很忙。"]},{"id":"w461","word":"时间","pinyin":"shíjiān","level":1,"note":"时候、时段","qa":["你有时间吗？"],"ex":["我没有时间。","她的时间很少。"]},{"id":"w462","word":"住","pinyin":"zhù","level":1,"note":"居住","qa":["你住在哪儿？"],"ex":["我住在学校。","她住在北京。"]},{"id":"w463","word":"早","pinyin":"zǎo","level":1,"note":"时间靠前","qa":["你明天能早一点儿来吗？"],"ex":["明天我们要早一点儿去机场。","早上好！"]},{"id":"w464","word":"以为","pinyin":"yǐwéi","level":3,"note":"主观认为某事，但情况并不是这样","qa":["你有没有以为一件事是真的，发现不是这样？","你以前以为学汉语很难吗？现在还这样觉得吗？","你有没有以为朋友生气了，后来发现他没有生气的时候？"],"ex":["我以为今天不上课，所以没有来学校。","他以为我是老师，我不是老师，是学生。","我以为你不喜欢喝茶，没想到你喝了很多。","她以为飞机已经到了，飞机还没有到。","我以为你今天要工作，没想到你在家休息。"]},{"id":"w465","word":"像","pinyin":"xiàng","level":3,"note":"相似、如同","qa":["你觉得你更像爸爸还是更像妈妈？","你觉得你的哪个朋友跟你很像？哪里像？","你觉得你说汉语的时候像中国人吗？为什么？"],"ex":["她的眼睛长得很像妈妈。","这件衣服的颜色很像妈妈的那件衣服。","他笑的时候很像我哥哥。","这个问题跟你问过的问题很像。","这只小狗长得很像那只猫。"]},{"id":"w466","word":"长","pinyin":"zhǎng","level":3,"note":"生长、发育（另读cháng表长度）","qa":["你这几年个子长高了吗？","你小时候长得像爸爸还是像妈妈？现在呢？","你觉得孩子们一年能长高多少？"],"ex":["我弟弟今年长高了很多。","他的个子长得很高。","她的头发长得很快。","这个孩子长大了很多。","他长得比我高，是我哥哥。"]},{"id":"w467","word":"身高","pinyin":"shēngāo","level":3,"note":"身体的高度","qa":["你的身高是多少？你觉得自己的身高怎么样？","你觉得身高对打篮球重要吗？为什么？","你们家里谁的身高最高？他有多高？"],"ex":["我的身高是一米七。","他的身高比我高一点儿。","这个孩子的身高长得很快。","她的身高不高，但是很漂亮。","医生问我身高多少，我不知道。"]},{"id":"w468","word":"米","pinyin":"mǐ","level":3,"note":"长度单位","qa":["你知道从你家到学校有多少米吗？","你觉得身高一米八的人高不高？","你一次能跑多少米？跑完以后累不累？"],"ex":["我的身高是一米六。","这条路不太远，就是二十米。","这个房间不大，长二十米。","从这儿到学校有五十米，走路很快。","虽然我的身高只有一米六，但是我很喜欢打篮球。"]},{"id":"w469","word":"行李","pinyin":"xínglǐ","level":3,"note":"出行携带的物品","qa":["你去旅游的时候，行李里会带什么重要的东西？","坐飞机的时候，你的行李一般多不多？为什么？","你觉得带很多行李去旅游方便吗？"],"ex":["我的行李很多，一个人拿不动。","她的箱子丢了，她的行李也丢了，她很着急。","请问，我的行李在哪儿？","上飞机的时候，我们要看好行李。","他这次旅游带了很多行李。"]},{"id":"w470","word":"丢","pinyin":"diū","level":3,"note":"遗失","qa":["你丢过重要的东西吗？丢了怎么做的？","你觉得东西丢了以后，应该先做什么？","你是不是一个经常丢东西的人？经常丢什么？"],"ex":["我的护照丢了，我很着急，不知道要怎么样。","她的箱子在机场丢了，服务台正在帮她找。","你不要丢东西，手机也要拿好。","他丢了工作，现在很不高兴。","我丢了一个很重要的东西，现在还没有找到。"]},{"id":"w471","word":"箱子","pinyin":"xiāngzi","level":3,"note":"盛放物品的容器","qa":["你的箱子里有什么东西？可以说一说吗？","你去旅游的时候，一般带几个箱子？","搬家的时候，你会把什么东西放在箱子里？"],"ex":["这个箱子东西很多，我一个人拿不动。","她的箱子丢了，到现在还没有找到。","这些书要拿进箱子里。","这次旅游的箱子是新买的。","箱子里有我的很多衣服。"]},{"id":"w472","word":"号码","pinyin":"hàomǎ","level":3,"note":"编号、数字组合","qa":["你能说一下你的电话号码吗？","你觉得哪个号码最好？为什么喜欢这个号码？","你能记住家人和朋友的电话号码吗？"],"ex":["请你告诉我你的电话号码。","我忘了他的手机号码。","护照上有一个号码。","这个房间的号码是三一五。","她给了我一个号码，我打过去发现是错的。"]},{"id":"w473","word":"好像","pinyin":"hǎoxiàng","level":3,"note":"第1课：似乎、看起来（好像要下雨）｜第16课：像、如同（它就好像我们的孩子）","qa":["你觉得今天的天气好像会怎么样？为什么这样觉得？","你的朋友最近好像有点儿不高兴，你会怎么做？","你有没有遇到一个好像在哪儿见过的人？","---","你觉得你的好朋友好像你的什么人？","你家有没有一个东西，对你来说好像家人一样？"],"ex":["他今天说话不多，好像不太高兴。","这个问题好像很难，我们想了很长时间。","她好像认识你，看着你笑了笑。","今天的天气好像要下雨了。","这件事好像不是我做的，他还问我。","---","我家的猫就好像我们的孩子一样。","她对我很好，好像我的姐姐一样。","因为这里的人都很热情，所以我觉得好像在自己家一样。","虽然我们认识不久，但是好像是很多年的老朋友。","这个地方漂亮得好像画一样。"],"lessons":[1,16]},{"id":"w474","word":"护照","pinyin":"hùzhào","level":3,"note":"出入境证件","qa":["你的护照在国外丢了，你觉得应该怎么样？","你第一次办护照是什么时候？去哪儿办的？","出国的时候，你会把护照放在哪儿？"],"ex":["你的护照丢了，你觉得应该怎么样？","我的护照丢了，我很着急，不知道要怎么样。","出国的时候，请你看好自己的护照。","他的护照号码很长，他不记得了。","请你给我看一下护照。"]},{"id":"w475","word":"服务台","pinyin":"fúwùtái","level":3,"note":"提供咨询服务的柜台","qa":["你在机场、商店问问题的时候，会去服务台问吗？","在宾馆里，你会去服务台问什么问题？","如果你在机场找不到行李，你会去服务台吗？"],"ex":["你在机场，会去服务台问问题吗？","请问服务台在哪儿？","我去服务台问了一个问题。","服务台的服务员每天都很忙。","她在服务台工作，每天要接很多电话。"]},{"id":"w476","word":"应该","pinyin":"yīnggāi","level":3,"note":"理当、应当","qa":["你觉得学生应该做什么，能学好汉语呢？","你觉得来中国旅游的人应该去哪些地方？","朋友不高兴的时候，你觉得应该说什么？"],"ex":["你觉得学生应该怎么学习汉语？","你应该多喝水，对身体好。","我们应该多帮助朋友。","学生应该每天多学习一点儿。","他应该已经到机场了。"]},{"id":"w477","word":"短","pinyin":"duǎn","level":3,"note":"长度小，跟'长'相对","qa":["你更喜欢穿长的裤子还是短的裤子？","你觉得短头发方便还是长头发方便？","夏天的时候，你喜欢穿短裤还是穿裙子？"],"ex":["这条裤子太短了，我想要一条长一点儿的。","她的头发本来很长，现在很短。","这本书很短，我一个下午就看完了。","我们的时间很短，请你说快一点儿。","这条路比那条路短一点儿。"]},{"id":"w478","word":"头发","pinyin":"tóufa","level":3,"note":"头上的毛发","qa":["你喜欢长头发还是短头发？为什么？","你的头发是长的还是短的？你喜欢现在的头发吗？","你觉得换一个头发颜色好看吗？"],"ex":["她的头发很长，也很漂亮。","我想让头发长得更快一点儿。","爷爷的头发已经白了，身体还很好。","这个孩子的头发是黑色的，跟妈妈很像。","她的头发长得很快，一个月就要短一次。"]},{"id":"w479","word":"发现","pinyin":"fāxiàn","level":3,"note":"经过观察、了解找到","qa":["你发现了什么有意思的事情吗？","你来中国以后，发现了什么跟你想的不一样的事？","你有没有发现自己最近的汉语水平提高了？"],"ex":["我发现她的护照不见了，就告诉了她。","他发现这个问题比想的更重要。","我们发现这条路比那条路更近。","她发现自己这几个月长高了不少。","我发现这个箱子里什么东西都没有。"]},{"id":"w480","word":"不见","pinyin":"bújiàn","level":3,"note":"看不到、消失、丢失","qa":["你有什么东西不见了吗？找到了吗？","你的手机不见了的时候，你会先做什么？","如果你的朋友突然不见了，你会着急吗？"],"ex":["你的东西不见了，找到了吗？","我的手机不见了，我找了很长时间也没找到。","她的箱子怎么不见了？我们一起去问问服务台。","那只小猫走着走着就不见了。","我的护照不见了，我现在非常着急。"]},{"id":"w481","word":"帮助","pinyin":"bāngzhù","level":3,"note":"给予支持","qa":["朋友有问题的时候，你会怎么帮助他？","你学汉语的时候，谁帮助你最多？","你觉得帮助别人以后，心里会怎么样？"],"ex":["谢谢你经常帮助我，我很高兴。","她经常帮助年轻的同学。","我现在要你的帮助，可以吗？","朋友们应该多帮助，一起想问题。","老师每天都帮助我学习汉语。"]},{"id":"w482","word":"菜单","pinyin":"càidān","level":3,"note":"记录菜品供选择的单子","qa":["你去饭店的时候，喜欢自己看菜单点菜，还是让服务员介绍？","你看中文菜单的时候，能看懂多少？","如果菜单上都是汉字，你会怎么点菜？"],"ex":["请给我一张菜单，谢谢。","这家饭店的菜单很长，有很多好吃的菜。","他拿着菜单看了很久，还是不知道点什么。","菜单上没有我喜欢的那个菜，我有点儿不高兴。","我们一起看菜单，然后一起点菜吧。"]},{"id":"w483","word":"渴","pinyin":"kě","level":3,"note":"口干、想喝水","qa":["你运动以后会觉得很渴吗？一般会喝什么？","天气很热、你很渴的时候，你会喝水还是喝饮料？","你觉得渴了以后，喝什么最好？"],"ex":["我运动以后很渴，想喝水。","天气这么热，你渴不渴？","他走了很长时间的路，渴得不想说话。","孩子渴了，快给他一杯水喝。","又饿又渴的时候，吃东西会觉得特别好吃。"]},{"id":"w484","word":"客气","pinyin":"kèqi","level":3,"note":"有礼貌、不随便","qa":["朋友请你吃饭的时候，你会不会觉得不好意思、很客气？","你去朋友家做客的时候，会很客气吗？","你觉得跟好朋友说话，需要这么客气吗？"],"ex":["你太客气了，不用给我买东西。","他对每个客人都很客气，大家都喜欢他。","我们认识很多年了，你不用这么客气。","她说话很客气，从来不跟别人生气。","别客气，多吃一点儿菜。"]},{"id":"w485","word":"好久","pinyin":"hǎojiǔ","level":3,"note":"很长时间","qa":["你有没有好久没见的朋友？最近有没有见面？","你有没有好久没做的事情，现在很想再做一次？","你好久没回家的时候，会很想家人吗？"],"ex":["好久不见，你还好吗？","我等了好久，你才来。","你有没有好久没见的朋友？最近有没有见面？","这个问题我们想了好久，还是不知道怎么办。","好久没吃到这么好吃的菜了，谢谢你。"]},{"id":"w486","word":"服务","pinyin":"fúwù","level":3,"note":"为别人做事、提供帮助","qa":["你觉得一家好的饭店应该给客人什么服务？","你去过服务特别好的饭店吗？说一说那家饭店。","你觉得哪家商店的服务最好？为什么？"],"ex":["你觉得一家好的饭店应该给客人什么服务？","他每天都在为客人服务，很忙也很累。","医院里的医生都在为病人服务，非常忙。","我们公司很重要的一点是服务，希望客人都满意。","好的服务能让客人愿意再来。"]},{"id":"w487","word":"员","pinyin":"yuán","level":3,"note":"从事某种工作的人","qa":["你身边有做服务员、售货员工作的朋友吗？","你知道哪些工作的名字里有员这个字吗？"],"ex":["她是一名服务员，工作很认真。","他是我们公司的一员，很努力工作。","你身边有做服务员、售货员工作的朋友吗？","售货员告诉我这件衣服很便宜。","服务员，请再给我一双筷子。"]},{"id":"w488","word":"双","pinyin":"shuāng","level":3,"note":"计量成对物品的量词","qa":["你今天穿的鞋是新的还是旧的？一共有几双？","你一共有几双鞋？你最喜欢哪一双？"],"ex":["请你给我一双新筷子。","她买了一双新鞋，很漂亮。","我有一双跟她一样的鞋。","这双鞋有点儿小，我想换一双。","他每天用自己的双手做饭、洗衣服。"]},{"id":"w489","word":"筷子","pinyin":"kuàizi","level":3,"note":"中式用餐工具","qa":["你会用筷子吃饭吗？第一次用筷子是什么时候？","你觉得用筷子吃饭难不难？为什么？","你觉得吃什么菜的时候，用筷子最不方便？"],"ex":["请给我一双新筷子。","他用筷子吃面条儿吃得很好。","我小的时候不会用筷子，妈妈教了我很久。","这双筷子是新买的，很漂亮。","吃中国菜的时候，我们一般用筷子。"]},{"id":"w490","word":"勺子","pinyin":"sháozi","level":3,"note":"舀取食物的用具","qa":["吃饭的时候，你更喜欢用筷子还是勺子？","喝什么东西的时候，你会用勺子？","你觉得小朋友吃饭的时候，用勺子方便还是用筷子方便？"],"ex":["请给我一个勺子，我想喝水。","小孩子刚开始吃饭的时候，一般先用勺子。","这个勺子太小了，用起来不方便。","他一边用勺子吃饭，一边跟我们说话。","服务员，请再给我们几个勺子。"]},{"id":"w491","word":"碗","pinyin":"wǎn","level":3,"note":"盛食物的器皿","qa":["你家吃饭用的碗是什么颜色的？可以说一说吗？","你中午一般能吃几碗米饭？","吃完饭以后，你家里一般是谁洗碗？"],"ex":["请给我一个碗，我想吃米饭。","她一个人吃了三碗面条儿，真能吃。","这个碗很漂亮，是妈妈买的。","吃完饭以后，请把碗放到桌子上。","服务员，请再给我一个新碗。"]},{"id":"w492","word":"尝","pinyin":"cháng","level":3,"note":"试着吃或喝一点儿","qa":["你有没有尝过很特别的菜？好吃吗？","你最想尝一尝哪个国家的菜？为什么？","朋友做了一个新菜，你会先尝一尝吗？"],"ex":["你尝一下这个菜，看看好不好吃。","我想尝尝这种新的饮料。","她做的蛋糕，大家都想尝一尝。","服务员，可以先给我们尝一点儿吗？","这个菜看起来很好吃，我要尝一下。"]},{"id":"w493","word":"记","pinyin":"jì","level":3,"note":"把事情写下来或记在心里","qa":["你有没有把重要的事情记在本子上的习惯？","你用什么方法记汉字？这个方法好用吗？","你能记住每个朋友的生日吗？"],"ex":["请把这个号码记一下。","我把她说的事都记在心里了。","他每天都会记一点儿新的汉字，学得很快。","这件事我记不清楚了，你能再说一次吗？","她记东西记得很快，也记得很清楚。"]},{"id":"w494","word":"鸡","pinyin":"jī","level":3,"note":"一种家禽","qa":["你喜欢吃鸡肉做的菜吗？最喜欢哪一种？","你会用鸡做什么菜？可以说一说怎么做吗？","你觉得鸡肉和牛肉，哪个更好吃？"],"ex":["这个菜是用鸡做的，很好吃。","妈妈今天做了鸡肉和米饭。","菜单上有很多鸡肉的菜。","他家养了几只鸡，每天早上都叫。","服务员，请给我们来一个鸡肉的菜。"]},{"id":"w495","word":"张","pinyin":"zhāng","level":3,"note":"第2课：量词（一张菜单、一张纸）｜第16课：动词，张开（张嘴）","qa":["你手机里有没有一张对你来说很重要的照片？","你的包里有几张卡？都是什么卡？","---","你看医生的时候，医生会让你张嘴吗？","你觉得小鸟张着嘴是想要什么？"],"ex":["请给我一张菜单，谢谢。","桌子上有一张纸，上面写着号码。","她给了我一张照片，是她家人的照片。","服务员拿来一张新桌子，请我们坐下。","护照上有一张照片，是我以前照的。","---","请你张嘴，医生要看一看。","因为嘴太疼了，所以他张不开嘴。","小猫张着嘴，好像很饿。","虽然他张了张嘴，但是一句话也没说。","孩子张大嘴，吃了一口蛋糕。"],"lessons":[2,16]},{"id":"w496","word":"不用","pinyin":"búyòng","level":3,"note":"不需要","qa":["朋友说要请你吃饭，你会说不用了吗？","朋友说不用送他回家，你还会送他吗？","你觉得去超市买东西的时候，不用带钱方便吗？"],"ex":["谢谢你，不用再帮我了。","这个问题不用问别人，我自己知道。","不用着急，我们还有时间。","你不用带雨伞，今天不会下雨。","不用客气，多吃一点儿菜。"]},{"id":"w497","word":"选","pinyin":"xuǎn","level":3,"note":"挑选","qa":["点菜的时候，你一般怎么选？会先看菜单还是先问服务员？","买衣服的时候，你一般怎么选颜色？","如果只能选一个国家去旅游，你会选哪个？"],"ex":["请你帮我选一个好吃的菜。","他选了很长时间，还是不知道选哪个。","我们一起选一家饭店去吃饭吧。","服务员，我选好了，可以点菜了。","她选了一件漂亮的衣服，很满意。"]},{"id":"w498","word":"外卖","pinyin":"wàimài","level":3,"note":"订购送到指定地点的食品","qa":["你喜欢自己去饭店吃饭，还是喜欢点外卖？为什么？","你一个星期点几次外卖？一般点什么？","你觉得外卖好吃还是自己做的饭好吃？"],"ex":["我今天太忙了，只能点外卖吃饭。","他每天都点外卖，很少自己做饭。","这家饭店的外卖服务很快。","点外卖虽然方便，但是没有在饭店吃得开心。","服务员告诉我们，这个菜也可以点外卖。"]},{"id":"w499","word":"方便面","pinyin":"fāngbiànmiàn","level":3,"note":"即食面食","qa":["你多久吃一次方便面？一般是什么时候吃？","你觉得方便面好吃吗？你最喜欢哪一种？","你觉得经常吃方便面对身体好不好？"],"ex":["我今天没时间做饭，只能吃方便面。","方便面虽然方便，但是不太健康。","他每天晚上都吃方便面，身体越来越不好。","冰箱里还有几包方便面，你要不要吃？","外卖太贵了，我今天想吃方便面。"]},{"id":"w500","word":"简单","pinyin":"jiǎndān","level":3,"note":"不复杂、容易","qa":["你觉得学汉语简单吗？为什么这样觉得？","你会做什么简单的菜？可以说一说怎么做吗？","你觉得汉字里最简单的字是哪个？"],"ex":["这个问题很简单，我马上就能回答。","她做的菜很简单，但是很好吃。","用筷子吃饭对我来说不简单。","这个问题看着简单，做起来不容易。","生活简单一点儿，人会更快乐。"]},{"id":"w501","word":"初中","pinyin":"chūzhōng","level":3,"note":"初级中学阶段","qa":["你上初中的时候，最喜欢什么课？","初中的生活跟小学有什么不一样？","你上初中的时候有没有特别好的朋友？现在还见面吗？"],"ex":["我弟弟今年上初中了。","她是初中的汉语老师。","初中三年过得很快。","因为我初中的时候学过汉语，所以现在觉得汉语不太难。","虽然初中毕业已经很多年了，但是我们还常常见面。"]},{"id":"w502","word":"咱们","pinyin":"zánmen","level":3,"note":"包括说话双方的'我们'","qa":["咱们今天晚上一起去吃饭，好不好？","如果咱们一起去旅游，你想去哪儿？","咱们班里，你觉得谁的汉语最好？"],"ex":["咱们认识很多年了，不用客气。","咱们明天几点见面？","咱们一起打扫房间吧。","咱们下午一起去银行办事吧。","如果明天不下雨，咱们就一起去爬山吧。"]},{"id":"w503","word":"房子","pinyin":"fángzi","level":3,"note":"住宅","qa":["你觉得自己以后想住什么房子？","你现在住的房子大不大？有几个房间？","你喜欢住在城市里的房子，还是住在海边的房子？"],"ex":["这个房子的环境很好，也很干净。","他们家的房子很大。","我们正在找新房子。","这个房子挺大的，环境也很好。","虽然这个房子不太大，但是环境很好，我很喜欢。"]},{"id":"w504","word":"小区","pinyin":"xiǎoqū","level":3,"note":"住宅区","qa":["你住的小区里有花园或者商店吗？","你住的小区大不大？里面有什么？","你觉得一个好的小区应该有什么？"],"ex":["我们小区的环境很好。","这个小区离学校很近。","她的小区有一个大花园。","这个小区有花园和商店，很方便。","我们小区不但有花园，而且还有超市，非常方便。"]},{"id":"w505","word":"挺","pinyin":"tǐng","level":3,"note":"很、颇","qa":["你觉得学汉语挺难的还是挺简单的？","你觉得你住的地方挺方便的吗？为什么？","你觉得最近的天气挺好的吗？"],"ex":["这个菜挺好吃的，你也尝一尝。","她的房子挺大的，住着很舒服。","今天天气挺好，我们出去走走吧。","他工作挺忙的，很少休息。","虽然今天挺冷的，但是我们还是去爬山了。"]},{"id":"w506","word":"空调","pinyin":"kōngtiáo","level":3,"note":"调节室内温度的设备","qa":["夏天的时候，你家里会开空调吗？","你觉得晚上睡觉的时候开空调好不好？","你家的空调是新的还是旧的？"],"ex":["夏天太热了，我想开空调。","这个房间没有空调，很热。","请你帮我关一下空调。","她家的空调坏了，很热。","如果夏天没有空调，我晚上就睡不着。"]},{"id":"w507","word":"洗衣机","pinyin":"xǐyījī","level":3,"note":"洗涤衣物的机器","qa":["你家的衣服一般是自己洗还是用洗衣机洗？","如果家里的洗衣机坏了，你会怎么办？","你觉得买洗衣机的时候，什么最重要？"],"ex":["我家的洗衣机坏了。","这个洗衣机是新买的，用起来很方便。","用洗衣机洗衣服很方便。","妈妈用洗衣机洗了很多衣服。","因为家里的洗衣机坏了，所以我只能自己洗衣服。"]},{"id":"w508","word":"花园","pinyin":"huāyuán","level":3,"note":"种植花草的园地","qa":["你喜欢在花园里做什么？","你家附近有没有漂亮的花园？","如果你有一个花园，你想在花园里种什么？"],"ex":["这个小区有一个漂亮的花园。","她每天都去花园走一走。","花园里的花开得很漂亮。","我们在花园里照了很多照片。","天气好的时候，我们一边在花园里走，一边聊天儿。"]},{"id":"w509","word":"灯","pinyin":"dēng","level":3,"note":"照明用具","qa":["晚上睡觉的时候，你会不会关灯？","你家里一共有几个灯？哪个灯最好看？","你出门的时候会不会忘记关灯？"],"ex":["请帮我把灯关一下，谢谢。","房间里的灯坏了，看不见东西。","晚上没有灯，很不方便。","她开着灯看书，看了很长时间。","因为房间里的灯坏了，所以我晚上不能看书。"]},{"id":"w510","word":"关","pinyin":"guān","level":3,"note":"关闭","qa":["出门以前，你会检查有没有关灯、关空调吗？","你睡觉以前会把手机关了吗？为什么？","你觉得离开教室的时候，应该关什么？"],"ex":["请把灯关一下，谢谢你。","出门以前要把门关好。","她把空调关了，觉得有点儿冷。","睡觉以前，请把灯关好。","虽然已经很晚了，但是他还没有关电脑。"]},{"id":"w511","word":"冰箱","pinyin":"bīngxiāng","level":3,"note":"冷藏食物的电器","qa":["你的冰箱里一般会放什么东西？","你觉得冰箱里的东西可以放多久？","你家的冰箱大不大？是什么颜色的？"],"ex":["冰箱里有牛奶和鸡蛋。","这个冰箱是新买的，用起来很方便。","天气热的时候，冰箱里的饮料大家都喜欢。","冰箱里的鸡蛋和牛奶都用完了。","因为冰箱里什么都没有了，所以我们要去超市买东西。"]},{"id":"w512","word":"卫生间","pinyin":"wèishēngjiān","level":3,"note":"洗手间","qa":["请问，卫生间在哪儿？","你家的卫生间大不大？一般是谁来打扫？","你觉得饭店的卫生间干净重要吗？为什么？"],"ex":["请问，卫生间在哪儿？","这个房子有几个卫生间，很方便。","她一个人在卫生间打扫了很长时间。","请问，卫生间怎么走？","这个宾馆的卫生间不但很大，而且非常干净。"]},{"id":"w513","word":"打扫","pinyin":"dǎsǎo","level":3,"note":"清理、清洁","qa":["你多久打扫一次房间？","你喜欢打扫房间吗？为什么？","你家里谁最喜欢打扫？"],"ex":["她每天打扫房间，很认真。","我们一起打扫卫生间吧。","打扫完房子，我觉得很舒服。","周末我们一起打扫小区的花园。","虽然打扫房间很累，但是打扫完以后心里很舒服。"]},{"id":"w514","word":"搬家","pinyin":"bānjiā","level":3,"note":"迁移住处","qa":["你搬过家吗？搬家的时候觉得累不累？","你觉得搬家以前应该准备什么？","如果你搬家，你想搬到哪儿去？"],"ex":["我们下个月要搬家了。","搬家很累，需要帮忙。","他们搬家以后，环境好多了。","他们搬家以后，房子更大了。","因为公司离家太远，所以我们打算下个月搬家。"]},{"id":"w515","word":"办","pinyin":"bàn","level":3,"note":"办理、处理","qa":["去银行办事情的时候，你觉得方便吗？","你有没有在银行办过什么卡？","你觉得在中国办事情方便吗？"],"ex":["我要去银行办一张信用卡。","这件事应该怎么办？","她在办公室办事情，很忙。","她去银行办了一张新的信用卡。","如果你明天有时间，我们一起去银行办信用卡吧。"]},{"id":"w516","word":"信用卡","pinyin":"xìnyòngkǎ","level":3,"note":"银行信用支付卡","qa":["你有信用卡吗？平时用得多吗？","你觉得用信用卡买东西好不好？为什么？","你出国旅游的时候会带信用卡吗？"],"ex":["我想办一张信用卡。","用信用卡买东西很方便。","她的信用卡丢了，很着急。","他用信用卡买了一个新的冰箱。","虽然用信用卡很方便，但是也不能买太多东西。"]},{"id":"w517","word":"听说","pinyin":"tīngshuō","level":3,"note":"听别人说、据说","qa":["你最近有没有听说什么有意思的事情？","你听说过中国的哪些有名的地方？","你来中国以前，听说过中国的什么事？"],"ex":["听说这家饭店的服务很好。","我听说她要搬家了。","听说明天会下雨，你要带伞。","听说这个小区的环境很好。","听说那个小区的环境不错，所以我们想去看看。"]},{"id":"w518","word":"才","pinyin":"cái","level":3,"note":"表示事情发生得晚或数量少","qa":["你昨天几点才睡觉？为什么这么晚？","你学了多久汉语，才能看懂中文菜单？"],"ex":["他昨天很晚才回家。","我等了好久，你才来。","这个房子才二十万，很便宜。","我打扫了很长时间，才把房子打扫干净。","因为路上车太多，所以他十点才到公司。"]},{"id":"w519","word":"纸","pinyin":"zhǐ","level":3,"note":"书写、包装等用的薄片材料","qa":["你喜欢用纸写字，还是喜欢用手机记事情？","你觉得我们应该少用纸吗？为什么？","你写汉字的时候，喜欢用什么纸？"],"ex":["请给我一张新的纸，谢谢。","桌子上有一张纸，写着号码。","她用纸写了一封信。","她把电话号码写在纸上。","如果没有纸，你就把号码写在手机上吧。"]},{"id":"w520","word":"需要","pinyin":"xūyào","level":3,"note":"有必要用到","qa":["你觉得学好汉语需要多长时间？","你学习汉语的时候，最需要什么帮助？","出国旅游的时候，你觉得需要带些什么？"],"ex":["我现在需要你的帮助。","搬家需要很多时间。","这个问题需要认真想一想。","打扫这个房子需要很长时间。","如果你需要帮助，就给我打电话吧。"]},{"id":"w521","word":"还","pinyin":"huán","level":3,"note":"归还","qa":["你借朋友东西以后，一般多久会还？","如果朋友借了你的钱，一直没有还，你会怎么办？"],"ex":["我明天把书还给你。","请把这些钱还给我，谢谢。","他忘了还银行的钱。","我借了她的书，一定要还给她。","因为我借了朋友的钱，所以这个月一定要还给他。"]},{"id":"w522","word":"假期","pinyin":"jiàqī","level":3,"note":"休假的时间","qa":["假期的时候，你一般喜欢做什么？","这个假期你打算去哪儿？为什么？","你觉得假期长一点儿好还是短一点儿好？"],"ex":["假期我想去海边旅游。","这个假期我打算在家休息。","假期很快就要结束了。","孩子们都很喜欢假期。","因为假期很长，所以我们打算去草原和海边旅游。"]},{"id":"w523","word":"海","pinyin":"hǎi","level":3,"note":"大洋边缘的水域","qa":["你喜欢去海边玩吗？海边有什么好玩的？","你第一次看到海是什么时候？","你觉得在海里游泳有意思吗？"],"ex":["假期我想去海边旅游。","这里的海很漂亮，我很喜欢。","他们坐飞机去看海了。","海边的房子很贵，我们买不起。","虽然海边的风很大，但是孩子们还是玩得很高兴。"]},{"id":"w524","word"
