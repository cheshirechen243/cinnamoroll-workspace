广（房屋）表意，“占”表声。本义是放货物或旅客住宿的屋子，引申为商店、饭店。"},{"char":"商","type":"形声","radical":"㕯，章（省）","benyi":"本义是估量、商量。","yanbian":"《说文》解释为“从外知内”，本义是估量、商量。商朝人擅长做买卖，后来做生意的人被叫作“商人”，引申为商店、商场。"},{"char":"虽","type":"形声","trad":"雖","radical":"虫，唯","benyi":"本义是一种像蜥蜴的爬虫。","yanbian":"繁体“雖”从虫表意，“唯”表声，本义是一种爬虫；后来借用表示让步——虽然。简化字只保留了左半边。"},{"char":"联","type":"会意","trad":"聯","radical":"耳，丝（絲）","benyi":"本义是连接。","yanbian":"繁体“聯”左边是“耳”，右边是“絲”（丝线），像把丝线连在耳朵上，本义是连接。引申为联系、联欢。"},{"char":"节","type":"形声","trad":"節","radical":"竹（简化为“艹”），即（简化为“卩”）","benyi":"本义是竹节。","yanbian":"从竹表意，“即”表声。本义是竹子的节，引申为一段一段的东西（一节课）、节日、节约。简化字写成草字头加“卩”。"},{"char":"已","type":"象形","benyi":"本义是停止、完毕。","yanbian":"古文字和“巳”原是一个字（一说像胎儿），后来分化出“已”，本义是停止、完毕，引申为已经。"},{"char":"气","type":"象形","trad":"氣","benyi":"本义是云气。","yanbian":"甲骨文是三条横线，像天上飘动的云气。后来借用加“米”的“氣”（本义是赠送粮食）来表示气；简化字回到了最早的“气”。引申为天气、空气、生气。"},{"char":"生","type":"象形","benyi":"本义是草木生长。","yanbian":"甲骨文下面一横是地面，上面像一棵刚长出来的小草。本义是草木生长，引申为出生、生活、学生。"},{"char":"慕","type":"形声","radical":"心（⺗），莫","benyi":"本义是思念、向往。","yanbian":"从心表意，“莫”表声。本义是想念、向往，引申为羡慕（希望自己也有）。"},{"char":"担","type":"形声","radical":"扌，旦","benyi":"本义是用肩挑东西","yanbian":"引申为承担。"},{"char":"出","type":"会意","radical":"止（脚），凵（洞口）","benyi":"本义是从里面出去。","yanbian":"甲骨文上面是一只脚（止），下面是半地穴式住房的出口，脚朝外，表示从里面走出来。引申为出现、出发、出国。"},{"char":"因","type":"会意","radical":"囗，大（人）","benyi":"一说本义是席子、垫子。","yanbian":"甲骨文像一个人（大）躺在席子上，一说本义是席子（后来写作“茵”）。人依靠着席子，引申为依靠、凭借，又引申为原因、因为。"},{"char":"喝","type":"形声","radical":"口，曷","benyi":"本义是大声喊叫。","yanbian":"从口表意，“曷”表声。本义是大声喊（吆喝），后来借用表示喝水、喝茶。"},{"char":"旅","type":"会意","radical":"㫃（旗），从（众人）","benyi":"本义是军队。","yanbian":"甲骨文是很多人跟在一面旗子下面行进，本义是军队（古代五百人为一旅）。军队经常在外行走，引申为出行——旅行、旅游。"},{"char":"炼","type":"形声","radical":"火，柬","benyi":"本义是用火冶炼金属","yanbian":"引申为锻炼、磨炼。"},{"char":"场","type":"形声","trad":"場","radical":"土，昜","benyi":"本义是平坦的空地。","yanbian":"从土表意，“昜”表声。本义是祭神或晒谷用的平地，引申为场地、机场、商场。"},{"char":"欢","type":"形声","trad":"歡","radical":"欠，雚（简化为“又”）","benyi":"本义是快乐。","yanbian":"从欠（张开嘴的人）表意，“雚”表声。本义是高兴，引申为欢迎、喜欢。简化字把左边换成“又”。"},{"char":"租","type":"形声","radical":"禾，且","benyi":"本义是田赋。","yanbian":"从禾（庄稼）表意，“且”表声。本义是古代按田地交的粮食税，引申为租用、出租——付钱借用别人的东西。"},{"char":"觉","type":"形声","trad":"覺","radical":"见，學（省）","benyi":"本义是睡醒。","yanbian":"从见表意，上面是“學”的省写，表声。本义是睡醒，引申为明白、感觉；读 jiào 时指睡眠（睡觉）。"},{"char":"发","type":"形声","trad":"發／髮","radical":"弓，癹","benyi":"本义是把箭射出去。","yanbian":"繁体“發”从弓表意，“癹”表声，本义是射箭，引申为发出、发生、发现。表示头发的“髮”也简化成了“发”。"},{"char":"羡","type":"会意","radical":"羊，㳄（口水）","benyi":"本义是想得到、贪慕。","yanbian":"上面是“羊”，下面是“㳄”（张嘴流口水），看见美味的羊肉流口水，本义是想得到，引申为羡慕。"},{"char":"名","type":"会意","radical":"夕，口","benyi":"夜晚天黑看不清人脸，需要开口自报姓名以示区别，本义为'自己称呼自己的名字'。","yanbian":"甲骨文从夕从口，会意夜里呼名相认；后引申为名字、名称，又引申为名声、命名等义。"},{"char":"字","type":"会意","radical":"宀，子","benyi":"在屋檐下抚育孩子，本义为'生育、繁衍'。","yanbian":"甲骨文、金文作屋内有子之形，本义是生子、养育；因文字如同由母体'孳生'出的子女般不断派生新字，故'字'又借指汉字，后又引申为成年后所取的表字。"},{"char":"们","type":"形声","trad":"們","radical":"亻，门","benyi":"加在名词或代词后表示复数。","yanbian":"本无更早的古文字形，是近代白话文兴起后新造的形声字，'门'只取其声，不表意。"},{"char":"吗","type":"形声","trad":"嗎","radical":"口，马","benyi":"疑问语气助词，用于句末构成是非问句。","yanbian":"从口表示与言语语气有关，'马'表声；是近代才产生的白话虚词，把陈述句变成疑问句。"},{"char":"哪","type":"形声","radical":"口，那","benyi":"疑问代词，询问处所或事物中的哪一个。","yanbian":"从口表意（与说话询问有关），'那'表声；由指示代词'那'分化出疑问用法而来。"},{"char":"喂","type":"形声","radical":"口，畏","benyi":"打招呼、呼唤人的叹词。","yanbian":"从口表意，'畏'取其音；多用于打电话或呼唤人时的招呼语。"},{"char":"国","type":"会意","trad":"國","radical":"囗，玉","benyi":"本义是有疆界、军队守卫的邦国。","yanbian":"繁体'國'从囗（城郭围墙）从或（持戈守卫疆域），甲骨文'或'本身就表示'国'；简化字'国'用'玉'代替里面的'或'，取国中有疆土珍宝之意。"},{"char":"她","type":"形声","radical":"女，也","benyi":"女性第三人称代词。","yanbian":"古汉语本无性别区分的'他/她/它'；'她'是二十世纪初刘半农等人仿照'他'字新造的字，专指女性第三人称。"},{"char":"姐","type":"形声","radical":"女，且","benyi":"称呼同辈中年长的女子。","yanbian":"从女表意，'且'表声；本义即姐姐。"},{"char":"对","type":"会意","trad":"對","radical":"丵，寸","benyi":"本义是应答、回答。","yanbian":"甲骨文像手持工具作答之形，引申为应答、对答，又引申出正确、相对等义；简化字用'又'代替繁体复杂的部件。"},{"char":"忙","type":"形声","radical":"忄，亡","benyi":"心里没有空闲，事情多。","yanbian":"从忄（心）表意，与心境有关，'亡'表声；本义是心绪繁乱、没有空闲。"},{"char":"想","type":"形声","radical":"心，相","benyi":"仔细察看、揣度。","yanbian":"从心表意，'相'（察看）兼表声，引申为思考、想念、希望。"},{"char":"我","type":"象形","radical":"戈，手","benyi":"本义是一种带齿刃的兵器。","yanbian":"甲骨文像一种锯齿状兵器的形状，后被假借用作第一人称代词'我'，兵器的本义反而不再使用。"},{"char":"文","type":"象形","benyi":"本义是花纹。","yanbian":"甲骨文像一个正面站立的人，胸口刻画着花纹（文身）。本义是花纹，引申为文字、文章、文化。"},{"char":"法","type":"会意","trad":"灋","radical":"氵，去","benyi":"本义是法律、法度。","yanbian":"古字'灋'从水、从廌（传说能辨曲直的神兽）、从去，取水面平如公平、神兽触去不直者之意；后世省去'廌'，简化为现在的'法'。"},{"char":"泰","type":"会意","radical":"大，廾，水","benyi":"本义是水流滑溜、通畅。","yanbian":"甲骨文像双手捧水而水从指缝间滑出的样子，引申为通泰、平安、极（同'太'）。"},{"char":"的","type":"形声","radical":"白，勺","benyi":"本义是鲜明的箭靶中心（白点）。","yanbian":"本指箭靶中心的白点'的'（目标），后借用作结构助词，表示领属或修饰关系，是现代汉语使用频率最高的字之一。"},{"char":"谁","type":"形声","trad":"誰","radical":"讠，隹","benyi":"疑问代词，询问是什么人。","yanbian":"从言表意，与言语问答有关，'隹'表声。"},{"char":"这","type":"形声","trad":"這","radical":"辶，文","benyi":"近指代词，'这个、这里'。","yanbian":"繁体'這'从辶从言，本义与'迎接'相关（古读yàn）；简化字'这'用'文'代替繁体的'言'作部件，只是记号性简化，不再表意。"},{"char":"个","type":"象形","trad":"箇","radical":"竹（半个竹节）","benyi":"本义是竹字之半，引申作量词，表示个体、单个。","yanbian":"古'个'是'竹'字的一半（半个竹节），后来渐渐替代了以'人'为声符的形声字'個'，成为现代汉语中最常用的量词。"},{"char":"么","type":"形声","trad":"麼","radical":"幺，麻","benyi":"疑问代词的后缀，如'什么、怎么'。","yanbian":"本作'麼'，从麻从幺；简化字'么'只保留声旁'幺'，是记号性简化字。"},{"char":"买","type":"会意","trad":"買","radical":"罒（网），贝","benyi":"本义是用网罗财货（贝壳）以换取物品，即购买。","yanbian":"繁体'買'从网从贝，古人以贝壳为货币，'网罗财货'即购买；简化字'买'是草书楷化后的记号字。"},{"char":"些","type":"形声","radical":"此，二","benyi":"表示不定的少量。","yanbian":"从'此'表意（指这一点），下面表示数量少，本义即若干、少量。"},{"char":"他","type":"形声","radical":"亻，也","benyi":"本义是别的、其他（人或事物）。","yanbian":"上古'他'泛指别的人或物，无性别之分；后来专指第三人称男性，女性用'她'、事物用'它'是近代才分化出的新字。"},{"char":"做","type":"会意","radical":"亻，故","benyi":"本义是从事、制作某事。","yanbian":"'做'是'作'的后起分化字，从人从故（故：旧事、缘故），表示人去处理、完成一件事，宋代以后逐渐通行。"},{"char":"儿","type":"象形","trad":"兒","benyi":"本义是小孩。","yanbian":"甲骨文像一个头顶囟门还没合上的小孩。简化字“儿”只保留了繁体“兒”下面的人形。"},{"char":"几","type":"会意","trad":"幾","radical":"幺幺（丝），戍","benyi":"繁体'幾'本义是隐微、细小的迹象。","yanbian":"从丝从戍，本指戍卫时察觉细微动静，引申为'几乎、接近'，又借作疑问代词询问数量；现代字形则借用了古已有之、本指小桌几案的'几'字。"},{"char":"包","type":"会意","radical":"勹（人弯腰环抱），巳（胎儿）","benyi":"本义是妇女怀孕，胎儿在腹中。","yanbian":"甲骨文像人腹中裹着胎儿的形状，引申为包裹、包住，又引申出量词和名词'包'（袋子）。"},{"char":"去","type":"会意","radical":"大（人），凵（坎、穴）","benyi":"本义是离开、离去。","yanbian":"甲骨文像人走出洞穴或坑坎，本义是离开原地，后引申为'前往（某处）'。"},{"char":"号","type":"形声","trad":"號","radical":"口，丂","benyi":"本义是大声呼叫。","yanbian":"从口表意，与呼喊有关；引申为名号、记号，又引申为日期中的'号'（如'几号'）。"},{"char":"呢","type":"形声","radical":"口，尼","benyi":"疑问或陈述语气助词。","yanbian":"从口表意，与语气有关，'尼'表声；是近代白话文中常用的虚词。"},{"char":"和","type":"形声","radical":"禾，口","benyi":"本义是声音相应和谐。","yanbian":"从口表意，与声音应和有关，'禾'表声；引申为和睦、和谐，又虚化为连词'和'，表示并列。"},{"char":"哥","type":"形声","radical":"可，可","benyi":"本义与歌唱有关，'哥'本是'歌'的本字。","yanbian":"古'哥'即'歌'，本义是歌唱，后来才转用于称呼兄长，本义另造'歌'字承担。"},{"char":"奶","type":"形声","radical":"女，乃","benyi":"本义是乳汁，也指哺乳的母亲。","yanbian":"从女表意，'乃'表声；引申为对祖母的称呼'奶奶'。"},{"char":"妈","type":"形声","trad":"媽","radical":"女，马","benyi":"母亲的口语称呼。","yanbian":"从女表意，'马'表声；是较晚起的形声字，专用于口语称呼母亲。"},{"char":"妹","type":"形声","radical":"女，未","benyi":"年幼的女性同辈亲属。","yanbian":"从女表意，'未'表声；本义即妹妹。"},{"char":"孩","type":"形声","radical":"子，亥","benyi":"本义是小儿的笑貌，引申指小孩子。","yanbian":"从子表意，与孩童有关，'亥'表声；本义是婴儿的笑声，后来泛指儿童。"},{"char":"它","type":"象形","benyi":"本义是蛇。","yanbian":"甲骨文像一条蛇，是“蛇”的本字。古人见面常问“无它乎”（没有蛇吧）；后来借用作代词，本义另加虫旁写成“蛇”。"},{"char":"岁","type":"形声","trad":"歲","radical":"步，戌","benyi":"本义是岁星（木星），古人用它来纪年。","yanbian":"繁体'歲'与步、戌相关，本指岁星运行一周为一年，引申为年岁、年龄的量词。"},{"char":"年","type":"会意","radical":"禾，人","benyi":"本义是庄稼成熟、丰收。","yanbian":"甲骨文像人背着成熟的禾谷，古代谷物一年一熟，故'年'引申为一年的时间单位。"},{"char":"怎","type":"形声","radical":"心，乍","benyi":"疑问代词，询问方式或原因。","yanbian":"从心表意，与疑问、心理活动有关，'乍'表声；是近代白话疑问词'怎么'的词根。"},{"char":"息","type":"会意","radical":"自（鼻），心","benyi":"本义是呼吸、气息。","yanbian":"从自（鼻子）从心，古人认为鼻息与心相通，本义是呼吸；引申为休息、消息、利息等义。"},{"char":"新","type":"形声","radical":"斤，亲","benyi":"本义是砍伐木材。","yanbian":"从斤（斧子）表意，古'新'本作砍柴解（后作'薪'），因新砍的木柴是'新'的，引申为新旧的'新'。"},{"char":"星","type":"形声","radical":"日，生","benyi":"本义是星辰、星星。","yanbian":"从日表意，与发光天体有关，'生'表声；甲骨文本像多颗星星的形状。"},{"char":"晚","type":"形声","radical":"日，免","benyi":"本义是太阳落下、天色将黑的时候。","yanbian":"从日表意，'免'表声；引申为迟、来得晚。"},{"char":"有","type":"会意","radical":"又（手），月（肉）","benyi":"本义是手中持有肉，表示拥有、占有。","yanbian":"甲骨文像手拿着一块肉，本义是持有、拥有，后泛指存在、具备。"},{"char":"期","type":"形声","radical":"其，月","benyi":"本义是约定的时日。","yanbian":"从月表意，与时间周期有关，'其'表声；引申为期限、星期、时期等义。"},{"char":"条","type":"形声","trad":"條","radical":"木，攸","benyi":"本义是树木的细长枝条。","yanbian":"从木表意，'攸'表声；因枝条细长，引申为量词'条'，用于细长的事物。"},{"char":"没","type":"会意","radical":"氵，殳","benyi":"本义是沉入水中、淹没。","yanbian":"从水表意，本义是沉没，引申为否定副词'没有'，表示不存在或未曾发生。"},{"char":"爸","type":"形声","radical":"父，巴","benyi":"父亲的口语称呼。","yanbian":"从父表意，'巴'表声；是较晚产生的形声字，专用于口语称呼父亲。"},{"char":"电","type":"象形","trad":"電","radical":"雨，申","benyi":"本义是闪电。","yanbian":"繁体'電'从雨从申（申象闪电屈折之形），本义是雷电；简化字'电'直接采用了内部的'申'形，后引申指电力、电器。"},{"char":"真","type":"会意","radical":"匕，目，乚，八","benyi":"本义说法不一，今义是真实。","yanbian":"《说文》解释为“仙人变形而登天”，字形由“匕（变化）”“目”“乚”“八”组成；也有学者认为金文像鼎里盛满东西。后来主要表示真实、的确、真正。"},{"char":"米","type":"象形","benyi":"本义是去壳的谷粒。","yanbian":"甲骨文中间一横，上下各有几个小点，像散落的米粒。本义是去了壳的粮食颗粒，也借作长度单位（一米）。"},{"char":"脑","type":"形声","trad":"腦","radical":"月（肉），卤","benyi":"本义是头颅中的脑髓。","yanbian":"从肉表意，与身体部位有关；繁体右边含'囟'（头顶骨缝）表示头脑，简化字用'卤'作声旁部件。"},{"char":"菜","type":"形声","radical":"艹，采","benyi":"本义是可以食用的草本植物。","yanbian":"从艹（草）表意，'采'（采摘）兼表声，本义是蔬菜，后泛指菜肴。"},{"char":"话","type":"形声","trad":"話","radical":"讠，舌","benyi":"本义是言语、说的话。","yanbian":"从言表意，'舌'与说话的器官相关（也兼表声），本义即言语。"},{"char":"边","type":"形声","trad":"邊","radical":"辶，力","benyi":"本义是边界、旁边。","yanbian":"繁体'邊'从辵（行走）表意，本义与巡行边界有关；简化字用'力'代替复杂声旁，是记号性简化。"},{"char":"那","type":"形声","radical":"冄，阝","benyi":"本作地名用字，后借作远指代词'那'。","yanbian":"本义与古代地名或部族名有关，后被假借为指示代词，与'这'相对，表示较远的事物。"},{"char":"非","type":"象形","benyi":"本义是违背、相反。","yanbian":"甲骨文像鸟的两只翅膀向两边张开、方向相反。本义是相背，引申为不对、不是，又用在“非常”里表示程度很高。"},{"char":"饺","type":"形声","trad":"餃","radical":"饣，交","benyi":"一种包馅的面食。","yanbian":"从食字旁表意，'交'表声（也暗示皮馅交合包裹之意），是较晚产生的专用字。"},{"char":"事","type":"会意","radical":"又（手），捕猎或记事的工具","benyi":"本义是职事、工作。","yanbian":"甲骨文像一只手拿着一种捕猎或记事的工具，本义是职事（和“史”“吏”原来是一个字）。引申为事情、事业。"},{"char":"分","type":"会意","radical":"八，刀","benyi":"本义是用刀把东西分开。","yanbian":"从八（分开）从刀，本义是分割，引申为分钟、分数等计量单位。"},{"char":"午","type":"象形","benyi":"本义是舂米用的杵。","yanbian":"甲骨文像一根舂米的木杵，是“杵”的本字。后来借用作地支第七位，对应一天正中的时辰，所以有了中午、下午。"},{"char":"半","type":"会意","radical":"八，牛","benyi":"本义是把牛平分为两半。","yanbian":"从八（分开）从牛，古代祭祀常把牛平分两份，引申为二分之一。"},{"char":"后","type":"会意","trad":"後","radical":"彳，幺，夂","benyi":"繁体'後'本义是走在后面、落后。","yanbian":"从彳（行走）、幺（细小迟缓）、夂（足），表示脚步迟缓落在后面，引申为时间空间上的'以后'；简化字'后'借用了古代表示'君主'的另一个字。"},{"char":"吧","type":"形声","radical":"口，巴","benyi":"商量、建议或推测的语气助词。","yanbian":"从口表意，与语气有关，'巴'表声；是近代白话文常用虚词。"},{"char":"影","type":"形声","radical":"景，彡","benyi":"本义是光影、影子。","yanbian":"从景（光）表意，'彡'表示物象的纹理轮廓，本义是物体挡光形成的影子，引申指电影。"},{"char":"早","type":"会意","radical":"日，甲","benyi":"本义是太阳刚出来的时候，即清晨。","yanbian":"从日从甲，甲象草木初生破壳之形，太阳初升如草木破土，本义是早晨，引申为时间上的'早'。"},{"char":"点","type":"形声","trad":"點","radical":"黑，占","benyi":"本义是细小的黑色斑迹。","yanbian":"从黑表意，'占'表声；引申为计时的'点（钟点）'、小数点、地点等义。"},{"char":"课","type":"形声","trad":"課","radical":"讠，果","benyi":"本义是考核、督促。","yanbian":"从言表意，古代指按规定标准考核督促；后引申为按计划教授的'课程、功课'。"},{"char":"里","type":"会意","radical":"田，土","benyi":"本义是居住的地方、乡里。","yanbian":"从田从土，表示可耕种居住之地，本义是乡里、居所，又作长度单位；简化字'里'又兼并了繁体'裏/裡'（表示衣服内层，引申指'里面'）的用法。"},{"char":"钟","type":"形声","trad":"鐘/鍾","radical":"钅，中","benyi":"本义是古代的打击乐器。","yanbian":"从金表意，古钟是青铜乐器；简化字把表示'计时器'的'鐘'和表示'专注（钟情）'的'鍾'合并为一个字，'中'作声旁。"},{"char":"到","type":"形声","radical":"至，刀","benyi":"本义是到达、抵达。","yanbian":"从至（到达）表意，'刀'表声，本义即到达终点。"},{"char":"前","type":"会意","radical":"止，舟","benyi":"本义是前进（脚站在船上向前行）。","yanbian":"甲骨文从止（脚）从舟，表示人站在船上向前行进，本义是前进，后引申为方位词'前面'。"},{"char":"外","type":"会意","radical":"夕，卜","benyi":"本义是占卜的时间不对（傍晚占卜为反常）。","yanbian":"从夕（傍晚）从卜，古人惯于早晨占卜，傍晚占卜不合常规，故'外'引申为超出常规、在范围之外，后泛指外面、外部。"},{"char":"房","type":"形声","radical":"户，方","benyi":"本义是正室两旁的屋子。","yanbian":"从户（单扇门，表示房屋）表意，'方'表声，本义是正房两侧的厢房，后泛指房屋、房间。"},{"char":"校","type":"形声","radical":"木，交","benyi":"本义是关养马匹的木栅栏。","yanbian":"从木表意，'交'表声，本义是木制栅栏，古代也指军营，后借指学校（比较考核学习之所）。"},{"char":"桌","type":"形声","radical":"木，卓","benyi":"本义是高而直立的桌子。","yanbian":"从木表意，'卓'（高而直立）兼表声，本义即桌子，是较晚才产生的字。"},{"char":"病","type":"形声","radical":"疒，丙","benyi":"本义是重病。","yanbian":"从疒（病字旁，与疾病有关）表意，'丙'表声，本义比'疾'更严重，后泛指生病。"},{"char":"能","type":"象形","benyi":"本义是熊。","yanbian":"金文像一只张着大嘴、有脚爪的熊，是“熊”的本字。熊力气大、本领强，所以借用表示能力、能够；本义另造“熊”字。"},{"char":"听","type":"形声","trad":"聽","radical":"口，斤","benyi":"繁体'聽'本义是用耳朵接受声音。","yanbian":"繁体从耳表意，与听觉有关；简化字'听'借用了一个同音的口字旁形声字字形，'斤'作声旁，是同音假借简化。"},{"char":"唱","type":"形声","radical":"口，昌","benyi":"本义是用口发出歌声。","yanbian":"从口表意，'昌'表声，本义即歌唱。"},{"char":"椅","type":"形声","radical":"木，奇","benyi":"本义是一种树木（椅树），后借指坐具。","yanbian":"从木表意，'奇'表声，本指一种树，后来假借表示有靠背的坐具'椅子'。"},{"char":"歌","type":"形声","radical":"可，欠","benyi":"本义是唱歌、歌唱。","yanbian":"从欠（张口出气，与唱歌有关）表意，'可'（本是'哥'，表歌唱）表声，本义即歌唱、歌曲。"},{"char":"狗","type":"形声","radical":"犭，句","benyi":"本义是小犬、幼犬。","yanbian":"从犬（犭）表意，'句'表声，本指小狗，后泛指狗。"},{"char":"玩","type":"形声","radical":"王，元","benyi":"本义是把玩玉器。","yanbian":"从王（玉）表意，与玉器有关，'元'表声，本义是摩挲、赏玩玉器，引申为玩耍、游戏。"},{"char":"白","type":"象形","benyi":"本义是白色。","yanbian":"甲骨文字形说法不一：一说像大拇指，一说像米粒，一说像太阳的光。本义是白色，引申为明亮、清楚（明白）、空白。"},{"char":"第","type":"形声","radical":"竹，弟","benyi":"本义是竹简编次的顺序。","yanbian":"从竹表意，古代竹简编号有次第，'弟'表声，本义是次序，引申为表示序数的前缀'第一、第二'。"},{"char":"视","type":"形声","trad":"視","radical":"礻，见","benyi":"本义是看、察看。","yanbian":"从见表意，与看有关，'示'表声，本义即观看、察看，引申为电视的'视'。"},{"char":"读","type":"形声","trad":"讀","radical":"讠，卖","benyi":"本义是诵读文字。","yanbian":"从言表意，与言语诵读有关，'卖'（繁体'賣'）表声，本义是朗读、诵读，引申为阅读。"},{"char":"件","type":"形声","radical":"亻，牛","benyi":"本义是把大牲畜分解成小块。","yanbian":"从人从牛，本义是分解，引申为件数、条款，用作量词表示单个事物。"},{"char":"便","type":"形声","radical":"亻，更","benyi":"本义是人发现不便之处就加以变更。","yanbian":"从人从更，本义是人根据情况变通，引申为方便、便利；读pián时组成'便宜'，表示价格低廉。"},{"char":"元","type":"会意","radical":"二，儿","benyi":"本义是人的头部。","yanbian":"从二（上）从儿（人），本义是头，因头是身体最上部，引申为首、初、大，又借作货币单位。"},{"char":"员","type":"会意","trad":"員","radical":"口，贝","benyi":"本义与计数、圆形有关。","yanbian":"从贝从口，古义与钱财、圆形陈设有关，后借指成员、人员。"},{"char":"售","type":"形声","radical":"口，隹","benyi":"本义是卖出去、售出。","yanbian":"从口表意，与交易叫卖有关，本义是出售、卖出。"},{"char":"块","type":"形声","trad":"塊","radical":"土，夬","benyi":"本义是土块。","yanbian":"从土表意，本义是成块的泥土，引申为量词'块'，也用于口语货币单位（一块钱）。"},{"char":"宜","type":"会意","radical":"宀，多","benyi":"本义是合适、适宜。","yanbian":"古字形像屋内案上摆放祭肉，表示合适地陈设祭品，引申为适宜、应当，又组成'便宜'表示价格适当、低廉。"},{"char":"斤","type":"象形","benyi":"本义是斧头。","yanbian":"甲骨文像一把有柄的斧头。本义是砍木头的斧子，后来借作重量单位（一斤）。以“斤”为偏旁的字多和砍有关，如“新”（用斧子砍木头）。"},{"char":"服","type":"会意","radical":"月，卩，又","benyi":"本义是使人屈服、驾驭。","yanbian":"古字形与舟、人、手有关，一说本义是使人顺从驾驭，引申为顺从、服从，又引申为衣服（穿着使身体服帖）。"},{"char":"杯","type":"形声","radical":"木，不","benyi":"本义是木制的饮器。","yanbian":"从木表意，古代杯子多为木制，'不'表声，本义即杯子。"},{"char":"果","type":"象形","benyi":"本义是果实。","yanbian":"甲骨文像一棵树（木）上长着圆圆的果子。本义是果实，引申为结果、果然。"},{"char":"样","type":"形声","trad":"樣","radical":"木，羊","benyi":"本义是一种树木（橡树）。","yanbian":"从木表意，'羊'表声，本指橡树，后借指样式、模样。"},{"char":"男","type":"会意","radical":"田，力","benyi":"本义是在田里用力耕作的男子。","yanbian":"从田从力，古代男子在田间劳作，本义即男子。"},{"char":"穿","type":"会意","radical":"穴，牙","benyi":"本义是穿透、凿通。","yanbian":"从穴（洞）从牙（尖利的物体），表示用尖物打通洞穴，本义是穿透，引申为穿衣服（把身体穿过衣物）。"},{"char":"苹","type":"形声","trad":"蘋","radical":"艹，平","benyi":"本义是一种水生植物（浮萍）。","yanbian":"从艹表意，'平'表声，本指水草'苹'，与'苹果'的'苹'本是两个不同的字，简化后合并同形，'苹果'其实是外来词的音译演变。"},{"char":"货","type":"形声","trad":"貨","radical":"贝，化","benyi":"本义是财物、钱财。","yanbian":"从贝（钱财）表意，'化'表声，本义是财货，引申为货物、商品。"},{"char":"贵","type":"会意","trad":"貴","radical":"中，贝","benyi":"本义是价格高、物以稀为贵。","yanbian":"从贝（钱财）表意，上部一说与双手捧物、地位尊贵有关，引申为地位高、价格高。"},{"char":"钱","type":"形声","trad":"錢","radical":"钅，戔","benyi":"本义是一种农具（铲子）。","yanbian":"从金表意，古'钱'本是铲形农具，因常用作交换媒介，后借指货币。"},{"char":"候","type":"形声","radical":"亻，侯","benyi":"本义是守望、侦察。","yanbian":"从人表意，'侯'表声，本义是在边境守望敌情，引申为等待、时候、气候。"},{"char":"床","type":"形声","radical":"木，广","benyi":"本义是供人躺卧的家具。","yanbian":"从木表意，古人睡卧的家具多为木制，本义即床铺。"},{"char":"开","type":"会意","trad":"開","radical":"门，廾","benyi":"繁体'開'本义是用双手把门打开。","yanbian":"从门从廾（双手），本义是开门，引申为打开、开始、开车等义；简化字'开'省去了门字框。"},{"char":"弟","type":"象形","benyi":"本义是次第、顺序。","yanbian":"甲骨文像绳子一圈一圈有次序地缠在木桩上。本义是次第；兄弟排行有先后，所以引申为弟弟。"},{"char":"时","type":"形声","trad":"時","radical":"日，寺","benyi":"本义是季节、时辰。","yanbian":"从日表意，与时间有关，'寺'表声，本义是四季，引申为时间、时候。"},{"char":"昨","type":"形声","radical":"日，乍","benyi":"本义是昨天，过去的一天。","yanbian":"从日表意，'乍'（忽然、刚才）表声，本义即昨天。"},{"char":"正","type":"指事","radical":"止","benyi":"本义是向目标前进、征伐。","yanbian":"甲骨文从止（脚）上加一横表示目标或城邑，本义是征行、出征，后引申为正直、正确、正在。"},{"char":"知","type":"会意","radical":"矢，口","benyi":"本义是知晓、明白事理。","yanbian":"从矢（箭）从口，一说箭能迅速命中目标，如同言语说出真知灼见，本义是知道、了解。"},{"char":"要","type":"象形","benyi":"本义是腰。","yanbian":"甲骨文像一个人两手叉在腰上，是“腰”的本字。腰在身体中间，非常重要，引申为重要、需要、想要；本义另加“月（肉）”写成“腰”。"},{"char":"说","type":"形声","trad":"說","radical":"讠，兑","benyi":"本义是用言语解说、使人心悦诚服。","yanbian":"从言表意，'兑'（喜悦）兼表声，本义是解说、劝说，引申为说话，又读yuè时通'悦'。"},{"char":"起","type":"形声","radical":"走，己","benyi":"本义是从坐卧状态站立、起身。","yanbian":"从走（与行走站立有关）表意，'己'表声，本义是起身，引申为起床、开始。"},{"char":"道","type":"会意","radical":"辶，首","benyi":"本义是人行走的道路。","yanbian":"从辶（行走）从首（头，引导），本义是道路，古人以人头引路会意，引申为道理、方法，'知道'即明白事理的路径。"},{"char":"问","type":"形声","trad":"問","radical":"口，门","benyi":"本义是询问、发问。","yanbian":"从口表意，与言语询问有关，'门'表声，本义即询问。"},{"char":"了","type":"象形","benyi":"本义说法不一。","yanbian":"小篆像一个没有手臂的小孩（一说像缠绕的样子），本义不太清楚。读 liǎo 时表示完结、明白（了解）；读 le 时是助词，表示动作完成或情况变化。"},{"char":"冷","type":"形声","radical":"冫，令","benyi":"本义是寒冷。","yanbian":"从冫（两点水，古'冰'字）表意，与寒冷有关，'令'表声，本义即寒冷。"},{"char":"司","type":"会意","radical":"𠂆（人形），口","benyi":"本义是掌管、主管。","yanbian":"甲骨文像一个人张口发号施令（一说像手拿器具）。本义是掌管，引申为主管的机构，今天常用在“公司”“司机”里。"},{"char":"回","type":"象形","benyi":"本义是回旋。","yanbian":"甲骨文像水流打旋的样子。本义是旋转，引申为返回（回家）、回答，又用作量词（一回）。"},{"char":"得","type":"会意","radical":"彳，贝，寸","benyi":"本义是在路上拾获财物。","yanbian":"从彳（行走）从贝（财物）从寸（手），表示在路上拾取财物，本义是获得，引申为得到、可以。"},{"char":"来","type":"象形","trad":"來","benyi":"本义是麦子。","yanbian":"甲骨文像一株有根、有叶、有麦穗的麦子，是“麦”的本字。后来借用表示“来去”的“来”，麦子的意思另写作“麦”。简化字根据草书写成“来”。"},{"char":"药","type":"形声","trad":"藥","radical":"艹，乐","benyi":"本义是可以治病的草。","yanbian":"从艹（草）表意，古代药物多为植物，'乐'表声，本义即药物。"},{"char":"需","type":"会意","radical":"雨，而","benyi":"本义是遇雨受阻而等待。","yanbian":"从雨从而（一说象人淋雨之形），本义是遇雨停留等待，引申为需要、必须。"},{"char":"先","type":"会意","radical":"之，儿","benyi":"本义是走在前面。","yanbian":"从止（脚）从人，表示脚在人前，本义是先行、领先，引申为时间上在前的'先'。"},{"char":"务","type":"形声","trad":"務","radical":"力，敄","benyi":"本义是致力从事。","yanbian":"从力表意，与用力做事有关，本义是致力于某事，引申为事务、务必。"},{"char":"卖","type":"会意","trad":"賣","radical":"十，买","benyi":"本义是把货物拿出去交换钱财。","yanbian":"繁体'賣'从出从買，表示把买来的东西再卖出去，本义即出售；简化字用'十'代替上部，是记号简化。"},{"char":"可","type":"会意","radical":"口，丂","benyi":"本义是应允、许可。","yanbian":"从口从丂，本义是开口应允，引申为可以、可能。"},{"char":"坐","type":"会意","radical":"人，人，土","benyi":"本义是两人相对坐在土地上。","yanbian":"甲骨文像两人对坐在土地（席子）上的样子，本义即坐下。"},{"char":"士","type":"象形","benyi":"本义是能担当事情的成年男子。","yanbian":"金文像一把斧钺（说法不一）。本义是成年男子，引申为读书人、有本领的人，“女士”“护士”里的“士”都指人。"},{"char":"给","type":"形声","trad":"給","radical":"纟，合","benyi":"本义是使丰足、供给。","yanbian":"从纟（丝）表意，古义与丝帛充足有关，'合'表声，本义是供给、使充足，引申为给予。"},{"char":"茶","type":"形声","radical":"艹，余","benyi":"本义是一种苦菜，后专指茶树、茶叶。","yanbian":"从艹表意，本字作'荼'，唐代以后减去一横，另造'茶'字专指茶叶。"},{"char":"蛋","type":"形声","radical":"疋，产","benyi":"本义是鸟、龟等的卵。","yanbian":"从疋（本作虫，指卵生动物）表意，本义是卵，泛指各种禽蛋。"},{"char":"请","type":"形声","trad":"請","radical":"讠，青","benyi":"本义是拜见、谒见。","yanbian":"从言表意，'青'表声，本义是请求会见，引申为邀请、敬辞'请'。"},{"char":"题","type":"形声","trad":"題","radical":"页，是","benyi":"本义是额头。","yanbian":"从页（头）表意，'是'表声，本义是额头，引申为标题、题目、问题（放在文章开头的部分）。"},{"char":"鸡","type":"形声","trad":"雞","radical":"又，鸟","benyi":"本义是家禽鸡。","yanbian":"从隹（短尾鸟）表意，'奚'表声，本义即鸡；简化字用'又'代替声旁'奚'。"},{"char":"不","type":"象形","benyi":"本义说法不一。","yanbian":"甲骨文一说像花萼的根部，一说像鸟往上飞不下来。很早就被借用为否定词，表示“不、没有”，本义已经不用。"},{"char":"写","type":"形声","trad":"寫","radical":"宀，与","benyi":"繁体'寫'本义是移置、放置。","yanbian":"从宀（房屋）表意，本义是把物象摹画、置物于家中，后专指书写文字；简化字'写'另借了一个同音的简单字形。"},{"char":"汉","type":"形声","trad":"漢","radical":"氵，又","benyi":"本义是汉水（一条河流的名称）。","yanbian":"从水表意，本指汉水；因汉朝定都于此、汉族由此得名，'汉'又引申指汉族、汉语。"},{"char":"语","type":"形声","trad":"語","radical":"讠，吾","benyi":"本义是谈论、议论。","yanbian":"从言表意，'吾'表声，本义是说话、议论，引申为语言。"},{"char":"都","type":"形声","radical":"者，阝","benyi":"本义是有先王宗庙的大城市（都城）。","yanbian":"从邑（阝，城市）表意，'者'表声，本义是都城，读dōu时假借为副词，表示全部。"},{"char":"京","type":"象形","benyi":"本义是人工堆起的高丘、高台。","yanbian":"甲骨文像建在高台上的房子。本义是高丘，国都多建在高处，所以引申为首都，如北京、南京。"},{"char":"住","type":"形声","radical":"亻，主","benyi":"本义是停止、止息。","yanbian":"从人表意，'主'表声，本义是停留，引申为长期停留某处、居住。"},{"char":"爱","type":"会意","trad":"愛","radical":"爪，冖，心，夊","benyi":"繁体'愛'本义是内心怀有深切的情感。","yanbian":"从心表意，与感情有关，字形像人手捧着心、缓行相送，本义是喜爱、爱惜；简化字'爱'省去了中间的'心'。"},{"char":"飞","type":"象形","trad":"飛","benyi":"本义是鸟飞。","yanbian":"繁体“飛”像一只鸟展开翅膀向上飞，简化字只保留了一边翅膀的轮廓。本义是鸟飞，引申为飞机飞行、飞快。"},{"char":"丢","type":"会意","radical":"去","benyi":"本义是抛弃、遗失。","yanbian":"从'去'（离去）加一点，表示东西离手而去，本义是丢弃、遗失。"},{"char":"像","type":"形声","radical":"亻，象","benyi":"本义是相似。","yanbian":"从人表意，'象'（古人以象骨制作雕像）兼表声，本义是模拟、相似，引申为画像、雕像。"},{"char":"助","type":"形声","radical":"且，力","benyi":"本义是从旁帮忙、辅助。","yanbian":"从力表意，与用力帮忙有关，'且'表声，本义即帮助。"},{"char":"台","type":"象形","trad":"臺／檯／颱","benyi":"本义是高而平、可以远望的建筑。","yanbian":"繁体“臺”像土台上的高楼，本义是高台。简化字借用了读音相同的“台”，同时合并了“檯”（桌子）、“颱”（台风），所以今天有舞台、服务台、台风等意思。"},{"char":"头","type":"形声","trad":"頭","radical":"大，豆","benyi":"本义是人的脑袋。","yanbian":"繁体从页（人头）从豆（声），本义即头部；简化字'头'另用了一个古字形，引申为物体的顶端、开头。"},{"char":"带","type":"象形","trad":"帶","benyi":"本义是腰带。","yanbian":"小篆像腰间束着的带子，下面垂着装饰的佩巾。本义是衣带，引申为带子；把东西系在身上走，又引申为携带、带领。"},{"char":"帮","type":"形声","trad":"幫","radical":"邦，巾","benyi":"繁体本义与国家、地域有关，后借指帮助。","yanbian":"繁体'幫'从巾从邦，后来专用于表示帮助、协助；简化字保留了下部'巾'的部件。"},{"char":"应","type":"形声","trad":"應","radical":"广，鹰","benyi":"本义是回应、答应。","yanbian":"繁体从心（后省），'鹰'表声，本义是应答、应和；简化字用'广'代替复杂的声旁部件。"},{"char":"护","type":"形声","trad":"護","radical":"扌，户","benyi":"本义是保卫、保护。","yanbian":"从言（后简化为扌）表意，'蒦'（简化为户）表声，本义是看护、保护。"},{"char":"李","type":"形声","radical":"木，子","benyi":"本义是一种果树（李树）。","yanbian":"从木表意，'子'表声，本义是李子树，后常用作姓氏。"},{"char":"短","type":"形声","radical":"矢，豆","benyi":"本义是长度不足。","yanbian":"从矢（箭，古人用箭的长度作为度量标准）表意，'豆'表声，本义是长度小、不足。"},{"char":"码","type":"形声","trad":"碼","radical":"石，马","benyi":"本义是计数、计量用的筹码。","yanbian":"从石表意，古代用石子计数，'马'表声，本义是计数的筹码，引申为数目字、号码。"},{"char":"箱","type":"形声","radical":"竹，相","benyi":"本义是车厢两旁的竹制遮蔽物。","yanbian":"从竹表意，古代车箱多用竹制，'相'表声，后引申为盛物的箱子。"},{"char":"该","type":"形声","trad":"該","radical":"讠，亥","benyi":"本义是完备、齐全。","yanbian":"从言表意，'亥'表声，本义与完备有关，后借用表示'应当'，即'应该'的'该'。"},{"char":"身","type":"象形","benyi":"本义是怀孕。","yanbian":"甲骨文像一个腹部隆起的人，本义是身孕。引申为人的身体，又引申为自身、亲身。"},{"char":"长","type":"象形","trad":"長","benyi":"本义是头发长。","yanbian":"甲骨文像一个头发很长、拄着拐杖的人。头发长，引申为长短的“长”（cháng）；老人年纪大，又引申为生长、年长、首长（zhǎng）。简化字根据草书写成“长”。"},{"char":"久","type":"象形","benyi":"本义说法不一。","yanbian":"小篆像一个人后面有东西拉住他，表示停留得久；一说像用艾草灸人的背部，是“灸”的本字，灸治要很长时间。引申为时间长——好久、多久。"},{"char":"勺","type":"象形","benyi":"本义是舀东西的勺子。","yanbian":"小篆像一把勺子，里面一点是舀起来的东西。本义是勺子，也用作容量单位。"},{"char":"单","type":"象形","trad":"單","benyi":"本义是一种打猎用的工具。","yanbian":"甲骨文像一种顶端分叉、绑着石块的狩猎工具。后来借用表示单独、单一，又引申为写着项目的纸（菜单、名单）；“简单”指不复杂。简化字根据草书简写。"},{"char":"又","type":"象形","benyi":"本义是右手。","yanbian":"甲骨文像一只伸出三个手指的右手，是“右”的本字。后来借用表示“再一次、而且”，右手的意思另写作“右”。作偏旁时常表示手，如友、取。"},{"char":"双","type":"会意","trad":"雙","radical":"又，又","benyi":"本义是一对、两个。","yanbian":"繁体'雙'从两个'隹'（鸟）加'又'（手），表示手里拿着一对鸟，本义即成对；简化字用'又又'代替。"},{"char":"只","type":"象形","trad":"隻","radical":"隹","benyi":"繁体'隻'本义是手里抓住一只鸟。","yanbian":"从又（手）从隹（鸟），表示手中擒获一只鸟，本义是一只，后作量词；读zhǐ表'仅仅'时是另一个更古老的字。"},{"char":"客","type":"形声","radical":"宀，各","benyi":"本义是来访的人、宾客。","yanbian":"从宀（房屋）表意，'各'表声，本义是到别人家做客的人。"},{"char":"尝","type":"形声","trad":"嘗","radical":"尚，旨","benyi":"本义是辨别滋味、试吃。","yanbian":"从旨（味道）表意，'尚'表声，本义是用嘴辨别滋味，引申为经历、曾经。"},{"char":"张","type":"形声","trad":"張","radical":"弓，长","benyi":"本义是把弓弦拉开。","yanbian":"从弓表意，与射箭有关，'长'表声，本义是拉开弓弦，引申为张开、扩大，又作量词用于纸张、桌子等平面物。"},{"char":"料","type":"会意","radical":"米，斗","benyi":"本义是用斗量米。","yanbian":"从米从斗，本义是称量谷物，引申为材料、原料、预料等义。"},{"char":"方","type":"象形","benyi":"本义说法不一。","yanbian":"甲骨文一说像一种翻土的农具，一说像两只船并在一起。常用义是方形、方向，又引申为方法、地方、方便。"},{"char":"渴","type":"形声","radical":"氵，曷","benyi":"本义是水干涸。","yanbian":"从水表意，'曷'表声，本义是河水干枯，引申为口干想喝水的'渴'。"},{"char":"用","type":"象形","benyi":"本义说法不一。","yanbian":"甲骨文像一种桶一类的器物（一说像木栅栏）。很早就用来表示使用、施行，引申为用处、有用。"},{"char":"碗","type":"形声","trad":"盌","radical":"石，宛","benyi":"本义是盛饭菜的器皿。","yanbian":"从石（后也作木、皿）表意，材质多样，'宛'表声，本义即碗。"},{"char":"筷","type":"形声","radical":"竹，快","benyi":"本义是夹取食物的用具（筷子）。","yanbian":"从竹表意，筷子多为竹制，'快'表声，本义即筷子。"},{"char":"简","type":"形声","trad":"簡","radical":"竹，间","benyi":"本义是古代用来写字的竹片（竹简）。","yanbian":"从竹表意，古人在竹片上写字，'间'表声，本义即竹简，引申为简单、简化。"},{"char":"糕","type":"形声","radical":"米，羔","benyi":"本义是用米粉做成的食品。","yanbian":"从米表意，与谷物制品有关，'羔'表声，本义即糕点。"},{"char":"选","type":"会意","trad":"選","radical":"辶","benyi":"本义是遣送、派遣。","yanbian":"从辵（行走）表意，本义与遣送有关，引申为挑选、选择。"},{"char":"信","type":"会意","radical":"亻，言","benyi":"本义是言语真实。","yanbian":"从人从言，表示人说的话真实可信，本义是诚实、守信，引申为书信、信息。"},{"char":"关","type":"会意","trad":"關","radical":"门","benyi":"繁体本义是门闩，把门关上的横木。","yanbian":"从门表意，本义是门闩，引申为关闭、关口，又引申为关系、关心；简化字用符号代替复杂的声旁。"},{"char":"冰","type":"形声","radical":"冫，水","benyi":"本义是水凝结成的固体。","yanbian":"从冫（两点水，古'冰'字）从水，本义即冰。"},{"char":"区","type":"会意","trad":"區","radical":"匚，品","benyi":"繁体本义是把物品分别放在筐子里。","yanbian":"从匚（筐子）从品（物品），本义是分类放置，引申为区分、地区、区域；简化字用符号代替内部部件。"},{"char":"卡","type":"会意","radical":"上，下","benyi":"本义是上下不通、卡住。","yanbian":"由'上'字下部和'下'字上部组成，表示上下受阻，本义是卡住；因英语card音译，又用来表示卡片。"},{"char":"卫","type":"会意","trad":"衛","radical":"行","benyi":"繁体本义是巡逻守卫。","yanbian":"从行（道路）从韦（围绕），表示在道路周围巡逻守护，本义是保卫；简化字省去复杂部件。"},{"char":"咱","type":"形声","radical":"口","benyi":"本义是'咱们'，说话人自称并包括对方。","yanbian":"从口表意，与说话有关，本义是自称之词，多用于北方口语'咱、咱们'。"},{"char":"园","type":"形声","trad":"園","radical":"囗，元","benyi":"本义是种植果木蔬菜的地方。","yanbian":"从囗（围墙）表意，'元'表声，本义是有围墙的种植园地，如花园、公园。"},{"char":"境","type":"形声","radical":"土，竟","benyi":"本义是疆界、边界。","yanbian":"从土表意，与土地疆域有关，'竟'表声，本义是边界，引申为境地、环境。"},{"char":"层","type":"形声","trad":"層","radical":"尸，曾","benyi":"本义是重叠的房屋。","yanbian":"从尸（房屋）表意，'曾'表声，本义是楼层，重叠的建筑物。"},{"char":"才","type":"象形","benyi":"本义是草木初生。","yanbian":"甲骨文像草木刚从地里冒出来，横线是地面。本义是草木初生，引申为才能；又用作副词，表示时间晚、数量少（他十点才来）。"},{"char":"扫","type":"会意","trad":"掃","radical":"扌，帚","benyi":"本义是用扫帚清除。","yanbian":"从手（扌）从帚（扫帚），本义是拿扫帚打扫，引申为清除、扫除。"},{"char":"挺","type":"形声","radical":"扌，廷","benyi":"本义是拔出、伸直。","yanbian":"从手表意，'廷'表声，本义是挺直、伸直，引申为坚持、程度副词'挺'（相当于'很'）。"},{"char":"灯","type":"形声","trad":"燈","radical":"火，登","benyi":"本义是油灯、照明用具。","yanbian":"从火表意，与照明有关，'登'表声，本义即灯。"},{"char":"空","type":"形声","radical":"穴，工","benyi":"本义是孔穴、洞。","yanbian":"从穴（洞穴）表意，'工'表声，本义是孔洞，引申为空虚、天空，又读kòng表示空闲。"},{"char":"纸","type":"形声","trad":"紙","radical":"纟，氏","benyi":"本义是用丝絮做成的薄片。","yanbian":"从纟（丝）表意，古代最早的纸与丝絮加工有关，'氏'表声，后指用植物纤维制成的书写材料。"},{"char":"调","type":"形声","trad":"調","radical":"讠，周","benyi":"本义是调和、协调。","yanbian":"从言表意，与言语和谐有关，'周'表声，本义是调和，引申为调节（如空调），又读diào表示调动、曲调。"},{"char":"主","type":"象形","benyi":"本义是灯芯上的火焰。","yanbian":"小篆像灯座上的一点火苗，是“炷”的本字。灯火是屋子的中心，所以引申为主人、主要、主意。"},{"char":"假","type":"形声","radical":"亻，叚","benyi":"本义是借、凭借。","yanbian":"从人表意，'叚'表声，本义是借用，引申为不真实的'假'（jiǎ），又读jià表示假期（借来的休息时间）。"},{"char":"净","type":"形声","trad":"淨","radical":"氵，争","benyi":"本义是水清澈。","yanbian":"从水表意，'争'表声，本义是水质清洁，引申为干净、纯净。"},{"char":"别","type":"会意","radical":"冎，刂","benyi":"本义是用刀把骨肉分开。","yanbian":"从冎（骨）从刀，本义是分解、分开，引申为离别、区别，又虚化为副词'别'，表示禁止。"},{"char":"刻","type":"形声","radical":"亥，刂","benyi":"本义是用刀雕刻。","yanbian":"从刀表意，'亥'表声，本义是雕刻，古代用漏壶刻度计时，因此引申为计时单位'一刻钟'。"},{"char":"原","type":"会意","radical":"厂，泉","benyi":"本义是水源、源头。","yanbian":"从厂（山崖）从泉（水），表示山崖下涌出的泉水，本义是水的源头，引申为原来、平原（宽广平坦的地方）。"},{"char":"宾","type":"会意","trad":"賓","radical":"宀，兵","benyi":"繁体本义是来访的客人。","yanbian":"从宀（房屋）表意，本义是登门造访的客人，即宾客。"},{"char":"干","type":"象形","trad":"乾／幹","benyi":"本义是盾牌一类的武器。","yanbian":"甲骨文像一种上端分叉的武器，一说是盾牌。本义是盾牌，引申为冒犯（干涉）。简化字“干”合并了表示干燥的“乾”和表示树干、做事的“幹”，所以有了干净、干活等意思。"},{"char":"意","type":"会意","radical":"立，心","benyi":"本义是心中所想、心愿。","yanbian":"从心从音（心声），表示心里的声音、想法，本义是意愿、心意。"},{"char":"海","type":"形声","radical":"氵，每","benyi":"本义是大海。","yanbian":"从水表意，'每'表声，本义即海洋，因海广阔无边，又引申形容数量极多。"},{"char":"直","type":"象形","radical":"目","benyi":"本义是眼睛看得端正、不弯曲。","yanbian":"甲骨文像眼睛上加一竖线，表示视线正直不偏，本义是不弯曲，引申为直接、一直。"},{"char":"相","type":"会意","radical":"木，目","benyi":"本义是仔细察看。","yanbian":"从木从目，表示用眼睛观察树木，本义是察看，引申为相互（互相看），又读xiàng表示相貌、宰相（辅助察看治理国家的人）。"},{"char":"迎","type":"形声","radical":"辶，卬","benyi":"本义是迎接、面对着来。","yanbian":"从辶（行走）表意，'卬'表声，本义是走上前去迎接。"},{"char":"除","type":"形声","radical":"阝，余","benyi":"本义是台阶。","yanbian":"从阝（阜，土山、台阶）表意，'余'表声，本义是宫殿的台阶，引申为除去、除了（去掉之后剩下的）。"},{"char":"乐","type":"象形","trad":"樂","benyi":"本义是乐器。","yanbian":"甲骨文像木架上绷着丝弦的乐器。本义是乐器、音乐（yuè），听音乐让人愉快，引申为快乐（lè）。简化字根据草书写成“乐”。"},{"char":"于","type":"象形","benyi":"本义说法不一。","yanbian":"甲骨文字形说法不一（一说像一种吹奏的乐器）。很早就借用作介词，表示“在、对、向”，如“终于”“对于”。"},{"char":"哈","type":"形声","radical":"口，合","benyi":"本义是张口呼气的样子，表示笑声。","yanbian":"从口表意，与口部动作有关，'合'表声，本义即拟声词'哈'，表示笑声或呼气声。"},{"char":"封","type":"会意","radical":"圭，寸","benyi":"本义是在土地上培土植树以为疆界。","yanbian":"从土从寸（手），表示用手培土筑界，本义是分封疆界，引申为封闭、密封，又作量词用于信件（信封）。"},{"char":"平","type":"会意","radical":"亏（于），八","benyi":"一说本义是说话语气平和舒展。","yanbian":"《说文》：“平，语平舒也。”金文像气息平稳舒展地散开（一说像浮萍浮在平静的水面上）。引申为平坦、平均、平时、水平。"},{"char":"总","type":"形声","trad":"總","radical":"纟","benyi":"繁体本义是把丝线聚拢在一起。","yanbian":"从纟（丝）表意，本义是聚合、汇集，引申为总共、总是（一直聚合不变）。"},{"char":"拍","type":"形声","radical":"扌，白","benyi":"本义是用手掌击打。","yanbian":"从手表意，'白'表声，本义是拍打，引申为拍照（用手按下快门）。"},{"char":"收","type":"形声","radical":"攴，丩","benyi":"本义是逮捕、拘捕。","yanbian":"从攴（手持棍棒）表意，'丩'表声，本义是捕捉，引申为收取、收到、收成。"},{"char":"是","type":"会意","radical":"日，正","benyi":"本义是正、直，符合正道。","yanbian":"从日从正，本义是正确、这，很早就用作判断词'是'，表示肯定判断。"},{"char":"束","type":"会意","radical":"木","benyi":"本义是用绳子把木柴捆起来。","yanbian":"象形/会意字，像一捆木柴用绳子捆住的样子，本义是捆绑，引申为结束、约束。"},{"char":"比","type":"会意","radical":"匕，匕","benyi":"本义是并列、挨着。","yanbian":"甲骨文是两个人朝同一个方向并排站着，本义是并列。引申为比较、比赛，又用作介词（我比他高）。"},{"char":"爬","type":"形声","radical":"爪，巴","benyi":"本义是虫类用脚行走。","yanbian":"从爪（手足抓物）表意，'巴'表声，本义是爬行，引申为攀登。"},{"char":"终","type":"形声","trad":"終","radical":"纟，冬","benyi":"本义是线的末端。","yanbian":"从纟（丝）表意，古代结绳记事，绳的末端即为终，'冬'表声，本义是末尾，引申为结束、终于。"},{"char":"趣","type":"形声","radical":"走，取","benyi":"本义是快步走、赶赴。","yanbian":"从走表意，与行走有关，'取'表声，本义是趋向、奔赴，后借指兴趣、趣味。"},{"char":"较","type":"形声","trad":"較","radical":"车，交","benyi":"本义是车厢两旁的横木。","yanbian":"从车表意，'交'表声，本义是车上的部件，后借指比较（衡量高低），组成'比较'。"},{"char":"过","type":"形声","trad":"過","radical":"辶","benyi":"本义是经过、走过。","yanbian":"从辶（行走）表意，'咼'表声，本义是走过、经过，引申为超过、过去，又作动态助词表示经历过。"},{"char":"邮","type":"会意","trad":"郵","radical":"阝，垂","benyi":"本义是古代传递文书的驿站。","yanbian":"从阝（邑，地方）从垂（边远），本义是设在边远地方传递文书的驿站，引申为邮寄、邮件。"},{"char":"阳","type":"形声","trad":"陽","radical":"阝，日","benyi":"本义是山的向阳面。","yanbian":"从阝（山）表意，与山地有关，本义是向着太阳的一面，引申为太阳、阳光，与'阴'相对。"},{"char":"鞋","type":"形声","radical":"革，圭","benyi":"本义是穿在脚上的用品。","yanbian":"从革（皮革）表意，古代鞋多用皮革制成，'圭'表声，本义即鞋子。"},{"char":"充","type":"形声","radical":"儿，育省","benyi":"本义是长高、长大，引申为满、足。","yanbian":"《说文》：“充，长也，高也。从儿，育省声。”下面的“儿”是人形，上面是“育”的省写表声。人长大长足就是“充”，后来引申为装满、补足（充满、充电）。"},{"char":"刷","type":"形声","radical":"刂，𠕁（刷省）","benyi":"本义是刮、刷去（污垢）。","yanbian":"《说文》：“刷，刮也。”从刀表意，右边表声。古代用刀具刮去脏东西，后来指用刷子清洗（刷碗），今天又引申出刷卡、刷手机这类“很快地扫过一下”的用法。"},{"char":"如","type":"会意","radical":"女，口","benyi":"本义是依从、顺从。","yanbian":"《说文》：“如，从随也。从女从口。”古人用“女子听从吩咐”来表示“依照、顺从”。依照一个样子做就是“像”，所以引申为如同；又借用作表示假设的词，就有了“如果”。"},{"char":"宝","type":"会意","trad":"寶","radical":"宀，玉，贝，缶","benyi":"本义是珍贵的东西。","yanbian":"甲骨文像房屋（宀）里放着玉和贝，古人把玉和贝当作最珍贵的财物；金文又加上“缶”表声，写成“寶”。简化字只保留屋子里的“玉”，写成“宝”。后来泛指珍贵的、宝贵的东西。"},{"char":"必","type":"形声","radical":"八，弋","benyi":"一说本义是兵器的柄（后写作“柲”）。","yanbian":"《说文》：“必，分极也。从八弋，弋亦声。”也有学者根据甲骨文、金文认为它像带柄的器物，本义是器物的柄。后来借用来表示“一定、必须”，本义就另写成“柲”了。"},{"char":"择","type":"形声","trad":"擇","radical":"扌，睪","benyi":"本义是挑选。","yanbian":"从手（扌）表意，表示用手挑拣；“睪”表声。《说文》：“擇，柬选也。”简化时把右边笔画很多的“睪”简写，就成了今天的“择”。今天常说选择、择日。"},{"char":"沙","type":"会意","radical":"氵，少","benyi":"本义是水边细碎的石粒。","yanbian":"《说文》：“沙，水散石也。从水从少。水少沙见。”水少了，河底的细石粒就露出来，这就是“沙”。后来泛指细小的颗粒；“沙发”是英语 sofa 的音译，只借它的读音。"},{"char":"票","type":"会意","radical":"覀（䙴省），火","benyi":"本义是火焰飞腾（一说）。","yanbian":"小篆上部是“䙴”（升高）的省形，下部是“火”，表示火苗往上飞。这个本义后来写作“飘”“熛”等字。“票”后来被借用来指作为凭证的纸片，如车票、门票、钱票。"},{"char":"红","type":"形声","trad":"紅","radical":"纟，工","benyi":"本义是浅红色的丝织品，也指浅红色。","yanbian":"从糸（纟）表意，与丝织品有关；“工”表声。《说文》：“紅，帛赤白色。”古代“红”原来指粉红一类的浅红色，深红叫“赤”；后来“红”慢慢成了红色的通称。"},{"char":"越","type":"形声","radical":"走，戉","benyi":"本义是越过、跨过去。","yanbian":"从走表意，表示与行走有关；“戉”（古代的一种大斧）表声。《说文》：“越，度也。”由“跨过去”引申为超出（越过），又虚化出“越……越……”，表示程度一步步加深。"},{"char":"路","type":"形声","radical":"足，各","benyi":"本义是道路。","yanbian":"从足表意，表示人走的地方；“各”表声，“各”在古文字里像脚走到住处，也兼表“到来”的意思。《说文》：“路，道也。”后来引申为路线、方向，也用来说门路、思路。"},{"char":"铁","type":"形声","trad":"鐵","radical":"钅，失","benyi":"本义是一种金属——铁。","yanbian":"繁体“鐵”从金表意，右边“𢧜”表声；简化字把复杂的声旁换成读音相近的“失”，写成“铁”。铁很硬，所以又引申出坚硬、不改变的意思（铁了心）。"},{"char":"静","type":"形声","radical":"青，争","benyi":"本义是色彩搭配得当、清明不乱（一说）。","yanbian":"《说文》：“靜，審也。从青，爭聲。”古人认为它和“青”（颜色清明）有关，“争”表声。后来多用为安定不动、没有声音，如安静、平静。繁体写作“靜”，和简体差别很小。"},{"char":"须","type":"会意","trad":"須","radical":"页，彡","benyi":"本义是胡须。","yanbian":"金文像人的脸（页，代表头部）旁边长着几根胡子（彡）。后来“须”被借用表示“必须、需要”，胡须的意思就另写作“鬚”；简化后两者又合并写成“须”。"},{"char":"且","type":"象形","benyi":"一说本义是祖先的牌位（“祖”的本字）。","yanbian":"甲骨文像一块竖立的牌位（一说像放肉的案板“俎”）。后来加“示”旁写成“祖”表示祖先；“且”本身被借用作虚词，表示暂且、而且、并且。"},{"char":"但","type":"形声","radical":"亻（人），旦","benyi":"本义是袒露身体（“袒”的本字）。","yanbian":"从人表意，“旦”表声。本义是脱去上衣、露出身体，后来这个意思写作“袒”。“但”被借用表示“只、仅仅”，又用作转折连词——但是、不但。"},{"char":"共","type":"会意","radical":"廾（双手），器物","benyi":"本义是两手一起捧着东西（“供”的本字）。","yanbian":"甲骨文像两只手一起捧着一件器物，表示恭敬地奉上。几只手一起捧，引申为共同、一起；合在一起算，又有了“一共”。"},{"char":"合","type":"会意","radical":"亼（盖子），口（器身）","benyi":"本义是闭合、合拢。","yanbian":"甲骨文上面是盖子，下面是容器口，盖子和容器正好扣在一起，表示合拢。引申为合在一起、符合（合适）、合作。"},{"char":"声","type":"会意","trad":"聲","radical":"殸（敲磬），耳","benyi":"本义是声音。","yanbian":"繁体“聲”上面是“殸”（手拿槌子敲打石磬），下面是“耳”，耳朵听到敲磬的声音，就是“声”。简化字只保留左上角。引申为声调、名声，也用作量词（说一声）。"},{"char":"旧","type":"形声","trad":"舊","radical":"萑（一种鸟），臼","benyi":"本义是一种鸟（鸱鸮一类）。","yanbian":"繁体“舊”从萑（一种猫头鹰类的鸟）表意，“臼”表声，本义是鸟名；后来借用表示陈旧、过去的，与“新”相对。简化字“旧”只保留了一竖加“日”。"},{"char":"极","type":"形声","trad":"極","radical":"木，亟（简化为“及”）","benyi":"本义是房屋最高处的正梁。","yanbian":"繁体“極”从木表意，“亟”表声，本义是屋顶正中的大梁，是房子最高的地方。引申为顶点、尽头（北极），又表示程度最高（好极了）。简化字借用了读音相近的“极”。"},{"char":"毛","type":"象形","benyi":"本义是人和动物的毛发。","yanbian":"金文像一根有分叉的毛或羽毛。本义是毛发、羽毛，引申为细小的东西；又借作货币单位，十毛是一块钱。"},{"char":"瓜","type":"象形","benyi":"本义是瓜。","yanbian":"金文像藤蔓上挂着一个圆圆的瓜，两边是瓜藤，中间是瓜。以“瓜”组成的词有西瓜、黄瓜等。"},{"char":"矮","type":"形声","radical":"矢（箭），委","benyi":"本义是身材短小。","yanbian":"从矢（箭）表意——古人用箭来量短的东西，箭比弓短；“委”表声。本义是个子矮，引申为高度小（矮房子）、等级低。"},{"char":"而","type":"象形","benyi":"本义是颊下的胡须。","yanbian":"甲骨文像下巴上垂下来的胡须。后来被借用作连词，连接两个部分，如“而且”“然而”，本义就不用了。"},{"char":"色","type":"会意","radical":"人，卪（跪着的人）","benyi":"本义是脸色、面色。","yanbian":"《说文》：“色，颜气也。”小篆上面是“人”，下面是跪着的人，一说表示看人的脸色。本义是脸上的神色，引申为颜色（黄色、红色）、景色。"},{"char":"蕉","type":"形声","radical":"艹，焦","benyi":"本义是没有沤过的生麻（一说）。","yanbian":"从艹表意，“焦”表声。本义和麻一类的植物有关，后来多指芭蕉一类叶子很大的植物，结的果实就是“香蕉”。"},{"char":"试","type":"形声","trad":"試","radical":"讠（言），式","benyi":"本义是任用、试用。","yanbian":"从言表意，“式”表声（“式”有法式、标准的意思）。本义是拿来用一用看行不行，引申为尝试（试一试）、考试。"},{"char":"适","type":"形声","trad":"適","radical":"辶（辵），啇（简化为“舌”）","benyi":"本义是往、到。","yanbian":"从辵（辶，走路）表意，“啇”表声。本义是去往某地；走到合适的地方，引申为合适、适合、舒适。简化字把右上换成了“舌”。"},{"char":"香","type":"会意","radical":"黍（简化为“禾”），甘（简化为“日”）","benyi":"本义是谷物的香气。","yanbian":"小篆上面是“黍”（一种粮食），下面是“甘”（好吃），表示煮熟的黍米散发出的香甜气味；隶变后写成“禾”和“日”。引申为好闻的气味、香甜（香蕉）。"},{"char":"鲜","type":"形声","trad":"鮮","radical":"鱼，羊（羴省）","benyi":"本义是一种鱼，引申为新鲜的鱼、活鱼。","yanbian":"从鱼表意，右边是“羴”的省写，表声。鱼和羊肉都是味道好的食物，所以引申为味道鲜美；刚打上来的活鱼最新鲜，又引申为新鲜。"},{"char":"黄","type":"象形","benyi":"一说本义是一种佩玉（“璜”的本字）。","yanbian":"甲骨文像人身上挂着的佩玉（一说像一个挺着肚子的人）。后来借用表示黄色，本义另写作“璜”。黄色是土地的颜色，古人很看重它。"},{"char":"也","type":"象形","benyi":"一说本义是古代一种盛水的器具（“匜”的本字）。","yanbian":"金文像一种带流口的盛水器（说法不一）。很早就被借用作虚词，表示“同样、也”，本义另写作“匜”。"},{"char":"什","type":"会意","radical":"亻（人），十","benyi":"本义是十个人为一组。","yanbian":"从人从十，古代军队或户籍以十人（十家）为一组，叫“什”（读 shí）。后来借用在“什么”里，读 shén，用来提问。"},{"char":"叫","type":"形声","radical":"口，丩","benyi":"本义是大声呼喊。","yanbian":"从口表意，“丩”表声。本义是大声喊叫，引申为称呼、名字叫作（我叫……），又引申为让、使（叫他来）。"},{"char":"同","type":"会意","radical":"凡（抬东西的架子），口","benyi":"本义是会合、共同。","yanbian":"甲骨文上面像一副抬东西的架子，下面是“口”，一说表示很多人一起抬东西、一起喊号子。本义是共同、一起，引申为相同（同学：一起学习的人）。"},{"char":"市","type":"形声","radical":"冂，乁，之（省）","benyi":"本义是做买卖的地方。","yanbian":"《说文》：“市，买卖所之也。”古代人们定时到一个地方交换货物，这个地方叫“市”。引申为城市、市场；“超市”是“超级市场”的简称。"},{"char":"很","type":"形声","radical":"彳，艮","benyi":"本义是不听从、违逆。","yanbian":"《说文》：“很，不听从也。”从彳表意，“艮”表声，本义和“狠”相近。后来借用作程度副词，表示“非常”，成了最常用的意思。"},{"char":"您","type":"形声","radical":"你，心","benyi":"本义是“你”的敬称。","yanbian":"宋元以后出现的字，在“你”下面加“心”，表示心里对对方的尊敬。用来称呼长辈、老师、客人等。"},{"char":"超","type":"形声","radical":"走，召","benyi":"本义是跳过、越过。","yanbian":"从走表意，“召”表声。本义是跳过去，引申为超过、超出；“超市”的“超”是“超级”的意思。"},{"char":"低","type":"形声","radical":"亻（人），氐","benyi":"本义是低下，与“高”相对。","yanbian":"从人表意，“氐”表声（“氐”有根底、下面的意思）。本义是位置低、低下，引申为声音小（低声）、程度或水平在一般以下。"},{"char":"体","type":"形声","trad":"體","radical":"骨，豊","benyi":"本义是身体的全部。","yanbian":"繁体“體”从骨表意，“豊”表声，指由骨肉组成的整个身体。简化字借用了原本读 bèn（笨）的“体”字。引申为身体、体育，又引申为形式（字体）。"},{"char":"健","type":"形声","radical":"亻（人），建","benyi":"本义是强壮有力。","yanbian":"从人表意，“建”表声（“建”有立起来的意思）。本义是人身体强壮，引申为健康，又引申为善于、很会（健谈）。"},{"char":"其","type":"象形","benyi":"本义是簸箕（“箕”的本字）。","yanbian":"甲骨文像一个用竹子编的簸箕。后来借用作代词，表示“他的、那个”（其他、其实），本义另加竹字头写成“箕”。"},{"char":"冒","type":"会意","radical":"冃（帽子），目","benyi":"本义是帽子（“帽”的本字）。","yanbian":"上面是“冃”（帽子），下面是“目”（眼睛），帽子戴在眼睛上面。本义是帽子，引申为向外透出（冒烟）、不顾危险往前（冒雨）；“感冒”是受了风寒。本义后来加“巾”写作“帽”。"},{"char":"差","type":"会意","radical":"左（手），𠂹（禾穗，变形）","benyi":"本义是不整齐、有差别。","yanbian":"金文从“左”（手），上部像垂下的禾穗，一说表示用手搓禾穗，搓得参差不齐。本义是不相同、有差距，引申为不好（很差）、缺少（差不多）；读 chāi 时指派去做事（出差）。"},{"char":"康","type":"象形","benyi":"一说本义是谷皮（“糠”的本字）。","yanbian":"甲骨文像打谷时从谷粒上脱下来、四散的谷皮。后来借用表示安乐、太平（健康、安康），本义另加“米”旁写成“糠”。"},{"char":"惯","type":"形声","trad":"慣","radical":"忄（心），贯","benyi":"本义是习以为常。","yanbian":"从心表意，“贯”表声也表意（“贯”是用绳子一个接一个穿起来）。一件事一直做下去，心里就觉得平常了，这就是“习惯”；引申为纵容（惯孩子）。"},{"char":"朵","type":"象形","benyi":"本义是树上垂下来的花朵。","yanbian":"小篆上面像下垂的花朵，下面是“木”（树）。本义是花朵，也用作量词（一朵花）；“耳朵”是用花朵的样子来比喻耳廓。"},{"char":"注","type":"形声","radical":"氵（水），主","benyi":"本义是灌注，把水倒进去。","yanbian":"从水表意，“主”表声。本义是把水灌进去，引申为把心思、目光集中在一个地方（注意），又引申为用文字解释（注释）。"},{"char":"球","type":"形声","radical":"王（玉），求","benyi":"本义是一种美玉（一说）。","yanbian":"从玉（王）表意，“求”表声。本义和玉有关，后来因为玉常被磨成圆形，引申指圆形的立体物（地球），又指体育用的球（羽毛球、篮球）。"},{"char":"种","type":"形声","trad":"種","radical":"禾，重（简化为“中”）","benyi":"本义是种子。","yanbian":"从禾（庄稼）表意，“重”表声，简化字换成读音相近的“中”。本义是植物的种子（zhǒng），引申为种类（这种、一种）；读 zhòng 时表示种植。"},{"char":"突","type":"会意","radical":"穴（洞穴），犬（狗）","benyi":"本义是狗从洞里突然窜出来。","yanbian":"上面是“穴”（洞），下面是“犬”（狗），狗从洞里猛地冲出来。本义是突然冲出，引申为突然、冲撞（冲突），又引申为高出来（突出）。"},{"char":"羽","type":"象形","benyi":"本义是鸟的长羽毛。","yanbian":"甲骨文像两根并排的鸟羽，能看出羽毛的纹路。本义是羽毛，以“羽”为偏旁的字多和鸟、飞有关，如“习（習）”“翅”。"},{"char":"世","type":"指事","benyi":"本义是三十年（一代人）。","yanbian":"金文像三个“十”连在一起，表示三十。古人以三十年为一代，所以本义是一世、一代，引申为时代、一辈子，又引申为人间、天下（世界）。"},{"char":"乎","type":"象形","benyi":"本义是表示疑问或感叹的语气词。","yanbian":"甲骨文像声音从口中向上扬出的样子（一说像吹奏乐器的簧片）。本义是语气词，相当于“吗、啊”；“几乎”里的“乎”是后面的词尾。"},{"char":"加","type":"会意","radical":"力，口","benyi":"本义是说话夸大、言过其实。","yanbian":"《说文》：“加，语相增加也。”从力从口，用力地说，把话说多了。本义是夸大，引申为增加、加上，又引申为参加。"},{"char":"动","type":"形声","trad":"動","radical":"力，重（简化为“云”）","benyi":"本义是行动、活动。","yanbian":"从力表意，“重”表声，简化字换成了“云”。本义是出力去做、活动起来，引申为动作、运动、感动。"},{"char":"参","type":"象形","trad":"參","benyi":"本义是参星（猎户座的三颗亮星）。","yanbian":"金文像一个人头上有三颗星，下面的“彡”是星光。本义是参星（读 shēn）；后来借用表示加入、参与（读 cān），如参加。"},{"char":"受","type":"会意","radical":"爫（手），冖（盘），又（手）","benyi":"本义是给予和接受（“授”“受”原是一个字）。","yanbian":"甲骨文上面一只手、下面一只手，中间是一个盘子（后来简化成“冖”），一只手递出去、一只手接过来。后来给予写作“授”，“受”只表示接受，引申为受到、忍受。"},{"char":"响","type":"形声","trad":"響","radical":"口（音），向（鄉）","benyi":"本义是回声。","yanbian":"繁体“響”从音表意，“鄉”表声；简化字改为从口、“向”表声。本义是回声，引申为声音、响亮。“影响”原来是影子和回声，后来指一件事对另一件事起的作用。"},{"char":"啤","type":"形声","radical":"口，卑","benyi":"本义就是啤酒。","yanbian":"这是近代为了翻译外语 beer（啤酒）而造的字，从口表意（表示外来词的读音），“卑”表声。一般只用在“啤酒”这个词里。"},{"char":"成","type":"形声","radical":"戊（斧钺），丁","benyi":"本义是完成、成功。","yanbian":"甲骨文从“戊”（一种大斧），“丁”表声（一说表示用斧子砍削完成器物）。本义是做完、成功，引申为成为、变成，又引申为成绩、成果。"},{"char":"界","type":"形声","radical":"田，介","benyi":"本义是田地的边界。","yanbian":"从田表意，“介”表声也表意（“介”有在中间、分隔的意思）。本义是田与田之间的界线，引申为范围、领域，“世界”就是天下所有的地方。"},{"char":"紧","type":"会意","trad":"緊","radical":"臤（紧握），糸（丝）","benyi":"本义是丝绳缠得很紧。","yanbian":"繁体“緊”上面“臤”有坚固、握紧的意思，下面是“糸”（丝），表示把丝绳缠紧。引申为不松（紧张）、急迫（要紧）。"},{"char":"练","type":"形声","trad":"練","radical":"纟（丝），柬","benyi":"本义是把生丝煮熟，使它柔软洁白。","yanbian":"从糸（纟）表意，“柬”表声。煮丝要反复多次，所以引申为反复地做——练习、训练，又引申为熟练。"},{"char":"绩","type":"形声","trad":"績","radical":"纟（丝），责","benyi":"本义是把麻搓成线（纺绩）。","yanbian":"从糸（纟）表意，“责”表声。搓麻成线是一点一点积累起来的，引申为做出来的事业和成果——功绩、成绩。"},{"char":"网","type":"象形","trad":"網","benyi":"本义是捕鱼、捕鸟的网。","yanbian":"甲骨文像一张张开的网，两边是网杆，中间是网眼。后来加上“糸”和声旁写成“網”；简化字又回到最早的“网”。引申为像网一样的东西，如网球的球网、互联网（上网）。"},{"char":"赛","type":"形声","trad":"賽","radical":"贝，塞（省）","benyi":"本义是祭祀酬谢神灵。","yanbian":"从贝（钱财，表示拿东西答谢）表意，“塞”的省形表声。古代收成后举行祭神活动，常常有各种比试，所以引申为比赛、竞赛。"},{"char":"运","type":"形声","trad":"運","radical":"辶（辵），军（简化为“云”）","benyi":"本义是移动、运转。","yanbian":"从辵（辶，走路）表意，“军”表声，简化字换成了“云”。本义是转动、移动，引申为运送、运动，又引申为运气。"},{"char":"酒","type":"会意","radical":"氵（水），酉（酒坛）","benyi":"本义是酒。","yanbian":"“酉”像一个装酒的坛子，是“酒”的本字；后来加上“氵”，表示坛子里装的液体。和酒有关的字常带“酉”，如醉、医（醫）。"},{"char":"业","type":"象形","trad":"業","benyi":"本义是古代乐器架上刻有锯齿的大横板。","yanbian":"金文像挂钟、鼓的木架上端锯齿形的横板。古人在木板上写字刻书，引申为学业、作业，又引申为事业、职业。简化字“业”只保留了上半部分。"},{"char":"努","type":"形声","radical":"力，奴","benyi":"本义是用力、使劲。","yanbian":"从力表意，“奴”表声。本义是尽量使出力气，“努力”就是用很大的力气去做。"},{"char":"历","type":"形声","trad":"歷／曆","radical":"止（脚），厤（简化为“厂”加“力”）","benyi":"本义是经过。","yanbian":"繁体“歷”从止（脚）表意，“厤”表声，表示一步一步走过，本义是经过（经历）。表示历法的“曆”也简化成“历”。经过的事写下来，就是历史。"},{"char":"句","type":"形声","radical":"勹，口","benyi":"本义是弯曲（读 gōu，“勾”的本字）。","yanbian":"从口，“勹”（弯曲）表声也表意。本义是弯曲；古人读书在语气停顿的地方画一个弯钩作记号，所以引申为句子（读 jù），又用作量词（一句）。"},{"char":"史","type":"会意","radical":"又（手），中（简册）","benyi":"本义是记录事情的官员。","yanbian":"甲骨文像一只手（又）拿着简册或记事的工具（中）。本义是负责记事的史官，引申为记录下来的过去的事情——历史。"},{"char":"当","type":"形声","trad":"當","radical":"田，尚","benyi":"本义是两块田相当、相对。","yanbian":"从田表意，“尚”表声。本义是田地面积相当、相对，引申为相称、应该（应当），又引申为担任（当老师）、当然。简化字把上部简写。"},{"char":"数","type":"形声","trad":"數","radical":"攵（手持棍），娄","benyi":"本义是计算、点数（读 shǔ）。","yanbian":"从攴（攵，手的动作）表意，“娄”表声。本义是一个一个地数，引申为数目（读 shù）、数学，又引申为几个（数次）。"},{"char":"板","type":"形声","radical":"木，反","benyi":"本义是木板。","yanbian":"从木表意，“反”表声。本义是片状的木头，引申为片状的硬东西，如黑板、地板。"},{"char":"求","type":"象形","benyi":"本义是皮毛做的衣服（“裘”的本字）。","yanbian":"甲骨文像一件毛朝外的皮衣。后来借用表示请求、寻找、要求，本义另加“衣”写成“裘”。"},{"char":"笔","type":"会意","trad":"筆","radical":"竹，毛（繁体为“聿”）","benyi":"本义是写字用的毛笔。","yanbian":"最早写作“聿”，像手拿着一支毛笔；后来加上竹字头写成“筆”，因为笔杆多用竹子做。简化字改为“竹”加“毛”，正好说明毛笔是竹杆加兽毛做成的。"},{"char":"般","type":"会意","radical":"舟（船），殳（手持篙）","benyi":"本义是撑船使船回转。","yanbian":"左边是“舟”（船），右边是“殳”（手拿长篙），表示用篙撑船让船转过来。本义是旋转（后来写作“盘”），借用表示种类、样子，如“一般”“这般”。"},{"char":"遇","type":"形声","radical":"辶（辵），禺","benyi":"本义是相逢、碰见。","yanbian":"从辵（辶，走路）表意，“禺”表声。本义是在路上碰到，引申为遇到（事情）、机会（机遇）。"},{"char":"遍","type":"形声","radical":"辶（辵），扁","benyi":"本义是走到每一个地方、到处。","yanbian":"从辵（辶）表意，“扁”表声。本义是周遍，处处都到（走遍），引申为量词，表示一个动作从头到尾做一次（读一遍）。"},{"char":"页","type":"象形","trad":"頁","benyi":"本义是人的头。","yanbian":"甲骨文像一个跪坐的人，特别画出大大的头部，本义是头。以“页”为偏旁的字多和头有关，如顶、额。后来借用表示书的一张纸（书页），又用作量词（第十页）。"},{"char":"黑","type":"会意","radical":"囱（烟囱），炎（火）","benyi":"本义是被烟熏成的黑色。","yanbian":"小篆上面是“囱”（烟囱、窗口），下面是“炎”（火），火烧起来烟从烟囱冒出，把烟囱熏黑了（金文一说像人脸上被刺了字）。本义是黑色，引申为暗、夜里。"},{"char":"城","type":"形声","radical":"土，成","benyi":"本义是城墙。","yanbian":"从土表意（古代城墙是用土夯成的），“成”表声。本义是围在都邑四周的城墙，引申为城墙里面的地方——城市。"},{"char":"怕","type":"形声","radical":"忄（心），白","benyi":"本义是心里平静、淡泊（一说）；后来指害怕。","yanbian":"从心表意，“白”表声。《说文》解释为“无为也”，即心里淡泊；后来这个意思不用了，“怕”专门表示害怕、担心。"},{"char":"愿","type":"形声","trad":"願","radical":"心，原","benyi":"本义是心里希望。","yanbian":"繁体“願”从页（头）表意，“原”表声；简化字把“页”换成“心”，更突出是心里的想法。本义是愿望、希望，引申为愿意、乐意。"},{"char":"或","type":"会意","radical":"戈，口，一","benyi":"本义是有疆域的国家（“国”“域”的本字）。","yanbian":"甲骨文由“戈”（武器）和“口”（城邑）组成，表示用武器守卫城邑，就是一个国家。后来加“囗”写成“國”，加“土”写成“域”；“或”本身借用表示“有的、或者”。"},{"char":"活","type":"形声","radical":"氵（水），舌（原为“𠯑”）","benyi":"本义是水流动的声音。","yanbian":"从水表意，右边表声（隶变后写成“舌”）。《说文》：“活，水流声。”流动的水是“活水”，引申为有生命的、活着，又引申为生活、工作（干活）。"},{"char":"离","type":"形声","trad":"離","radical":"隹（鸟），离","benyi":"本义是一种鸟（黄鹂）。","yanbian":"繁体“離”从隹（鸟）表意，“离”表声，本义是鸟名。后来借用表示分开、离开，又表示距离（离家很近）。简化字只保留了左半边。"},{"char":"者","type":"象形","benyi":"说法不一，一说本义是煮东西（“煮”的本字）。","yanbian":"金文像在器具上烧煮东西的样子（一说）。很早就借用作虚词，放在词后面表示“……的人”（作者、记者），或用在“或者”里。"},{"char":"议","type":"形声","trad":"議","radical":"讠（言），義（简化为“义”）","benyi":"本义是商量、讨论。","yanbian":"从言表意，“義”表声，简化字换成“义”。本义是大家一起商量、讨论对不对，引申为意见、主张，如会议、建议。"},{"char":"借","type":"形声","radical":"亻（人），昔","benyi":"本义是暂时用别人的东西。","yanbian":"从人表意，“昔”表声。本义是向别人借来用（借书），也指把东西暂时给别人用（借给你）；引申为凭借、利用（借这个机会）。"},{"char":"冬","type":"象形","benyi":"本义是终了、结束（“终”的本字）。","yanbian":"甲骨文像一根绳子两头打了结，表示到了尽头。一年到冬天就结束了，所以借来表示冬季；小篆下面加了“仌”（冰），表示寒冷，隶变后成了两点。"},{"char":"凉","type":"形声","radical":"冫（冰），京","benyi":"本义是微寒、稍冷。","yanbian":"原来写作“涼”，从水表意，“京”表声；后来左边改成“冫”（冰），表示冷。本义是有点儿冷，引申为凉快，又引申为冷淡。"},{"char":"刚","type":"形声","trad":"剛","radical":"刂（刀），冈","benyi":"本义是坚硬。","yanbian":"从刀表意（刀刃要坚硬），“冈”表声。本义是坚硬、刚强，后来借用作副词，表示时间不久（刚才、刚刚）或正好（刚好）。"},{"char":"刮","type":"形声","trad":"颳（刮风）","radical":"刂（刀），舌（原为“𠯑”）","benyi":"本义是用刀子刮去东西。","yanbian":"从刀表意，右边表声。本义是用刀刮削，表示风吹的“颳”简化时也并入了“刮”，所以有了“刮风”。"},{"char":"化","type":"会意","radical":"亻（正立的人），匕（倒过来的人）","benyi":"本义是变化。","yanbian":"甲骨文是一个正立的人和一个倒过来的人，表示人发生了翻转、变化。本义是变化，引申为改变、教化（文化），也用在词尾表示变成某种样子。"},{"char":"变","type":"形声","trad":"變","radical":"攵（手持棍），䜌（简化为“亦”）","benyi":"本义是改变。","yanbian":"繁体“變”从攴（攵，表示动作）表意，“䜌”表声；简化字根据草书写成“变”。本义是改变、变化，引申为变成、变得。"},{"char":"叶","type":"形声","trad":"葉","radical":"艹，枼（简化为“叶”）","benyi":"本义是植物的叶子。","yanbian":"繁体“葉”从艹表意，下面的“枼”像树上长着叶子（兼表声）。简化字借用了原本读 xié（协）的“叶”字。引申为像叶子一样薄的东西，也用来表示一个时代的一段（清朝末叶）。"},{"char":"四","type":"指事","benyi":"本义是数目四。","yanbian":"甲骨文用四条横线表示“四”，和“一二三”一样。后来为了和“三”区别，借用了表示鼻息的“四”字（像口鼻出气），写成现在的样子。"},{"char":"夏","type":"象形","benyi":"本义是中原地区的人（“华夏”的“夏”）。","yanbian":"金文像一个有头、有手、有脚的高大的人，表示中原的人（华夏）。后来借用表示一年中最热的季节——夏天。"},{"char":"季","type":"会意","radical":"禾，子","benyi":"本义是排行最小的（幼子）。","yanbian":"上面是“禾”（庄稼），下面是“子”（孩子），像小小的禾苗和孩子，本义是幼小、兄弟中排行最后的（伯仲叔季）。引申为一段时间的末尾，又指一年的一个季节（四季）。"},{"char":"快","type":"形声","radical":"忄（心），夬","benyi":"本义是高兴、痛快。","yanbian":"从心表意，“夬”表声。本义是心里痛快、高兴（快乐），引申为速度快、很快、快要，又用在“凉快”里表示舒服。"},{"char":"春","type":"形声","radical":"艹，屯，日","benyi":"本义是春天。","yanbian":"甲骨文由“艹”（草木）、“屯”（小芽破土，兼表声）、“日”（太阳）组成，表示太阳照着、草木开始发芽的季节。隶变后上部合成了现在的样子。"},{"char":"秋","type":"会意","radical":"禾，火","benyi":"本义是庄稼成熟的季节。","yanbian":"甲骨文像一只蟋蟀（秋天鸣叫的虫），后来写成“禾”加“火”：庄稼成熟、颜色像火一样黄红，就是秋天。引申为收成、一年（千秋）。"},{"char":"船","type":"形声","radical":"舟，㕣","benyi":"本义是船。","yanbian":"从舟（像一条小船）表意，右边“㕣”表声。和船有关的字常带“舟”，如般、航。"},{"char":"街","type":"形声","radical":"行（十字路口），圭","benyi":"本义是城里的大路。","yanbian":"从行表意（“行”像十字路口），中间的“圭”表声。本义是城市里四通八达的大路，引申为街道、街上。"},{"char":"闻","type":"形声","trad":"聞","radical":"门，耳","benyi":"本义是听见。","yanbian":"从耳表意，“门”表声。本义是用耳朵听到，引申为听到的事——新闻；后来又引申为用鼻子闻气味。"},{"char":"风","type":"形声","trad":"風","radical":"几（凡），虫","benyi":"本义是风。","yanbian":"甲骨文借用“凤”（凤鸟）的样子表示风；小篆写成“凡”表声、“虫”表意（古人认为风一吹虫子就生出来）。简化字把里面简写成“㐅”。引申为风景、风格。"},{"char":"图","type":"会意","trad":"圖","radical":"囗（范围），啚（边远的地方）","benyi":"本义是规划、谋划（画出地域的图）。","yanbian":"繁体“圖”外面的“囗”表示范围，里面的“啚”是“鄙”的本字，指边远的地方，合起来表示把一片地方的疆界画出来。本义是地图、规划，引申为图画，又引申为打算（图谋）。简化字把里面简写成“冬”。"},{"char":"夫","type":"指事","radical":"大，一","benyi":"本义是成年男子。","yanbian":"甲骨文是一个正面站立的人（大），头上加一横，表示束发插簪——古代男子成年后才束发戴簪。本义是成年男子，引申为丈夫（夫妻），也用在对人的称呼里。"},{"char":"妻","type":"会意","radical":"又（手），女","benyi":"本义是妻子。","yanbian":"甲骨文像一只手（又）在给一个女子整理头发（一说像抢婚的样子），表示已经嫁人的女子。本义是男子的配偶——妻子。"},{"char":"居","type":"形声","radical":"尸（人），古","benyi":"本义是蹲、坐（一说）；后指居住。","yanbian":"从尸（像人屈身而坐）表意，“古”表声。本义和坐、蹲有关，引申为停留、居住，又指住的地方（住所），“邻居”就是住在旁边的人家。"},{"char":"物","type":"形声","radical":"牛，勿","benyi":"本义是杂色的牛（一说）。","yanbian":"从牛表意，“勿”表声。牛是古代重要的财产，本义一说是毛色驳杂的牛，后来泛指天地间的一切东西——万物、礼物、动物。"},{"char":"画","type":"会意","trad":"畫","radical":"聿（手拿笔），田（画出的界线）","benyi":"本义是划分界线。","yanbian":"甲骨文上面是手拿着笔（聿），下面是画出的交叉线条，表示用笔画出界线。本义是划界，引申为绘画、画儿、画家。简化字保留了下半部分的轮廓。"},{"char":"盘","type":"形声","trad":"盤","radical":"皿（器皿），般","benyi":"本义是一种浅口的盛器。","yanbian":"从皿表意（后来也写作从木、从金），“般”表声（“般”有旋转的意思）。本义是盛水、盛东西的浅盘，引申为盘子，又引申为盘旋、绕（盘山路）。"},{"char":"礼","type":"会意","trad":"禮","radical":"示（祭神），豊（盛放祭品的器具）","benyi":"本义是祭神求福的仪式。","yanbian":"繁体“禮”左边的“示”和祭神有关，右边“豊”像在器具里盛满玉等祭品。本义是祭祀的仪式，引申为礼节、礼貌，又引申为送人的东西——礼物。简化字右边写成“乚”。"},{"char":"聊","type":"形声","radical":"耳，卯","benyi":"本义是耳鸣（一说）；后多表示闲谈。","yanbian":"从耳表意，“卯”表声。《说文》解释为“耳鸣”。后来借用表示姑且、暂且（聊胜于无）、依靠（民不聊生），今天最常用的是闲谈——聊天儿。"},{"char":"邻","type":"形声","trad":"鄰","radical":"阝（邑，城邑），令（原为“粦”）","benyi":"本义是居住在附近的人家。","yanbian":"从邑（右阝，与居住的地方有关）表意，“粦”表声，简化字把声旁换成读音相近的“令”。古代五家为一邻，本义是相邻的人家，引申为邻居、邻近。"},{"char":"典","type":"会意","radical":"冊（简册），廾（双手）","benyi":"本义是重要的书籍。","yanbian":"甲骨文上面是“冊”（串起来的竹简），下面是两只手，像双手恭敬地捧着书。本义是重要的典籍，引申为标准、规范（典范），“词典”就是查词的权威书。"},{"char":"忘","type":"形声","radical":"心，亡","benyi":"本义是忘记。","yanbian":"从心表意，“亡”表声也表意（“亡”是失去、不在了）。心里的东西丢了，就是忘记。"},{"char":"报","type":"会意","trad":"報","radical":"㚔（刑具），𠬝（用手按住人）","benyi":"本义是判罪、处置犯人。","yanbian":"金文左边是刑具，右边是一只手按住一个跪着的人，表示处置罪人。后来引申为回复、报告，又引申为传播消息的东西——报纸。简化字右边写成“𠬝”的简形。"},{"char":"故","type":"形声","radical":"攵（手持棍），古","benyi":"本义是使它这样（原因）。","yanbian":"从攴（攵）表意，“古”表声也表意（和古老、过去有关）。本义是原因、缘故，引申为过去的、旧的（故乡），又用在“故事”里，指过去的事、讲出来的事。"},{"char":"演","type":"形声","radical":"氵（水），寅","benyi":"本义是水长流、流得很远。","yanbian":"从水表意，“寅”表声。本义是水长长地流，引申为推演、发展（演变），又引申为把故事、节目展现出来——表演、演员。"},{"char":"留","type":"形声","radical":"田，卯","benyi":"本义是停留。","yanbian":"从田表意（一说像水停在田里），上面表声。本义是停留、不走，引申为留下、保留，又引申为在外国住下学习——留学。"},{"char":"表","type":"会意","radical":"衣，毛","benyi":"本义是外衣（毛朝外的皮衣）。","yanbian":"小篆由“衣”和“毛”组成，古人穿皮衣时毛朝外，所以本义是外衣、外面。引申为表面、表现，又引申为表示、表演；计时的“手表”是后来的用法。"},{"char":"被","type":"形声","radical":"衤（衣），皮","benyi":"本义是睡觉时盖的被子。","yanbian":"从衣表意，“皮”表声（也表示盖在外面）。本义是被子，引申为覆盖（被覆）；后来借用作介词，表示被动（被他拿走了）。"},{"char":"词","type":"形声","trad":"詞","radical":"讠（言），司","benyi":"本义是说出来的话、言辞。","yanbian":"从言表意，“司”表声。本义是言辞，引申为语言里最小的能独立使用的单位——词；又指一种文学体裁（宋词）。"},{"char":"跳","type":"形声","radical":"⻊（足），兆","benyi":"本义是跳起来。","yanbian":"从足表意，“兆”表声。本义是两脚用力离开地面跳起，引申为跳舞，又引申为心跳、跳过（越过）。"},{"char":"频","type":"会意","trad":"頻","radical":"步（脚步），页（头）","benyi":"本义是皱眉（“颦”的本字，一说是水边）。","yanbian":"金文由“步”和“页”（头）组成，一说表示人走到水边，一说像人皱着眉头。后来借用表示次数多（频繁），又用在“频率”“视频”里。"},{"char":"养","type":"形声","trad":"養","radical":"食，羊","benyi":"本义是供养、喂养。","yanbian":"繁体“養”从食表意，“羊”表声（也有人认为甲骨文像手拿鞭子放羊，表示饲养）。本义是喂养、供养，引申为养动物、养花，又引申为养成（习惯）。简化字根据草书写成“养”。"},{"char":"戏","type":"形声","trad":"戲","radical":"戈（兵器），虚（简化为“又”）","benyi":"本义是军队的侧翼（一说是角力、比武）。","yanbian":"繁体“戲”从戈表意，与兵器有关，左边表声。古代比试武艺也有表演、娱乐的意味，于是引申为玩耍、游戏，又指戏剧、演戏。简化字把左边换成“又”。"},{"char":"据","type":"形声","trad":"據","radical":"扌（手），豦（简化为“居”）","benyi":"本义是用手扶着、靠着。","yanbian":"从手表意，右边表声（简化字换成“居”）。本义是手扶着东西作为依靠，引申为依据、按照（根据），又引申为占据。"},{"char":"景","type":"形声","radical":"日，京","benyi":"本义是日光。","yanbian":"从日表意，“京”表声。本义是太阳光（后来光影的意思写成“影”），引申为风景、景色，又用在“景点”里指风景好的地方。"},{"char":"根","type":"形声","radical":"木，艮","benyi":"本义是草木的根。","yanbian":"从木表意，“艮”表声。本义是植物长在土里的根，引申为事物的根本、来源，又用在“根据”里表示依据。"},{"char":"段","type":"会意","radical":"殳（手持工具），𠩵（山崖边的石块）","benyi":"本义是捶打（“锻”的本字）。","yanbian":"金文像手拿工具在山崖下敲打石头，本义是捶击，后来加“金”写成“锻”。“段”借用来表示分成的一截一截——一段路、一段时间。"},{"char":"河","type":"形声","radical":"氵（水），可","benyi":"本义是黄河。","yanbian":"从水表意，“可”表声。古代“河”专指黄河，“江”专指长江；后来“河”泛指所有的河流。"},{"char":"蓝","type":"形声","trad":"藍","radical":"艹，监","benyi":"本义是蓼蓝，一种可以做蓝色染料的草。","yanbian":"从艹表意，“监”表声。本义是能提取蓝色染料的植物（“青出于蓝”就是说青色是从蓝草里提炼出来的），后来指蓝色。"},{"char":"全","type":"会意","radical":"入，王（玉）","benyi":"本义是纯玉、完整的玉。","yanbian":"小篆上面是“入”，下面是“玉”（王），表示完好无缺的纯玉。本义是纯、完整，引申为全部、整个（全家），又用作副词“都”（全吃完了）。"},{"char":"嘴","type":"形声","radical":"口，觜","benyi":"本义是鸟的嘴。","yanbian":"最早写作“觜”，指鸟嘴；后来加“口”旁写成“嘴”，泛指人和动物的嘴。"},{"char":"奇","type":"会意","radical":"大，可","benyi":"本义是特殊、不平常。","yanbian":"由“大”和“可”组成（一说像人骑在马上，是“骑”的本字）。本义是特别、少见，引申为奇怪、惊奇；读 jī 时表示单数（奇数）。"},{"char":"实","type":"会意","trad":"實","radical":"宀（房屋），貫（钱串）","benyi":"本义是富足、屋里装满财物。","yanbian":"繁体“實”上面是“宀”（房屋），下面是“貫”（一串串的钱），屋里装满了钱，表示充实、富有。引申为真实、实在，又用在“其实”里表示实际上。"},{"char":"怪","type":"形声","radical":"忄（心），圣（kū）","benyi":"本义是奇异、不平常。","yanbian":"从心表意，右边表声。本义是奇异、少见，引申为奇怪、觉得奇怪，又引申为责怪（怪他）。"},{"char":"竹","type":"象形","benyi":"本义是竹子。","yanbian":"甲骨文像两枝下垂的竹叶。和竹子有关的字多带“⺮”（竹字头），如笔、答、筷。"},{"char":"脏","type":"形声","trad":"髒／臟","radical":"月（肉），庄","benyi":"本义是身体里的内脏（读 zàng）；又指不干净（读 zāng）。","yanbian":"表示内脏的“臟”从肉（月）、“藏”表声；表示不干净的“髒”从骨表意。简化时两个字都写成“脏”，所以一个字有两个读音。"},{"char":"脸","type":"形声","trad":"臉","radical":"月（肉），佥","benyi":"本义是两颊的上部。","yanbian":"从肉（月）表意，“佥”表声。古代“脸”原来只指脸颊的上部（常用来说化妆的地方），后来慢慢代替“面”，指整个脸。"},{"char":"野","type":"形声","radical":"里，予","benyi":"本义是城外的郊野。","yanbian":"从里（与田地、居住有关）表意，“予”表声。本义是城外很远的地方，引申为不是人养的、自然生长的（野生），又引申为粗野。"},{"char":"饱","type":"形声","trad":"飽","radical":"饣（食），包","benyi":"本义是吃足了。","yanbian":"从食表意，“包”表声也表意（像把东西包在里面）。本义是吃饱，引申为充足、满（饱满）。"}];

function petMigrateLegacy(pt){

    p.pets=p.pets.filter(pt=>pt.pack||pt.moods.some(m=>m.imgs.length));
    if(!p.pets.some(pt=>pt.pack==='default'))p.pets.unshift(makePackPet('毛球'));
    p.activePet=p.pets[0].id;
    p.packSeeded=true;
  }
  if(!p.pets.length)p.pets.push(makePackPet('毛球'));
  p.pets.forEach(pt=>{
    petRefreshPack(pt);
    if(!Array.isArray(pt.hidden))pt.hidden=[];
    pt.moods.forEach(m=>{
      if(!Array.isArray(m.imgs))m.imgs=[];
      m.imgs.forEach(im=>{if(im.src){petStashSrc(im.id,im.src);delete im.src;}});
      if(!Array.isArray(m.links))m.links=Object.keys(PET_MOOD_LINK).filter(k=>PET_MOOD_LINK[k]===m.label&&!/^(困|饿)$/.test(k));
    });

    if(!pt.actions||typeof pt.actions!=='object')pt.actions={};

  });
  if(!p.activePet||!p.pets.some(x=>x.id===p.activePet))p.activePet=p.pets[0].id;
  delete p.slots;delete p.reminders;
  if(!p.stats)p.stats={happy:0,health:0,growth:0,smart:0};

  if(p.walkSecs==null)p.walkSecs=90;
  if(p.fallLv==null)p.fallLv=3;

let _petIdbP=null;
function petIdb(){

function petIdbPut(id,src){petIdb().then(db=>{db.transaction('img','readwrite').objectStore('img').put(src,id);}).catch(()=>{});}
function petIdbDel(id){petIdb().then(db=>{db.transaction('img','readwrite').objectStore('img').delete(id);}).catch(()=>{});}
function petIdbLoadAll(){

    const tx=db.transaction('img','readonly');const st=tx.objectStore('img');
    const req=st.openCursor();
    req.onsuccess=()=>{const c=req.result;if(c){if(!imageCache[c.key])imageCache[c.key]=c.value;c.continue();}else res();};
    req.onerror=()=>res();

}
function petImgUrl(im){
  if(!im)return '';
  if(im.path)return PET_PACK_BASE+im.path+PET_PACK_Q;
  return imageCache[im.id]||im.src||'';
}
function petImgRound(im){return !!(im&&(im.round||(im.path&&PET_ROUND.has(im.path))));}

function petFileType(f){
  const t=(f.type||'').toLowerCase();
  if(t==='image/apng')return 'image/png';
  if(t)return t;
  const ext=(f.name||'').split('.').pop().toLowerCase();
  return {gif:'image/gif',png:'image/png',apng:'image/png',webp:'image/webp',jpg:'image/jpeg',jpeg:'image/jpeg'}[ext]||'';
}
function petReadDataUrl(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});}
let _gifencP=null;
function petLoadGifenc(){
  if(!_gifencP)_gifencP=import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js').catch(e=>{_gifencP=null;throw e;});
  return _gifencP;
}
// 把 GIF / APNG / WEBP 动图缩到 200px 以内并重新编码成 GIF；静态图直接走 canvas 压缩
async function petProcessFile(f,maxDim,keepBytes){
  maxDim=maxDim||PET_UP_MAX;keepBytes=keepBytes||300*1024;
  const type=petFileType(f);
  if(!type.startsWith('image/'))throw new Error('type');
  const canDecode=typeof ImageDecoder!=='undefined'&&await ImageDecoder.isTypeSupported(type).catch(()=>false);
  if(!canDecode){
    if(type==='image/jpeg')return compressImageFile(f,maxDim,0.85);
    // 浏览器不支持逐帧解码（如较旧的 Safari）：小文件保留原动图，显示时由 CSS 统一尺寸
    if(f.size<=PET_CLOUD_MAX)return petReadDataUrl(f);
    if(type==='image/gif')throw new Error('toolarge');
    return compressImageFile(f,maxDim,0.85);
  }
  const dec=new ImageDecoder({data:await f.arrayBuffer(),type:type});
  await dec.tracks.ready;
  const track=dec.tracks.selectedTrack;
  const count=Math.min(track?track.frameCount:1,300);
  const first=(await dec.decode({frameIndex:0})).image;
  const sw=first.displayWidth,sh=first.displayHeight;
  const scale=Math.min(1,maxDim/Math.max(sw,sh));
  const W=Math.max(1,Math.round(sw*scale)),H=Math.max(1,Math.round(sh*scale));
  if(count<=1){
    first.close();dec.close();
    if(type==='image/gif'||scale<1||f.size>200*1024)return compressImageFile(f,maxDim,0.85);
    return petReadDataUrl(f);
  }
  if(scale===1&&f.size<=keepBytes){first.close();dec.close();return petReadDataUrl(f);}
  const {GIFEncoder,quantize,applyPalette}=await petLoadGifenc();
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const gif=GIFEncoder();
  for(let i=0;i<count;i++){
    const fr=i===0?first:(await dec.decode({frameIndex:i})).image;
    ctx.clearRect(0,0,W,H);ctx.drawImage(fr,0,0,W,H);
    const delay=Math.max(20,Math.round((fr.duration||100000)/1000));
    fr.close();
    const data=ctx.getImageData(0,0,W,H).data;
    const palette=quantize(data,256,{format:'rgba4444',oneBitAlpha:true});
    const index=applyPalette(data,palette,'rgba4444');
    const ti=palette.findIndex(c=>c.length>3&&c[3]===0);
    gif.writeFrame(index,W,H,{palette:palette,delay:delay,transparent:ti>=0,transparentIndex:Math.max(0,ti),dispose:2});
  }
  dec.close();gif.finish();
  const out=new Blob([gif.bytes()],{type:'image/gif'});
  // 原图本来就小且更省空间时，保留原图（APNG/WEBP 画质更好）
  if(scale===1&&f.size<=out.size)return petReadDataUrl(f);
  return petReadDataUrl(out);
}

function petFindMood(pt,label){
  if(!label)return null;
  return pt.moods.find(m=>m.label===label)||pt.moods.find(m=>m.label.indexOf(label)>=0||label.indexOf(m.label)>=0)||null;
}
function petBaseMoodLabel(){
  const p=ensurePetState();
  if(p.curMood)return p.curMood;
  if(p.todayMood&&p.todayMood.date===todayKey())return p.todayMood.label;
  return '普通';
}
function petEffMood(pt){
  const p=ensurePetState();
  if(p.sadToday){const s=pt.moods.find(m=>m.isSad);if(s)return s;}
  return petFindMood(pt,petBaseMoodLabel())||pt.moods.find(m=>petMoodImgs(pt,m).length)||pt.moods[0];
}
function petPickImg(pt,m,avoid){
  const list=petMoodImgs(pt,m);
  if(!list.length)return null;
  const pool=list.length>1?list.filter(im=>im.id!==avoid):list;
  return pool[Math.floor(Math.random()*pool.length)];
}
function petAllImgs(pt){const out=[];pt.moods.forEach(m=>petMoodImgs(pt,m).forEach(img=>out.push({mood:m,img:img})));return out;}
// 优先池：时间表里挑的动图（curPick）+ 优先心情的整类（“只用挑的动图”时不加整类）；难过惩罚那天只有难过的
function petPrefPool(pt){
  const p=ensurePetState();const m=petEffMood(pt);const all=petAllImgs(pt);
  if(p.sadToday)return all.filter(x=>x.mood===m);
  let pool=[];
  if(Array.isArray(p.curPick)&&p.curPick.length)pool=all.filter(x=>p.curPick.includes(x.img.id));
  if(!(p.curPickOnly&&pool.length))pool=pool.concat(all.filter(x=>x.mood===m&&!pool.some(y=>y.img.id===x.img.id)));
  return pool;
}
// 按概率挑一张：大概率来自优先池，小概率随机换成别的心情（先随机一个心情，再随机一张）
function petPickWeighted(pt,avoid){
  const p=ensurePetState();const pool=petPrefPool(pt);
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  if(!p.sadToday&&Math.random()*100>=(p.moodChance==null?75:p.moodChance)){
    const others=petAllImgs(pt).filter(x=>!x.mood.isSad&&!pool.some(y=>y.img.id===x.img.id)&&x.img.id!==avoid);
    const moods=[...new Set(others.map(x=>x.mood))];
    if(moods.length){const o=rnd(moods);return rnd(others.filter(x=>x.mood===o));}
  }
  if(!pool.length)return {mood:petEffMood(pt),img:null};
  const cand=pool.length>1?pool.filter(x=>x.img.id!==avoid):pool;
  return rnd(cand.length?cand:pool);
}
function petCurImg(pt){
  const p=ensurePetState();
  const pool=p.sadToday?[petEffMood(pt)]:pt.moods;
  for(const m of pool){
    const im=m&&m.imgs.find(x=>x.id===pt.curImg);
    if(im&&petImgUrl(im)&&!pt.hidden.includes(im.id))return {mood:m,img:im};
  }
  const r=petPickWeighted(pt);pt.curImg=r.img?r.img.id:null;
  return r;
}
function petImgKey(pt){const c=petCurImg(pt);return c.img?petImgUrl(c.img):('e:'+((c.mood&&c.mood.emoji)||''));}

function petSchedMin(t){const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):-1;}
function petCheckSchedule(){
  const p=state.pet;if(!p||!Array.isArray(p.schedule)||!p.schedule.length)return;
  const now=new Date();const mins=now.getHours()*60+now.getMinutes();
  const day=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
  const due=p.schedule.map(s=>({s:s,m:petSchedMin(s.time)})).filter(x=>x.m>=0&&x.m<=mins).sort((a,b)=>b.m-a.m)[0];
  if(!due)return;
  const key=day+'|'+due.s.id+'|'+due.s.time;
  if(p.schedKey===key)return;
  p.schedKey=key;
  // 空 = 回到今日心情；__pick__ = 只用挑的动图
  p.curMood=(due.s.mood&&due.s.mood!=='__pick__')?due.s.mood:null;
  p.curPick=Array.isArray(due.s.picks)&&due.s.picks.length?due.s.picks.slice():null;
  p.curPickOnly=due.s.mood==='__pick__';
  const pt=petActive();if(pt)pt.curImg=null;
  persistLocal();petApplyDom();
}

function petTipLines(){const p=ensurePetState();return (p.tips.text||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);}
function petNextLine(){
  const p=ensurePetState();
  const max=Math.max(1,p.tipTimes|0);
  const tips=petTipLines().filter(l=>(p.tips.shown[l]||0)<max);
  const hasGreet=(p.greets||[]).some(Boolean);
  // 提醒只是“优先”：有一定概率照样说招呼语（没有招呼语时就一直说提醒）
  if(tips.length&&(!hasGreet||Math.random()*100<(p.tipChance==null?70:p.tipChance))){
    tips.sort((a,b)=>(p.tips.shown[a]||0)-(p.tips.shown[b]||0));
    const l=tips[0];p.tips.shown[l]=(p.tips.shown[l]||0)+1;
    return {text:l,tip:true};
  }
  const g=(p.greets||[]).filter(Boolean);
  if(!g.length)return {text:'🐾',tip:false};
  const pool=g.length>1?g.filter(x=>x!==petNextLine._last):g;
  const l=pool[Math.floor(Math.random()*pool.length)];
  petNextLine._last=l;
  return {text:l,tip:false};
}
// 内置提示音（柔和的钟琴/水滴音色），也可以换成自己上传的音频
function petSynth(kind,vol){
  if(!window.AudioContext&&!window.webkitAudioContext)return;
  if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const ctx=_audioCtx;ctx.resume();const t0=ctx.currentTime;
  const out=ctx.createGain();out.gain.value=vol;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;
  out.connect(lp);lp.connect(ctx.destination);
  const tone=(f,at,dur,peak,type,partials)=>{
    (partials||[[1,1]]).forEach(([mul,g])=>{
      const o=ctx.createOscillator(),gn=ctx.createGain();
      o.type=type||'sine';o.frequency.value=f*mul;o.connect(gn);gn.connect(out);
      gn.gain.setValueAtTime(0.0001,t0+at);
      gn.gain.exponentialRampToValueAtTime(peak*g,t0+at+0.012);
      gn.gain.exponentialRampToValueAtTime(0.0001,t0+at+dur);
      o.start(t0+at);o.stop(t0+at+dur+0.05);
    });
  };
  const bellP=[[1,1],[2.01,.28],[3.02,.1]];
  if(kind==='bell'){tone(1318.5,0,1.1,.16,'sine',bellP);tone(1046.5,.22,1.4,.16,'sine',bellP);}
  else if(kind==='chime'){[1567.98,1318.5,1760,2093].forEach((f,i)=>tone(f,i*.11+Math.random()*.03,1.6,.07,'sine',bellP));}
  else if(kind==='drop'||kind==='pop'){
    const o=ctx.createOscillator(),gn=ctx.createGain();o.type='sine';o.connect(gn);gn.connect(out);
    const a=kind==='drop'?[1500,520,.09,.22]:[380,980,.06,.16];
    o.frequency.setValueAtTime(a[0],t0);o.frequency.exponentialRampToValueAtTime(a[1],t0+a[2]);
    gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(a[3],t0+.01);gn.gain.exponentialRampToValueAtTime(0.0001,t0+a[2]+.14);
    o.start(t0);o.stop(t0+a[2]+.2);
    if(kind==='drop')tone(1046.5,.1,.35,.03,'sine');
  }
}
let _petAudio=null;
function petChime(tip,forceKind){
  const p=ensurePetState();
  const cfg=p.snd[tip?'tip':'greet']||{kind:'bell'};
  const kind=forceKind||cfg.kind;
  const vol=Math.max(0,Math.min(1,p.vol==null?0.6:p.vol));
  if(kind==='none'||vol===0)return;
  try{
    if(kind==='custom'){
      const src=cfg.id&&imageCache[cfg.id];
      if(!src){petSynth('bell',vol);return;}
      if(_petAudio){_petAudio.pause();}
      _petAudio=new Audio(src);_petAudio.volume=vol;_petAudio.play().catch(()=>{});
      return;
    }
    petSynth(kind,vol);
  }catch(e){}
}

function petIsOpaque(src){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.naturalWidth,h=img.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.drawImage(img,0,0);
        res([[1,1],[w-2,1],[1,h-2],[w-2,h-2]].every(([a,b])=>x.getImageData(Math.max(0,a),Math.max(0,b),1,1).data[3]>200));
      }catch(e){res(false);}
    };
    img.onerror=()=>res(false);img.src=src;
  });
}

      m.imgs.push(it);
      ok++;
    }catch(e){console.warn('桌宠图片处理失败',f.name,e);fail++;}
  }
  return {ok,fail};
}

/* ===================== 桌宠 · 活动层：沿屏幕四边爬 / 拖动 / 坠落 / 回房间 ===================== */
// 位置用「沿边距离」s 表示：从右下角出发，沿底边向左 → 左边向上 → 顶边向右 → 右边向下，绕一圈回到右下角
// 在房间（总览日记的背景图）里时，只在房间地板上左右走
const PET_SPEED=48,PET_CORNER_S=10;
const PET_EDGE_ROT={bottom:0,left:90,top:180,right:-90};
let _petEl=null,_petHomeTimer=null,_petRotateTimer=null,_petWalkTimer=null;
const _pm={s:PET_CORNER_S,mode:'idle',dir:1,remain:0,x:0,y:0,vy:0,home:false,room:null,raf:0,lastT:0,drag:null,act:null,actImg:null,lastBox:null};
function petLayerEnsure(){
  let layer=document.getElementById('petLayer');
  if(!layer){
    layer=document.createElement('div');
    layer.id='petLayer';
    document.body.appendChild(layer);
  }
  return layer;
}
function petSizePx(){const b=_petEl&&_petEl.querySelector('.pet-body');return b&&b.offsetWidth?Math.max(24,b.offsetWidth):80;}
function petBox(){
  const S=petSizePx();
  let W,H;
  if(_pm.home&&_pm.room){W=_pm.room.clientWidth;H=_pm.room.clientHeight;}
  else{W=window.innerWidth;H=window.innerHeight;}
  const m=S/2+2;
  const xL=m,xR=Math.max(m,W-m),yT=m,yB=Math.max(m,H-m);
  return {W:W,H:H,S:S,xL:xL,xR:xR,yT:yT,yB:yB,w:xR-xL,h:yB-yT};
}
function petPerim(b){return _pm.home?b.w:2*(b.w+b.h);}
function petAt(s,b){
  if(_pm.home){s=Math.max(0,Math.min(b.w,s));return {x:b.xR-s,y:b.yB,edge:'bottom'};}
  const P=2*(b.w+b.h);s=((s%P)+P)%P;
  if(s<b.w)return {x:b.xR-s,y:b.yB,edge:'bottom'};
  s-=b.w;if(s<b.h)return {x:b.xL,y:b.yB-s,edge:'left'};
  s-=b.h;if(s<b.w)return {x:b.xL+s,y:b.yT,edge:'top'};
  s-=b.w;return {x:b.xR,y:b.yT+s,edge:'right'};
}
function petSOf(edge,x,y,b){
  const cl=(v,a,c)=>Math.max(a,Math.min(c,v));
  if(_pm.home||edge==='bottom')return cl(b.xR-x,0,b.w);
  if(edge==='left')return b.w+cl(b.yB-y,0,b.h);
  if(edge==='top')return b.w+b.h+cl(x-b.xL,0,b.w);
  return 2*b.w+b.h+cl(y-b.yT,0,b.h);
}
function petCurXY(){
  if(_pm.mode==='drag'||_pm.mode==='fall')return {x:_pm.x,y:_pm.y};
  return petAt(_pm.s,petBox());
}
function petCurXYScreen(){
  const c=petCurXY();
  if(_pm.home&&_pm.room){const r=_pm.room.getBoundingClientRect();return {x:r.left+_pm.room.clientLeft+c.x,y:r.top+_pm.room.clientTop+c.y};}
  return c;
}
// 动作动图：自己挑的 > 另一方向的镜像 > 当前表情
function petActList(pt,act){
  if(!act)return null;
  const own=(pt.actions[act]||[]).filter(im=>petImgUrl(im));
  if(own.length)return {list:own,flip:false};
  if(act==='walkL'||act==='walkR'){
    const other=(pt.actions[act==='walkL'?'walkR':'walkL']||[]).filter(im=>petImgUrl(im));
    if(other.length)return {list:other,flip:true};
  }
  return null;
}
function petBodyUpdate(pt,act,rot){
  const body=_petEl.querySelector('.pet-body');
  if(_pm.act!==act){_pm.act=act;_pm.actImg=null;}
  let html,key,flip=false;
  const al=petActList(pt,act);
  if(al){
    let im=_pm.actImg&&al.list.find(x=>x.id===_pm.actImg);
    if(!im){im=al.list[Math.floor(Math.random()*al.list.length)];_pm.actImg=im.id;}
    const u=petImgUrl(im);
    html='<img'+(petImgRound(im)?' class="rd"':'')+' src="'+esc(u)+'" alt="" draggable="false">';key='a:'+u;flip=al.flip;
  }else{html=petImgHtml(pt);key=petImgKey(pt);}
  if(body.dataset.k!==key){body.innerHTML=html;body.dataset.k=key;}
  const tf='rotate('+rot+'deg)'+(flip?' scaleX(-1)':'');
  if(body.style.transform!==tf)body.style.transform=tf;
}
function petRender(){
  if(!_petEl)return;
  const pt=petActive();const b=petBox();_pm.lastBox=b;
  let x,y,rot=0,act=null;
  if(_pm.mode==='drag'||_pm.mode==='fall'){x=_pm.x;y=_pm.y;act=_pm.mode;}
  else{
    const a=petAt(_pm.s,b);x=a.x;y=a.y;rot=PET_EDGE_ROT[a.edge];
    if(_pm.mode==='walk')act=_pm.dir>0?'walkL':'walkR';
  }
  _petEl.style.left=x+'px';_petEl.style.top=y+'px';
  _petEl.classList.toggle('dragging',_pm.mode==='drag');
  if(_pm.home&&_pm.room){
    const bg=_pm.room.querySelector('.bg');
    if(bg&&b.w>0){const pct=Math.max(0,Math.min(100,(x-b.xL)/b.w*100));bg.style.backgroundPosition=pct.toFixed(1)+'% center';}
  }

}
function petPop(){if(!_petEl)return;_petEl.classList.remove('pet-pop');void _petEl.offsetWidth;_petEl.classList.add('pet-pop');}
function petTick(ts){
  _pm.raf=0;
  const dt=_pm.lastT?Math.min(0.05,(ts-_pm.lastT)/1000):0.016;_pm.lastT=ts;
  const b=petBox();
  if(_pm.mode==='walk'){
    const mv=Math.min(_pm.remain,PET_SPEED*dt);
    _pm.s+=_pm.dir*mv;_pm.remain-=mv;
    if(_pm.home)_pm.s=Math.max(0,Math.min(b.w,_pm.s));
    else{const P=petPerim(b);_pm.s=((_pm.s%P)+P)%P;}
    if(_pm.remain<=0.5)_pm.mode='idle';
  }else if(_pm.mode==='fall'){
    const lv=Math.max(1,Math.min(10,(state.pet&&state.pet.fallLv)||3));
    _pm.vy=Math.min(140*lv,_pm.vy+220*lv*dt);_pm.y+=_pm.vy*dt;
    _pm.x=Math.max(b.xL,Math.min(b.xR,_pm.x));
    if(_pm.y>=b.yB){_pm.y=b.yB;_pm.s=petSOf('bottom',_pm.x,_pm.y,b);_pm.mode='idle';petPop();if(_pm.goCorner){_pm.goCorner=false;setTimeout(petGoCorner,600);}}
  }
  petRender();
  if(_pm.mode==='walk'||_pm.mode==='fall')petLoop();else _pm.lastT=0;
}
function petLoop(){if(!_pm.raf)_pm.raf=requestAnimationFrame(petTick);}
function petWalkTo(target,dirPref){
  const b=petBox();
  if(_pm.home){
    const t=Math.max(0,Math.min(b.w,target));
    _pm.remain=Math.abs(t-_pm.s);_pm.dir=t>=_pm.s?1:-1;
  }else{
    const P=petPerim(b);
    const fwd=((target-_pm.s)%P+P)%P,back=P-fwd;
    if(dirPref===1||(!dirPref&&fwd<=back)){_pm.dir=1;_pm.remain=fwd;}else{_pm.dir=-1;_pm.remain=back;}
  }
  if(_pm.remain<1)return;
  _pm.mode='walk';_pm.lastT=0;petLoop();
}
function petGoCorner(){if(_pm.mode==='idle'&&!_pm.home)petWalkTo(PET_CORNER_S);}
// 每隔一段时间决定下一步：一半机会爬回右下角，一半机会沿着边随便爬一段
function petWalkDecide(){
  const p=state.pet;
  if(!p||document.hidden||_pm.mode!=='idle')return;
  const b=petBox();
  if(_pm.home){petWalkTo(Math.random()*b.w);return;}
  if(!p.walkSecs)return;
  const P=petPerim(b);
  const far=Math.min(((_pm.s-PET_CORNER_S)%P+P)%P,((PET_CORNER_S-_pm.s)%P+P)%P);
  if(far>40&&Math.random()<0.5){petWalkTo(PET_CORNER_S);return;}
  const d=(Math.random()<0.5?1:-1)*(120+Math.random()*Math.max(80,b.w*0.5));
  petWalkTo(_pm.s+d,d>0?1:-1);
}
function petScheduleWalk(){
  clearTimeout(_petWalkTimer);
  const p=state.pet;
  const secs=_pm.home?Math.max(3,Math.min(8,(p&&p.walkSecs)||6)):(p&&p.walkSecs);
  if(!secs)return;
  _petWalkTimer=setTimeout(()=>{petWalkDecide();petScheduleWalk();},secs*1000*(0.7+Math.random()*0.6));
}
function petRotateImg(){
  const p=state.pet;if(!p||!Array.isArray(p.pets)||document.hidden)return;
  const pt=petActive();
  const r=petPickWeighted(pt,pt.curImg);
  if(r.img&&r.img.id!==pt.curImg){pt.curImg=r.img.id;petApplyDom();}
}
function petScheduleRotate(){
  clearTimeout(_petRotateTimer);
  const p=state.pet;const secs=p&&p.moodSecs;if(!secs)return;
  _petRotateTimer=setTimeout(()=>{petRotateImg();petScheduleRotate();},secs*1000);
}
/* --- 拖动：按住拖到哪就在哪；松手时贴着边就扒在边上，不贴边就自由坠落到底边 --- */
function petCreateEl(id){
  const el=document.createElement('div');
  el.className='pet-float';el.dataset.id=id;
  el.innerHTML='<div class="pet-body"></div><div class="pet-bubble" style="display:none"></div>';
  el.addEventListener('pointerdown',petPointerDown);
  el.addEventListener('pointermove',petPointerMove);
  el.addEventListener('pointerup',petPointerUp);
  el.addEventListener('pointercancel',petPointerUp);
  el.addEventListener('dragstart',e=>e.preventDefault());
  el.addEventListener('click',e=>e.stopPropagation());
  return el;
}
function petPointerDown(e){
  if(e.button!=null&&e.button>0)return;
  const c=petCurXYScreen();
  _pm.drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:e.clientX-c.x,oy:e.clientY-c.y,moved:false};
  try{_petEl.setPointerCapture(e.pointerId);}catch(err){}
  e.preventDefault();e.stopPropagation();
}
function petPointerMove(e){
  const d=_pm.drag;if(!d||e.pointerId!==d.id)return;
  e.stopPropagation();
  if(!d.moved){
    if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<6)return;
    d.moved=true;
    if(_pm.home)petLeaveHome(true,true);
    const c=petCurXYScreen();_pm.x=c.x;_pm.y=c.y;
    _pm.mode='drag';_pm.vy=0;_pm.remain=0;
    clearTimeout(_petWalkTimer);
  }
  const b=petBox();
  _pm.x=Math.max(b.xL,Math.min(b.xR,e.clientX-d.ox));
  _pm.y=Math.max(b.yT,Math.min(b.yB,e.clientY-d.oy));
  petRender();
}
function petPointerUp(e){
  const d=_pm.drag;if(!d||e.pointerId!==d.id)return;
  _pm.drag=null;_pm.goCorner=false;e.stopPropagation();
  if(!d.moved){petClick(petActive().id);return;}
  const b=petBox();const x=_pm.x,y=_pm.y,snap=Math.max(28,b.S*0.45);
  let edge=null;
  if(x-b.xL<=snap)edge='left';
  else if(b.xR-x<=snap)edge='right';
  else if(y-b.yT<=snap)edge='top';
  else if(b.yB-y<=snap)edge='bottom';
  if(edge){_pm.s=petSOf(edge,x,y,b);_pm.mode='idle';petRender();petPop();}
  else{_pm.mode='fall';_pm.vy=0;_pm.lastT=0;petLoop();}
  petScheduleWalk();
}
function petApplyDom(){
  const p=ensurePetState();
  const pt=petActive();
  if(_pm.home&&!(_pm.room&&_pm.room.isConnected)){
    const r=document.querySelector('.game-room');
    if(r)_pm.room=r;else petLeaveHome(true);
  }
  if(!_petEl||_petEl.dataset.id!==pt.id){

    _petEl=petCreateEl(pt.id);

  }
  const container=_pm.home?_pm.room:petLayerEnsure();

  _petEl.classList.toggle('in-room',_pm.home);

}
function petClick(pid){

  const m=petEffMood(pt);

function petComeHome(){
  const p=ensurePetState();
  if(_pm.home&&!p.homeSecs){petLeaveHome();return;}
  const room=document.querySelector('.game-room');
  if(!room){toast('先打开总览日记，桌宠才能回房间哦');return;}
  _pm.home=true;_pm.room=room;_pm.drag=null;_pm.remain=0;
  petApplyDom();
  const b=petBox();
  _pm.x=b.xL+Math.random()*b.w;_pm.y=b.yT;_pm.vy=0;_pm.mode='fall';_pm.lastT=0;petLoop();
  const r=room.getBoundingClientRect();
  if(r.bottom<0||r.top>window.innerHeight)room.scrollIntoView({behavior:'smooth',block:'center'});
  clearTimeout(_petHomeTimer);
  if(p.homeSecs>0){
    _petHomeTimer=setTimeout(()=>petLeaveHome(),p.homeSecs*1000);

}
function petLeaveHome(silent,keepPos){

  if(!_pm.home)return;
  let sx=null,sy=null;
  if(_pm.room&&_pm.room.isConnected&&_petEl&&_petEl.isConnected){const c=petCurXYScreen();sx=c.x;sy=c.y;}
  if(_pm.room){const bg=_pm.room.querySelector('.bg');if(bg)bg.style.backgroundPosition='';}
  _pm.home=false;_pm.room=null;_pm.remain=0;
  if(_petEl){petLayerEnsure().appendChild(_petEl);_petEl.classList.remove('in-room');}
  const b=petBox();
  if(sx==null||sy<0||sy>b.H){_pm.s=PET_CORNER_S;_pm.mode='idle';}
  else{
    _pm.x=Math.max(b.xL,Math.min(b.xR,sx));_pm.y=Math.max(b.yT,Math.min(b.yB,sy));
    if(keepPos)_pm.mode='drag';
    else{_pm.mode='fall';_pm.vy=0;_pm.lastT=0;_pm.goCorner=true;petLoop();}
  }

const QUOTES=["他从不肯说想念，只是在每个深夜，把窗外的月光，看成是你的侧脸。","世间所有的久别重逢，都是一个人在原地，把另一个人等成了执念。","我宁愿你忘了我，也不愿你想起我时，心里有半分难过。","他眼底有星辰坠落，那是我穷尽一生也接不住的温柔。","后来我才明白，有些人光是遇见，就已经花光了所有运气。","他把所有的喜欢都藏进风里，怕你听见，又怕你听不见。","如果可以，我想做你生命里那场不必停的雨，淋湿你所有的孤单。","他们都说时间会冲淡一切，可我的时间，好像从他离开那天起就停了。","我这一生见过太多热闹，唯独在他身边，才觉得安静也是好的。","他不是我的月亮，但有一刻，月光确确实实照在了我的身上。","喜欢你这件事，我瞒着所有人，包括自己，却瞒不过每个深夜。","他在人海里回头的那一眼，我把它当成了一辈子的承诺。","原来最深的思念，不是念念不忘，而是不敢再提起你的名字。","我把你写进每一个故事里，却始终写不出一个圆满的结局。","他笑起来的时候，整个冬天都失去了下雪的理由。","我想成为他疲惫时可以依靠的那扇窗，不说话，只让光照进来。","所有的兵荒马乱里，我只想护他一个周全。","他说别等了，可他不知道，等待是我唯一还能做的事。","这世上最好的事，莫过于兜兜转转，你还在原地，而我也没走远。","他是我所有故事的开头，也是我所有故事的结尾。","我把他放在心上最软的地方，碰不得，忘不掉。","若故事能重来，我还是会在那个路口，撞上他的目光。","他不知道，他随手递来的一颗糖，甜了我整个青春。","思念是无声的雪，落满他走过的每一段路。","我在他看不见的地方，把自己活成了他的样子。","他说向前走别回头，可我回头时，他还在原地望着我。","原来心动是这么安静的一件事，像月亮掉进了海里。","我用一生去练习一个名字的发音，直到它变成呼吸。","他走后，连风吹过空椅子，我都觉得是他的拥抱。","如果有来生，我想做他案头的那盏灯，陪他熬过所有长夜。"];

{w:"之",m:"王力《古代汉语》第一册通论核心虚词。主要用法：①代词，代人、事、物，如「学而时习之」；②指示代词「这、那」，如「之二虫又何知」；③动词「往、到……去」，如「吾欲之南海」；④结构助词「的」，如「赤子之心」；⑤取消句子独立性，如「孤之有孔明」；⑥宾语前置标志，如「何陋之有」；⑦定语后置标志，如「马之千里者」；⑧凑足音节，无实义，如「顷之」。"},
{w:"其",m:"①第三人称代词，作定语表领属「他的、它的」，如「见其发矢十中八九」；②作主语或宾语「他、它」，如「其闻道也固先乎吾」；③指示代词「那、那些」，如「既其出，则或咎其欲出者」；④副词表测度「大概、恐怕」，如「其皆出于此乎」；⑤表反诘「难道」，如「其孰能讥之乎」；⑥表祈使或商量「还是、应当」，如「吾其还也」；⑦连词表假设「如果」，如「其业有不精，德有不成者」。"},
{w:"而",m:"连词，用法最繁：①并列，如「蟹六跪而二螯」；②承接，如「温故而知新」；③转折，如「学而不思则罔」；④修饰，连接状语与中心词，如「吾尝跂而望矣」；⑤递进，如「君子博学而日参省乎己」；⑥假设，如「人而无信，不知其可也」；⑦因果，如「表恶其能而不用也」。注意「而」无代词用法，「而翁」之「而」通「尔」。"},
{w:"以",m:"①动词「用、认为」，如「皆以美于徐公」；②介词表工具「用、拿」，如「以刀劈狼首」；③表凭借「凭、靠」，如「以勇气闻于诸侯」；④表原因「因为」，如「不以物喜」；⑤表时间「在、于」，如「余以乾隆三十九年十二月」；⑥连词表目的「来」，如「作《师说》以贻之」；⑦表结果「以致」，如「以啮人，无御之者」；⑧表并列或修饰，如「挟飞仙以遨游」。"},
{w:"于",m:"介词，常引介处所、对象、比较、被动等：①「在」，如「战于长勺」；②「到」，如「乃设九宾礼于庭」；③「对、向」，如「请奉命求救于孙将军」；④「比」，表比较，如「苛政猛于虎也」；⑤「被」，表被动，如「不拘于时」；⑥「从」，如「青，取之于蓝」。翻译时多后置，须调整语序。"},
{w:"为",m:"①动词「做、是、成为」，如「为学」；②介词表对象「替、给」，如「为天下兴利除弊」；③表被动「被」，如「身死人手，为天下笑」；④表原因「因为」，如「为之动容」；⑤介词「对、向」，如「不足为外人道也」；⑥句末语气词，表反问，如「何辞为」。读 wèi 时多为介词或语气词。"},
{w:"乃",m:"①副词「于是、就」，如「乃入据陈」；②「才」，如「乃悟前狼假寐」；③「竟然、却」，如「乃不知有汉」；④判断动词「是」，如「当立者乃公子扶苏」；⑤「只、仅仅」，如「至东城，乃有二十八骑」。"},
{w:"所",m:"「所」字结构是古汉语名词化的重要手段：①「所+动词」转指受事，如「渔人一一为具言所闻」；②「所+介词+动词」表凭借、原因、处所，如「所以遣将守关者」；③「为……所……」表被动，如「行将为人所并」；④「所谓」即「所说的」，「所以」表原因或凭借，不可按现代汉语「所以」理解。"},
{w:"者",m:"①代词性助词，附于动词、形容词后表「……的人/事/物」，如「得道者多助」；②附于数词后表「……种、……样」，如「二者不可得兼」；③用于判断句主语后表提顿，如「陈涉者，阳城人也」；④用于时间词后表停顿，如「今者项庄拔剑舞」；⑤用于假设分句末，如「不者，若属皆且为所虏」。"},
{w:"也",m:"语气词，古汉语使用频率极高：①句末表判断，如「城北徐公，齐国之美丽者也」；②句末表解释或肯定，如「环滁皆山也」；③句末表疑问或反诘，如「何者？严大国之威以修敬也」；④句中表停顿，以舒缓语气，如「是说也，人常疑之」；⑤与「邪」「乎」配合表反问。"},
{w:"矣",m:"动态语气词，主要表事态变化：①表已然「了」，如「吾知之久矣」；②表将然「了、吧」，如「天下苦秦久矣」；③表感叹，如「嗟乎！燕雀安知鸿鹄之志哉」中的感叹常与「矣」合用；④与「而已」连用表限止「罢了」。"},

const GUWEN_GRAMMAR=[
{t:"古汉语的判断句",d:"古汉语判断句一般不用系词「是」，而以名词或名词性短语作谓语，借助「者……也」「也」「者也」等语气词表示。如「陈涉者，阳城人也」「城北徐公，齐国之美丽者也」「刘备天下枭雄」。先秦「是」多作指示代词，如「是社稷之臣也」中「是」即「这」，不可误为系词。汉代以后系词「是」逐渐发展，但古汉语教学中须严格区分。"},
{t:"被动表示法",d:"古汉语被动式主要有：①「于」字式，如「郤克伤于矢」；②「为」字式，如「身死国灭，为天下笑」；③「为……所……」式，如「不者，若属皆且为所虏」；④「见」字式，如「信而见疑，忠而被谤」；⑤「见……于……」式，如「吾长见笑于大方之家」；⑥「被」字式，汉代以后渐多，如「妆成每被秋娘妒」。先秦被动式较少，多借助上下文或反训理解。"},
{t:"宾语前置的类型",d:"古汉语宾语前置主要有三种：①疑问代词作宾语前置，如「吾谁欺？欺天乎？」「微斯人，吾谁与归？」；②否定句中代词宾语前置，如「不吾知也」「未之有也」「莫我肯顾」；③以「之」「是」为标志的宾语前置，如「何陋之有」「唯利是图」「句读之不知，惑之不解」。第四种为介词宾语前置，如「夜以继日」「秋以为期」。"},
{t:"词类活用·名词活用为动词",d:"名词在特定句法位置上当动词用。如「驴不胜怒，蹄之」中「蹄」=用蹄子踢；「沛公军霸上」中「军」=驻军；「范增数目项王」中「目」=使眼色；「假舟楫者，非能水也」中「水」=游泳。判断关键是看该名词是否带宾语、受副词修饰或处于谓语位置。"},
{t:"词类活用·使动与意动",d:"使动用法是主语使宾语发出动作或具有某种状态，如「项伯杀人，臣活之」的「活」=使……活；「春风又绿江南岸」的「绿」=使……绿。意动用法是主语主观认为宾语如何，如「渔人甚异之」的「异」=以……为异；「孔子登东山而小鲁」的「小」=以……为小。名词、形容词、动词皆可活用为使动或意动，须依上下文及语义判断。"},
{t:"词类活用·名词作状语",d:"古汉语普通名词可直接置于动词前作状语，表比喻、工具、处所、时间等。如「天下云集响应」中「云」「响」表比喻；「箕畚运于渤海之尾」表工具；「上食埃土，下饮黄泉」表方位；「日削月割，以趋于亡」表时间频率。翻译时须补出介词或作相应转换。"},
{t:"定语后置",d:"古汉语为强调或调节节奏，常将定语置于中心词之后。主要格式：①「中心词+之+定语+者」，如「马之千里者」=千里马；②「中心词+定语+者」，如「求人可使报秦者」=求可使报秦之人；③「中心词+之+定语」，如「蚓无爪牙之利，筋骨之强」。翻译时须将定语提前。"},
{t:"状语后置",d:"介词结构「于……」「以……」等常置于动词之后作补语，翻译时应提前作状语。如「战于长勺」=于长勺战；「告之于帝」=于帝告之；「具告以事」=以事具告；「青，取之于蓝，而青于蓝」后一「于蓝」表比较。注意后置状语与被动式「于」的区别。"},
{t:"宾语补出与省略句",d:"古汉语为求简洁，常省略主语、宾语、介词等。省略主语如「（项伯）欲呼张良与（之）俱去」；省略宾语如「竖子不足与（之）谋」；省略介词如「将军战（于）河北，臣战（于）河南」。阅读时须据上下文补出省略成分，方可准确理解句意。"},
{t:"通假字与古今字",d:"通假是古书中音同或音近字的通用假借，如「学而时习之，不亦说乎」中「说」通「悦」；「倍道而妄行」中「倍」通「背」。古今字是先后产生的同词异字，如「莫」本为「暮」，后借为否定代词，又造「暮」字。不可把通假字误作本字理解。"},
{t:"古汉语的副词系统",d:"古汉语副词可分为：①程度副词，如「甚、极、殊、太、尤」；②范围副词，如「皆、尽、悉、咸、仅、但、独」；③时间副词，如「既、已、尝、方、将、且、旋」；④语气副词，如「必、诚、殆、盖、庶、宁」；⑤否定副词，如「不、弗、毋、勿、未、非、微、莫」。其中「弗」相当于「不……之」。"},
{t:"「所」字结构与「者」字结构",d:"「所+动词」构成名词性短语，指代动作对象或相关事物，如「渔人一一为具言所闻」。「者」附于动词、形容词后亦构成名词性结构，如「得道者多助」。「所……者」合用，如「所操之术多异故也」。二者是古汉语名词化的重要手段，学习时应掌握其指代功能和翻译方法。"},
{t:"复音词与联绵词",d:"古汉语以单音词为主，但也存在大量复音词。①联绵词：两字联缀成义，不可拆开，如「徘徊、参差、犹豫、仓猝、窈窕」；②叠音词：如「萧萧、冉冉、悠悠」；③复合词：如「天下、国家、社稷、君子」。识别联绵词和复合词对正确断句、理解文意至关重要。"},
{t:"句首语气词与词头",d:"古汉语句首常用发语词引出议论或叙述，如「夫」「盖」「且夫」「若夫」「今夫」等，无实义，只起提示、舒缓语气作用。词头如「有」用于专有名词前，如「有夏」「有殷」；「言」用于动词前，如「言告师氏」。翻译时可略去不译或转换为现代汉语的语气词。"}
